# 站点配置。
#
# 正文由 tools/build-site.mjs 从仓库根目录的 book/ 生成到 site/content/，
# 每次生成都会整体重建该目录，所以不要手工往里加页面。
#
# 版本前提：本机 Hugo v0.167.0。**extended 并非必需**——2026-10-03 实测用非 extended 的
# 0.167.0 构建本站，343 页全部产出（样式走 css.Build/esbuild，标准版里就有）。
# 真实下限是 0.158.0，声明与实测记录在主题的 hugo.toml。
# 0.158 起 languageCode 改名为 locale。

# 本地预览用的默认地址；发布时由 CI 用 --baseURL 覆盖成真实地址
baseURL = 'https://example.org/'
title = '劳动者的账本'

locale = 'zh-CN'
timeZone = 'Asia/Shanghai'
hasCJKLanguage = true
enableGitInfo = true
enableRobotsTXT = true

# 本书不用标签分类，关掉以免生成空的分类页
disableKinds = ['taxonomy', 'term']

theme = 'ledger'

[params]
  # 首页副标题：一句话说清这本书记的是什么
  tagline = '法律允许什么，是一回事；拿不拿得到，是另一回事'
  # 首页导语（markdown）。生成脚本不会重写 hugo.toml，所以这段文案是稳的
  homeIntro = '''
本书面向在中国大陆工作的人：**刚要参加校招和刚毕业的**、在职的、要离职的、被欠薪的、受了工伤的、正在准备签合同的。

它记的不是「法律允许什么」，而是**一条权利要真正落到手里，还需要什么**——要什么证据、受什么时效约束、在哪些地方口径不一致、主张强度到底是「可主张」「可推定」还是「倡导性」。

每一条都标了三样东西：**效力位阶**（这条依据在仲裁委和法院面前的地位）、**主张强度**（你能不能真拿到手）、**举证难度**（打赢要什么证据、好不好拿）。三者各管一件事，不互相替代。

第一次签劳动合同的，从第 15 节「应届生与第一份工作」读起——三方协议与劳动合同是什么关系、offer 能不能撤销、入职当月社保、实习与劳动关系的区分。其中「应届生身份」一项在法律上没有定义与失效时点，书里只给核实渠道，不给统一答案。
'''
  # 首页底部说明
  homeNote = '全书条目按时效与地方口径标注，核对日期逐条可查。制度会变，用之前请核对当地现行规定。'
  # 核对日期超过这个天数即提示「待复核」，仓库约定值（见 docs/条目规范.md）
  staleDays = 180
  # 全站免责声明。**必须带「去哪问」的可点链接**：只写「请咨询当地仲裁委、人社部门或执业律师」
  # 等于把人推到门口就撒手。渠道页集中了热线号码、官方入口与区县级机构的定位方法，
  # 并如实标注了哪些入口有技术障碍（例如 12333.gov.cn 的 TLS 旧式重协商）。
  disclaimer = '''本指南为通用信息整理，不构成针对具体个案的法律意见。涉及自身权益的处理，请先看 [**求助与反馈渠道**](/求助渠道/)：里面有 12333／12348／12329／12345 等热线、官方入口，以及怎么找到你所在区县的劳动人事争议仲裁委员会、劳动保障监察机构与社保经办机构。'''
  # 页面底部生成说明
  generatorNote = '正文以 book/ 下的 markdown 为唯一真相源，站点内容由 tools/build-site.mjs 生成。'

# llms.txt：给大模型与检索系统的站点说明（GEO）。
#
# **为什么需要声明这个**：Hugo 只为 robots.txt、sitemap.xml 这类**内置名**自动
# 输出根级文件；llms.txt 不是内置名，光把模板放 layouts/ 下**不会有任何产物**
# （本项目实测过：模板在、public/llms.txt 不存在）。必须像下面这样声明一个
# 自定义输出格式并把它挂到首页，Hugo 才会渲染并写到站点根。
# isPlainText 让它按纯文本输出、不被当成 HTML 转义；baseName + suffix 决定文件名。
# 显式声明 mediaType：光写 mediaType = "text/plain" 而不注册它，Hugo 会**静默丢弃**
# 整个输出格式（实测：hugo config 里看不到 llmstxt，产物也不生成，且不报错）。
# 内建或已注册的 mediaType（html、json）不需要这一步，自定义后缀的必须注册。
[mediaTypes."text/plain-llms"]
  suffixes = ["txt"]
  delimiter = ""

[outputFormats.llmstxt]
  mediaType = "text/plain-llms"
  baseName = "llms"
  isPlainText = true
  isHTML = false
  noUgly = true

# 首页除 HTML 外再输出一份归一化的检索索引（供前端筛选与全文检索，也是 GEO 首选入口）。
# 输出路径为 /entries.json —— 改这里会同时影响前端检索与 llms.txt 里的指引，别单独改。
[outputFormats.JSON]
  mediaType = "application/json"
  baseName = "entries"
  isPlainText = true
  isHTML = false
  noUgly = true

# 首页除 HTML 与 JSON 检索索引外，再多输出一份 llms.txt
[outputs]
  home = ["HTML", "JSON", "llmstxt"]
  section = ["HTML"]

[frontmatter]
  lastmod = [':git', 'lastmod', 'date']

# HTML 压缩：保留可选的结束标签。
#
# Hugo 默认的压缩器会删掉可以省略的 `</li>`（HTML 规范允许省略）。问题是删掉之后
# `<ul><li>…<div>…</div><ul>…</ul></ul>` 里就找不到「哪个 ul 是哪个 ul 的子元素」了——
# 任何按嵌套深度解析页面的工具（我们的 site/checks/semantic-check.mjs、第三方爬虫、
# 无障碍工具）都会把内层 <ul> 误判成外层 <ul> 的直接子元素。
# 规范允许省略不等于无害：省略后结构信息就只剩浏览器的自动补全，机器读不出来。
# 代价只是每页多几个字节，换来的是产物结构可被机械验证。
[minify]
  [minify.tdewolff]
    [minify.tdewolff.html]
      keepEndTags = true
