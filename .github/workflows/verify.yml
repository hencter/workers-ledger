name: 校验

# 三道独立防线，各跑各的：
#   1. 条目结构校验 —— 字段完整性、字段名、枚举取值、编号连续、核对日期时效
#   2. 来源时效与链接监控 —— 抓官方页面比对版本，只对「确定失效」和「版本不一致」判失败
#   3. 脱敏扫描 —— 个人信息类硬命中即失败
#
# 任何一个 job 失败都不会阻塞其余 job 出结果（job 之间没有 needs 依赖，并行跑）。

on:
  push:
  pull_request:
  # 每周一 02:00 UTC（北京时间 10:00）全量跑一次来源时效，联网抓官方页面
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      full_network:
        description: '来源时效 job 是否联网抓取官方页面（不定时触发时默认只校验注册表字段）'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  items:
    name: 条目结构校验
    # 定时任务只跑来源时效，条目结构与脱敏扫描在 push / PR / 手动触发时跑
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 取出仓库内容
        uses: actions/checkout@v4
      - name: 准备 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 运行条目结构校验
        run: node tools/check-items.mjs --check --summary "$GITHUB_STEP_SUMMARY"

  # 新增：来源引用完整性（纯本地对账，与「来源时效」分工见下方注释）
  refs:
    name: 来源引用完整性（登记 ↔ 依据 ↔ 来源）
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 取出仓库内容
        uses: actions/checkout@v4
      - name: 准备 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      # 纯本地对账，不联网。与「来源时效」job 的分工：
      #   这里判「正文引用的法规有没有登记、正文写的版本有没有落后于登记版本」；
      #   那个 job 抓官方页面判「登记的那 33 条自己有没有失效或更新」。
      # 两者不重叠：住房公积金条例与 N01 那两次换版事故都是这一道抓出来的，
      # 而旧的 check-items 交叉核查只在「来源栏没有 URL」时才触发，从未生效。
      #
      # 作业标识（job id）必须是 ASCII：中文标识会让整个工作流无法解析，
      # 这正是远端刚修好的那个坑（提交「修复工作流无法解析：作业标识改用 ASCII」）。
      # 所以这里用 refs，而不是「来源引用」。
      - name: 运行来源引用完整性核查
        run: node tools/check-refs.mjs --check --summary "$GITHUB_STEP_SUMMARY"

  sources:
    name: 来源时效与链接监控
    runs-on: ubuntu-latest
    # 联网抓一批官方页面要慢得多，给足时间
    timeout-minutes: 30
    steps:
      - name: 取出仓库内容
        uses: actions/checkout@v4
      - name: 准备 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      # 说明：GitHub 托管 runner 在境外机房，gov.cn 系站点常挡境外 IP。
      # 脚本已把超时、5xx、TLS 握手失败单列成「没连上」「握手不兼容」两档，不判失效，
      # 所以境外 runner 上跑不会天天红；但要真正抓到「版本不一致」，
      # 需要在能访问 gov.cn 的环境（自建 runner 或本地机器）上跑 --check。
      - name: 运行来源时效与链接监控
        env:
          联网: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_network) }}
        run: |
          if [ "$联网" = "true" ]; then
            echo "模式：联网全量"
            node tools/check-sources.mjs --check --summary "$GITHUB_STEP_SUMMARY"
          else
            echo "模式：离线（只校验注册表必填字段）"
            node tools/check-sources.mjs --offline --check --summary "$GITHUB_STEP_SUMMARY"
          fi

  desensitize:
    name: 脱敏扫描
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 取出仓库内容
        uses: actions/checkout@v4
      - name: 准备 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      # 用 --check：个人信息类硬命中即失败；「需语境档」只报待人工判断，不阻塞。
      # 想把需语境档也变成门禁，加 --strict。
      #
      # 扫描范围扩到全仓库，不只是正文：本站点、AI skill、工具脚本与自测夹具都会发布，
      # 任何一处带上真实个人信息都是泄露。自测夹具里是故意造的虚构泄露特征，
      # 脚本默认跳过并在汇总里报出跳过数量——所以这里不需要额外排除参数。
      - name: 运行脱敏扫描（全仓库）
        run: |
          node tools/check-desensitize.mjs --check \
            --dir . \
            --summary "$GITHUB_STEP_SUMMARY"
