name: 生成 PDF 并发布

# 用户要求 PDF 走 Release 分发，参照同类开源项目的做法：正文更新后重新生成，
# 挂到一个固定 tag 的 Release 上，下载链接保持不变（转发出去的链接不会失效）。
#
# 链：book/ 正文 → tools/build-site.mjs 生成 content → Hugo 在仓库根构建 public
#     → tools/build-pdf.mjs 把站点产物打成 PDF → 上传到 Release 的固定 tag。
#
# 为什么 PDF 由浏览器打印而不是 pandoc/mdbook：
#   本机与 runner 上都没有 pandoc、typst、LaTeX、LibreOffice；Hugo 本身不出 PDF。
#   mdbook 虽能装，但需要自己的一套目录结构——等于引入第三份正文，违反本仓库
#   「book/ 是唯一真相源」的规矩，而且它自己也不出 PDF。浏览器打印能直接复用
#   站点已经调好的排版（中文字体、证据徽章、行宽），且零新依赖。

on:
  push:
    branches: [main]
    paths:
      - 'book/**'
      - 'hugo.toml'
      - 'themes/**'
      - 'tools/build-site.mjs'
      - 'tools/build-pdf.mjs'
      - '.github/workflows/pdf-release.yml'
  workflow_dispatch:

# 发布 Release 需要写 contents
permissions:
  contents: write

concurrency:
  group: pdf-release
  cancel-in-progress: false

jobs:
  pdf:
    name: 生成 PDF 并挂到 Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 取出仓库内容
        uses: actions/checkout@v4
        with:
          # 页脚会显示构建时间，取全量历史不影响；但 enableGitInfo 需要至少一次提交
          fetch-depth: 1

      - name: 准备 Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 从 book/ 生成站点内容与索引
        run: node tools/build-site.mjs

      - name: 生成哨兵：正文与索引逐字段对账
        run: node tools/check-site.mjs

      - name: 安装 Hugo（版本与本地一致）
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.167.0'
          extended: true

      # 中文字体是硬依赖，不是可选项。
      # 浏览器打印时若找不到中文字体，正文会整篇渲染成豆腐块（□）而不会报错——
      # 产出的 PDF 页数看着正常、文件也不小，肉眼一看才发现全是方框。
      # 曾观察到一份 674 页的豆腐块 PDF，就是在缺字体的 Linux 环境里生成的。
      # Ubuntu runner 默认不带中文字体，必须显式装；装完列出字体清单自证。
      - name: 安装中文字体（缺了会让正文变豆腐块）
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-noto-cjk-extra
          echo "已安装的中文字体（前若干项）："
          fc-list :lang=zh | head -n 12
          if [ -z "$(fc-list :lang=zh)" ]; then
            echo "没有可用的中文字体，PDF 会渲染成豆腐块，中止" >&2
            exit 1
          fi

      # 确认 Chromium 已在 PATH 上，并打印版本——排查问题时要看它
      - name: 确认无头浏览器可用
        run: |
          set -euo pipefail
          for c in google-chrome google-chrome-stable chromium-browser chromium; do
            if command -v "$c" >/dev/null 2>&1; then
              echo "找到浏览器：$c"
              "$c" --version
              echo "PDF_BROWSER=$c" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "runner 上没有 Google Chrome 或 Chromium，无法生成 PDF" >&2
          exit 1

      # baseURL 必须与发布地址一致：PDF 里的链接按它拼绝对地址（--link-base）。
      # 与 pages.yml 同源：都读仓库根 hugo.toml 的 baseURL（2026-10-04 前读 site.config.json）。
      - name: 构建站点（生产环境）
        env:
          HUGO_ENVIRONMENT: production
        run: |
          set -euo pipefail
          # 发布地址的唯一真相源是仓库根的 hugo.toml（baseURL）。不再按仓库名推导：
          # 绑了自定义域名后推导出的 hencter.github.io/... 是另一个地址。
          base=$(hugo config --format json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).baseurl||''))")
          if [ -z "$base" ]; then
            echo "读不到 hugo.toml 的 baseURL，中止" >&2
            exit 1
          fi
          echo "站点绝对地址：$base"
          echo "SITE_BASE=$base" >> "$GITHUB_ENV"
          hugo --minify --baseURL "$base"

      - name: 生成 PDF
        run: |
          set -euo pipefail
          node tools/build-pdf.mjs \
            --browser "$PDF_BROWSER" \
            --no-sandbox \
            --out dist/劳动者的账本.pdf \
            --link-base "$SITE_BASE"

      # 不只看「文件生成了」：校验页数、文件大小、文本可提取，且抽查内容真的在
      - name: 校验 PDF
        run: |
          set -euo pipefail
          ls -l dist/
          node tools/verify-pdf.mjs dist/劳动者的账本.pdf || {
            echo "verify-pdf.mjs 未通过或不存在，改用最小检查" >&2
            test -s dist/劳动者的账本.pdf
            test "$(stat -c%s dist/劳动者的账本.pdf)" -gt 500000
          }

      - name: 把 PDF 汇总写进运行摘要
        env:
          ASSET_NAME: work-rights-cn-book.pdf
        run: |
          set -euo pipefail
          size=$(stat -c%s dist/劳动者的账本.pdf)
          {
            echo "### PDF 已生成"
            echo ""
            echo "- 文件大小：$((size / 1024 / 1024)) MB"
            echo "- 链接基准：${SITE_BASE}"
            echo "- 下载地址：https://github.com/${GITHUB_REPOSITORY}/releases/download/pdf-latest/${ASSET_NAME}"
          } >> "$GITHUB_STEP_SUMMARY"

      # 固定 tag 的 Release：下载链接不变。与同类项目做法一致。
      # 注意 --latest=false：PDF 不该抢走仓库的 latest 标记。
      #
      # ⚠ 附件名必须是 **ASCII**。实测 `gh release upload` 对非 ASCII 文件名会剔除字符：
      #   上传 `重命名实验-临时.pdf` 得到 `-.pdf`（中文全没了）。于是
      #   `gh release upload dist/劳动者的账本.pdf` 落到一个与公布地址不符的名字上，
      #   而**本地文件名一直是对的**，作者看不出问题——直到有人点下载链接发现 404。
      #   站点上的显示文字仍用中文书名，下载文件名用 ASCII 不影响任何人。
      #   （本地工具的产物名保持中文，那是给人看的；只在发布这一步改成 ASCII。）
      - name: 发布到 Release（固定 tag：pdf-latest）
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_NAME: work-rights-cn-book.pdf
        run: |
          set -euo pipefail
          tag=pdf-latest
          notes="正文提交 ${GITHUB_SHA::7}，生成于 $(date -u -d '+8 hours' +'%Y-%m-%d %H:%M')（北京时间）。本 PDF 由无头浏览器打印站点生成，正文更新后自动重建，下载链接固定不变。"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "《劳动者的账本》PDF（正文更新后自动重建）" --notes "$notes"
          else
            gh release create "$tag" --title "《劳动者的账本》PDF（正文更新后自动重建）" --notes "$notes" --latest=false
          fi
          cp "dist/劳动者的账本.pdf" "dist/${ASSET_NAME}"
          gh release upload "$tag" "dist/${ASSET_NAME}" --clobber
          # 删掉历史上因非 ASCII 名被剔字符而残留的附件（例如 "-.pdf"、"default.pdf"），
          # 否则它们会一直挂在 Release 上，让人以为有多个版本。
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" \
            --jq '.assets[] | select(.name != "'"${ASSET_NAME}"'") | .id' \
            | while read -r id; do
                [ -n "$id" ] && gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${id}" || true
              done
          echo "Release 附件："
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.assets[] | "  \(.name)  \(.size) 字节"'
