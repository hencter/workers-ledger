属劳动者一侧情形，不在应付补偿之列；第④⑤项按第四十六条第六项应当支付经济补偿。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第四十四条、第四十六条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——需要确定落哪一项（期满证明、破产或吊销的公示信息、养老金领取记录）；单位主体状态可通过国家企业信用信息公示系统查询","地域":"全国","时效":"程序时效——仲裁申请时效一年。起算点——自劳动合同终止之日。例外——无特别时效，不适用劳动报酬类例外。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文）","核对日期":"2026-10-03","备注":"第四十六条第五项有个但书：用人单位维持或者提高原约定条件续订而劳动者不同意续订的，单位无需支付补偿（见第 3 节第 3.16 条）。第四十六条第六项对应第四十四条第四、五项，即单位破产或被吊销、责令关闭、撤销、决定提前解散。判断时先定位第四十四条的具体项，再对照第四十六条是否列明。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"大","口径":"金钱"}},{"节号":5,"节名":"离职与补偿","条号":24,"标题":"单位被吊销执照、责令关闭或提前解散：照样要给补偿","说人话":"公司被吊销执照、被责令关闭，或者股东决定提前解散——这几种情况下合同是「终止」，但补偿照样要给。你要做的是尽快固定劳动关系与工资证据，并在终止之日起一年内提出主张，因为主体一旦注销，追偿会变难。","适用":"单位被吊销营业执照、责令关闭、撤销，或者单位决定提前解散。","成本":"时间——协商或仲裁，一般半年上下；金钱——仲裁不收费，律师费通常自己承担。","收益":"上述情形属于劳动合同终止（第四十四条第五项）；用人单位以该情形终止劳动合同的，应当向劳动者支付经济补偿（第四十六条第六项），标准按第四十七条计算（每满一年一个月工资，六个月以上不满一年按一年，不满六个月半个月）。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第四十四条第五项、第四十六条第六项、第四十七条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——终止事实可由公示系统信息证明；工资与工龄需自己留存工资流水、社保记录","地域":"全国；清算主体责任与后续追偿路径按公司法及企业破产法处理","时效":"程序时效——仲裁申请时效一年。起算点——自劳动合同终止之日。例外——无特别时效，不适用劳动报酬类例外。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文）","核对日期":"2026-10-03","备注":"时间紧是这一条的特点：单位进入清算或注销后，主张对象可能变化，所以一旦出现吊销、关闭、解散的消息，立即收集证据并尽快申请仲裁，不要等「公司给个说法」。主体状态用国家企业信用信息公示系统可查。清算中的补偿债权属职工债权，具体受偿顺序与后续追偿建议咨询执业律师或当地劳动人事争议仲裁委员会。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"金钱"}},{"节号":5,"节名":"离职与补偿","条号":25,"标题":"用人单位破产：欠薪与经济补偿要按破产程序申报","说人话":"公司破产不等于你的钱就没了。欠付工资在破产清偿顺序里排在前面，经济补偿也要给。你要做的是按破产程序申报债权——留意人民法院或管理人发布的债权申报公告，在规定期限内申报，别错过。","适用":"单位被依法宣告破产，劳动合同终止，职工索要欠薪与经济补偿。","成本":"时间——需要参与破产程序申报债权，周期较长；金钱——申报债权本身不收费。","收益":"用人单位被依法宣告破产属于劳动合同终止情形（第四十四条第四项），应当向劳动者支付经济补偿（第四十六条第六项）。另据《工资支付暂行规定》，用人单位依法破产时劳动者有权获得其工资，在破产清偿中用人单位应按企业破产法规定的清偿顺序首先支付欠付本单位劳动者的工资；《工伤保险条例》亦规定企业破产的，在破产清算时依法拨付应当由单位支付的工伤保险待遇费用。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第四十四条第四项、第四十六条第六项、第四十七条；《工资支付暂行规定》（劳部发〔1994〕489 号，1995-01-01 施行）第十四条；《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）第四十三条第四款","效力位阶":"法律（第十四条为部门规章，《工伤保险条例》为行政法规）","主张强度":"可推定","举证难度":"中——劳动关系、工资与工龄材料需自己留存；破产程序中的债权申报需按管理人要求提交","地域":"全国；破产程序与债权申报按企业破产法及受理法院要求","时效":"程序时效——债权申报期限由人民法院确定并在公告中载明；劳动仲裁时效一年。起算点——自劳动合同终止之日（仲裁）；自法院公告的申报期限（破产债权）。例外——无特别时效豁免。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文）；https://www.gov.cn/zhengce/2022-08/31/content_5711284.htm（中国政府网·工资支付暂行规定全文，第十四条）；https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本）","核对日期":"2026-10-03","备注":"不确定点在破产程序中职工债权的实际受偿比例——清偿顺序优先不等于一定能全额拿到，取决于破产财产状况，故标「可推定」。关键动作是别错过债权申报期：关注受理法院与管理人发布的公告，按要求提交材料并保留申报回执。具体程序建议咨询破产管理人、当地人民法院或执业律师；劳动仲裁与破产程序的衔接可向当地劳动人事争议仲裁委员会或拨 12333 咨询。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"金钱"}},{"节号":5,"节名":"离职与补偿","条号":26,"标题":"劳动者死亡或开始领养老金：劳动合同终止，无经济补偿","说人话":"到了领养老金的年龄开始领养老金，合同自然终止，没有经济补偿；劳动者死亡或宣告死亡、失踪，合同也终止，也没有经济补偿。但死亡情形下，遗属可以领社保的丧葬补助金和抚恤金——那是另一笔，走社保渠道，不是经济补偿。","适用":"劳动者开始依法享受基本养老保险待遇，或者劳动者死亡、被宣告死亡、宣告失踪。","成本":"不花钱。核对自己或亲属所处情形。","收益":"上述三种情形属于劳动合同终止（第四十四条第二项、第三项）。这两类终止不在第四十六条列举的应付经济补偿情形之内，因此不产生经济补偿。劳动者死亡情形下，其遗属可依社会保险法主张丧葬补助金和抚恤金等基本养老保险待遇。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第四十四条第二项、第三项、第四十六条；《社会保险法》（2018-12-29 修正）第十七条","效力位阶":"法律","主张强度":"可主张","举证难度":"易——养老金领取记录或死亡证明、宣告文书是直接凭证","地域":"全国；社保待遇的核定由参保地经办机构办理","时效":"程序时效——待遇核定争议可申请行政复议（60 日）或提起行政诉讼（六个月）；劳动仲裁时效一年。起算点——自知道核定结果之日（行政救济）；自权利被侵害之日（仲裁）。例外——无特别时效豁免。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文）；http://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_296659.html（中国人大网·社会保险法全文）","核对日期":"2026-10-03","备注":"「开始依法享受基本养老保险待遇」是合同终止的时点，与「达到法定退休年龄」在文本上不是同一件事（见 5.27）。死亡情形下遗属可主张的是《社会保险法》第十七条的丧葬补助金与抚恤金，属基本养老保险待遇，与经济补偿是两套规则，不要混。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"中","口径":"金钱"}},{"节号":5,"节名":"离职与补偿","条号":27,"标题":"「达到法定退休年龄」与「开始领养老金」：两个时点要分清","说人话":"条文写的是「开始领养老金」合同才终止，而不是「到年龄」就自动终止。所以「到了退休年龄但还没办下退休、还在上班」这个空档期，合同状态不是一句话能定的——各地做法不同。遇到这种情况，先向参保地社保经办机构确认能否办理退休，再向仲裁委问清这一段的用工关系怎么认定。","适用":"劳动者达到法定退休年龄但尚未办理退休、未开始领取基本养老金，单位要终止合同。","成本":"不花钱。核对是否已实际领取养老金。","收益":"《劳动合同法》第四十四条第二项的表述是「劳动者开始依法享受基本养老保险待遇的」，劳动合同终止——条文锚定的时点是「开始享受待遇」，不是「达到退休年龄」本身。参加基本养老保险的个人，达到法定退休年龄时累计缴费满十五年的，按月领取基本养老金；累计缴费不足十五年的，可以缴费至满十五年，也可以转入城乡居民社会养老保险。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第四十四条第二项；《社会保险法》（2018-12-29 修正）第十六条","效力位阶":"法律","主张强度":"可推定","举证难度":"中——养老金领取记录或未领取的证明是关键；达到退休年龄的时点可由身份证件确定","地域":"全国；对「达到退休年龄但未享受养老保险待遇」期间用工关系的认定，各地裁审口径不一致","时效":"程序时效——仲裁申请时效一年。起算点——自用人单位以退休年龄为由终止劳动合同之日。例外——无特别时效豁免。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文）；http://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_296659.html（中国人大网·社会保险法全文）","核对日期":"2026-10-03","备注":"不确定点在空档期的关系定性——各地对「达到法定退休年龄但未开始享受基本养老保险待遇」的用工关系认定不一（有的按劳动关系、有的按劳务关系），因此本条只引条文原文、不作定性结论，故标「可推定」。这个判断直接决定能不能主张经济补偿与工伤待遇，务必先向当地劳动人事争议仲裁委员会或拨 12333 确认本地口径。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"中","口径":"金钱"}},{"节号":5,"节名":"离职与补偿","条号":28,"标题":"劳动报酬约定不明：按集体合同标准，没有就同工同酬","说人话":"没签合同、工资又没谈清，法律给了两档填法：先看本单位有没有集体合同，按集体合同的标准；没有，就按同工同酬——跟你干同样的活、同样岗位的人拿多少，你拿多少。所以「同岗位同事的工资」在这种情形下就是你的计算依据。","适用":"用工时没签书面合同，双方对劳动报酬约定不明确，发生争议。","成本":"不花钱。查一次本单位有没有集体合同。","收益":"用人单位未在用工的同时订立书面劳动合同，与劳动者约定的劳动报酬不明确的，新招用的劳动者的劳动报酬按照集体合同规定的标准执行；没有集体合同或者集体合同未规定的，实行同工同酬。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第十一条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——「同岗位」「同等工作量」的比对需要同事工资水平或岗位薪酬制度证据，后者可能需单位提交","地域":"全国","时效":"程序时效——仲裁申请时效一年；属劳动报酬类。起算点——逐月起算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文）","核对日期":"2026-10-03","备注":"「同工同酬」的举证是难点：你需要证明存在可比的同岗位人员并说明其报酬水平，而同事工资通常不公开。可行路径是要求单位提交岗位薪酬制度与同岗位工资表（属其掌握的证据，不提交承担不利后果，见第 9 节第 9.9 条）。各地对「同工」的比对口径不同，主张前向当地劳动人事争议仲裁委员会或拨 12333 确认。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"中","口径":"金钱"}},{"节号":5,"节名":"离职与补偿","条号":29,"标题":"服务期未到期但合同期满：合同要续延到服务期满","说人话":"签过培训服务期协议的人注意：合同期限到了但服务期没满，合同要顺延到服务期结束，不是自动终止。想提前走，就回到服务期违约金的规则——违约金以培训费为上限、按未履行部分分摊（见第 3 节第 3.13 条）。","适用":"约定了专项培训服务期，服务期还没满，劳动合同期限先到了。","成本":"不花钱。核对服务期协议与合同期限两个日期。","收益":"劳动合同期满，但是用人单位与劳动者依照劳动合同法第二十二条的规定约定的服务期尚未到期的，劳动合同应当续延至服务期满；双方另有约定的，从其约定。","依据":"《劳动合同法实施条例》（国务院令第 535 号）第十七条；《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第二十二条","效力位阶":"行政法规（第二十二条为法律）","主张强度":"可主张","举证难度":"易——服务期协议与合同期限均为书面文本，可直接比对","地域":"全国","时效":"程序时效——仲裁申请时效一年。起算点——自服务期届满之日，或自单位主张违约金之日。例外——无特别时效豁免。","来源":"https://www.gov.cn/zhengce/zhengceku/2008-09/19/content_6630.htm（中国政府网·劳动合同法实施条例全文）；http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文）","核对日期":"2026-10-03","备注":"本条与解释（二）第八条呼应——后者把「实施条例第十七条规定的服务期尚未到期」列为合同期满时依法自动续延的情形，且明确不属于未订立书面劳动合同，因此顺延期间不触发二倍工资。顺延期间社保与公积金应继续缴纳，建议书面确认。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"中","口径":"自由"}},{"节号":5,"节名":"离职与补偿","条号":30,"标题":"单位未在用工同时签合同且报酬不明：先看有没有约定","说人话":"这一条的前提是「报酬真没约定」。如果 offer、微信里写过「月薪 X 元」，那就是约定了，按那个走，不用绕到同工同酬。所以第一步是把录用通知、聊天记录翻出来——里面有数字，你的请求就清楚得多。","适用":"入职时既没签书面合同，也没把工资标准写进任何文件。","成本":"不花钱。核对录用通知、聊天记录里有没有工资约定。","收益":"此项规则的适用前提是「未在用工的同时订立书面劳动合同，与劳动者约定的劳动报酬不明确」。若录用通知、聊天记录、邮件中已有明确工资标准，则不属「约定不明确」，按该约定执行；若确实没有，则按集体合同标准，无集体合同则同工同酬（第十一条）。未签书面合同另可主张二倍工资（第八十二条）。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第十条、第十一条、第八十二条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——录用通知与聊天记录需自己留存；「约定是否明确」由双方各自举证","地域":"全国","时效":"程序时效——仲裁申请时效一年；属劳动报酬类。起算点——逐月起算；二倍工资自用工满一个月的次月起逐月起算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文）","核对日期":"2026-10-03","备注":"把「约定明确」与「约定不明」分开，会影响两条请求的写法：约定明确时直接主张该标准；约定不明时才用同工同酬。二倍工资与同工同酬是不同请求，可并存（见第 3 节第 3.11 条）。取证时机在离职之前：录用通知、入职沟通记录、首个工资条当时留存。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"金钱"}},{"节号":5,"节名":"离职与补偿","条号":31,"标题":"发生劳动争议后先协商，协商不成再走调解仲裁","说人话":"顺序是「协商 → 调解 → 仲裁 → 诉讼」，但协商和调解都不是必经程序——可以直接申请仲裁。反过来，庭审前仲裁庭会先调解一次，这是法定动作。所以别把时间耗在「先协商看看」上，协商可以同时做，但时效不等人。","适用":"刚发生争议，不确定先找谁。","成本":"不花钱。协商本身不设时限。","收益":"发生劳动争议，当事人不愿协商、协商不成或者达成和解协议后不履行的，可以向调解组织申请调解；不愿调解、调解不成或者达成调解协议后不履行的，可以向劳动争议仲裁委员会申请仲裁；对仲裁裁决不服的，除本法另有规定的外，可以向人民法院提起诉讼。此外，仲裁庭在作出裁决前，应当先行调解；调解书经双方当事人签收后发生法律效力。","依据":"《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第五条、第四十二条","效力位阶":"法律","主张强度":"可主张","举证难度":"易——程序顺序由法律明文规定，不依赖实体证据","地域":"全国；调解组织的设置与调解程序按属地规定","时效":"程序时效——协商与调解期间要注意时效：主张权利可产生时效中断（第二十七条第二款）；仲裁申请时效一年。起算点——自知道或应当知道权利被侵害之日。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制。","来源":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（广东省人民政府门户网站·劳动争议调解仲裁法全文，页面来源标注中国人大网）","核对日期":"2026-10-03","备注":"两条实操要点：① 协商阶段每次沟通都留书面痕迹，既是谈判筹码，也能中断时效（见第 9 节第 9.14 条）；② 第四十二条规定的先行调解是法定程序，签字前确认给付金额与期限写清——调解书经双方签收即生效。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"中","口径":"时间"}},{"节号":6,"节名":"在职与离职后的红线","条号":1,"标题":"违约金不能随便约定，能约定的只有两种情况","说人话":"公司能让你赔违约金的，只有两种情况：一是它花钱送你去专项培训、约定了服务期；二是签了竞业限制。除此之外，「违反在职不兼职承诺罚 N 万」这类约定，违约金部分是可以争的。但要注意：违约金条款无效不代表它不能索赔——它可以按实际损失另找你要钱，只是那条路要它自己举证损失。","适用":"合同或协议里出现「违反 XX 承诺赔偿 X 万元」这类条款，例如承诺在职不注册公司、不兼职、不泄露信息，违反要赔违约金。","成本":"不花钱。签字前把全部「劳动者违约责任」条款圈出来。","收益":"除服务期（第二十二条）和竞业限制（第二十三条）两种情形外，用人单位不得与劳动者约定由劳动者承担违约金。超出这两种授权的违约金条款，其违约金部分存在抗辩空间。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第二十二条、第二十三条、第二十五条、第九十条","效力位阶":"法律","主张强度":"可推定","举证难度":"中——违约金条款写在协议里，文本自己应留存；实际损失的举证责任在用人单位","地域":"全国；对「超出授权范围的违约金条款效力」各地裁判路径不完全一致（有的直接认定违约金条款无效，有的按实际损失调整）","时效":"程序时效——用人单位主张赔偿走仲裁，时效一年。起算点——自其知道损失发生之日。例外——无特别时效豁免。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文）","核对日期":"2026-10-03","备注":"不确定点在抗辩路径的选择——违约金无效与按实际损失赔偿是两个问题，各地裁审对「用人单位能否绕开第二十五条按第九十条索赔实际损失」的处理不一致，需向当地劳动人事争议仲裁委员会或拨 12333 确认本地尺度。签字前把所有「违约金」字样圈出来，看它挂在哪种构造下（见 6.3）。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"金钱"}},{"节号":6,"节名":"在职与离职后的红线","条号":2,"标题":"竞业限制只能对三类人用，不是人人都能被限制","说人话":"竞业限制不是公司想给谁签就给谁签，法律只认三类人：高管、高级技术人员、以及其他确实负有保密义务的人。「其他负有保密义务的人员」是唯一有解释空间的一类——判断标准是你实际知不知道、接不接触商业秘密，不是协议上怎么写。所以关键证据是：你的岗位职责里有没有碰客户报价、技术方案、经营数据。","适用":"被要求签署竞业限制协议，或者协议里的对象条款写得很宽泛（例如「全体员工」）。","成本":"不花钱。核对协议里对人员范围的表述。","收益":"竞业限制的人员限于高级管理人员、高级技术人员和其他负有保密义务的人员。对不属于上述范围的人员约定竞业限制，该约定缺乏法律基础。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第二十四条第一款","效力位阶":"法律","主张强度":"可推定","举证难度":"中——岗位说明书、工作内容记录、可访问数据范围由自己一方整理；「是否属于涉密人员」由用人单位主张","地域":"全国；对「其他负有保密义务的人员」的认定标准各地差异较大","时效":"程序时效——用人单位主张违约金或劳动者请求确认条款不生效，走仲裁，时效一年。起算点——自收到主张或自离职之日。例外——无特别时效豁免。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）","核对日期":"2026-10-03","备注":"不确定点在人员范围的认定，各地对职能岗、支持岗是否构成「负有保密义务的人员」把握不一，需向当地劳动人事争议仲裁委员会或拨 12333 确认。入职时把岗位说明书留一份——它是证明「我的工作内容不涉及核心秘密」最直接的材料，事后找公司要基本要不出来。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"自由"}},{"节号":6,"节名":"在职与离职后的红线","条号":3,"标题":"在职期间的竞业限制条款是有效的，而且不用给补偿","说人话":"这是 2025 年新司法解释里最需要知道的一条。离职后的竞业限制，公司必须按月给你钱；但在职期间的竞业限制，法律认可它有效，而且不要求公司给补偿——零成本就能把你绑住。所以签字前必须分清是哪种：写「在职期间」的，别用「离职后才有补偿义务」的逻辑安慰自己。它和员工手册里「不得兼职、不得自营」的禁止条款是两条可以同时用的路径。","适用":"续签或新签文本里出现「在职期间不得从事竞争业务、不得自营同类业务」这类条款。","成本":"不花钱。签字前逐字看「适用期间」那一栏写的是「在职期间」还是「解除/终止后」。","收益":"与负有保密义务的人员约定在职期间的竞业限制条款，劳动者以「不得约定在职期间竞业限制」或者「未支付经济补偿」为由请求确认无效的，人民法院不予支持。也就是说：在职竞业限制条款有效，且用人单位没有按月支付经济补偿的义务。","依据":"《最高人民法院关于审理劳动争议案件适用法律问题的解释（二）》（法释〔2025〕12 号，2025-09-01 施行）第十四条","效力位阶":"司法解释","主张强度":"可主张","举证难度":"中——条款文本自己应留存原件；「在职期间从事竞争业务」的事实由用人单位举证","地域":"全国（该解释为全国统一适用）","时效":"程序时效——用人单位主张违约或劳动者请求确认条款无效，走仲裁，时效一年。起算点——自收到主张之日，或自在职行为发生之日。例外——无特别时效豁免。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文，作入口）；http://gongbao.court.gov.cn/Details/bb72019c45453f84d920bd6375573e.html（最高人民法院公报·关于审理劳动争议案件适用法律问题的解释（二）全文，法释〔2025〕12 号）","核对日期":"2026-10-03","备注":"解释（二）已核到一手全文（最高人民法院公报，2026-10-03 复核），条文与 2026-09-02 记录一致。这一条与 6.1 的关系：在职竞业条款有效，所以不能再主张「整条无效」，抗辩空间收缩到「违约金约定是否超出第二十三条授权」和「范围是否过度」。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"中","口径":"自由"}},{"节号":6,"节名":"在职与离职后的红线","条号":4,"标题":"离职后竞业限制最长两年，超期部分无效","说人话":"离职后的竞业限制最长两年，写三年五年也只按两年算，超出的部分不算数。这一条是硬上限，不用争。协议里写「长期有效」「直至竞业事由消失」这类的，同样只能算两年。","适用":"竞业限制协议约定的限制期限超过两年。","成本":"不花钱。看协议里的期限条款。","收益":"在解除或终止劳动合同后，竞业限制期限不得超过二年。超过二年的部分无效。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第二十四条第二款","效力位阶":"法律","主张强度":"可主张","举证难度":"易——协议文本本身即可证明期限约定","地域":"全国","时效":"程序时效——仲裁申请时效一年。起算点——自解除或终止劳动合同之日。例外——无特别时效豁免。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）","核对日期":"2026-10-03","备注":"两年从解除或终止之日起算，不是从签署协议之日起算。协议里如果写「自离职之日起 X 年」，注意保留离职日期的凭证。第二十四条第二款还明确覆盖了「自己开业生产或者经营同类产品、从事同类业务」的情形——注册公司自己干，同样在这两年的射程内。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"中","口径":"自由"}},{"节号":6,"节名":"在职与离职后的红线","条号":5,"标题":"范围、地域、期限超出保密必要，超过部分可以请求无效","说人话":"竞业限制的边界要和你知道的秘密相称——你在一个城市做本地客户维护，限制你两年内全国同行业都不能干，这就超出了合理比例，超出那部分可以请求认定无效。这一条是 2025 年新司法解释的明文，不是猜测。要做的是拿岗位职责、可访问的数据范围去比对协议里的定义。","适用":"竞业限制协议把「竞争业务」定义得极宽（例如「与公司业务相关的一切领域」）、地域覆盖全国乃至全球、期限顶满两年，但你实际接触的保密信息很有限。","成本":"时间——请求确认走仲裁，一般几个月；金钱——仲裁不收费，律师费通常自己承担。","收益":"约定的范围、地域、期限与劳动者知悉、接触的保密事项不相适应的，可以请求确认超过合理比例的部分无效。","依据":"《最高人民法院关于审理劳动争议案件适用法律问题的解释（二）》（法释〔2025〕12 号，2025-09-01 施行）第十三条第二款","效力位阶":"司法解释","主张强度":"可推定","举证难度":"中——岗位职责、工作内容记录、可访问数据范围需自己整理；「相适应」的判断是个案裁量","地域":"全国（该解释为全国统一适用）；「合理比例」的个案裁量空间较大","时效":"程序时效——仲裁申请时效一年。起算点——自收到用人单位主张违约之日，或自离职之日。例外——无特别时效豁免。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文，作入口）；http://gongbao.court.gov.cn/Details/bb72019c45453f84d920bd6375573e.html（最高人民法院公报·关于审理劳动争议案件适用法律问题的解释（二）全文，法释〔2025〕12 号）","核对日期":"2026-10-03","备注":"不确定点在「合理比例」怎么划——解释只给了「相适应」这个标准，没有给量化尺度，各地个案裁量差异明显，需向当地劳动人事争议仲裁委员会或拨 12333 确认本地尺度。解释（二）已核到一手全文（最高人民法院公报）。入职时把协议原文和岗位说明书一起留存，比对材料全靠这两样。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"自由"}},{"节号":6,"节名":"在职与离职后的红线","条号":6,"标题":"没接触过保密事项，可以请求确认竞业限制条款不生效","说人话":"签了竞业协议不等于就被绑死。如果你实际工作里根本碰不到客户报价、技术方案、经营数据这类秘密，可以请求确认这条条款不生效。举证责任在劳动者一边——所以你要拿出能说明「我的工作内容不含敏感信息」的材料：岗位说明书、工作交接记录、系统权限范围、可访问的数据清单。这一条对职能岗、支持岗尤其值得评估。","适用":"签了竞业限制协议，但实际工作岗位根本接触不到商业秘密和与知识产权相关的保密事项。","成本":"时间——主张走仲裁，一般几个月；金钱——仲裁不收费，律师费通常自己承担。","收益":"劳动者未知悉、未接触用人单位商业秘密和与知识产权相关的保密事项的，可以请求确认竞业限制条款不生效。","依据":"《最高人民法院关于审理劳动争议案件适用法律问题的解释（二）》（法释〔2025〕12 号，2025-09-01 施行）第十三条第一款","效力位阶":"司法解释","主张强度":"可推定","举证难度":"难——需要证明「未知悉、未接触」这一消极事实，材料多在公司系统里，且离职后难以还原","地域":"全国（该解释为全国统一适用）","时效":"程序时效——仲裁申请时效一年。起算点——自用人单位主张违约之日，或自离职之日。例外——无特别时效豁免。","来源":"https://www.court.gov.cn/fabu/xiangqing/282121.html（最高人民法院官网·劳动争议解释（一）全文）；http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文）；http://gongbao.court.gov.cn/Details/bb72019c45453f84d920bd6375573e.html（最高人民法院公报·关于审理劳动争议案件适用法律问题的解释（二）全文，法释〔2025〕12 号）","核对日期":"2026-10-03","备注":"举证难度标「难」——取证时机必须在离职之前。具体动作：把岗位说明书、系统权限清单、可访问的文件夹与数据范围、日常工作产出（不含实质秘密的）当场截图留存；有内网权限证明的，把权限页面截图。离职后账号停用，这些全部取不到。不确定点在「未接触」的证明标准，各地口径不一，可向当地劳动人事争议仲裁委员会或拨 12333 咨询。解释（二）已核到一手全文（最高人民法院公报，2026-10-03 复核），条文与 2026-09-02 记录一致。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"自由"}},{"节号":6,"节名":"在职与离职后的红线","条号":7,"标题":"约定了竞业限制但没写补偿金额，按月按 30% 主张","说人话":"协议里只写「你不能去竞争对手那里」，没写「我每月给你多少钱」——不影响你拿钱。你实际守了约，就可以按离职前十二个月平均工资的 30% 按月要；算下来比当地最低工资还低的，按最低工资给。这个 30% 是司法解释定的兜底比例，不用跟公司谈。","适用":"竞业限制协议只写了限制，没写按月给多少钱的补偿标准。","成本":"不花钱。核对协议里有没有补偿条款。","收益":"约定了竞业限制但未约定经济补偿的，劳动者履行了竞业限制义务后，可要求用人单位按劳动合同解除或终止前十二个月平均工资的 30% 按月支付经济补偿；低于劳动合同履行地最低工资标准的，按最低工资标准支付。","依据":"《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》（法释〔2020〕26 号，2021-01-01 施行）第三十六条","效力位阶":"司法解释","主张强度":"可主张","举证难度":"中——需要证明自己履行了竞业限制义务；离职前十二个月工资流水需自己留存","地域":"全国；「劳动合同履行地最低工资标准」按工作地现行标准","时效":"程序时效——仲裁申请时效一年。起算点——自各月补偿应付未付之日起算，逐月计算。例外——属于持续性按月给付义务，逐月起算，不是从离职日一次性起算。","来源":"https://www.court.gov.cn/fabu/xiangqing/282121.html（最高人民法院官网·关于审理劳动争议案件适用法律问题的解释（一）全文，第三十六条）","核对日期":"2026-10-03","备注":"已核到原文的表述为「当事人在劳动合同或者保密协议中约定了竞业限制，但未约定解除或者终止劳动合同后给予劳动者经济补偿，劳动者履行了竞业限制义务，要求用人单位按照劳动者在劳动合同解除或者终止前十二个月平均工资的 30% 按月支付经济补偿的，人民法院应予支持」；低于劳动合同履行地最低工资标准的按最低工资标准支付，见该条第二款。注意逐月起算这件事：每个月都是一笔独立的请求权，拖得越久越难追，离职后按月核对有没有到账，没到账就留记录。","成本标签":{"钱":"0","时间":"少","毅力":"些","收益":"大","口径":"金钱"}},{"节号":6,"节名":"在职与离职后的红线","条号":8,"标题":"单位三个月不付补偿，可以请求解除竞业限制约定","说人话":"公司三个月不给你竞业补偿，你可以请求解除这条限制——解除之后你就不用再守着，它也不能再拿这条找你要违约金。三个月是硬门槛，从第一笔该付没付算起。","适用":"约定了竞业限制和经济补偿，单位因自身原因连续三个月没有支付。","成本":"时间——主张走仲裁，一般几个月；金钱——仲裁不收费，律师费通常自己承担。","收益":"当事人在劳动合同或者保密协议中约定了竞业限制和经济补偿，劳动合同解除或终止后，因用人单位原因超过三个月未支付经济补偿，劳动者请求解除竞业限制约定的，人民法院应予支持。","依据":"《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》（法释〔2020〕26 号，2021-01-01 施行）第三十八条","效力位阶":"司法解释","主张强度":"可推定","举证难度":"中——银行流水可证明补偿未到账；「未支付是否因用人单位原因」可能成为争点","地域":"全国；只约定竞业限制、未约定补偿金额时，三个月未付能否直接请求解除，各地裁判口径未统一","时效":"程序时效——仲裁申请时效一年。起算点——自三个月未支付届满之日起算。例外——无特别时效豁免，但按月补偿的请求权各自起算。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文，作入口）","核对日期":"2026-10-03","备注":"不确定点在条文衔接上——第三十八条的字面前提是「约定了竞业限制和经济补偿」；如果协议只约定竞业限制、没写补偿金额（落入 6.7 的 30% 兜底场合），三个月不付能否直接请求解除，各地口径不统一，需向当地劳动人事争议仲裁委员会或拨 12333 确认。解释（一）原文页本轮未打开，内容取自 2026-09-02 已核对记录，标注待换一手源。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"自由"}},{"节号":6,"节名":"在职与离职后的红线","条号":9,"标题":"单位中途解除竞业限制，要额外给三个月补偿（需你主张）","说人话":"公司中途说「你不用守竞业了」，它可以解除，但要额外补你三个月的竞业补偿。注意这是请求权，不是自动给的——它不会主动打钱，你得自己提。收到解除通知就书面提出这三个月的补偿要求。","适用":"竞业限制期限内，单位单方通知你「不用再守了」。","成本":"不花钱。核对通知与已付补偿的月份。","收益":"在竞业限制期限内，用人单位请求解除竞业限制协议的，人民法院应予支持；解除竞业限制协议时，劳动者请求用人单位额外支付三个月竞业限制经济补偿的，人民法院应予支持。","依据":"《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》（法释〔2020〕26 号，2021-01-01 施行）第三十九条","效力位阶":"司法解释","主张强度":"可主张","举证难度":"中——单位解除竞业限制的通知需留存；已付补偿的月份可由流水证明","地域":"全国；三个月补偿的计算基数（按原约定标准还是 30% 兜底）各地认定不一","时效":"程序时效——仲裁申请时效一年。起算点——自单位解除竞业限制约定之日。例外——无特别时效豁免。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文，作入口）","核对日期":"2026-10-03","备注":"不确定点在三个月补偿的计算基数，各地做法不一致，需向当地劳动人事争议仲裁委员会或拨 12333 确认。这条请求权需要劳动者主动主张，实务中很多人收到「解除通知」就以为结束了，白白丢掉三个月。解释（一）原文页本轮未打开，内容取自 2026-09-02 已核对记录，标注待换一手源。","成本标签":{"钱":"0","时间":"少","毅力":"些","收益":"大","口径":"金钱"}},{"节号":6,"节名":"在职与离职后的红线","条号":10,"标题":"违反有效的竞业限制：退补偿、付违约金，还可能要接着守","说人话":"违反竞业限制不是「大不了不拿补偿」。真实的代价是三样叠加：把已经拿到的补偿退回去、按约定付违约金、而且还可能被要求继续守完剩下的期限。所以离职前如果签过竞业限制，先把「是否启动、补偿多少、付到什么时候」这三件事书面确认清楚，再决定去向。","适用":"签了有效的竞业限制协议，离职后去了竞争方或者自己开业做同类业务。","成本":"钱——要返还已收的经济补偿，还要按约定支付违约金，两项叠加；时间——争议走仲裁，一般几个月。","收益":"这不是收益条，是风险条。劳动者违反有效的竞业限制约定，用人单位请求其按照约定返还已经支付的经济补偿并支付违约金的，人民法院依法予以支持；支付违约金后，用人单位仍可要求继续履行竞业限制。","依据":"《最高人民法院关于审理劳动争议案件适用法律问题的解释（二）》（法释〔2025〕12 号，2025-09-01 施行）第十五条；《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》（法释〔2020〕26 号，2021-01-01 施行）第四十条","效力位阶":"司法解释","主张强度":"可主张","举证难度":"中——竞业限制协议、补偿支付记录、新单位任职或自营登记信息","地域":"全国","时效":"程序时效——仲裁申请时效一年。起算点——自用人单位知道违约行为之日。例外——违反竞业限制属持续性行为，时效起算可能从违约行为终了之日起算。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文，作入口）；http://gongbao.court.gov.cn/Details/bb72019c45453f84d920bd6375573e.html（最高人民法院公报·关于审理劳动争议案件适用法律问题的解释（二）全文，法释〔2025〕12 号）","核对日期":"2026-10-03","备注":"商事主体登记信息（法定代表人、股东、经营范围）通过国家企业信用信息公示系统公开可查，自己开业难以隐去。解释（一）（二）原文页本轮未打开，内容取自 2026-09-02 已核对记录，标注待换一手源。离职时务必书面确认竞业限制是否启动，没有书面确认的，默认按协议执行。","成本标签":{"钱":"多","时间":"多","毅力":"是","收益":"小","口径":"自由"}},{"节号":6,"节名":"在职与离职后的红线","条号":11,"标题":"保密义务不需要付对价，也不因离职而消失","说人话":"保密和竞业是两件事，别搞混。保密是「不说出去、不拿来用」，公司不用给你钱，你离职之后也照样要守；竞业是「不去竞争对手那里干」，那个才需要按月给补偿。签了保密协议不等于被竞业限制，反过来也一样。","适用":"签了保密协议或者合同里有保密条款，担心「公司没给保密费，我是不是就不用守了」。","成本":"不花钱。留存保密协议文本，明确保密范围。","收益":"用人单位与劳动者可以在劳动合同中约定保守用人单位的商业秘密和与知识产权相关的保密事项。保密义务不以支付对价为前提：在职期间当然负有，离职后按约定与法定义务继续承担。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第二十三条第一款、第九十条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——保密协议文本自己应留存；是否构成「泄露、使用」由用人单位举证","地域":"全国","时效":"程序时效——用人单位主张赔偿走仲裁，时效一年。起算点——自其知道或应当知道泄密行为之日。例外——保密义务本身没有期限，离职后继续有效。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）","核对日期":"2026-10-03","备注":"保密范围写得越概括（「一切经营信息」）对劳动者越不利，签字时能缩小就缩小。离职前把自己在职期间的工作产出、可访问的资料范围列个清单——将来被主张泄密时，这份清单能帮你划清「我本来就接触不到」的边界。原始资料不要带走，包括自己做的、存在公司系统里的东西。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"中","口径":"自由"}},{"节号":6,"节名":"在职与离职后的红线","条号":12,"标题":"什么算商业秘密：三个要件，缺一个就不受保护","说人话":"公司说「这是商业秘密」，得同时满足三条：外面查不到、能带来经济利益、它自己采取了保密措施（签保密协议、加密、权限管理、标注密级都算）。第三条最容易被忽略——一个谁都能打开的内部共享文件夹里的文件，它很难主张是「采取了保密措施」的。被指泄密时，先照这三条问一遍。","适用":"公司主张你泄露了「商业秘密」，要追究责任。","成本":"不花钱。核对自己接触的信息是否满足三个要件。","收益":"商业秘密是指不为公众所知悉、具有商业价值并经权利人采取相应保密措施的技术信息、经营信息等商业信息。三个要件——秘密性、价值性、保密措施——缺一个就不构成商业秘密，公司也就没有可保护的对象。","依据":"《反不正当竞争法》（2025-06-27 第二次修订，2025-10-15 施行）第十条第四款","效力位阶":"法律","主张强度":"可推定","举证难度":"中——信息的公开性与保密措施由双方各自举证；「不为公众所知悉」的举证责任分配在个案中不同","地域":"全国","时效":"程序时效——侵犯商业秘密的民事赔偿诉讼时效三年；用人单位以劳动者违约为由主张赔偿的走仲裁，时效一年。起算点——自权利人知道或应当知道权利受损害之日。例外——无特别时效豁免。","来源":"http://www.npc.gov.cn/npc/c2/c30834/202506/t20250627_446247.html（中国人大网·反不正当竞争法现行本，页内载明 2025-06-27 第二次修订，第四十一条「本法自 2025 年 10 月 15 日起施行」；2026-10-03 实测 HTTP 200，第十条第四款逐字比对通过）","核对日期":"2026-10-03","备注":"不确定点在「不为公众所知悉」与「采取相应保密措施」的证明标准，个案差异大；用人单位同时可能走劳动仲裁（违约）和民事诉讼（侵权）两条路，抗辩重点不同，具体尺度可向当地劳动人事争议仲裁委员会咨询。本条给的是构成要件，不是「你能赢」的结论。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"中","口径":"自由"}},{"节号":6,"节名":"在职与离职后的红线","条号":13,"标题":"职务作品与职务发明：在职期间做出来的东西归谁","说人话":"上班时做出来的东西归谁，分两种：一般职务作品，著作权归你，但公司可以在业务范围内优先用，而且完成后两年内你不能自己许可别人用同样方式；如果是主要用公司的物质技术条件做的，并且是软件、设计图这类，那著作权基本归公司，你只有署名权。合同里另外约定了归属的，按合同来——所以「职务成果」条款值得逐字看一遍。","适用":"在职期间开发了软件、写了文档、做了设计，想知道成果归谁。","成本":"不花钱。核对一次合同里的「职务成果归属」条款。","收益":"自然人为完成法人或者非法人组织工作任务所创作的作品是职务作品，除法律另有规定外，著作权由作者享有，但单位有权在其业务范围内优先使用；作品完成两年内，未经单位同意，作者不得许可第三人以与单位使用的相同方式使用该作品。有下列情形之一的职务作品，作者只享有署名权，著作权的其他权利由单位享有：主要是利用单位的物质技术条件创作并由单位承担责任的工程设计图、产品设计图、地图、示意图、计算机软件等职务作品；报社、期刊社、通讯社、广播电台、电视台工作人员创作的职务作品；法律、行政法规规定或者合同约定著作权由单位享有的职务作品。","依据":"《著作权法》（2020-11-11 第三次修正）第十八条；《专利法》（2020-10-17 第四次修正，2021-06-01 施行）第六条","效力位阶":"法律","主张强度":"可推定","举证难度":"中——创作过程、是否利用单位物质技术条件、合同约定条款需要各自举证","地域":"全国","时效":"程序时效——著作权侵权或权属争议的诉讼时效三年。起算点——自权利人知道或应当知道权利受损害之日。例外——若用人单位以劳动仲裁路径主张，适用仲裁时效一年。","来源":"https://www.gov.cn/guoqing/2021-10/29/content_5647633.htm（中国政府网·著作权法全文，页面标注 2020-11-11 第三次修正）；http://www.npc.gov.cn/npc/c2/c30834/202011/t20201119_308800.html（中国人大网·专利法现行本，第六条；2026-10-03 实测 HTTP 200 并逐字比对通过）；http://www.npc.gov.cn/npc/c2/c30834/202010/t20201017_308253.html（中国人大网·主席令第五十五号，载明 2020 年第四次修正「自2021年6月1日起施行」；该页为施行日期的依据，因专利法正文页第八十二条仍保留 1985 年原始施行日期、未随修正更新）","核对日期":"2026-10-03","备注":"职务发明（专利）另有一套规定，《专利法》第六条：执行本单位任务、或者主要是利用本单位物质技术条件完成的发明创造为职务发明创造，申请专利的权利属于单位，获批后单位为专利权人；非职务发明的申请权属于发明人或设计人。第三条关键：利用本单位物质技术条件完成的发明创造，单位与发明人订有合同约定归属的，从其约定——所以合同里怎么写，比默认规则更管用。不确定点在于「主要是利用单位的物质技术条件」的判断，业余时间、自有设备做的东西是否落入这一档，个案差异大；好在第六条第三款把合同约定放在优先位置，签字前把归属条款谈清楚，比事后争「算不算职务发明」有效。权属争议的受理与认定路径各地不一，可向当地劳动人事争议仲裁委员会或拨 12333 咨询，涉及软件、设计成果的也可先咨询当地版权登记或人民法院立案窗口。合同里的「职务成果归单位」条款通常写得很宽，签字前单独看这一条。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"中","口径":"自由"}},{"节号":6,"节名":"在职与离职后的红线","条号":14,"标题":"员工手册里的「禁止兼职/自营」条款，程序不合法就用不了","说人话":"员工手册里那些「不得兼职、不得自营」的规定，要能用它来罚你、辞你，前提是这份制度走过程序、并且给过你看（签收、公示、培训都算）。没签收过、只在群里发过一次的，拿到仲裁去用往往不成立。所以入职签收的每一份制度，自己都要留一份——这是你能拿到的最便宜的护身符。","适用":"员工手册或入职承诺书里写着「在职期间不得兼职、不得自营」，单位据此要解除你的合同。","成本":"时间——争议走仲裁，一般几个月；金钱——仲裁不收费，律师费通常自己承担。","收益":"直接涉及劳动者切身利益的规章制度，应当经民主程序制定，并向劳动者公示或告知。未公示告知的制度不能作为约束劳动者的依据；据此解除的，可能构成违法解除，可主张按经济补偿标准二倍的赔偿金。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第四条、第三十九条第二项、第四十八条、第八十七条","效力位阶":"法律","主张强度":"可推定","举证难度":"难——制度是否公示告知、是否经民主程序，证据多由用人单位掌握；劳动者一侧难以证明「我没收到」","地域":"全国；对「民主程序」和「公示告知」的证明标准各地不同","时效":"程序时效——仲裁申请时效一年。起算点——自收到解除通知之日。例外——无特别时效豁免。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）","核对日期":"2026-10-03","备注":"举证难度标「难」——取证时机在入职当时和每次制度换版时，具体动作：核对自己有没有签收页，没签过的版本当场拍照留版本号与发布日期；离职前把能访问到的制度公告、培训通知、内部系统截图导出，离职后账号停用就取不到了。不确定点在「民主程序」与「公示告知」的证明标准，各地口径不一，可向当地劳动人事争议仲裁委员会或拨 12333 咨询本地尺度。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"金钱"}},{"节号":6,"节名":"在职与离职后的红线","条号":15,"标题":"建立双重劳动关系：被解除的依据，以及它的适用条件","说人话":"同时跟两家单位建立劳动关系，被本单位辞退且不给补偿，需要满足两个条件之一：要么确实严重影响了本职工作，要么公司提出来让你停、你不改。第二个条件对公司来说更容易举证——所以收到公司「限期停止兼职」的书面要求时，怎么回应就变得很关键。另外注意：单纯在册但没实际用工经营的注册公司，一般不直接等于「建立另一段劳动关系」，但可能落入员工手册的禁止条款。","适用":"在职期间与另一家单位建立劳动关系，或者自己注册公司并实际经营。","成本":"时间——争议走仲裁，一般几个月；金钱——仲裁不收费，律师费通常自己承担。","收益":"这不是收益条，是风险条。劳动者同时与其他用人单位建立劳动关系，对完成本单位的工作任务造成严重影响，或者经用人单位提出拒不改正的，用人单位可以解除劳动合同且无需支付经济补偿。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第三十九条第四项","效力位阶":"法律","主张强度":"可推定","举证难度":"中——「是否建立劳动关系」与「是否造成严重影响」由用人单位举证；书面要求的送达与回复是争议焦点","地域":"全国；对「注册但未实际经营的公司是否构成双重劳动关系」各地认定不一","时效":"程序时效——仲裁申请时效一年。起算点——自收到解除通知之日。例外——无特别时效豁免。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）","核对日期":"2026-10-03","备注":"不确定点在「注册并自营公司是否等于建立另一劳动关系」——条文通常指向存在实际用工的情形，本人名下有商事登记但未实际用工经营是否落入，需按个案判断，各地口径不一，可向当地劳动人事争议仲裁委员会或拨 12333 确认。收到任何关于兼职、自营的书面质询，回复要留痕，回不回复、怎么回复，直接影响「拒不改正」这个条件的成立。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"中","口径":"自由"}},{"节号":6,"节名":"在职与离职后的红线","条号":16,"标题":"严重失职造成重大损害：解除要同时满足「失职」和「重大损害」","说人话":"公司用「你严重失职造成重大损失」辞你，它得同时拿出两样：你的失职行为，以及实际发生的重大损害。只说「影响很坏」不算。所以被这样辞的时候，逐条问它要：具体哪个行为、造成了多少损失、损失怎么算出来的。","适用":"单位以「严重失职、营私舞弊，给用人单位造成重大损害」为由解除劳动合同。","成本":"时间——争议走仲裁，一般几个月；金钱——仲裁不收费，律师费通常自己承担。","收益":"这不是收益条，是风险条。该情形下用人单位可以解除且无需支付经济补偿，但需要同时证明两件事：存在严重失职或营私舞弊行为，以及该行为造成了重大损害。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第三十九条第三项、第四十八条、第八十七条","效力位阶":"法律","主张强度":"可推定","举证难度":"中——用人单位的举证责任较重；劳动者一侧需要保存能说明事件经过与职责范围的材料","地域":"全国；对「重大损害」是否有量化标准，各地把握差异明显","时效":"程序时效——仲裁申请时效一年。起算点——自收到解除通知之日。例外——无特别时效豁免。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）","核对日期":"2026-10-03","备注":"不确定点在「重大损害」的量化——多数地方不在规章层面定标准，而是个案判断，需向当地劳动人事争议仲裁委员会或拨 12333 了解本地尺度。保住自己能证明事实经过的材料：当时的工作指令、邮件、审批记录、系统日志时间点，在解除通知送达的当场就整理留存。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"中","口径":"金钱"}},{"节号":6,"节名":"在职与离职后的红线","条号":17,"标题":"离职时把竞业限制的启动与补偿，一次性书面问清","说人话":"离职前发一封邮件给公司（抄送人事和直属领导），问三句：竞业限制是否启动？每月补偿多少、怎么付？付到哪一天？对方回复了就留底；不回复也是一种状态，第二天再发一封确认「未收到回复，视为按协议执行」。这封邮件比什么都有用——它把模糊地带变成了可举证的事实。","适用":"签过竞业限制协议或含竞业限制条款的合同，正在办离职。","成本":"不花钱。发一封邮件，几分钟。","收益":"一次性锁定三件事——是否启动竞业限制、补偿标准与支付方式、支付到什么时候。这三件事有书面确认，后续无论是拿补偿、请求解除，还是判断能不能去新单位，都有了依据。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第二十三条第二款、第二十四条；《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》（法释〔2020〕26 号，2021-01-01 施行）第三十六条","效力位阶":"法律（第三十六条为司法解释）","主张强度":"可推定","举证难度":"中——需要留存协议原文、书面询问与对方回复；对方不回复时，己方的催告记录即成为证据","地域":"全国；只约定竞业限制未约定补偿金额时，三个月未付能否解除的口径各地未统一","时效":"程序时效——仲裁申请时效一年。起算点——补偿类自各月应付未付之日；解除类自三个月未支付届满之日。例外——按月补偿的请求权逐月起算。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）","核对日期":"2026-10-03","备注":"不确定点在「未约定补偿金额」场合的解除权（见 6.8），各地口径不一，可就本地尺度咨询当地劳动人事争议仲裁委员会或拨 12333。这封询问邮件要在离职手续办完之前发出，离职后对方可能不再回应。附上协议扫描件一并发送，避免日后对条款版本产生争议。","成本标签":{"钱":"0","时间":"少","毅力":"些","收益":"大","口径":"金钱"}},{"节号":6,"节名":"在职与离职后的红线","条号":18,"标题":"服务期与竞业限制是两条独立的路径，可以同时存在","说人话":"这是两条各自独立的线。你提前离职，可能要按服务期协议赔一笔培训费（有上限、按剩余期限分摊）；同时竞业限制还在——公司按月给钱，你就得守着，不给钱你可以要求解除。别把两件事当成一件来谈，谈判时分开算。","适用":"单位为一项投入同时主张服务期和竞业限制，或者你想知道「赔了服务期违约金，还要不要守竞业」。","成本":"时间——争议走仲裁，一般几个月；金钱——仲裁不收费，律师费通常自己承担。","收益":"服务期违约金以专项培训费为上限并按未履行部分分摊；竞业限制是独立义务，须按月支付经济补偿。二者的成立要件、对价与救济路径互不相同——违反服务期不等于违反竞业限制，赔了前者的违约金，后者仍然有效。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第二十二条、第二十三条、第二十五条、第九十条","效力位阶":"法律","主张强度":"可推定","举证难度":"中——两项协议的文本、培训费凭证、补偿支付记录需要分别留存","地域":"全国；对两类条款能否在一份协议中合并约定、以及对价的对应关系，各地审查尺度不一","时效":"程序时效——仲裁申请时效一年。起算点——服务期违约金自劳动者提出解除之日；竞业补偿自各月应付未付之日。例外——无特别时效豁免。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）","核对日期":"2026-10-03","备注":"不确定点在「同一笔投入是否可以同时作为服务期对价与竞业补偿对价」的审查，各地尺度不一，可向当地劳动人事争议仲裁委员会或拨 12333 确认。签字前把两份协议摊在一起看：对价是什么、能拿多少、要守多久。培训费凭证有权要求单位出示，凭证拿不出来的，服务期违约金的基础就不牢。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"中","口径":"金钱"}},{"节号":6,"节名":"在职与离职后的红线","条号":19,"标题":"双重劳动关系：另一段实际用工与「注册未经营」不是一回事","说人话":"要分清两条线。「有另一份工作实际在上班」走第三十九条第四项，公司要证明造成了严重影响、或者提出来让你停而你不改。「名下注册了公司但没实际干」一般不落在这一项，但可能落进员工手册的禁止条款——那个只看制度有没有合法送达，不看有没有造成影响。","适用":"在职期间在另一家单位有实际用工，或者名下注册了公司但没有实际经营。","成本":"时间——争议走仲裁，一般几个月；金钱——仲裁不收费，律师费通常自己承担。","收益":"这不是收益条，是风险条。 劳动者同时与其他用人单位建立劳动关系，对完成本单位的工作任务造成严重影响，或者经用人单位提出拒不改正的，用人单位可以解除劳动合同且无需支付经济补偿（第三十九条第四项）。至于以自己名义注册但未实际用工经营的商事主体，通常不直接等于「建立另一段劳动关系」，但可能落入合同或员工手册的「禁止兼职、自营」条款，适用第四条与第三十九条第二项。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第四条、第三十九条第二项、第四项","效力位阶":"法律","主张强度":"可推定","举证难度":"中——「是否造成严重影响」「是否建立实际用工」由用人单位举证；「拒不改正」的成立取决于书面要求的送达与你的回复","地域":"全国；对「注册但未实际经营是否构成双重劳动关系」各地认定不一","时效":"程序时效——仲裁申请时效一年。起算点——自收到解除通知之日。例外——无特别时效豁免。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文）","核对日期":"2026-10-03","备注":"不确定点在「注册未经营」的定性，各地口径不一（有的按第三十九条第四项处理，有的归入规章制度条款），需向当地劳动人事争议仲裁委员会或拨 12333 确认。收到任何关于兼职、自营的书面质询，回复前先要求其明确所指事实，并把回复留痕——「拒不改正」这个条件的成立与否，往往就取决于这一刻的往来记录。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"小","口径":"自由"}},{"节号":6,"节名":"在职与离职后的红线","条号":20,"标题":"商事主体登记信息是公开的：着力点应放在「经营范围是否同类」","说人话":"这一条不给法律结论，只讲一个事实：你名下有没有公司、是不是股东、经营范围写什么，公开可查。所以别把精力放在「怎么不被发现」上，重点应该放在「我名下这家公司与单位业务有没有竞争关系」——那个才决定风险大小。","适用":"名下有自己的公司或个体工商户，担心在职期间被单位发现。","成本":"不花钱。可自行查询一次公示信息。","收益":"没有可直接援引的劳动法条文；本条讲的是事实基础——商事主体的注册登记与备案信息由市场监管部门通过国家企业信用信息公示系统公示，法定代表人、股东、经营范围等均可公开查询，因此在职期间的商事登记难以对用人单位保密。","依据":"无明文的全国统一规定（指劳动法意义上的披露义务）。可确证的是《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第四条、第三十九条第二项、第四项关于规章制度效力与解除情形的规定","效力位阶":"无明文依据","主张强度":"倡导性","举证难度":"中——公示信息可自行查询；「是否构成竞争关系」需要对经营范围与单位业务做实质比对","地域":"全国；公示系统的具体字段与更新频率由市场监管部门维护","时效":"程序时效——如发生解除争议，仲裁申请时效一年。起算点——自收到解除通知之日。例外——无特别时效豁免。","来源":"「劳动法上的披露义务」无官方一手依据可援引。 尝试过的路径：已打开中国人大网劳动合同法全文核对第四条、第三十九条，条文未规定劳动者须主动披露名下商事主体；检索其他全国性规定未定位到对应条款。故按「无明文依据」处理。已核对页面：http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文）","核对日期":"2026-10-03","备注":"本条不给结论，只把事实讲清：公示可查，真正的着力点是经营范围与单位业务是否同类。自查方法：把自己的营业执照经营范围逐条抄下来，与单位的业务范围并排比对——哪些重合、重合部分你是否实际参与。具体风险判断建议咨询执业律师；解除争议的本地口径可向当地劳动人事争议仲裁委员会或拨 12333 确认。","成本标签":{"钱":"0","时间":"中","毅力":"否","收益":"小","口径":"自由"}},{"节号":6,"节名":"在职与离职后的红线","条号":21,"标题":"「违反在职不兼职承诺赔偿 X 万」：违约金没依据，损失要另证","说人话":"这类条款分两段看。违约金那一段：不在服务期和竞业限制授权范围内，可以抗辩。赔偿损失那一段：公司仍可以按实际损失索赔，但得它自己举证损失是多少、怎么算出来的。所以「条款无效」不等于「完全没事」，但能把「照约定数字付钱」变成「让它证明损失」。","适用":"入职承诺书或合同里写了「违反在职不兼职、不自营承诺的赔偿 X 万元」。","成本":"时间——争议走仲裁，一般几个月；金钱——仲裁不收费，律师费通常自己承担。","收益":"除服务期（第二十二条）和竞业限制（第二十三条）两种情形外，用人单位不得与劳动者约定由劳动者承担违约金（第二十五条）。另据第九十条，劳动者违反劳动合同中约定的保密义务或竞业限制，给用人单位造成损失的，应当承担赔偿责任——赔偿以造成损失为要件，用人单位需举证损失。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第二十二条、第二十三条、第二十五条、第九十条","效力位阶":"法律","主张强度":"可推定","举证难度":"中——承诺书文本应留存；实际损失的举证责任在用人单位","地域":"全国；对超出授权范围的违约金条款，各地裁判路径不完全一致","时效":"程序时效——用人单位主张违约金或赔偿走仲裁，时效一年。起算点——自其知道或应当知道损失与违约行为之日。例外——无特别时效豁免。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文）","核对日期":"2026-10-03","备注":"不确定点在「违约金无效」与「按实际损失赔偿」的衔接，各地处理不一致，需向当地劳动人事争议仲裁委员会或拨 12333 确认本地尺度。签字前把「赔偿」「违约金」两种表述分开圈出来——它们走的是不同规则。本节第 6.1 条与第 12 节第 12.17 条从不同角度写过同一问题。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"金钱"}},{"节号":6,"节名":"在职与离职后的红线","条号":22,"标题":"劳动合同被确认无效：过错方赔偿，已付出的劳动仍要付报酬","说人话":"合同无效不等于白干。你付出劳动的部分，公司照样要付报酬，标准参照同岗位或相近岗位。同时，如果是它的过错导致合同无效并给你造成损害，你可以主张赔偿；如果是你的过错（比如提供虚假材料入职），责任反过来在你。","适用":"劳动合同因欺诈、胁迫、乘人之危，或用人单位免除自己法定责任、排除劳动者权利等情形被确认无效。","成本":"时间——确认无效的争议走仲裁，一般几个月；金钱——仲裁不收费。","收益":"下列劳动合同无效或者部分无效：① 以欺诈、胁迫的手段或者乘人之危，使对方在违背真实意思的情况下订立或者变更劳动合同的；② 用人单位免除自己的法定责任、排除劳动者权利的；③ 违反法律、行政法规强制性规定的。劳动合同被确认无效，劳动者已付出劳动的，用人单位应当向劳动者支付劳动报酬——数额参照本单位相同或者相近岗位劳动者的劳动报酬确定；给对方造成损害的，有过错的一方应当承担赔偿责任（第八十六条）。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第二十六条、第二十八条、第八十六条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——主张无效的事由（欺诈、胁迫、免责条款等）需举证；已付出劳动的事实可由考勤与工作记录证明","地域":"全国","时效":"程序时效——仲裁申请时效一年；属劳动报酬类。起算点——逐月起算（报酬）；自知道或应当知道损害发生之日（赔偿）。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文）","核对日期":"2026-10-03","备注":"第二十六条（无效情形）、第二十八条（已付出劳动的报酬）、第八十六条（过错赔偿）是三条要连起来看的规则。实务中常见单位用「合同无效所以没有劳动关系」来拒付，这一招不成立——第二十八条明确了已付出劳动要付报酬。举证责任分配（用人单位对解除、减薪等决定负举证责任）见第 9 节第 9.9 条。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"金钱"}},{"节号":6,"节名":"在职与离职后的红线","条号":23,"标题":"规章制度要走民主程序，还要公示或告知你","说人话":"制度要能拿来处分你，得同时过两关：走过讨论协商程序，以及公示或告知过你。两关的证据都在公司手里——所以你要做的是反向证明「我这一侧没有签收记录」。这一条是本节好几条抗辩的共同基础（6.14、6.18、6.19）。","适用":"单位依据自己制定的考核、考勤、奖惩、竞业等制度处分你。","成本":"不花钱。核对自己有没有签收过该版本制度。","收益":"用人单位在制定、修改或者决定有关劳动报酬、工作时间、休息休假、劳动安全卫生、保险福利、职工培训、劳动纪律以及劳动定额管理等直接涉及劳动者切身利益的规章制度或者重大事项时，应当经职工代表大会或者全体职工讨论，提出方案和意见，与工会或者职工代表平等协商确定；并且应当将直接涉及劳动者切身利益的规章制度和重大事项决定公示，或者告知劳动者（第四条第二款、第四款）。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第四条、第三十九条第二项","效力位阶":"法律","主张强度":"可推定","举证难度":"难——民主程序与公示告知的证据多由用人单位掌握，劳动者难以直接证明「未告知」","地域":"全国；各地对「民主程序」与「公示告知」的证明标准不同（有的认可系统公告加培训记录，有的要求本人签收）","时效":"程序时效——仲裁申请时效一年。起算点——自收到依据该制度作出的处分或解除通知之日。例外——无特别时效豁免。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文）","核对日期":"2026-10-03","备注":"举证难度标「难」——取证时机在入职当时和每次制度换版时：核对自己有没有签收页，没签过的版本当场拍照留版本号与发布日期；离职前把能访问到的制度公告、培训通知、内部系统截图导出，离职后账号停用就取不到了。不确定点在「民主程序」与「公示告知」的证明标准，各地口径不一，可向当地劳动人事争议仲裁委员会或拨 12333 咨询本地尺度。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"金钱"}},{"节号":7,"节名":"社保公积金与失业之后","条号":1,"标题":"缴费基数低报：影响的是你将来所有待遇","说人话":"社保按什么基数缴，直接决定你以后领多少养老金、工伤赔多少、失业金有多长。公司按最低基数报，你现在到手多几十块，将来少的是几千几万。这件事在职期间就能查——看缴费明细里的基数和你工资条上的工资对不对得上，对不上就书面要求按实际工资申报。","适用":"单位按最低基数、按「基本工资」而不是实际工资申报社保缴费基数。","成本":"不花钱。每月核对一次缴费明细与工资条。","收益":"用人单位应当自行申报、按时足额缴纳社会保险费，非因不可抗力等法定事由不得缓缴、减免；应当按月将缴纳社会保险费的明细情况告知本人。未按时足额缴纳的，由征收机构责令限期缴纳或补足，并自欠缴之日起按日加收万分之五滞纳金，逾期仍不缴纳的处欠缴数额一倍以上三倍以下罚款。","依据":"《社会保险法》（2018-12-29 修正）第六十条、第六十三条、第八十六条","效力位阶":"法律","主张强度":"可主张","举证难度":"易——社保缴费明细属官方记录，可自行查询打印；工资流水可自行导出，两者比对即可看出基数是否低报","地域":"全国；缴费基数上下限由参保地每年公布，需按工作地现行标准比对","时效":"程序时效——补缴走社保征收机构责令限期缴纳或补足，属行政征缴路径；因未足额缴纳导致待遇损失的赔偿请求走仲裁，时效一年。起算点——补缴类自欠缴之日起算；待遇损失赔偿自知道或应当知道损失发生之日。例外——社会保险费的征缴属行政管理，不适用劳动关系终止后一年内的仲裁时效限制。","来源":"http://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_296659.html（中国人大网·社会保险法全文，含 2018 修正说明）；https://www.gov.cn/zhengce/zhengceku/2008-03/28/content_7383.htm（劳动保障监察条例全文）","核对日期":"2026-10-03","备注":"低报基数的直接后果在工伤和失业金上最明显——一次性伤残补助金、伤残津贴都按「本人工资」即前十二个月平均月缴费工资算（见第 8 节），基数低报会同步压低这些待遇。所以核对基数不只是养老的事。发现低报，先书面要求补足并留存沟通记录；具体补缴流程与基数上下限向参保地社保经办机构或拨 12333 确认。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"健康"}},{"节号":7,"节名":"社保公积金与失业之后","条号":2,"标题":"社保费怎么交、什么时候交，单位不得缓缴或减免","说人话":"社保不是公司经营困难就能缓一缓、减一减的，法律把口子收得很紧——只有不可抗力这类法定事由才行。缴费明细上看到月份断续、隔几个月才补一次，就要书面问一句。断缴影响医保报销和缴费年限，是你的损失。","适用":"单位以「经营困难」为由缓缴、减免社保，或者长期按季度、半年补缴。","成本":"不花钱。核对缴费明细的到账月份是否按月连续。","收益":"用人单位应当自行申报、按时足额缴纳社会保险费，非因不可抗力等法定事由不得缓缴、减免；职工应当缴纳的部分由用人单位代扣代缴。","依据":"《社会保险法》（2018-12-29 修正）第六十条、第六十三条","效力位阶":"法律","主张强度":"可主张","举证难度":"易——缴费明细可自行查询，缴费月份是否连续一目了然","地域":"全国；确有阶段性缓缴政策的，以参保地现行政策为准","时效":"程序时效——由社保征收机构责令限期缴纳或补足，属行政征缴路径。起算点——自欠缴之日起算。例外——社会保险费征缴不适用劳动关系终止后一年内的仲裁时效限制。","来源":"http://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_296659.html（社会保险法 2018 修正全文页）","核对日期":"2026-10-03","备注":"阶段性的缓缴政策确实存在，但需要人社部门明文发布，不是单位自己说了算。遇到单位声称「国家允许缓缴」的，要求其出示对应文件，再向参保地社保经办机构或拨 12333 核实。缴费明细建议按月截图存档，形成连续记录。","成本标签":{"钱":"0","时间":"少","毅力":"些","收益":"大","口径":"健康"}},{"节号":7,"节名":"社保公积金与失业之后","条号":3,"标题":"单位不办社保登记：责令改正、罚款、还要补缴","说人话":"公司不给你办社保登记，不只是补缴的问题——它会被罚款，负责人个人也会被罚。你可以直接向社保行政部门反映，也可以走劳动保障监察投诉。别自己垫钱去交，一垫就把「单位应缴」变成了「个人自愿缴纳」，性质变了。","适用":"入职后单位一直没给你办社保登记，缴费记录里查不到参保信息。","成本":"不花钱。查一次参保状态。","收益":"用人单位应当自用工之日起三十日内为职工申请办理社会保险登记；未办理登记的，由社会保险经办机构核定其应当缴纳的社会保险费；由社会保险行政部门责令限期改正，逾期不改正的，对单位处应缴社会保险费数额一倍以上三倍以下罚款，对直接负责的主管人员和其他直接责任人员处五百元以上三千元以下罚款。","依据":"《社会保险法》（2018-12-29 修正）第五十八条、第八十四条","效力位阶":"法律","主张强度":"可主张","举证难度":"易——参保状态可自行查询，是否有登记属官方系统记录","地域":"全国；投诉受理与核定流程由参保地规定","时效":"程序时效——由社会保险行政部门责令限期改正，属行政路径；向劳动保障监察投诉的，违法行为在 2 年内未被发现也未被举报、投诉的不再查处。起算点——自未办理登记之日，或自劳动者知悉之日。例外——社会保险费征缴不适用劳动关系终止后一年内的仲裁时效限制。","来源":"http://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_296659.html（社会保险法 2018 修正全文页）；https://www.gov.cn/zhengce/zhengceku/2008-03/28/content_7383.htm（劳动保障监察条例全文）","核对日期":"2026-10-03","备注":"不要用自己的钱去补缴单位应缴部分，也不要签「自愿由个人承担」的确认书——这会改变责任归属。发现未登记的当天就截图留存查询结果（带日期），并向单位书面提出要求。投诉受理口径与所需材料向参保地社保经办机构或拨 12333 确认。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"大","口径":"健康"}},{"节号":7,"节名":"社保公积金与失业之后","条号":4,"标题":"自愿放弃社保的承诺无效，但已拿的「社保补贴」可能要返还","说人话":"签了「自愿放弃社保」也无效——该缴还得缴，该有的待遇一样享受。但有一个反向的坑：如果公司按月给你发过「社保补贴」，后来它依法补缴了，它可以要求你把已经拿到的补贴退回去。所以别把「补贴」当成白拿的钱。","适用":"入职时签过「自愿放弃缴纳社会保险」的承诺书、协议，或者按月领过「社保补贴」。","成本":"不花钱。核对自己签过的文件和工资条上的补贴名目。","收益":"此类约定或承诺无效，不影响劳动者依法主张权利。但用人单位事后依法补缴的，可以请求劳动者返还其已支付的社保补偿款（例如按月随工资发放的「社保补贴」）。","依据":"《最高人民法院关于审理劳动争议案件适用法律问题的解释（二）》（法释〔2025〕12 号，2025-09-01 施行）第十九条","效力位阶":"司法解释","主张强度":"可主张","举证难度":"中——承诺书、工资条上的补贴名目需自己留存；是否属于「社保补偿款」由双方争议","地域":"全国（该解释为全国统一适用）","时效":"程序时效——补缴走行政征缴路径；主张权利或请求返还补偿款走仲裁，时效一年。起算点——返还请求自单位完成补缴之日起算；劳动者主张待遇损失的，自损失发生之日。例外——社会保险费征缴不适用劳动关系终止后一年内的仲裁时效限制。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文，第三十八条第一款第三项）；http://gongbao.court.gov.cn/Details/bb72019c45453f84d920bd6375573e.html（最高人民法院公报·关于审理劳动争议案件适用法律问题的解释（二）全文，法释〔2025〕12 号）","核对日期":"2026-10-03","备注":"解释（二）已核到一手全文（最高人民法院公报）。实务动作：如果签过放弃承诺，保留一份复印件；工资条上标注为「社保补贴」「社保补助」的项，逐月留存，这类名目将来可能被主张为应返还的补偿款。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"健康"}},{"节号":7,"节名":"社保公积金与失业之后","条号":5,"标题":"社保争议走哪条路：可以仲裁，也可以找行政部门","说人话":"社保被侵害有三条路可走，不冲突：一是申请劳动仲裁（针对单位），二是向社保行政部门或征收机构举报要求处理，三是对社保经办机构的处理不服可以申请行政复议或起诉。补缴这类事通常走第二条更快——直接找征收机构责令它补缴，比自己去仲裁要钱省事。","适用":"单位侵害你的社会保险权益，不知道该找谁。","成本":"不花钱。三个渠道都能问，先打 12333 问清管辖。","收益":"个人与所在用人单位发生社会保险争议的，可以依法申请调解、仲裁，提起诉讼；用人单位侵害个人社会保险权益的，个人也可以要求社会保险行政部门或者社会保险费征收机构依法处理。对经办机构不依法办理登记、核定、支付待遇、办理转移接续手续等行为，可以依法申请行政复议或者提起行政诉讼。","依据":"《社会保险法》（2018-12-29 修正）第八十三条","效力位阶":"法律","主张强度":"可主张","举证难度":"易——缴费记录可自行查询；路径选择不依赖证据强度","地域":"全国；各地的受理分工与经办流程不同","时效":"程序时效——劳动仲裁一年；行政复议申请期限 60 日，行政诉讼起诉期限六个月；劳动保障监察投诉的 2 年查处期限。起算点——仲裁自知道或应当知道权利被侵害之日；行政复议自知道该行政行为之日。例外——社会保险费征缴不适用劳动关系终止后一年内的仲裁时效限制。","来源":"http://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_296659.html（社会保险法 2018 修正全文页）","核对日期":"2026-10-03","备注":"先分清你要的是什么：要单位补缴，走行政征缴；要单位赔你因未缴造成的损失（例如本该报销的医疗费），走仲裁。两条路的时效和举证要求都不一样。管辖与材料清单打 12333 或向参保地社保经办机构问一次就能问清，比在三条路之间猜要快。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"健康"}},{"节号":7,"节名":"社保公积金与失业之后","条号":6,"标题":"养老保险个人账户不得提前支取，缴不满十五年可以续缴","说人话":"养老保险个人账户里的钱不能提前取出来——网上说的「退保取钱」是误传，只有个人死亡时余额才能继承。缴不满十五年也不是白缴：可以继续缴到满十五年再按月领，或者按规定转入城乡居民养老保险。","适用":"离职后不想继续缴社保，或者缴费年限不够，担心将来领不到养老金。","成本":"不花钱。查一次自己的累计缴费年限。","收益":"个人账户不得提前支取，记账利率不得低于银行定期存款利率，免征利息税；个人死亡的，个人账户余额可以继承。参加基本养老保险的个人，达到法定退休年龄时累计缴费满十五年的，按月领取基本养老金；累计缴费不足十五年的，可以缴费至满十五年，按月领取基本养老金，也可以转入新型农村社会养老保险或者城镇居民社会养老保险。","依据":"《社会保险法》（2018-12-29 修正）第十四条、第十六条","效力位阶":"法律","主张强度":"可主张","举证难度":"易——缴费年限与个人账户余额可自行查询","地域":"全国；转移接续与续缴的具体办理由参保地规定，城乡居民养老保险的衔接办法按国务院规定","时效":"程序时效——待遇核定与领取的争议可申请行政复议或提起行政诉讼，无固定申请期限但应在知道行政行为后及时提出；转为行政救济的，行政复议 60 日、行政诉讼六个月。起算点——自知道该行政行为之日。例外——养老保险关系可转移接续，不因跨地区就业而丧失。","来源":"http://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_296659.html（社会保险法 2018 修正全文页）","核对日期":"2026-10-03","备注":"离职断档期是否继续缴、按灵活就业还是别的身份缴，直接影响年限累计与将来的待遇，各地办理口径不同，需向参保地社保经办机构或拨 12333 确认后再决定。离职时把个人的累计缴费年限和个人账户余额记录下来，这是判断「还差几年」的基础数据。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"大","口径":"金钱"}},{"节号":7,"节名":"社保公积金与失业之后","条号":7,"标题":"医保断缴的影响要按参保地问：等待期与报销资格是地方口径","说人话":"医保断缴的后果没有全国统一答案——有的地方重新参保后有等待期，有的地方补缴能追溯，差别很大。这件事必须在断缴之前打电话问参保地，别等生病了才发现不能报。断缴期间看病的费用能不能补报，同样要事先问清。","适用":"离职后一段时期内不缴医保，或者中断后重新参保。","成本":"不花钱。断缴前先问清本地规则。","收益":"没有可直接援引的全国统一条文——《社会保险法》规定了参保与缴费义务以及争议救济渠道，但没有规定医保断缴后重新参保的等待期、断缴期间医疗费用能否报销、补缴后待遇如何恢复。这三项都是参保地经办口径，本条不承诺任何待遇。","依据":"无明文的全国统一规定。可确证的是：《社会保险法》（2018-12-29 修正）第六十条、第六十三条规定按时足额缴纳及责令限期缴纳或补足的一般义务；第八十三条第三款规定个人与用人单位的社保争议可申请调解、仲裁或诉讼，也可要求社会保险行政部门或征收机构依法处理——但均未规定断缴后的待遇恢复规则","效力位阶":"无明文依据","主张强度":"倡导性","举证难度":"中——就医票据、参保记录需要自己留存；待遇能否报销的认定在经办机构","地域":"地方口径差异大，必须以参保地现行规定为准","时效":"程序时效——对经办机构核定的待遇有异议的，可申请行政复议（60 日）或提起行政诉讼（六个月）。起算点——自知道核定结果之日。例外——无特别时效豁免。","来源":"无官方一手依据可援引。 尝试过的路径：① 已打开《社会保险法》官方全文页（clawContent.shtml?id=70741）逐条核对，第五十八条至第六十三条讲参保与缴费、第八十三条讲救济渠道，均无等待期与补缴追溯的规定；② 检索国家层面关于基本医疗保险待遇享受与等待期的统一规范性文件，未定位到可作依据的条文；③ 地方经办规则的官方页面本轮未逐地核实。故按「无明文依据」处理。；已核对页面：http://www.npc.gov.cn/c2/c30834/201905/t20190521_296659.html（中国人大网·社会保险法全文）","核对日期":"2026-10-03","备注":"本条不给结论、不涉及金额，价值在于把「断缴后果因地而异」讲清楚并定下行动顺序。行动顺序是「先问再断」：离职前拨打 12333 或问参保地社保经办机构，问清等待期、能否补缴、补缴后待遇如何恢复；就医票据、结算单、参保状态截图全部留存。查询渠道：参保地社保经办机构、12333。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"小","口径":"健康"}},{"节号":7,"节名":"社保公积金与失业之后","条号":8,"标题":"领失业金期间，医保由失业保险基金代缴，个人不缴","说人话":"能确定的是：领失业金期间生病就医，可以申请医疗补助金，具体给多少由各省定。至于医保费是不是由基金替你缴、你自己不用掏，这是地方规定——有的省写在地方条例里，国家层面的条例没有这一条。所以别按听说来的办，领金登记时问一句「我这期间医保怎么算」，把答复记下来。","适用":"正在领取失业保险金，担心医保断了。","成本":"不花钱。核对领金期间的参保状态。","收益":"已确证的一层：《失业保险条例》第十九条规定，失业人员在领取失业保险金期间患病就医的，可以按照规定向社会保险经办机构申请领取医疗补助金，标准由省、自治区、直辖市人民政府规定。未确证的一层：领金期间的基本医疗保险费是否由失业保险基金代缴、个人是否不用缴——这是地方条例口径（部分省的失业保险条例有明文，国家层面本轮未核到），本条不写这一层的条文号。","依据":"《失业保险条例》（国务院令第 258 号）第十九条","效力位阶":"行政法规（指第十九条）；领金期间医保代缴属地方口径","主张强度":"可推定","举证难度":"易——领金期间的参保状态可自行查询","地域":"医疗补助金标准由省级政府规定；领金期间医保代缴的有无与范围属地方口径，需以参保地现行规定为准","时效":"程序时效——待遇争议可申请行政复议（60 日）或提起行政诉讼（六个月）；与单位的争议走仲裁，时效一年。起算点——自知道待遇核定结果之日。例外——无特别时效豁免。","来源":"https://www.gd.gov.cn/zwgk/wjk/zcfgk/content/mpost_2521625.html（失业保险条例全文，第十九条）","核对日期":"2026-10-03","备注":"待查清的只是「地方口径」这一层，条文层面第十九条已核实。具体要问清的是两件事：① 参保地有没有「领金期间由基金代缴基本医疗保险费」的规定；② 当地医疗补助金的标准与申领材料。渠道：参保地社保经办机构、12333，也可查参保地所在省失业保险条例的官方文本。领金期间如果重新就业或以其他身份参保，可能影响领金资格，动之前先问清（见 7.16）。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"中","口径":"健康"}},{"节号":7,"节名":"社保公积金与失业之后","条号":9,"标题":"领失业金要同时满足三个条件","说人话":"领失业金要三个条件同时满足：缴费满一年、不是你主动辞职、已经办了失业登记并且有求职意愿。第二条最容易出问题——离职证明上写「个人原因」就不算非因本人意愿，所以签离职文件时那个「原因」栏必须看清楚。","适用":"合同到期不续签、被裁、协商解除之后想申领失业保险金。","成本":"不花钱。先核条件，再走登记。","收益":"具备下列条件的失业人员，可以领取失业保险金：① 按照规定参加失业保险，所在单位和本人已按照规定履行缴费义务满 1 年；② 非因本人意愿中断就业；③ 已办理失业登记，并有求职要求。","依据":"《失业保险条例》（国务院令第 258 号）第十四条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"中——缴费记录可自行查询；「非因本人意愿」取决于离职证明与单位上报的减员原因，需要留意单位怎么写","地域":"全国；缴费年限的认定与「非因本人意愿」的具体情形由地方条例细化，地方口径可能不同","时效":"程序时效——按参保地经办流程申领；原 60 日申领期限已由国家层面口径放宽。起算点——自终止或解除劳动关系之日；待遇自办理失业登记之日起计发。例外——无特别时效豁免，但越早登记越早起算。","来源":"https://www.gd.gov.cn/zwgk/wjk/zcfgk/content/mpost_2521625.html（失业保险条例全文，第十四条）","核对日期":"2026-10-03","备注":"第二条的成败在你签离职文件的那一分钟就已经定了（见 5.17）。确认单位有没有在解除或终止之日起 15 日内把失业人员名单报社保经办机构（《失业保险条例》第十六条）——没报就催。地方对「非因本人意愿」的细化情形与经办材料，向参保地社保经办机构或拨 12333 确认。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"金钱"}},{"节号":7,"节名":"社保公积金与失业之后","条号":10,"标题":"领多久按累计缴费年限分档，最长 24 个月","说人话":"能领几个月看累计缴费了多久：满 1 年不满 5 年最多 12 个月，满 5 年不满 10 年最多 18 个月，10 年以上最多 24 个月。以前失业时该领没领完的月数可以合并进来，但总数封顶 24 个月。所以缴费记录别断——它决定你能领多久。","适用":"已经符合领失业金条件，想知道能领几个月。","成本":"不花钱。查一次累计缴费时间。","收益":"失业前所在单位和本人按照规定累计缴费时间满 1 年不足 5 年的，领取失业保险金的期限最长为 12 个月；满 5 年不足 10 年的，最长为 18 个月；10 年以上的，最长为 24 个月。重新就业后再次失业的，缴费时间重新计算，领取期限可以与前次失业应领取而尚未领取的期限合并计算，但最长不得超过 24 个月。","依据":"《失业保险条例》（国务院令第 258 号）第十七条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"易——累计缴费时间可在社保经办渠道自行查询","地域":"全国；地方条例对分档办法可能有细化规定，以参保地现行口径为准","时效":"程序时效——按参保地经办流程申领，经办机构审核有法定时限；对核定结果有异议可申请行政复议（60 日）或提起行政诉讼（六个月）。起算点——自办理失业登记之日起计发失业金。例外——重新就业后再次失业的，缴费时间重新计算，前次未领完期限可合并，总计不超过 24 个月。","来源":"https://www.gd.gov.cn/zwgk/wjk/zcfgk/content/mpost_2521625.html（失业保险条例全文，第十七条）","核对日期":"2026-10-03","备注":"本条是全国上限口径，地方条例可能对分档办法作细化规定（例如每满 1 年领几个月、超过一定年限的部分如何递增），实际可领月数以参保地核定为准，可向参保地社保经办机构或拨 12333 确认。领金期间每月的资格确认（就业状态申报）别漏做，漏做可能被停发。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"大","口径":"金钱"}},{"节号":7,"节名":"社保公积金与失业之后","条号":11,"标题":"失业金标准由省级确定，不高于当地最低工资、不低于低保","说人话":"每月领多少，国家只给了一个区间：低于当地最低工资、高于城市居民最低生活保障标准，具体数字由各省自己定。所以网上看到的金额换一个省份就不适用，必须查参保地现行标准。查法很简单——打 12333，问参保地现行失业金月标准。","适用":"想知道每月能领多少钱。","成本":"不花钱。查参保地现行标准。","收益":"失业保险金的标准，按照低于当地最低工资标准、高于城市居民最低生活保障标准的水平，由省、自治区、直辖市人民政府确定。","依据":"《失业保险条例》（国务院令第 258 号）第十八条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"易——标准由参保地公布，可自行查询","地域":"地方口径，各省、自治区、直辖市分别确定并可能定期调整，必须以参保地现行标准为准","时效":"程序时效——按参保地经办流程申领；对核定金额有异议可申请行政复议（60 日）或提起行政诉讼（六个月）。起算点——自知道核定结果之日。例外——无特别时效豁免。","来源":"https://www.gd.gov.cn/zwgk/wjk/zcfgk/content/mpost_2521625.html（失业保险条例全文，第十八条）","核对日期":"2026-10-03","备注":"本条只给区间规则，不给具体金额——金额是地方数据，且随最低工资调整而变。核对时注意最低工资标准本身也在调整（见 3.7 引用的全国分省数据）。查询渠道：参保地社保经办机构、12333。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"大","口径":"金钱"}},{"节号":7,"节名":"社保公积金与失业之后","条号":12,"标题":"停止领取失业金的几种情形","说人话":"领失业金期间重新就业、出国定居、开始领养老金、或者连续拒绝推荐的工作和培训，都会停发。「重新就业」的认定各地不一样——自己注册公司、以灵活就业身份参保算不算重新就业，必须先问参保地，别自己判断。办之前不申报，可能被要求退还已领的钱。","适用":"正在领取失业保险金，情况发生变化。","成本":"不花钱。变化发生时主动向经办机构申报。","收益":"失业保险金停发的法定情形包括：重新就业的；应征服兵役的；移居境外的；按月享受基本养老保险待遇的；无正当理由，拒不接受当地人民政府指定部门或者机构介绍的适当工作或者提供的培训的等。","依据":"《失业保险条例》（国务院令第 258 号）第十五条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"中——就业状态变化需本人申报；「是否构成重新就业」的认定在经办机构","地域":"地方口径差异大，社保衔接方案须以参保地规定为准","时效":"程序时效——对停发决定有异议可申请行政复议（60 日）或提起行政诉讼（六个月）。起算点——自知道停发决定之日。例外——无特别时效豁免。","来源":"https://www.gd.gov.cn/zwgk/wjk/zcfgk/content/mpost_2521625.html（失业保险条例全文，第十五条）","核对日期":"2026-10-03","备注":"不确定点在「重新就业」的认定标准，各地执行口径不一（尤其涉及自营、灵活就业参保、挂靠参保等情形），办理任何社保衔接动作之前，先向参保地社保经办机构或拨 12333 问清，不要自行推断。发现情况变化就主动申报——隐瞒后被追回，比提前问清麻烦得多。","成本标签":{"钱":"0","时间":"少","毅力":"些","收益":"大","口径":"金钱"}},{"节号":7,"节名":"社保公积金与失业之后","条号":13,"标题":"失业登记后待遇才开始计发，越早办越早起算","说人话":"失业金不是从你离职那天开始算，是从你办完失业登记那天开始算。所以离职后别拖：先办失业登记，再申领失业金。拖一个月就少一个月，领金期限不会因为拖而延长。","适用":"刚被解除或终止劳动关系，还没办失业登记。","成本":"不花钱。办登记本身不收费，跑一趟或线上办。","收益":"符合条件的失业人员可以领取失业保险金，待遇自办理失业登记之日起计发——登记越早，起算越早，同样的领取期限能更早到手。","依据":"《失业保险条例》（国务院令第 258 号）第十四条、第十六条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"中——离职证明、缴费记录、身份证件等材料需自备；单位是否已按期报送名单需核实","地域":"全国；登记与申领渠道由参保地规定（线上平台或经办机构窗口）","时效":"程序时效——按照参保地经办流程办理登记与申领，审核有法定时限；原 60 日申领期限已由国家层面口径放宽。起算点——自办理失业登记之日起计发。例外——无特别时效豁免，拖延只损失自己的起算点。","来源":"https://www.gd.gov.cn/zwgk/wjk/zcfgk/content/mpost_2521625.html（失业保险条例全文，第十四条、第十六条）","核对日期":"2026-10-03","备注":"先办登记再申领，顺序反了会白跑。需要的材料通常包括身份证或社保卡、单位出具的解除或终止劳动合同证明、失业登记记录、本人银行账户，具体以参保地要求为准，可向参保地社保经办机构或拨 12333 确认。单位应在解除或终止之日起 15 日内把失业人员名单报经办机构（第十六条），没报就催它。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"金钱"}},{"节号":7,"节名":"社保公积金与失业之后","条号":14,"标题":"申领失业保险金的材料与办理时限：国家层面确证 15 日报送，材料清单按参保地","说人话":"有一件事是国家规定死的：公司要在你离职之日起 15 天内，把失业人员名单报给社保经办机构——没报，你这边可能办不下去，要去催。其余的事（带什么材料、多久出结果）各地略有差别，但核心四样通常少不了：身份证或社保卡、单位开的解除/终止证明、失业登记记录、本人银行账户。","适用":"准备去办失业登记和失业金申领，想知道要带什么、多久有结果。","成本":"不花钱。材料齐了通常一次办成。","收益":"国家层面已确证的一层：用人单位应当及时为失业人员出具终止或者解除劳动关系的证明，并将失业人员的名单自终止或者解除劳动关系之日起十五日内告知社会保险经办机构。地方经办口径的一层：具体的材料清单、审核时限与发放方式，各地经办规程不同，依参保地规定执行。","依据":"《社会保险法》（2018-12-29 修正）第五十条","效力位阶":"法律（第五十条已核对）；材料清单与审核时限属地方经办口径","主张强度":"可推定","举证难度":"中——材料需要自己准备；单位是否按期报送名单需要主动核实","地域":"全国统一的是 15 日告知名单义务；材料清单、审核时限与发放方式依参保地经办规程","时效":"程序时效——按参保地经办流程申领，审核有法定时限；原 60 日申领期限已放宽。起算点——待遇自办理失业登记之日起计发。例外——无特别时效豁免。","来源":"http://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_296659.html（社会保险法 2018 修正全文页，第五十条）；地方口径部分以参保地社保经办机构官方发布或 12333 答复为准","核对日期":"2026-10-03","备注":"待问清的只是地方经办那一层（材料清单细节、审核时限、发放方式），第五十条的 15 日告知名单义务已是法律明文。渠道：参保地社保经办机构、12333。离职当天就把解除/终止证明拿到手（见 5.7）——这是申领的第一份必备材料，事后回公司补开往往要等很久。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"金钱"}},{"节号":7,"节名":"社保公积金与失业之后","条号":15,"标题":"离职时公积金账户要办转移或封存，缴存登记义务是 30 日","说人话":"公积金和社保是两套系统。录用时单位要在 30 天内给你办缴存登记和账户设立或转移；离职时对应的账户转移或封存也要及时办——因为贷款资格要求连续缴存，中断或账户状态不对会直接影响你能不能贷。逾期不缴或欠缴的，公积金中心责令限期缴存，还不缴可以申请法院强制执行；不给办登记或开户的，要被罚 5 万到 30 万。","适用":"办离职手续时核对单位有没有处理你的公积金账户；或者换城市工作，需要转移账户。","成本":"不花钱。查一次缴存明细与账户状态。","收益":"单位录用职工的，应当自录用之日起 30 日内向住房公积金管理中心办理缴存登记，并办理职工住房公积金账户的设立或者转移手续（《住房公积金管理条例》第十五条）。单位应当按时、足额缴存住房公积金，不得逾期缴存或者少缴（第二十条）。单位逾期不缴或者少缴的，由住房公积金管理中心责令限期缴存；逾期仍不缴存的，可以申请人民法院强制执行（第四十条）。单位不办理缴存登记或者不为职工办理账户设立手续的，由住房公积金管理中心责令限期办理；逾期不办理的，处 5 万元以上 30 万元以下的罚款（第三十九条）。","依据":"《住房公积金管理条例》（1999 年国务院令第 262 号发布，经 2002-03-24 第一次修订、2019-03-24 第二次修订、2026-08-10 第三次修订）第十五条、第二十条、第三十九条、第四十条","效力位阶":"行政法规","主张强度":"可推定","举证难度":"中——缴存明细可自行查询；账户是否按期转移或封存需要主动核实","地域":"缴存比例区间与办理流程由各地住房公积金管理委员会、公积金管理中心规定，地方口径有差异","时效":"程序时效——单位逾期不缴或少缴的，可向住房公积金管理中心投诉，属行政投诉路径，不受仲裁一年时效约束；但若走仲裁主张因未缴、少缴造成的损失赔偿，适用仲裁时效一年。起算点——行政投诉自知道或应当知道未缴、少缴之日；仲裁主张损失自知道或应当知道损失发生之日。例外——无特别时效豁免。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=1822（国家行政法规库·住房公积金管理条例现行本；版本说明载明 1999 年国务院令第 262 号发布，2002-03-24 第一次修订、2019-03-24 第二次修订、2026-08-10 第三次修订）","核对日期":"2026-10-03","备注":"版本陷阱提示（第二例局部位移型）：2026-08-10 第三次修订把罚则条号后移——不办缴存登记／不办账户设立的罚则由原第三十七条移至第三十九条，罚款由「1 万元以上 5 万元以下」提高到「5 万元以上 30 万元以下」；逾期不缴或少缴的强制由原第三十八条移至第四十条（内容不变）；第十八条的缴存比例新增「不得高于国家规定的最高缴存比例」这一上限；条文总数由 47 条增至 50 条。该库内的旧版页面（LawID=521）不标废止，条号仍在但内容对不上——引用前务必读版本说明。缴存比例下限与上限、以及罚则的完整表述见第 2 节第 9 条。本条的落点在离职节点：确认单位在 30 日内办了账户转移或封存并索要办理结果；换城市工作的先问清转入地材料。地方办理流程与贷款连续性要求，向工作地住房公积金管理中心或拨 12333 确认。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"中","口径":"金钱"}},{"节号":7,"节名":"社保公积金与失业之后","条号":16,"标题":"以灵活就业身份续保之前，先问清会不会影响领失业金","说人话":"这一条有一半是确定的、一半不是。确定的是：重新就业会停发失业金，这是条例明文。不确定的是：「以灵活就业身份自己缴社保」算不算重新就业，各地做法不一样。正确顺序是：先打 12333 问参保地口径，再决定用什么身份参保、什么时候开始缴。反过来做，可能失业金被停、还要退钱。","适用":"离职后打算以灵活就业人员身份继续缴社保，同时还想领失业保险金。","成本":"不花钱。动之前打一个电话。","收益":"国家层面已确证的一层：《失业保险条例》第十五条列明了几类停止领取失业保险金的情形，「重新就业」是其中的核心判断项。地方口径的一层：以灵活就业身份参保是否构成「重新就业」，各地经办口径不一，本条不给结论。","依据":"《失业保险条例》（国务院令第 258 号）第十五条","效力位阶":"行政法规（指第十五条）；「灵活就业参保是否构成重新就业」属地方经办口径","主张强度":"可推定","举证难度":"中——参保身份变更记录可查询；是否构成重新就业的认定在经办机构","地域":"全国统一的是第十五条的停发情形；具体认定标准属地方口径，必须以参保地规定为准","时效":"程序时效——对停发决定有异议可申请行政复议（60 日）或提起行政诉讼（六个月）。起算点——自知道停发决定之日。例外——无特别时效豁免。","来源":"https://www.gd.gov.cn/zwgk/wjk/zcfgk/content/mpost_2521625.html（失业保险条例全文，第十五条）","核对日期":"2026-10-03","备注":"待问清的只是「地方认定口径」这一层，第十五条的停发情形已是行政法规明文。要具体问清的是：参保地经办机构对「以灵活就业身份参保」是否按重新就业处理、以名下商事主体身份参保如何处理。渠道：参保地社保经办机构、12333。办完之后保存经办机构的答复记录（工单号、答复时间）。如果名下另有商事主体或在别的单位参保，情况会更复杂，一并说明给经办机构听，不要只问一半。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"大","口径":"金钱"}},{"节号":7,"节名":"社保公积金与失业之后","条号":17,"标题":"骗取社保待遇的后果：退回加二倍到五倍罚款","说人话":"这一条只说风险：骗保不只是退钱，还要罚二到五倍——领了两万，可能要罚四万到十万。挂靠参保、伪造离职材料、隐瞒就业状态继续领金，都属于这一类。别为了几个月的失业金冒这个风险。","适用":"用虚构材料、伪造证明等方式申领社保待遇；或者离职后继续挂靠参保。","成本":"钱——要退回骗取的社会保险金，并处骗取金额二倍以上五倍以下罚款。","收益":"这不是收益条，是风险条。以欺诈、伪造证明材料或者其他手段骗取社会保险待遇的，由社会保险行政部门责令退回骗取的社会保险金，处骗取金额二倍以上五倍以下的罚款。","依据":"《社会保险法》（2018-12-29 修正）第八十八条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——认定由社会保险行政部门作出，涉事人一侧的材料将作为认定依据","地域":"全国","时效":"程序时效——由社会保险行政部门责令退回并处罚款，属行政路径；对处罚决定不服可申请行政复议（60 日）或提起行政诉讼（六个月）。起算点——自收到处理决定之日。例外——无特别时效豁免。","来源":"http://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_296659.html（社会保险法 2018 修正全文页，第八十八条）","核对日期":"2026-10-03","备注":"判断「重新就业」的边界不清时，主动向参保地社保经办机构或拨 12333 问清并申报，比事后被认定为骗取要好。所有与经办机构的沟通留一份记录（工单号、答复时间、经办人），这是证明「我申报过」的材料。涉及名下商事主体、挂靠参保等复杂情形的，先问清再办。","成本标签":{"钱":"多","时间":"中","毅力":"是","收益":"小","口径":"金钱"}},{"节号":7,"节名":"社保公积金与失业之后","条号":18,"标题":"灵活就业人员可以自己缴养老保险，但资格与待遇按参保地口径","说人话":"没有单位的阶段，可以以灵活就业身份自己缴养老保险，钱全部自己出。这样能把缴费年限接上，不至于断档——年限直接影响将来能不能按月领养老金、能领多少。具体基数档次怎么选、要交多少，问参保地社保经办机构或拨 12333。","适用":"离职后以灵活就业身份继续缴养老保险，或者长期没有单位。","成本":"缴费由个人承担（具体金额按参保地基数与档次确定）。","收益":"职工应当参加基本养老保险，由用人单位和职工共同缴纳基本养老保险费；无雇工的个体工商户、未在用人单位参加基本养老保险的非全日制从业人员以及其他灵活就业人员可以参加基本养老保险，由个人缴纳基本养老保险费。","依据":"《社会保险法》（2018-12-29 修正）第十条、第十六条","效力位阶":"法律","主张强度":"可推定","举证难度":"易——参保缴费记录可自行查询","地域":"地方口径——缴费基数档次、办理渠道与能否补缴由参保地规定","时效":"程序时效——待遇核定争议可申请行政复议（60 日）或提起行政诉讼（六个月）。起算点——自知道核定结果之日。例外——养老保险关系可转移接续，跨地区就业不丧失。","来源":"http://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_296659.html（中国人大网·社会保险法全文）","核对日期":"2026-10-03","备注":"不确定点在灵活就业参保与失业金的联动——以灵活就业身份参保是否构成失业金停发情形中的「重新就业」，各地经办口径不一（见本节第 7.16 条），动之前先问参保地，否则可能失业金被停、还要退钱。缴费档次的选择会影响将来待遇与当期负担，向参保地社保经办机构或拨 12333 确认。","成本标签":{"钱":"多","时间":"少","毅力":"些","收益":"大","口径":"金钱"}},{"节号":7,"节名":"社保公积金与失业之后","条号":19,"标题":"养老金按月领取的条件：达到法定退休年龄且累计缴费满十五年","说人话":"领养老金要同时满足两个条件：到了法定退休年龄，并且累计缴费满十五年。不满十五年也不是白缴——可以继续缴到满十五年，或者按规定转入城乡居民养老保险。所以「还差几年」这个数字值得每年查一次。","适用":"想确认自己什么时候能领养老金、还差几年。","成本":"不花钱。查一次个人累计缴费年限。","收益":"参加基本养老保险的个人，达到法定退休年龄时累计缴费满十五年的，按月领取基本养老金；达到法定退休年龄时累计缴费不足十五年的，可以缴费至满十五年，按月领取基本养老金；也可以转入新型农村社会养老保险或者城镇居民社会养老保险，按国务院规定享受相应待遇。","依据":"《社会保险法》（2018-12-29 修正）第十五条、第十六条","效力位阶":"法律","主张强度":"可主张","举证难度":"易——累计缴费年限与个人账户余额可在社保经办渠道自行查询","地域":"全国；退休年龄的认定、缴费至满十五年的办理、以及城乡居民养老保险衔接办法按国务院及参保地规定","时效":"程序时效——待遇核定争议可申请行政复议（60 日）或提起行政诉讼（六个月）。起算点——自知道核定结果之日。例外——无特别时效豁免。","来源":"http://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_296659.html（中国人大网·社会保险法全文）","核对日期":"2026-10-03","备注":"「累计缴费满十五年」是领取条件，不是缴费上限——缴得久、基数高，待遇相应更高（第十五条规定基本养老金由统筹养老金和个人账户养老金组成，根据累计缴费年限、缴费工资、当地职工平均工资、个人账户金额、城镇人口平均预期寿命等因素确定）。一至四级工伤职工退休后，若基本养老保险待遇低于伤残津贴，由工伤保险基金补足差额（见第 13 节第 13.13 条）。法定退休年龄的具体规定与办理流程向参保地社保经办机构或拨 12333 确认。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"大","口径":"金钱"}},{"节号":7,"节名":"社保公积金与失业之后","条号":20,"标题":"基本养老金怎么算：五个因素决定数额","说人话":"养老金由两部分组成，具体数额看五个因素——其中你能影响的是缴费年限和缴费工资（基数）。所以「单位按低基数报社保」这件事的后果就在这里兑现：基数低，个人账户进得少，将来养老金就少。个人账户的钱不能提前取出来，但可以继承。","适用":"想知道养老金大概有多少、哪些因素能提高。","成本":"不花钱。查一次缴费记录与个人账户余额。","收益":"基本养老金由统筹养老金和个人账户养老金组成。基本养老金根据个人累计缴费年限、缴费工资、当地职工平均工资、个人账户金额、城镇人口平均预期寿命等因素确定。 个人账户不得提前支取，记账利率不得低于银行定期存款利率，免征利息税；个人死亡的，个人账户余额可以继承。国家建立基本养老金正常调整机制。","依据":"《社会保险法》（2018-12-29 修正）第十四条、第十五条、第十八条","效力位阶":"法律","主张强度":"可主张","举证难度":"易——缴费年限、缴费工资、个人账户金额均可在社保经办渠道查询","地域":"全国；统筹养老金的具体计算办法按国务院及参保地规定的计发办法执行","时效":"程序时效——待遇核定争议可申请行政复议（60 日）或提起行政诉讼（六个月）。起算点——自知道核定结果之日。例外——基本养老金按国家建立的正常调整机制适时调整（第十八条）。","来源":"http://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_296659.html（中国人大网·社会保险法全文）","核对日期":"2026-10-03","备注":"本条与本节第 7.1 条是同一个动作的两端：在职时核对缴费基数，决定退休时的养老金。个人账户「不得提前支取」也意味着网上流传的「退保取钱」不成立——只有个人死亡时余额可继承。具体计发办法与调整情况向参保地社保经办机构或拨 12333 确认。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"大","口径":"金钱"}},{"节号":7,"节名":"社保公积金与失业之后","条号":21,"标题":"未足额缴纳社保的两种救济：补缴走征缴，损失赔偿走仲裁","说人话":"分两条路想清楚。要它把社保补上——走征收机构责令限期缴纳或补足，这条路通常更快更直接。要它赔你因未缴、少缴造成的损失（例如本该报销的医疗费）——走仲裁。两条路的对象、时效和材料都不一样，别混着提。","适用":"单位低报基数、少缴险种或长期欠缴，你想追。","成本":"时间——行政征缴路径依赖征收机构，仲裁路径一般几个月；金钱——两条路都不收费。","收益":"补缴路径：用人单位未按时足额缴纳社会保险费的，由社会保险费征收机构责令其限期缴纳或者补足（第六十三条）；自欠缴之日起按日加收万分之五的滞纳金，逾期仍不缴纳的由有关行政部门处欠缴数额一倍以上三倍以下罚款（第八十六条）。争议路径：个人与所在用人单位发生社会保险争议的，可以依法申请调解、仲裁，提起诉讼；用人单位侵害个人社会保险权益的，个人也可以要求社会保险行政部门或者社会保险费征收机构依法处理（第八十三条第三款）。未办理登记的：由社会保险经办机构核定其应当缴纳的社会保险费，并对单位责令改正、罚款（第五十八条、第八十四条）。","依据":"《社会保险法》（2018-12-29 修正）第五十八条、第六十三条、第八十三条、第八十四条、第八十六条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——缴费记录与工资流水可自行取得，用于证明基数低报或险种缺失；损失赔偿部分需另行证明损失","地域":"全国；征收机构与经办机构的职责分工、投诉受理流程按参保地规定","时效":"程序时效——补缴走行政征缴，不适用仲裁一年时效；损失赔偿走仲裁，时效一年。起算点——补缴类自欠缴之日；损失赔偿自知道或应当知道损失发生之日。例外——社会保险费征缴不适用劳动关系终止后一年内的仲裁时效限制。","来源":"http://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_296659.html（中国人大网·社会保险法全文）","核对日期":"2026-10-03","备注":"顺序建议：先走征缴把缴费记录补正，再用补正后的记录去主张损失赔偿——顺序倒过来，损失数额会算不清。举证核心是「基数低报」：把社保缴费明细里的基数与工资条上的应发工资并排比对，差额就是主张的基础（见本节第 7.1 条）。受理分工与流程向当地人力资源社会保障局、参保地社保经办机构或拨 12333 确认。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"健康"}},{"节号":7,"节名":"社保公积金与失业之后","条号":22,"标题":"被辞退后社保怎么衔接：三个时间点","说人话":"离职后盯三个时间点：① 公司 15 天内要把你的社保关系转出去；② 公司 15 天内要把失业人员名单报给社保机构；③ 你尽快办失业登记。这三个动作的顺序决定了你的社保会不会断、失业金什么时候开始算。","适用":"被解除或终止合同，担心社保断档。","成本":"不花钱。按时间点逐一确认。","收益":"时间点一（15 日）：用人单位应当在解除或终止劳动合同时出具证明，并在十五日内为劳动者办理档案和社会保险关系转移手续（劳动合同法第五十条）。时间点二（15 日）：用人单位应当及时为失业人员出具终止或解除劳动关系的证明，并将失业人员名单自终止或解除劳动关系之日起十五日内告知社会保险经办机构（社会保险法第五十条）。时间点三：失业登记越早办，失业金起算越早（见本节第 7.13 条）。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第五十条；《社会保险法》（2018-12-29 修正）第五十条","效力位阶":"法律","主张强度":"可主张","举证难度":"易——参保状态与减员记录可自行查询；单位是否按期报送需主动核实","地域":"全国；转移接续与失业登记的办理渠道按参保地规定","时效":"程序时效——单位未依规办理的可向社保经办机构或劳动保障监察反映；主张损害的走仲裁，时效一年。起算点——自解除或终止之日。例外——无特别时效豁免。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文）；http://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_296659.html（中国人大网·社会保险法全文）","核对日期":"2026-10-03","备注":"最容易漏的是第一个 15 日——单位没做减员，新单位加不进来，中间就断缴，直接影响医保报销与缴费年限。离职两周后自己查一次参保状态，显示「在职」的就去催。用邮件书面确认三件事：社保缴至哪个月、减员日期、失业人员名单是否已报送。具体经办向参保地社保经办机构或拨 12333 确认。","成本标签":{"钱":"0","时间":"少","毅力":"些","收益":"大","口径":"健康"}},{"节号":7,"节名":"社保公积金与失业之后","条号":23,"标题":"社保关系转移接续：跨省换工作不会让缴费作废","说人话":"换个省工作，以前缴的养老保险不会白缴——关系可以转移接续。如果经办机构不给办、拖着办，条文明确写了可以申请行政复议或提起行政诉讼。所以「转不过去」不是终点，是有救济路径的。","适用":"跨省或跨地区换工作，担心以前的缴费年限不算数。","成本":"不花钱。办理转移接续需要跑一次申请。","收益":"对经办机构不依法办理社会保险转移接续手续的行为，可以依法申请行政复议或者提起行政诉讼（第八十三条第二款）；养老保险关系可转移接续，跨地区就业不导致缴费作废。此外，个人与所在用人单位发生社会保险争议的，可以依法申请调解、仲裁，提起诉讼（第八十三条第三款）。","依据":"《社会保险法》（2018-12-29 修正）第十四条、第十六条、第八十三条","效力位阶":"法律","主张强度":"可推定","举证难度":"易——参保与缴费记录可自行查询；转移申请的受理凭证需自己留存","地域":"全国；转移接续的办理渠道、时限与材料按参保地与转入地规定，各地经办口径有差异","时效":"程序时效——对经办机构不依法办理转移接续的行为，可申请行政复议（60 日）或提起行政诉讼（六个月）。起算点——自知道该行政行为之日。例外——无特别时效豁免。","来源":"http://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_296659.html（中国人大网·社会保险法全文）","核对日期":"2026-10-03","备注":"不确定点在各地经办的具体时限与材料要求——办理渠道（线上平台或窗口）、需要哪些材料、多久办结，各地不同，故标「可推定」，需向参保地与转入地社保经办机构或拨 12333 确认。动作：换工作时先在新参保地开立账户，再申请把原关系转过来；每次提交材料都留受理凭证，这是后续主张「已申请而未被办理」的依据。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"金钱"}},{"节号":7,"节名":"社保公积金与失业之后","条号":24,"标题":"单位必须按月告知社保缴费明细：这是你自查的依据","说人话":"公司必须每月把缴费明细告诉你——这是法定义务，也是你唯一能按月发现问题的窗口。同时你本来就有权查询自己的缴费记录和个人权益记录，不依赖公司。每月花两分钟看一次基数和到账月份，比离职后翻旧账有效得多。","适用":"不知道单位按什么基数缴、有没有少缴。","成本":"不花钱。每月核对一次明细。","收益":"用人单位应当自行申报、按时足额缴纳社会保险费，非因不可抗力等法定事由不得缓缴、减免。职工应当缴纳的社会保险费由用人单位代扣代缴，用人单位应当按月将缴纳社会保险费的明细情况告知本人。 此外，用人单位和个人依法缴纳社会保险费，有权查询缴费记录、个人权益记录，要求社会保险经办机构提供社会保险咨询等相关服务。","依据":"《社会保险法》（2018-12-29 修正）第四条、第六十条","效力位阶":"法律","主张强度":"可主张","举证难度":"易——缴费记录与个人权益记录属官方系统数据，可自行查询打印","地域":"全国；查询渠道（线上平台、经办机构窗口、自助终端）按参保地规定","时效":"程序时效——未按月告知的可向社保经办机构或劳动保障监察反映；主张待遇损失的走仲裁，时效一年。起算点——自知道权利被侵害之日。例外——社会保险费征缴不适用劳动关系终止后一年内的仲裁时效限制。","来源":"http://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_296659.html（中国人大网·社会保险法全文）","核对日期":"2026-10-03","备注":"「按月告知」与「自行查询权」是两条独立的依据——公司不告知，你也能自己查到，不能以「公司没给我」为借口不查。留档建议：每月查询后截图或导出成文件并按月命名，形成连续记录；一旦发现低报，这份连续记录就是最好的证据链（用法见本节第 7.1 条）。查询渠道向参保地社保经办机构或拨 12333 确认。","成本标签":{"钱":"0","时间":"少","毅力":"些","收益":"大","口径":"健康"}},{"节号":7,"节名":"社保公积金与失业之后","条号":25,"标题":"社保争议可以仲裁，也可以找行政部门：先分清你要什么","说人话":"判断标准就一句话——你要的是「把社保补上」还是「赔我钱」。补上，走行政部门或征收机构责令缴纳，通常更快；赔钱（例如本该报销的医疗费），走仲裁。两条路的受理机关、时效、材料都不同，先分清再动，别两边都递一遍。","适用":"与单位就社保发生争议，不确定走哪条路。","成本":"不花钱。先判断诉求类型再动。","收益":"个人与所在用人单位发生社会保险争议的，可以依法申请调解、仲裁，提起诉讼；用人单位侵害个人社会保险权益的，个人也可以要求社会保险行政部门或者社会保险费征收机构依法处理（第八十三条第三款）。用人单位不办理社会保险登记的，由社会保险行政部门责令限期改正，逾期不改正的处应缴数额一倍以上三倍以下罚款（第八十四条）。","依据":"《社会保险法》（2018-12-29 修正）第八十三条、第八十四条、第八十六条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——补缴类需要缴费记录与工资流水比对；损失赔偿类需要另行证明损失金额","地域":"全国；受理分工与流程按参保地规定","时效":"程序时效——补缴走行政征缴，不适用仲裁一年时效；损失赔偿走仲裁，时效一年。起算点——补缴类自欠缴之日；损失赔偿自知道或应当知道损失发生之日。例外——社会保险费征缴不适用劳动关系终止后一年内的仲裁时效限制。","来源":"http://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_296659.html（中国人大网·社会保险法全文）","核对日期":"2026-10-03","备注":"这两条路的关键差异在时效：补缴不受仲裁一年限制，损失赔偿受一年限制。所以「先补缴、后索赔」的顺序不只是效率问题，还关系到损失赔偿请求会不会过期。本节第 7.21 条写了同一区分的操作细节，第 9 节第 9.3 条写了劳动保障监察的 2 年查处期限。受理分工向当地人力资源社会保障局或拨 12333 确认。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"健康"}},{"节号":7,"节名":"社保公积金与失业之后","条号":26,"标题":"单位不办社保登记与不办公积金登记：两条并行的行政责任","说人话":"这是两个系统、两套罚则，可以分别投诉。社保那边罚单位加负责人个人；公积金那边是 5 万到 30 万。别只投诉一个——很多人只知道投诉社保，公积金那部分就漏掉了。两个都投诉，压力更大，也更容易促成办理。","适用":"入职后既没办社保登记，也没办公积金缴存登记。","成本":"不花钱。两条投诉可分别提出。","收益":"社保：用人单位应当自用工之日起三十日内为职工申请办理社会保险登记；未办理的由社会保险经办机构核定其应当缴纳的社会保险费，并由社会保险行政部门责令限期改正，逾期不改正的处应缴数额一倍以上三倍以下罚款，对直接负责的主管人员和其他直接责任人员处五百元以上三千元以下罚款。公积金：单位不办理住房公积金缴存登记或者不为本单位职工办理住房公积金账户设立手续的，由住房公积金管理中心责令限期办理；逾期不办理的，处 5 万元以上 30 万元以下的罚款。","依据":"《社会保险法》（2018-12-29 修正）第五十八条、第八十四条；《住房公积金管理条例》（1999 年国务院令第 262 号发布，2026-08-10 第三次修订）第十五条、第三十九条","效力位阶":"法律（第三十九条为行政法规条款）","主张强度":"可主张","举证难度":"易——参保状态与公积金缴存明细均可自行查询，属官方系统记录","地域":"全国；两条投诉的受理机关不同（社保行政部门或征收机构、住房公积金管理中心）","时效":"程序时效——社保与公积金的行政查处分别适用其规定；劳动保障监察投诉的 2 年查处期限。起算点——自未办理登记之日。例外——社会保险费征缴不适用劳动关系终止后一年内的仲裁时效限制。","来源":"http://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_296659.html（中国人大网·社会保险法全文）；https://xzfg.moj.gov.cn/front/law/detail?LawID=1822（国家行政法规库·住房公积金管理条例现行本，1999 年国务院令第 262 号发布，2026-08-10 第三次修订）","核对日期":"2026-10-03","备注":"公积金罚则的数字已按 2026-08-10 第三次修订更新（原为 1 万元以上 5 万元以下，现为 5 万元以上 30 万元以下；条号由原第三十七条移到第三十九条，见本节第 7.15 条）。投诉动作：社保向当地社会保险行政部门或征收机构提出；公积金向工作地住房公积金管理中心提出；两边都留受理回执。查询渠道：参保地社保经办机构、工作地公积金管理中心、12333。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"大","口径":"健康"}},{"节号":8,"节名":"工伤与职业病","条号":1,"标题":"工伤认定的一年期：单位不申请，自己要在一年内提","说人话":"出了工伤，公司要在 30 天内去申请认定；它不申请，你自己或者家人、工会可以在一年内直接去申请。这一年的截止日从事故发生那天算起，不是从你跟公司吵完那天算起。而且公司要是拖过了 30 天，那段拖延期间的工伤待遇费用由它自己出——这是它拖的代价。","适用":"发生事故伤害或者被诊断、鉴定为职业病后，单位没有在规定期限内为你申请工伤认定。","成本":"不花钱。提交材料本身不收费，但要跑统筹地区社会保险行政部门。","收益":"所在单位应当自事故伤害发生之日或者被诊断、鉴定为职业病之日起 30 日内提出工伤认定申请；用人单位未按前款规定提出申请的，工伤职工或者其近亲属、工会组织在事故伤害发生之日或者被诊断、鉴定为职业病之日起 1 年内，可以直接向用人单位所在地统筹地区社会保险行政部门提出工伤认定申请。 另外，用人单位未在 30 日内提交申请的，此期间发生符合条例规定的工伤待遇等费用由该用人单位负担。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）（国务院令第 586 号修订）第十七条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"中——事故时间、诊疗记录、劳动关系材料需要自己收集；单位是否已申请可向社会保险行政部门核实","地域":"全国；受理机关为用人单位所在地统筹地区社会保险行政部门","时效":"程序时效——单位 30 日内；单位未申请的，劳动者一方 1 年内。起算点——事故伤害发生之日，或被诊断、鉴定为职业病之日。例外——遇有特殊情况经报社会保险行政部门同意，申请时限可以适当延长。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本，2003 年国务院令第 375 号公布、2010-12-20 修订）","核对日期":"2026-10-03","备注":"一年期是最不可逆的一条。受伤当天就做两件事：一是把就诊记录、诊断证明留好，二是书面催单位申请（邮件或聊天记录留痕），它不申请你就自己报。劳动关系有争议的，先解决劳动关系确认，但要意识到这会占用一年期，别等到期限快满才开始。有没有被受理、材料差什么，直接问当地社会保险行政部门或拨 12333。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"大","口径":"健康"}},{"节号":8,"节名":"工伤与职业病","条号":2,"标题":"哪些情形应当认定为工伤：七种法定情形","说人话":"工伤不只是在车间里被机器伤到。上班前后在工作场所做准备工作或收尾工作受伤、因工作被人打伤、因公出差期间受伤或失踪、上下班路上出交通事故且你不是主要责任方、得了职业病，这些都算。第六项最容易漏——上下班路上出事故要抓住两个点：属交通事故类，且责任认定你不是主责。","适用":"判断自己遇到的事故是否落在工伤范围内。","成本":"不花钱。逐条对照事故情形。","收益":"职工有下列情形之一的，应当认定为工伤：① 在工作时间和工作场所内，因工作原因受到事故伤害的；② 工作时间前后在工作场所内，从事与工作有关的预备性或者收尾性工作受到事故伤害的；③ 在工作时间和工作场所内，因履行工作职责受到暴力等意外伤害的；④ 患职业病的；⑤ 因工外出期间，由于工作原因受到伤害或者发生事故下落不明的；⑥ 在上下班途中，受到非本人主要责任的交通事故或者城市轨道交通、客运轮渡、火车事故伤害的；⑦ 法律、行政法规规定应当认定为工伤的其他情形。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）（国务院令第 586 号修订）第十四条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"中——事故证明、诊疗记录、考勤与工作安排记录、交通事故责任认定书需要自己收集","地域":"全国","时效":"程序时效——单位 30 日内，单位未申请的劳动者一方 1 年内（见 8.1）。起算点——事故伤害发生之日或被诊断、鉴定为职业病之日。例外——特殊情况经报社会保险行政部门同意可适当延长申请时限。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本，2003 年国务院令第 375 号公布、2010-12-20 修订）","核对日期":"2026-10-03","备注":"上下班交通事故这一类，交警出具的道路交通事故责任认定书是关键材料，务必留存并确认责任划分。因工外出、下落不明的情形另有专门规定，可向当地社会保险行政部门或拨 12333 咨询。事故发生当场拍照、留证人联系方式，这些事后都补不回来。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"大","口径":"健康"}},{"节号":8,"节名":"工伤与职业病","条号":3,"标题":"哪些情形视同工伤，以及哪些情形一律不予认定","说人话":"工伤还有一类叫「视同工伤」：上班时间和岗位上突发疾病，当场死亡或者 48 小时内抢救无效死亡的，算工伤——注意这个 48 小时是硬线，起算点是抢救开始的时间。另外三种排除情形要记住：故意犯罪、醉酒或吸毒、自残或自杀，有这些情形一律不认定。","适用":"判断突发疾病、抢险救灾受伤等情形是否算工伤；以及有醉酒、自残等情形时能否认定。","成本":"不花钱。逐条对照。","收益":"视同工伤的情形有三种：① 在工作时间和工作岗位，突发疾病死亡或者在 48 小时之内经抢救无效死亡的；② 在抢险救灾等维护国家利益、公共利益活动中受到伤害的；③ 职工原在军队服役，因战、因公负伤致残，已取得革命伤残军人证，到用人单位后旧伤复发的。同时，职工符合上述规定，但有下列情形之一的，不得认定为工伤或者视同工伤：故意犯罪的；醉酒或者吸毒的；自残或者自杀的。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）（国务院令第 586 号修订）第十五条、第十六条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"中——抢救记录、死亡证明、时间节点材料是关键；「48 小时」的起算时间需要有医疗机构记录支撑","地域":"全国","时效":"程序时效——单位 30 日内，单位未申请的劳动者一方 1 年内（见 8.1）。起算点——突发疾病死亡的，自死亡之日或抢救开始之日。例外——军队因战因公致残旧伤复发的，按条例享受除一次性伤残补助金以外的工伤保险待遇。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本，2003 年国务院令第 375 号公布、2010-12-20 修订）","核对日期":"2026-10-03","备注":"「48 小时」的起算时间点在实务中是争议焦点，需要医院的抢救记录、入院时间、死亡记录来固定，家属在第一时间就应向医院索取并保存这些材料复印件。用人单位可能主张存在醉酒等排除情形，相关事实由主张方举证。具体认定尺度可向当地社会保险行政部门或拨 12333 咨询。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"大","口径":"健康"}},{"节号":8,"节名":"工伤与职业病","条号":4,"标题":"单位不认为是工伤的，由单位承担举证责任","说人话":"认定环节的举证责任分配对你有利：你说是工伤、公司说不是，那由公司拿出「不是工伤」的证据。所以你要做的不是证明「一定是工伤」，而是把「看起来像工伤」的基础材料交上去——事故时间地点、怎么受的伤、诊疗记录、当时的工作安排。剩下的反驳责任在公司那边。","适用":"单位否认是工伤，拒绝申报，或者在认定程序中提出异议。","成本":"不花钱。「由单位举证」这一条本身就是程序上的优势。","收益":"社会保险行政部门受理工伤认定申请后，根据审核需要可以对事故伤害进行调查核实，用人单位、职工、工会组织、医疗机构以及有关部门应当予以协助。职工或者其近亲属认为是工伤，用人单位不认为是工伤的，由用人单位承担举证责任。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）（国务院令第 586 号修订）第十九条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"中——基础事实材料需自己提交；用人单位的反驳举证责任由条例明确分配","地域":"全国","时效":"程序时效——单位 30 日内，单位未申请的劳动者一方 1 年内（见 8.1）。起算点——事故伤害发生之日或被诊断、鉴定为职业病之日。例外——特殊情况经报社会保险行政部门同意可适当延长申请时限。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本，2003 年国务院令第 375 号公布、2010-12-20 修订）","核对日期":"2026-10-03","备注":"举证责任有利不等于不用准备材料——申请材料不完整时行政部门会一次性书面告知需要补正的全部材料（第十八条），按要求补齐即可，不要因为材料被退就放弃。对认定结论不服的，可以依法申请行政复议或提起行政诉讼（第五十五条）。具体材料清单向当地社会保险行政部门或拨 12333 确认。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"健康"}},{"节号":8,"节名":"工伤与职业病","条号":5,"标题":"申请工伤认定要交三样材料，缺了会一次性告知补正","说人话":"工伤认定要三样：申请表、证明你跟单位有劳动关系的材料、医院的诊断证明（职业病则是职业病诊断证明书）。材料不齐不会被直接驳回，行政部门要一次性书面告诉你差什么，补齐就得受理。第二样是没签合同的人最容易卡住的地方——所以平时留工资流水、考勤、工牌这类材料就格外重要。","适用":"准备去申请工伤认定，想知道要带什么。","成本":"不花钱。材料补齐后即可受理。","收益":"提出工伤认定申请应当提交：① 工伤认定申请表；② 与用人单位存在劳动关系（包括事实劳动关系）的证明材料；③ 医疗诊断证明或者职业病诊断证明书（或者职业病诊断鉴定书）。工伤认定申请表应当包括事故发生的时间、地点、原因以及职工伤害程度等基本情况。申请人提供材料不完整的，社会保险行政部门应当一次性书面告知需要补正的全部材料；按要求补正后应当受理。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）（国务院令第 586 号修订）第十八条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"中——劳动关系证明材料是难点，需靠工资流水、考勤、聊天记录、工牌等组合证明","地域":"全国；申请表的格式与受理窗口由当地社会保险行政部门规定","时效":"程序时效——单位 30 日内，单位未申请的劳动者一方 1 年内（见 8.1）。起算点——事故伤害发生之日或被诊断、鉴定为职业病之日；补正期间通常不重新计算期限。例外——特殊情况经报社会保险行政部门同意可适当延长申请时限。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本，2003 年国务院令第 375 号公布、2010-12-20 修订）","核对日期":"2026-10-03","备注":"没签合同就要先解决劳动关系确认，这一步可能要走仲裁，会占用一年期里的时间，所以越早启动越好。去之前先打 12333 或问当地社会保险行政部门要一份材料清单，避免来回跑。所有提交的材料自己留一份复印件并记下收件日期。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"大","口径":"健康"}},{"节号":8,"节名":"工伤与职业病","条号":6,"标题":"认定决定有时限：一般 60 日，事实清楚 15 日","说人话":"正常 60 天内出认定结论，事实清楚的 15 天内出。如果结论要等交警责任认定、法院判决这类前置结果，那段时间不计算在内。超过时限没有结果的，可以去催问。","适用":"提交申请后等结果，想知道多久能有答复。","成本":"不花钱。记住时限便于催办。","收益":"社会保险行政部门应当自受理工伤认定申请之日起 60 日内作出工伤认定的决定，并书面通知申请工伤认定的职工或者其近亲属和该职工所在单位；对受理的事实清楚、权利义务明确的申请，应当在 15 日内作出决定。作出决定需要以司法机关或者有关行政主管部门的结论为依据的，在尚未作出结论期间，时限中止。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）（国务院令第 586 号修订）第二十条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"易——受理与决定的时限由条例明文规定，受理回执可证明起算时间","地域":"全国","时效":"程序时效——受理后 60 日内作出决定（事实清楚的 15 日内）；对认定结论不服的，可申请行政复议（60 日）或提起行政诉讼（六个月）。起算点——自受理申请之日；行政复议自知道该行政行为之日。例外——需以司法机关或有关行政主管部门结论为依据的，该期间时限中止。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本，2003 年国务院令第 375 号公布、2010-12-20 修订）","核对日期":"2026-10-03","备注":"提交材料时索取受理回执或留存收件凭据，这是计算 60 日起算点和你催办时唯一的依据。第五十五条规定，对工伤认定申请不予受理的决定、对工伤认定结论不服的，可以申请行政复议或提起行政诉讼。各地受理窗口与线上申报渠道可向当地社会保险行政部门或拨 12333 确认。","成本标签":{"钱":"0","时间":"中","毅力":"否","收益":"中","口径":"健康"}},{"节号":8,"节名":"工伤与职业病","条号":7,"标题":"工伤医疗费用怎么报：要在协议医疗机构就医，紧急情况可就近","说人话":"看工伤得去签了服务协议的医院，只有紧急情况可以就近先救。符合目录的费用由工伤保险基金出。住院期间的伙食补助，以及经批准去外地就医的交通食宿费也由基金出，但具体标准是各地自己定的——所以别按外地听来的数字算，问参保地。治疗非工伤引发的疾病不算工伤待遇，走医保。","适用":"治疗工伤期间的费用报销。","成本":"不花钱。核对就医机构与用药目录。","收益":"职工治疗工伤应当在签订服务协议的医疗机构就医，情况紧急时可以先到就近的医疗机构急救。治疗工伤所需费用符合工伤保险诊疗项目目录、工伤保险药品目录、工伤保险住院服务标准的，从工伤保险基金支付。职工住院治疗工伤的伙食补助费，以及经医疗机构出具证明、报经办机构同意到统筹地区以外就医所需的交通、食宿费用从工伤保险基金支付，基金支付的具体标准由统筹地区人民政府规定。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）（国务院令第 586 号修订）第三十条","效力位阶":"行政法规","主张强度":"可推定","举证难度":"中——医疗票据、费用清单、转诊证明、经办机构同意文件需要自己留存","地域":"全国；住院伙食补助费、统筹地区外就医的交通食宿费标准由统筹地区人民政府规定，各地不同","时效":"程序时效——医疗费用由工伤保险基金按规定结算；对核定的待遇有异议可申请行政复议（60 日）或提起行政诉讼（六个月）。起算点——自知道核定结果之日。例外——社会保险行政部门作出认定工伤决定后发生行政复议、行政诉讼的，复议与诉讼期间不停止支付治疗工伤的医疗费用（第三十一条）。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本，2003 年国务院令第 375 号公布、2010-12-20 修订）","核对日期":"2026-10-03","备注":"不确定点在统筹地区制定的伙食补助与外地就医交通食宿标准，各地数额不同，需向参保地社保经办机构或拨 12333 确认。紧急情况就近就医后，要尽快转到协议医疗机构，并保留首诊病历与急诊记录，否则首诊那部分费用可能难以报销。所有票据、费用清单、诊断证明按时间顺序整理存档。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"健康"}},{"节号":8,"节名":"工伤与职业病","条号":8,"标题":"停工留薪期：原工资福利待遇不变，由单位按月支付","说人话":"养伤这段时间叫停工留薪期，工资福利照原来的发，由公司按月给，不是发低保、也不是只发基本工资。一般不超过 12 个月，特别严重的经鉴定确认可以再延长最多 12 个月。评上伤残等级之后，这项停发，改按伤残待遇走。这段时间需要人照顾且生活不能自理的，由公司负责。","适用":"因工作遭受事故伤害或者患职业病需要暂停工作接受工伤医疗。","成本":"不花钱。需要拿到医疗机构出具的建议休息证明。","收益":"在停工留薪期内，原工资福利待遇不变，由所在单位按月支付。停工留薪期一般不超过 12 个月；伤情严重或者情况特殊，经设区的市级劳动能力鉴定委员会确认，可以适当延长，但延长不得超过 12 个月。工伤职工评定伤残等级后，停发原待遇，按伤残待遇规定执行；停工留薪期满后仍需治疗的，继续享受工伤医疗待遇。生活不能自理的工伤职工在停工留薪期需要护理的，由所在单位负责。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）（国务院令第 586 号修订）第三十三条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"中——医疗机构的休息建议、诊断证明、工资流水需要自己留存；停工留薪期的时长常成为争议焦点","地域":"全国；停工留薪期的具体认定与延长程序由设区的市级劳动能力鉴定委员会办理","时效":"程序时效——停工留薪期工资属劳动报酬类争议，走仲裁，时效一年。起算点——自各月应发未发之日起算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本，2003 年国务院令第 375 号公布、2010-12-20 修订）","核对日期":"2026-10-03","备注":"停工留薪期的长度要有医疗证明支撑——每次复诊都让医生在病历上写建议休息期限，这些是后续主张的依据。单位若主张「你早就能上班了」，举证责任在它，但你需要用连续的医疗材料对抗。延长需要经劳动能力鉴定委员会确认，走程序前先向当地社会保险行政部门或拨 12333 问清流程。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"大","口径":"金钱"}},{"节号":8,"节名":"工伤与职业病","条号":9,"标题":"劳动能力鉴定怎么申请、多久出结论、不服怎么办","说人话":"伤情稳定后要去做劳动能力鉴定，定出伤残等级——等级直接决定能拿多少一次性补助金。市级 60 天出结论，必要时再延 30 天。不服的 15 天内申请省级再次鉴定，省级就是最终结论。等级定低了很吃亏，一级差好几个月工资，所以拿到结论当天先记下日期。","适用":"工伤职工经治疗伤情相对稳定后存在残疾、影响劳动能力。","成本":"不花钱。鉴定不收费，但要准备完整的医疗资料。","收益":"劳动能力鉴定由用人单位、工伤职工或者其近亲属向设区的市级劳动能力鉴定委员会提出申请，并提供工伤认定决定和职工工伤医疗的有关资料。设区的市级劳动能力鉴定委员会应当自收到申请之日起 60 日内作出鉴定结论，必要时可以延长 30 日。申请鉴定的单位或者个人对结论不服的，可以在收到结论之日起 15 日内向省级劳动能力鉴定委员会提出再次鉴定申请，省级结论为最终结论。自鉴定结论作出之日起 1 年后，伤残情况发生变化的，可以申请复查鉴定。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）（国务院令第 586 号修订）第二十一条、第二十三条、第二十五条、第二十六条、第二十八条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"中——工伤认定决定、病历、诊断证明、影像报告等医疗资料需要自己整理留档","地域":"全国；受理机关为设区的市级劳动能力鉴定委员会，再次鉴定由省级委员会办理","时效":"程序时效——市级自收到申请之日起 60 日内出结论（可延长 30 日）；不服的 15 日内申请再次鉴定；复查鉴定自结论作出之日起 1 年后可申请。起算点——15 日自收到鉴定结论之日起算，不是作出之日。例外——省级劳动能力鉴定委员会的结论为最终结论。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本，2003 年国务院令第 375 号公布、2010-12-20 修订）","核对日期":"2026-10-03","备注":"15 日从「收到」起算——签收当天就在日历上标出来。住院病历、诊断证明、影像报告自己留一套复印件，原件交出去就要不回来。劳动功能障碍分十个伤残等级，最重的为一级，最轻的为十级；生活自理障碍分三个等级（第二十二条），等级与待遇的对应关系见 8.10 与 8.11。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"健康"}},{"节号":8,"节名":"工伤与职业病","条号":10,"标题":"一次性伤残补助金：按等级给几个月本人工资","说人话":"伤残等级一到十级，一次性补助金对应 7 到 27 个月的本人工资——一级 27 个月，十级 7 个月，中间按等级递减。这笔钱由工伤保险基金出。等级差一级，差的是好几个月工资，所以对鉴定结论不服要及时申请再次鉴定（见 8.9）。","适用":"已评定伤残等级，按等级领取一次性伤残补助金。","成本":"不花钱。核对等级与「本人工资」基数。","收益":"一次性伤残补助金标准——一级 27 个月、二级 25 个月、三级 23 个月、四级 21 个月；五级 18 个月、六级 16 个月；七级 13 个月、八级 11 个月、九级 9 个月、十级 7 个月的本人工资。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）（国务院令第 586 号修订）第三十五条、第三十六条、第三十七条、第六十四条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"易——伤残等级由鉴定结论确定，标准由条例明文规定，属官方核定渠道","地域":"全国","时效":"程序时效——由工伤保险基金按核定发放；对核定的待遇有异议可申请行政复议（60 日）或提起行政诉讼（六个月）。起算点——自知道核定结果之日。例外——无特别时效豁免。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本，2003 年国务院令第 375 号公布、2010-12-20 修订）","核对日期":"2026-10-03","备注":"「本人工资」是前 12 个月平均月缴费工资，不是实发工资；高于统筹地区职工平均工资 300% 的按 300% 算，低于 60% 的按 60% 算（第六十四条）。所以单位低报缴费基数，会直接压低这一笔钱——在职期间核对缴费基数这件事（见 7.1）在这里兑现。核定结果拿到后自己按等级和基数算一遍。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"大","口径":"金钱"}},{"节号":8,"节名":"工伤与职业病","条号":11,"标题":"一至四级伤残：按月领伤残津贴，退休后转养老金","说人话":"一到四级是最重的档：不用上班，但劳动关系保留，每月发伤残津贴（本人工资的 75% 到 90%），比当地最低工资低的部分基金补上。退休后这项停发，改领养老金；养老金比伤残津贴少的部分，工伤保险基金补差额。也就是说这一档的待遇水平是被兜住的。","适用":"工伤职工被鉴定为一至四级伤残。","成本":"不花钱。核对伤残津贴的发放与调整。","收益":"保留劳动关系，退出工作岗位；从工伤保险基金按月支付伤残津贴，标准为本人工资的：一级 90%、二级 85%、三级 80%、四级 75%；伤残津贴实际金额低于当地最低工资标准的，由工伤保险基金补足差额。达到退休年龄并办理退休手续后，停发伤残津贴，按国家有关规定享受基本养老保险待遇；基本养老保险待遇低于伤残津贴的，由工伤保险基金补足差额。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）（国务院令第 586 号修订）第三十五条、第三十四条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"易——伤残等级与「本人工资」基数为核定依据，属官方渠道","地域":"全国；生活护理费按统筹地区上年度职工月平均工资的 50%、40%、30% 分档，由工伤保险基金按月支付","时效":"程序时效——由工伤保险基金按月发放；对核定的待遇有异议可申请行政复议（60 日）或提起行政诉讼（六个月）。起算点——自知道核定结果之日。例外——伤残津贴、供养亲属抚恤金、生活护理费由统筹地区社会保险行政部门适时调整（第四十条）。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本，2003 年国务院令第 375 号公布、2010-12-20 修订）","核对日期":"2026-10-03","备注":"一至四级伤残职工由用人单位和职工个人以伤残津贴为基数缴纳基本医疗保险费（第三十五条）。经劳动能力鉴定委员会确认需要生活护理的，另有按月生活护理费，标准为统筹地区上年度职工月平均工资的 50%（生活完全不能自理）、40%（大部分不能自理）、30%（部分不能自理）（第三十四条）。这几笔钱分别核定，别混成一笔。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"大","口径":"金钱"}},{"节号":8,"节名":"工伤与职业病","条号":12,"标题":"工亡的三笔钱：丧葬补助金、供养亲属抚恤金、一次性工亡补助金","说人话":"因工死亡有三笔：丧葬补助金（6 个月当地上年度职工月平均工资）、供养亲属抚恤金（配偶每月 40%、其他亲属每人 30%，总额不超过生前工资）、一次性工亡补助金（上一年度全国城镇居民人均可支配收入的 20 倍）。第三笔是全国统一算法，依据是国家统计局公布的全国数据，不是当地数据。","适用":"职工因工死亡。","成本":"不花钱。近亲属需要准备关系证明与材料。","收益":"近亲属从工伤保险基金领取三笔钱：① 丧葬补助金为 6 个月的统筹地区上年度职工月平均工资；② 供养亲属抚恤金按职工本人工资的一定比例发给由其生前提供主要生活来源、无劳动能力的亲属——配偶每月 40%，其他亲属每人每月 30%，孤寡老人或者孤儿每人每月在上述标准的基础上增加 10%，核定的各供养亲属的抚恤金之和不应高于因工死亡职工生前的工资；③ 一次性工亡补助金标准为上一年度全国城镇居民人均可支配收入的 20 倍。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 《国务院关于修改〈工伤保险条例〉的决定》修订，2011-01-01 施行）第三十九条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"中——死亡证明、亲属关系证明、供养关系与无劳动能力证明需要家属收集","地域":"全国；丧葬补助金随统筹地区上年度职工月平均工资变动，一次性工亡补助金按全国城镇居民人均可支配收入统一计算","时效":"程序时效——待遇由工伤保险基金核定发放；对核定不服可申请行政复议（60 日）或提起行政诉讼（六个月）。起算点——自知道核定结果之日。例外——伤残职工在停工留薪期内因工伤导致死亡的，近亲属享受本条规定的待遇。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本，第三十九条）；https://www.gov.cn/lianbo/202601/content_7055181.htm（中国政府网·2025 年居民收入和消费支出情况，城镇居民人均可支配收入 56502 元）；https://www.jyg.gov.cn/rsj/ztzl/shbz/art/2026/art_7bc1fb2986ce4615a0dd0b463f3ea740.html（嘉峪关市人社局·2026 年度一次性工亡补助金标准说明）","核对日期":"2026-10-03","备注":"2026 年度一次性工亡补助金为 1130040 元——计算式为 56502 元 × 20 = 1130040 元。数据链：国家统计局于 2026-01-19 公布 2025 年全国城镇居民人均可支配收入 56502 元；《工伤保险条例》第三十九条定公式为上一年度全国城镇居民人均可支配收入的 20 倍。适用期间为 2026-01-01 至 2026-12-31 期间因工死亡的职工近亲属申领，全国统一标准，不分地域、不分户籍、不分行业。 次年 1 月国家统计局公布新数据后标准随之上调，主张前请确认适用年度。丧葬补助金则相反，随统筹地区上年度职工月平均工资变动，属地方数据。本节与第 13 节第 15 条为同一条目的基础层与实操层。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"金钱"}},{"节号":8,"节名":"工伤与职业病","条号":13,"标题":"单位没缴工伤保险：全部待遇由单位按条例标准支付","说人话":"公司没给你缴工伤保险，你出了工伤，本来该基金出的钱全部由公司按同一套标准自己掏。换个说法：你的待遇标准不变，但付款人从基金变成了公司——这时候公司有没有偿付能力就成了真问题。所以能走工伤认定就先走认定，把责任和数额固定下来。","适用":"发生工伤，但单位没有依法参加工伤保险。","成本":"时间——待遇争议走仲裁，一般几个月；若单位无力支付，执行也可能耗时。","收益":"用人单位依照条例规定应当参加工伤保险而未参加的，由社会保险行政部门责令限期参加、补缴应当缴纳的工伤保险费，并自欠缴之日起按日加收万分之五的滞纳金；逾期仍不缴纳的，处欠缴数额 1 倍以上 3 倍以下的罚款。应当参加而未参加工伤保险的用人单位职工发生工伤的，由该用人单位按照条例规定的工伤保险待遇项目和标准支付费用。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）（国务院令第 586 号修订）第六十二条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"中——工伤认定材料与参保状态记录；未参保的事实可自行查询","地域":"全国；一次性工伤医疗补助金、一次性伤残就业补助金标准由省级政府规定","时效":"程序时效——工伤认定申请单位 30 日内、劳动者一方 1 年内；待遇争议走仲裁，时效一年。起算点——工伤认定自事故伤害发生之日；待遇争议自知道权利被侵害之日。例外——用人单位参加工伤保险并补缴费用、滞纳金后，由工伤保险基金和用人单位按规定支付新发生的费用。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本，2003 年国务院令第 375 号公布、2010-12-20 修订）","核对日期":"2026-10-03","备注":"先做工伤认定，别先谈钱——认定结论是后面所有主张的地基，没它连数额都算不出来。单位补缴后，只有「新发生的费用」才由基金分担，此前已发生的仍由单位承担。单位拒付的，走仲裁；对数额有争议的，可向参保地社保经办机构或拨 12333 咨询。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"健康"}},{"节号":8,"节名":"工伤与职业病","条号":14,"标题":"职业病诊断可以在三个地方做，不必回用人单位所在地","说人话":"职业病诊断不用回公司所在地，三个地方任选：公司所在地、你的户籍地、你的经常居住地。诊断机构不能拒绝你。而且诊断和鉴定的费用由公司承担，不是你掏。","适用":"怀疑自己得了职业病，被单位要求「回公司所在地才能诊断」。","成本":"不花钱。诊断本身有费用承担规则（见下）。","收益":"劳动者可以在用人单位所在地、本人户籍所在地或者经常居住地依法承担职业病诊断的医疗卫生机构进行职业病诊断。承担职业病诊断的医疗卫生机构不得拒绝劳动者进行职业病诊断的要求。职业病诊断、鉴定费用由用人单位承担。","依据":"《职业病防治法》（2018-12-29 修正）第四十四条、第五十三条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——职业史、职业病危害接触史、工作场所检测结果等资料多由用人单位掌握，但有举证规则兜底（见 8.15）","地域":"全国；三地任选的权利由法律明文规定","时效":"程序时效——职业病诊断按诊断机构的流程办理；职业病病人依法享有工伤保险待遇，工伤认定申请适用一年期（见 8.1）。起算点——自被诊断、鉴定为职业病之日。例外——职业病病人的诊疗、康复费用及伤残后的社会保障，按工伤保险的规定执行。","来源":"https://wsjkw.sh.gov.cn/fl1/20180525/0012-31403.html（上海市卫生健康委员会·职业病防治法【2018 年修订】全文）","核对日期":"2026-10-03","备注":"确诊职业病之后要走工伤认定——职业病属于应当认定为工伤的情形（《工伤保险条例》第十四条第四项），认定后按工伤待遇处理。诊断所需的职业史、接触史材料单位应当如实提供；它不提供时的规则见 8.15。诊断费用由单位承担，被要求自己先垫的，留存票据与要求其承担的书面记录。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"大","口径":"健康"}},{"节号":8,"节名":"工伤与职业病","条号":15,"标题":"单位不提供职业病诊断资料，诊断机构可以结合你的自述作结论","说人话":"公司不给你提供工作场所的检测资料，并不等于诊断做不成——诊断机构可以结合你的临床表现、检查结果和职业史，参考你的自述来下结论。所以你要做的是把自己的职业史写清楚：什么时候在哪个岗位、接触什么、每天多久、有没有防护用品。","适用":"单位拒绝或拖延提供职业病诊断、鉴定所需的资料。","成本":"不花钱。需要自己准备自述材料与能佐证的旁证。","收益":"用人单位应当如实提供职业病诊断、鉴定所需的劳动者职业史和职业病危害接触史、工作场所职业病危害因素检测结果等资料。职业病诊断、鉴定过程中，用人单位不提供工作场所职业病危害因素检测结果等资料的，诊断、鉴定机构应当结合劳动者的临床表现、辅助检查结果和劳动者的职业史、职业病危害接触史，并参考劳动者的自述、安全生产监督管理部门提供的日常监督检查信息等，作出职业病诊断、鉴定结论。","依据":"《职业病防治法》（2018-12-29 修正）第四十七条、第四十八条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——职业史与接触史的自述材料由自己写，旁证（工友证言、车间照片、工牌岗位记录）需自己收集","地域":"全国","时效":"程序时效——职业病诊断按诊断机构流程办理；工伤认定申请适用一年期（见 8.1）。起算点——自被诊断、鉴定为职业病之日。例外——对职业病诊断有争议的，可向设区的市级地方人民政府卫生行政部门申请鉴定。","来源":"https://wsjkw.sh.gov.cn/fl1/20180525/0012-31403.html（上海市卫生健康委员会·职业病防治法【2018 年修订】全文）","核对日期":"2026-10-03","备注":"职业史自述越具体越好：入厂时间、岗位名称、接触的化学品或粉尘名称、每天接触时长、防护用品发放情况、同岗位同事人数。旁证同样重要——工友的联系方式、车间照片、排班表、工资条上的岗位津贴名目，在职期间就要收集，离职后这些材料都拿不到。诊断争议的鉴定程序可向当地卫生健康行政部门或拨 12333 咨询。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"健康"}},{"节号":8,"节名":"工伤与职业病","条号":16,"标题":"离岗前职业健康检查：没做就不能解除合同","说人话":"接触有毒有害工种的，离职前必须做离岗职业健康检查，费用公司出。没做这项检查，公司就不能解除或终止你的合同——这是保护你的一条硬规则，因为它决定了将来能不能证明「损害是在这家公司得上的」。检查结果必须书面告诉你。","适用":"从事接触职业病危害作业，单位要解除或终止你的劳动合同。","成本":"不花钱。核对自己有没有做过离岗时职业健康检查。","收益":"对从事接触职业病危害作业的劳动者，用人单位应当组织上岗前、在岗期间和离岗时的职业健康检查，并将检查结果书面告知劳动者；职业健康检查费用由用人单位承担。对未进行离岗前职业健康检查的劳动者，不得解除或者终止与其订立的劳动合同。对在职业健康检查中发现有与所从事职业相关的健康损害的劳动者，应当调离原工作岗位并妥善安置。","依据":"《职业病防治法》（2018-12-29 修正）第三十五条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——是否做过检查由体检记录证明，可向体检机构或单位索取；检查结果通知的书面材料需自己留存","地域":"全国；职业健康检查由取得《医疗机构执业许可证》的医疗卫生机构承担","时效":"程序时效——职业病诊断与工伤认定适用一年期（见 8.1）；因未做检查而被解除合同的争议走仲裁，时效一年。起算点——工伤认定自被诊断、鉴定为职业病之日；仲裁自知道权利被侵害之日。例外——疑似职业病病人在诊断或者医学观察期间，用人单位不得解除或终止劳动合同（第五十五条）。","来源":"https://wsjkw.sh.gov.cn/fl1/20180525/0012-31403.html（上海市卫生健康委员会·职业病防治法【2018 年修订】全文）","核对日期":"2026-10-03","备注":"离岗体检是「离职前」这个时间窗口才能做的动作——离职之后再想补，已离开该工作场所，检测与因果链都断了。所以接触有毒有害岗位的人，办离职手续时要主动提出做离岗职业健康检查，并索取检查报告复印件。单位不做、也不让你做的，先书面要求并留痕，再向当地卫生健康行政部门反映。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"大","口径":"健康"}},{"节号":8,"节名":"工伤与职业病","条号":17,"标题":"疑似职业病诊断或医学观察期间，不得解除劳动合同","说人话":"被列为疑似职业病、正在诊断或医学观察期间，公司不能解除或终止你的合同。这个保护期从「被列为疑似」开始，到诊断结论出来为止。单位在这个窗口里辞你，属于违法解除。","适用":"被列为疑似职业病病人，正在诊断或医学观察期间，单位要求解除或终止合同。","成本":"时间——争议走仲裁，一般几个月；金钱——仲裁不收费，律师费通常自己承担。","收益":"医疗卫生机构发现疑似职业病病人时，应当告知劳动者本人并及时通知用人单位；用人单位应当及时安排对疑似职业病病人进行诊断；在疑似职业病病人诊断或者医学观察期间，不得解除或者终止与其订立的劳动合同。用人单位和医疗卫生机构发现职业病病人或者疑似职业病病人时，应当及时向所在地卫生行政部门和安全生产监督管理部门报告。","依据":"《职业病防治法》（2018-12-29 修正）第五十条、第五十五条；《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第四十二条第一项、第四十八条、第八十七条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——疑似职业病的诊断或通知材料是关键，需向诊断机构或单位索取；解除通知需留存","地域":"全国","时效":"程序时效——仲裁申请时效一年。起算点——自收到解除或终止通知之日。例外——在疑似职业病病人诊断或者医学观察期间，用人单位不得解除或者终止劳动合同（法定禁止期）。","来源":"https://wsjkw.sh.gov.cn/fl1/20180525/0012-31403.html（上海市卫生健康委员会·职业病防治法【2018 年修订】全文）；http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）","核对日期":"2026-10-03","备注":"取得「疑似职业病」的书面材料是这一步的关键——主动向诊断机构索取受理或检查结论的书面文件，并保留一份。单位在保护期内解除的，可主张继续履行合同或按经济补偿标准二倍主张赔偿金（《劳动合同法》第四十八条、第八十七条）。合同到期与保护期重叠的顺延规则见 5.12。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"健康"}},{"节号":9,"节名":"维权路径与时效","条号":1,"标题":"仲裁时效三层：一年、从知道被侵害之日起算、拖欠报酬有例外","说人话":"仲裁时效就一年，从你知道自己被侵权那天开始算。但有两处要记住：一是只要你向公司主张过、或者找过有关部门，这一年就重新开始算；二是欠工资这种事，只要劳动关系还在，不受这一年限制——但一旦离职，就得从离职那天起一年内提出来。所以「我早就离职了」才是最危险的状态。","适用":"任何准备申请劳动仲裁的人。先算时效，再谈别的。","成本":"不花钱。算一遍自己的时间点，半小时。","收益":"劳动争议申请仲裁的时效期间为一年，从当事人知道或者应当知道其权利被侵害之日起计算；因当事人一方向对方主张权利、向有关部门请求权利救济，或者对方同意履行义务而中断，从中断时起重新计算；因不可抗力或者有其他正当理由不能申请仲裁的，时效中止，从中止原因消除之日起继续计算。劳动关系存续期间因拖欠劳动报酬发生争议的，劳动者申请仲裁不受一年时效期间的限制；但是，劳动关系终止的，应当自劳动关系终止之日起一年内提出。","依据":"《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第二十七条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——证明时效中断需要留痕（主张权利的邮件、投诉回执、对方同意履行的记录）；劳动关系终止日期需要离职证明或社保记录","地域":"全国","时效":"程序时效——仲裁申请时效一年；中断后重新计算；中止后继续计算。起算点——自当事人知道或者应当知道其权利被侵害之日起计算；拖欠劳动报酬类，劳动关系终止的自终止之日起一年内提出。例外——劳动关系存续期间因拖欠劳动报酬发生的争议，不受一年时效期间的限制。","来源":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（广东省人民政府门户网站·劳动争议调解仲裁法全文，第二十七条）","核对日期":"2026-10-03","备注":"时效中断必须有痕迹——口头催过不算，要有邮件、聊天记录、投诉回执、书面催告。中断的证据要能显示时间和内容。劳动关系终止之日在离职证明、社保减员记录、最后一个月工资发放时间上都能固定，离职时把这三样各留一份。具体时效计算有争议的，向当地劳动人事争议仲裁委员会咨询或拨 12333。","成本标签":{"钱":"0","时间":"中","毅力":"否","收益":"大","口径":"金钱"}},{"节号":9,"节名":"维权路径与时效","条号":2,"标题":"劳动仲裁是前置程序，不能直接去法院起诉","说人话":"劳动争议不能跳过仲裁直接去法院，得先仲裁。好处是仲裁这一步不收费。等仲裁出了结果，你不服还可以在收到裁决书之日起 15 天内去法院起诉。","适用":"想直接到法院起诉欠薪、经济补偿等劳动争议。","成本":"不花钱。仲裁不收费。","收益":"劳动争议需要先经过劳动人事争议仲裁；对仲裁裁决不服的，才可以向人民法院起诉。仲裁裁决的作出有时限，且部分裁决为终局裁决。","依据":"《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第五条、第四十八条、第五十条、第五十三条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——仲裁裁决书与送达时间是起诉期限的关键，需留存签收记录","地域":"全国；仲裁管辖按劳动合同履行地或用人单位所在地确定","时效":"程序时效——仲裁申请时效一年；对仲裁裁决不服的，自收到裁决书之日起 15 日内向人民法院提起诉讼。起算点——自收到仲裁裁决书之日（15 日起诉期）。例外——部分裁决为终局裁决（第四十七条），劳动者的起诉权与用人单位的撤销权路径不同。","来源":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（劳动争议调解仲裁法全文）","核对日期":"2026-10-03","备注":"签收裁决书那天就是 15 日起诉期的起算日，务必留好签收凭证或送达记录。第四十七条列举的终局裁决情形下，劳动者不服仍可起诉（第四十八条），用人单位则是向中级人民法院申请撤销（第四十九条），两侧路径不同，别搞混。管辖与受理材料向当地劳动人事争议仲裁委员会咨询或拨 12333。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"金钱"}},{"节号":9,"节名":"维权路径与时效","条号":3,"标题":"劳动监察投诉：另一条路，但有 2 年查处期限","说人话":"除了仲裁，还可以向劳动保障监察投诉举报——这条路不收费，而且能逼着单位限期改正、补发工资。但有个 2 年的期限：违法行为发生两年内没人发现也没人举报投诉的，就不再查处了。所以投诉要趁早，别等攒够了证据再动。","适用":"欠薪、不缴社保、超时加班、低于最低工资，想走行政查处而不是仲裁。","成本":"不花钱。投诉举报不收费。","收益":"任何组织或者个人对违反劳动保障法律、法规或者规章的行为，有权向劳动保障行政部门举报。劳动保障行政部门对下列事项实施劳动保障监察：用人单位遵守劳动保障法律法规的情况，包括工资支付、社会保险、工时休假、女职工和未成年工特殊保护等。违反劳动保障法律、法规或者规章的行为在 2 年内未被劳动保障行政部门发现，也未被举报、投诉的，劳动保障行政部门不再查处。","依据":"《劳动保障监察条例》（国务院令第 423 号，2004-12-01 施行）第九条、第十条、第十一条、第二十条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"中——投诉需要提供单位名称与基本事实；工资流水、考勤记录等材料有助于加快查处","地域":"全国；受理机构为用人单位所在地的劳动保障行政部门","时效":"程序时效——违法行为在 2 年内未被发现也未被举报、投诉的，不再查处；主张个别权利的仲裁时效为一年。起算点——违法行为发生之日（监察查处期限）；劳动者知道或应当知道权利被侵害之日（仲裁）。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年仲裁时效限制。","来源":"https://www.gov.cn/zhengce/zhengceku/2008-03/28/content_7383.htm（劳动保障监察条例全文）","核对日期":"2026-10-03","备注":"监察投诉与仲裁可以并行，但目标不同：监察要的是责令改正、行政处罚（例如补缴社保、补发工资），仲裁要的是给到你个人的给付（补偿金、赔偿金）。想快点拿钱可以先投诉施压，但不能指望投诉解决全部诉求。受理分工与管辖向当地人力资源社会保障局劳动保障监察机构或拨 12333 确认。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"中","口径":"金钱"}},{"节号":9,"节名":"维权路径与时效","条号":4,"标题":"12333 能问到什么、问不到什么","说人话":"12333 是打给「政策口径」的，不是打给「替你判断案子」的。问「失业金现在多少钱一个月」「工伤认定要带什么材料」「我这个情况去哪个窗口」——这类问题它答得了。问「我这个案子能不能赢」——它答不了，也不该由它答。打电话时把经办员工号、答复时间记下来。","适用":"不确定本地口径、办事流程、需要带什么材料的时候。","成本":"不花钱。打一个电话几分钟。","收益":"没有可直接援引的全国统一条文——本轮未核实到规定 12333 热线职能范围的官方文件，本条不承诺它能办成任何事。作为渠道说明：12333 是各级人力资源社会保障部门按公开服务承诺运行的服务热线，一般可咨询社保参保与转移、失业保险金申领条件与标准、工伤认定流程、劳动争议处理渠道等事项，并可转接参保地经办机构。","依据":"无明文的全国统一规定；本轮未获取到规定该热线职能范围的官方文件","效力位阶":"无明文依据","主张强度":"倡导性","举证难度":"易——拨打电话即可，不需要证据","地域":"全国；热线由各级人力资源社会保障部门运行，本地口径以属地答复为准","时效":"无特别时效——咨询渠道本身不受时效限制。起算点：不适用，本条是渠道条目，不是实体权利主张。例外：你要问的实体权利各自有时效约束（仲裁一年、工伤认定一年等），别把「渠道不失效」当成「权利不失效」。","来源":"无官方一手依据可援引。 尝试过的路径：① 检索人力资源社会保障部官网关于 12333 热线职能范围的文件，未定位到可作为依据的公开文件；② 检索各地人力资源社会保障局对 12333 服务范围的说明，均为地方服务承诺类页面，不足以作为全国性依据。故按「无明文依据」处理，仅作渠道说明。","核对日期":"2026-10-03","备注":"本条不是法律依据条，只是渠道条目，因此效力位阶为「无明文依据」、主张强度为「倡导性」。价值在于告诉读者「什么问题该问这个渠道」以及记录答复：经办员工号、答复日期、答复内容，涉及社保衔接等重大决定时，这个记录可能成为证明「我按规定申报过」的材料。热线忙时可改走当地人力资源社会保障局官网或政务服务平台。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"小","口径":"时间"}},{"节号":9,"节名":"维权路径与时效","条号":5,"标题":"工伤认定的一年期是最硬的期限，过期就没有救济","说人话":"别的时效还有中断、中止的余地，工伤认定这一年是实打实的——一年内不去申请，后面所有工伤待遇都无从谈起，这是一条没有回头路的线。所以出了工伤，第一件事就是确认单位有没有在 30 天内申请；没有，自己立刻去，别等到伤好了再谈。","适用":"发生事故伤害或被诊断、鉴定为职业病，还在犹豫要不要申请工伤认定。","成本":"不花钱。但拖延的代价可能是全部工伤待遇。","收益":"所在单位应当自事故伤害发生之日或者被诊断、鉴定为职业病之日起 30 日内提出工伤认定申请；单位未提出的，工伤职工或者其近亲属、工会组织在事故伤害发生之日或者被诊断、鉴定为职业病之日起 1 年内可以直接向用人单位所在地统筹地区社会保险行政部门提出申请。用人单位未在 30 日内提交申请的，此期间发生符合条例规定的工伤待遇等费用由该用人单位负担。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）第十七条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"中——事故时间与诊疗记录需自己留存；劳动关系材料可能是难点（见 8.5）","地域":"全国；受理机关为用人单位所在地统筹地区社会保险行政部门","时效":"程序时效——单位 30 日内；单位未申请的，劳动者一方 1 年内。起算点——事故伤害发生之日或者被诊断、鉴定为职业病之日。例外——遇有特殊情况，经报社会保险行政部门同意，申请时限可以适当延长。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（工伤保险条例全文，第十七条）","核对日期":"2026-10-03","备注":"收到工伤认定申请不予受理的决定或者对结论不服，可以申请行政复议（60 日）或提起行政诉讼（六个月）（第五十五条）——这是对决定不服的救济，不是对「一年期已过」的救济，两者不能混。怀疑自己已经超期的，立即打 12333 或到当地社会保险行政部门窗口问
