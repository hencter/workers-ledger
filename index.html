在职竞业条款不一定管用。收到书面质询时，回复方式直接影响「拒不改正」是否成立。","适用":"你在职期间从事了竞争性业务，单位要解除合同。","成本":"时间——争议走仲裁，一般几个月；金钱——仲裁不收费，律师费通常自己承担。","收益":"这不是收益条，是风险条。 明文层：① 用人单位与涉密人员约定在职期间竞业限制条款有效（解释（二）第十四条）；② 劳动者严重违反用人单位的规章制度的，用人单位可以解除劳动合同且无需支付经济补偿（第三十九条第二项）；③ 劳动者同时与其他用人单位建立劳动关系，对完成本单位的工作任务造成严重影响，或者经用人单位提出拒不改正的，用人单位可以解除且无需支付经济补偿（第三十九条第四项）。三条可并用。","依据":"《最高人民法院关于审理劳动争议案件适用法律问题的解释（二）》（法释〔2025〕12 号，2025-09-01 施行）第十四条；《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第三十九条第二项、第四项、第四条","效力位阶":"法律（第十四条为司法解释）","主张强度":"可推定","举证难度":"中——「是否构成实际用工」「制度是否有效送达」「是否拒不改正」三个事实的举证责任分配不同","地域":"全国；对「注册但未实际经营是否构成双重劳动关系」各地认定不一","时效":"程序时效——仲裁申请时效一年。起算点——自收到解除通知之日。例外——无特别时效豁免。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文，第四条、第三十九条）；http://gongbao.court.gov.cn/Details/bb72019c45453f84d920bd6375573e.html（最高人民法院公报·劳动争议解释（二）全文，第十四条）","核对日期":"2026-10-03","备注":"不确定点在第三十九条第四项的适用范围——条文通常指向存在实际用工的「另一段劳动关系」，本人名下有商事登记但未实际用工经营是否落入，需个案判断，各地口径不一，可向当地劳动人事争议仲裁委员会或拨 12333 确认。关键动作：收到任何关于兼职、自营的书面质询，回复前先书面确认已收悉并要求明确所指事实，避免在不知情的情况下被认定「拒不改正」。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"中","口径":"自由"}},{"节号":12,"节名":"竞业限制与保密实操","条号":27,"标题":"保密与竞业的取证清单：离职前一次性做完","说人话":"这四条抗辩能不能立起来，全看你手里有没有「我不涉密」的材料。离职前一次性做完六件事：① 岗位说明书与职责范围；② 系统权限清单与可访问的数据目录；③ 经手项目的范围与产出清单（不含实质秘密）；④ 协议与合同原文（含签署日期）；⑤ 保密与竞业条款的适用期间、范围、地域、补偿、违约金五要素抄录；⑥ 历次补偿到账记录。做完存个人设备。","适用":"还在职、签过保密或竞业限制协议，想在离职前把材料备齐。","成本":"不花钱。花一两个小时集中整理。","收益":"没有可直接援引的条文；本条是动作清单。其法律作用是支撑 12.3（人员范围）、12.8（未接触抗辩）、12.9（范围过度抗辩）、12.16（赔偿损失）四条的抗辩材料。","依据":"无明文的全国统一规定；配套依据为《最高人民法院关于审理劳动争议案件适用法律问题的解释（二）》（法释〔2025〕12 号，2025-09-01 施行）第十三条、《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第二十四条","效力位阶":"无明文依据","主张强度":"倡导性","举证难度":"难——六类材料全部在离职后无法取得，只能在职期间完成","地域":"全国；各地对电子证据形式的采信要求不同","时效":"无特别时效——本条是取证动作，自身不受时效限制。起算点：不适用。例外：所支撑的实体主张受一年仲裁时效约束。","来源":"无官方一手依据可援引（本条是动作清单）。其配套条文一手页：http://gongbao.court.gov.cn/Details/bb72019c45453f84d920bd6375573e.html（最高人民法院公报·解释（二）第十三条）；http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法第二十四条）。","核对日期":"2026-10-03","备注":"举证难度标「难」——取证时机必须在离职之前，六类材料在离职后全部取不到。第六项「补偿到账记录」要按月保留，它既证明对方在履约（协议有效），也是 12.6、12.23 的时间基准。材料存个人设备，不要放在公司电脑或公司网盘里（见 12.13 备注）。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"大","口径":"自由"}},{"节号":12,"节名":"竞业限制与保密实操","条号":28,"标题":"服务期与竞业限制同时存在：两条线分开算","说人话":"两条各自独立的线。你提前离职，可能按服务期协议赔一笔培训费（有上限、按剩余期限分摊）；同时竞业限制还在——公司按月给钱你就得守，不给钱你可以要求解除。别把两件事当一件来谈，谈判和举证都要分开。","适用":"单位为同一项投入既主张服务期又主张竞业限制，或者你想知道「赔了服务期违约金还要不要守竞业」。","成本":"时间——争议走仲裁，一般几个月；金钱——仲裁不收费，律师费通常自己承担。","收益":"明文层：① 服务期违约金以专项培训费为上限并按未履行部分分摊（第二十二条）；② 离职后竞业限制须按月支付经济补偿（第二十三条第二款）；③ 二者成立要件、对价与救济路径互不相同——违反服务期不等于违反竞业限制；④ 以特殊待遇为对价的服务期，违约属赔偿损失责任，由法院综合实际损失、过错程度、已履行年限酌定（解释（二）第十二条）。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第二十二条、第二十三条第二款；《最高人民法院关于审理劳动争议案件适用法律问题的解释（二）》（法释〔2025〕12 号，2025-09-01 施行）第十二条","效力位阶":"法律（第十二条为司法解释）","主张强度":"可推定","举证难度":"中——两类协议的文本、培训费凭证、补偿发放记录需分别留存","地域":"全国；对两类条款能否合并约定、以及对价对应关系的审查尺度各地不一","时效":"程序时效——仲裁申请时效一年。起算点——服务期违约金自劳动者提出解除之日；竞业补偿自各月应付未付之日。例外——无特别时效豁免。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文，第二十二条、第二十三条）；http://gongbao.court.gov.cn/Details/bb72019c45453f84d920bd6375573e.html（最高人民法院公报·劳动争议解释（二）全文，第十二条）","核对日期":"2026-10-03","备注":"不确定点在同一笔投入能否同时作为服务期对价与竞业补偿对价——各地审查尺度不一，需向当地劳动人事争议仲裁委员会或拨 12333 确认。有权要求单位出示培训费凭证，出示不了的服务期违约金基础不牢（第 3 节第 3.13 条）。签字前把两份协议摊在一起看：对价是什么、能拿多少、要守多久。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"中","口径":"金钱"}},{"节号":13,"节名":"工伤认定与待遇实操","条号":1,"标题":"认定申请的时限：单位 30 日、劳动者一方 1 年，两条线都从事故当天起算","说人话":"两条线，都从事故当天开始数：公司 30 天内报，它不报，你自己一年内报。注意一年从事故发生日起算，不是从伤好、也不是从跟公司谈崩那天起算。公司拖过 30 天，那段时间的工伤待遇费用由它自己出——这是它拖延的代价。","适用":"发生事故伤害或被诊断、鉴定为职业病，准备申请工伤认定。","成本":"不花钱。提交材料本身不收费。","收益":"所在单位应当自事故伤害发生之日或者被诊断、鉴定为职业病之日起 30 日内向统筹地区社会保险行政部门提出工伤认定申请；遇有特殊情况，经报社会保险行政部门同意，申请时限可以适当延长。用人单位未按前款规定提出申请的，工伤职工或者其近亲属、工会组织在事故伤害发生之日或者被诊断、鉴定为职业病之日起 1 年内，可以直接向用人单位所在地统筹地区社会保险行政部门提出工伤认定申请。用人单位未在 30 日内提交申请的，在此期间发生符合条例规定的工伤待遇等有关费用由该用人单位负担。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）第十七条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"中——事故时间与诊疗记录需自己留存；单位是否已申请可向社会保险行政部门核实","地域":"全国；受理机关为用人单位所在地统筹地区社会保险行政部门","时效":"程序时效——单位 30 日内；单位未申请的，劳动者一方 1 年内。起算点——事故伤害发生之日，或被诊断、鉴定为职业病之日。例外——特殊情况经报社会保险行政部门同意，申请时限可以适当延长。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本，2003 年国务院令第 375 号公布、2010-12-20 修订）","核对日期":"2026-10-03","备注":"一年期是不可逆的硬线。受伤当天做两件事：留存就诊记录与诊断证明；书面催单位申请并留痕。单位不申请就自己报，材料不齐会被一次性书面告知补正，不是驳回。劳动关系有争议的先解决劳动关系确认，但那会占用一年期，越早启动越好。怀疑已超期的，立刻向当地社会保险行政部门或拨 12333 询问是否还有路径。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"大","口径":"健康"}},{"节号":13,"节名":"工伤认定与待遇实操","条号":2,"标题":"应当认定为工伤的七种情形","说人话":"工伤不只是在车间被机器伤到。上班前后在工作场所做预备或收尾工作受伤、因工作被人打伤、因公出差受伤或失踪、上下班路上出交通事故且你不是主责、得了职业病，这些都算。第六项最容易漏——要抓住两个点：属交通事故类，且责任认定你不是主责。","适用":"判断自己遇到的事故是否落在工伤范围内。","成本":"不花钱。逐条对照事故情形。","收益":"职工有下列情形之一的，应当认定为工伤：① 在工作时间和工作场所内，因工作原因受到事故伤害的；② 工作时间前后在工作场所内，从事与工作有关的预备性或者收尾性工作受到事故伤害的；③ 在工作时间和工作场所内，因履行工作职责受到暴力等意外伤害的；④ 患职业病的；⑤ 因工外出期间，由于工作原因受到伤害或者发生事故下落不明的；⑥ 在上下班途中，受到非本人主要责任的交通事故或者城市轨道交通、客运轮渡、火车事故伤害的；⑦ 法律、行政法规规定应当认定为工伤的其他情形。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）第十四条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"中——事故证明、诊疗记录、工作安排记录、交通事故责任认定书需自己收集","地域":"全国","时效":"程序时效——单位 30 日内，单位未申请的劳动者一方 1 年内。起算点——事故伤害发生之日或被诊断、鉴定为职业病之日。例外——特殊情况经报社会保险行政部门同意可适当延长。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本）","核对日期":"2026-10-03","备注":"14 条第 6 项的表述是 2010 年修订后的现行文本：「非本人主要责任的交通事故或者城市轨道交通、客运轮渡、火车事故伤害」。修订前的旧版写的是「机动车事故伤害」，范围更窄。核条文时务必认准现行本（国家行政法规库内另有一份 2010 年修订前旧版，页面无废止标记）。交警出具的道路交通事故责任认定书是关键材料，务必留存并确认责任划分。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"大","口径":"健康"}},{"节号":13,"节名":"工伤认定与待遇实操","条号":3,"标题":"视同工伤的三种情形与三种排除情形","说人话":"工伤还有一类叫「视同工伤」：上班时间和岗位上突发疾病，当场死亡或 48 小时内抢救无效死亡的，算工伤——48 小时是硬线。另外三类排除情形要记住：故意犯罪、醉酒或吸毒、自残或自杀，有这些一律不认定。抢险救灾受伤这一档按条例享受待遇；军队旧伤复发这一档只享受除一次性伤残补助金以外的待遇。","适用":"判断突发疾病、抢险救灾受伤等情形是否算工伤；以及有醉酒、自残等情形时能否认定。","成本":"不花钱。逐条对照。","收益":"视同工伤的情形有三种：① 在工作时间和工作岗位，突发疾病死亡或者在 48 小时之内经抢救无效死亡的；② 在抢险救灾等维护国家利益、公共利益活动中受到伤害的；③ 职工原在军队服役，因战、因公负伤致残，已取得革命伤残军人证，到用人单位后旧伤复发的。同时，职工符合上述规定，但有下列情形之一的，不得认定为工伤或者视同工伤：故意犯罪的；醉酒或者吸毒的；自残或者自杀的。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）第十五条、第十六条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"中——抢救记录、死亡证明、时间节点材料是关键；「48 小时」的起算需有医疗机构记录支撑","地域":"全国","时效":"程序时效——单位 30 日内，单位未申请的劳动者一方 1 年内。起算点——突发疾病死亡的，自死亡之日；旧伤复发的，自复发被诊断之日。例外——特殊情况经报社会保险行政部门同意可适当延长。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本）","核对日期":"2026-10-03","备注":"「48 小时」的起算时间点在实务中是争议焦点（以抢救开始时间还是初次诊断时间为准，各地把握不一），家属应在第一时间向医院索取抢救记录、入院记录、死亡记录的复印件并盖章，这些事后补取困难。用人单位主张存在醉酒等排除情形的，相关事实由主张方举证。具体尺度向当地社会保险行政部门或拨 12333 咨询。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"大","口径":"健康"}},{"节号":13,"节名":"工伤认定与待遇实操","条号":4,"标题":"单位不认为是工伤：举证责任在单位","说人话":"认定环节的举证责任分配对你有利：你说是工伤、公司说不是，那由公司拿出「不是工伤」的证据。你要做的不是证明「一定是工伤」，而是把看起来像工伤的基础材料交上去——事故时间地点、怎么受的伤、诊疗记录、当时的工作安排。剩下的反驳责任在公司那边。","适用":"单位否认是工伤、拒绝申报，或在认定程序中提出异议。","成本":"不花钱。「由单位举证」这一条本身就是程序上的优势。","收益":"社会保险行政部门受理工伤认定申请后，根据审核需要可以对事故伤害进行调查核实，用人单位、职工、工会组织、医疗机构以及有关部门应当予以协助。职工或者其近亲属认为是工伤，用人单位不认为是工伤的，由用人单位承担举证责任。 依法取得职业病诊断证明书或职业病诊断鉴定书的，社会保险行政部门不再进行调查核实。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）第十九条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"中——基础事实材料需自己提交；用人单位的反驳举证责任由条例明确分配","地域":"全国","时效":"程序时效——单位 30 日内，单位未申请的劳动者一方 1 年内。起算点——事故伤害发生之日或被诊断、鉴定为职业病之日。例外——特殊情况经报社会保险行政部门同意可适当延长。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本）","核对日期":"2026-10-03","备注":"已取得职业病诊断证明书或鉴定书的，行政部门不再调查核实（第十九条第一款）——这是职业病路径相对顺畅的原因，诊断环节的攻防比认定环节更关键（见 13.14）。对认定结论不服的，可以申请行政复议或提起行政诉讼（第五十五条）。材料清单向当地社会保险行政部门或拨 12333 确认。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"健康"}},{"节号":13,"节名":"工伤认定与待遇实操","条号":5,"标题":"申请工伤认定要交的三样材料","说人话":"三样东西：申请表、证明你跟单位有劳动关系的材料、医院的诊断证明（职业病则是职业病诊断证明书）。注意第二样写的是「包括事实劳动关系」——没签合同也能申请，用工资流水、考勤、工牌、聊天记录凑。材料不齐不会被直接驳回，会一次性告诉你差什么。","适用":"准备去申请工伤认定，想知道要带什么。","成本":"不花钱。材料补齐后即可受理。","收益":"提出工伤认定申请应当提交：① 工伤认定申请表；② 与用人单位存在劳动关系（包括事实劳动关系）的证明材料；③ 医疗诊断证明或者职业病诊断证明书（或者职业病诊断鉴定书）。工伤认定申请表应当包括事故发生的时间、地点、原因以及职工伤害程度等基本情况。申请人提供材料不完整的，社会保险行政部门应当一次性书面告知需要补正的全部材料；按要求补正后应当受理。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）第十八条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"中——劳动关系证明材料是难点，需靠工资流水、考勤、聊天记录、工牌等组合证明","地域":"全国；申请表的格式与受理窗口由当地社会保险行政部门规定","时效":"程序时效——单位 30 日内，单位未申请的劳动者一方 1 年内。起算点——事故伤害发生之日或被诊断、鉴定为职业病之日。例外——特殊情况经报社会保险行政部门同意可适当延长。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本）","核对日期":"2026-10-03","备注":"没签合同的要先解决劳动关系确认，这一步可能要走仲裁，会占用一年期里的时间。「事实劳动关系」这一表述是条例原文，不是引申——所以别被「你没合同，报不了工伤」挡住。提交材料时索取受理回执或留存收件凭据，这是后续计算时限与催办的依据。材料清单先打 12333 问一次，避免来回跑。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"大","口径":"健康"}},{"节号":13,"节名":"工伤认定与待遇实操","条号":6,"标题":"认定的审核时限：一般 60 日，事实清楚 15 日","说人话":"正常 60 天内出结论，事实清楚的 15 天内出。如果结论要等交警责任认定、法院判决这类前置结果，那段时间不计算在内（中止）。超过时限没结果就去催。另外，经办人员与你有利害关系的，可以要求回避——这是条文明确写的。","适用":"提交申请后等结果，想知道多久能有答复。","成本":"不花钱。记住时限便于催办。","收益":"社会保险行政部门应当自受理工伤认定申请之日起 60 日内作出工伤认定的决定，并书面通知申请工伤认定的职工或者其近亲属和该职工所在单位；对受理的事实清楚、权利义务明确的申请，应当在 15 日内作出决定。作出决定需要以司法机关或者有关行政主管部门的结论为依据的，在尚未作出结论期间，时限中止。工作人员与申请人有利害关系的，应当回避。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）第二十条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"易——受理与决定的时限由条例明文规定，受理回执可证明起算时间；回避事由需自行提出","地域":"全国","时效":"程序时效——受理后 60 日内作出决定（事实清楚的 15 日内）；对结论不服的可申请行政复议（60 日）或提起行政诉讼（六个月）。起算点——自受理申请之日；行政复议自知道该行政行为之日。例外——需以司法机关或有关行政主管部门结论为依据的，该期间时限中止。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本）","核对日期":"2026-10-03","备注":"提交材料时索取受理回执或留存收件凭据，这是计算 60 日起算点和催办时唯一的依据。回避申请要书面提出并写明理由，口头提出容易漏记。各地受理窗口与线上申报渠道向当地社会保险行政部门或拨 12333 确认。","成本标签":{"钱":"0","时间":"中","毅力":"否","收益":"中","口径":"健康"}},{"节号":13,"节名":"工伤认定与待遇实操","条号":7,"标题":"对认定结论不服：行政复议 60 日、行政诉讼 6 个月","说人话":"认定被拒了、结论不利，有两条路：申请行政复议或直接起诉。时限记牢——复议 60 日、诉讼 6 个月，从收到决定之日起算。拿到决定书当天就把日期标出来，别等想清楚了才发现过期。","适用":"对工伤认定申请不予受理的决定、对工伤认定结论不服。","成本":"行政复议与行政诉讼一般不收费（行政诉讼按法院标准可能收取少量费用）。","收益":"有下列情形之一的，有关单位或者个人可以依法申请行政复议，也可以依法向人民法院提起行政诉讼：① 申请工伤认定的职工或者其近亲属、该职工所在单位对工伤认定申请不予受理的决定不服的；② 申请工伤认定的职工或者其近亲属、该职工所在单位对工伤认定结论不服的；③ 用人单位对经办机构确定的单位缴费费率不服的；④ 签订服务协议的医疗机构、辅助器具配置机构认为经办机构未履行有关协议或者规定的；⑤ 工伤职工或者其近亲属对经办机构核定的工伤保险待遇有异议的。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）第五十五条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"中——行政决定书与送达时间是期限起算的关键，需留存签收凭证","地域":"全国；复议机关与受诉法院按属地确定","时效":"程序时效——行政复议申请期限 60 日；行政诉讼起诉期限 6 个月。起算点——自知道该行政行为之日（一般以收到决定书之日起算）。例外——法律规定复议前置的须先经复议，具体以对应法律的规定为准。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本）","核对日期":"2026-10-03","备注":"第六十一条（现第三十一条）另有一层保护：社会保险行政部门作出认定为工伤的决定后发生行政复议、行政诉讼的，复议与诉讼期间不停止支付工伤职工治疗工伤的医疗费用——所以别因为怕打官司而耽误治疗。复议与诉讼的管辖、前置要求各地有差别，拿到决定书后尽快向作出决定的机关、当地司法行政部门复议机构或人民法院立案窗口确认。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"中","口径":"健康"}},{"节号":13,"节名":"工伤认定与待遇实操","条号":8,"标题":"工伤医疗费用：要在协议医疗机构就医，紧急情况可就近","说人话":"看工伤要去签了服务协议的医院，只有紧急情况可以就近先救。符合三个目录的费用由基金出。住院伙食补助、经批准去外地就医的交通食宿也由基金出，但标准是各地自己定的，别按外地听来的数算。治疗非工伤的病不算工伤待遇，走医保。工伤康复的费用符合规定的也能报。","适用":"治疗工伤期间的费用报销。","成本":"不花钱。核对就医机构与用药目录。","收益":"职工治疗工伤应当在签订服务协议的医疗机构就医，情况紧急时可以先到就近的医疗机构急救。治疗工伤所需费用符合工伤保险诊疗项目目录、工伤保险药品目录、工伤保险住院服务标准的，从工伤保险基金支付。职工住院治疗工伤的伙食补助费，以及经医疗机构出具证明、报经办机构同意到统筹地区以外就医所需的交通、食宿费用从工伤保险基金支付，基金支付的具体标准由统筹地区人民政府规定。治疗非工伤引发的疾病，不享受工伤医疗待遇，按基本医疗保险办法处理；到签订服务协议的医疗机构进行工伤康复的费用，符合规定的从工伤保险基金支付。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）第三十条","效力位阶":"行政法规","主张强度":"可推定","举证难度":"中——医疗票据、费用清单、转诊证明、经办机构同意文件需自己留存","地域":"全国；住院伙食补助费、统筹地区外就医的交通食宿费标准由统筹地区人民政府规定，各地不同","时效":"程序时效——医疗费用由工伤保险基金按规定结算；对核定的待遇有异议可申请行政复议（60 日）或提起行政诉讼（六个月）。起算点——自知道核定结果之日。例外——作出认定工伤决定后发生复议、诉讼的，期间不停止支付治疗工伤的医疗费用。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本）","核对日期":"2026-10-03","备注":"不确定点在统筹地区制定的伙食补助与外地就医交通食宿标准（条例只授权未给数字），需向参保地社保经办机构或拨 12333 确认。紧急情况就近就医后要尽快转到协议医疗机构，并保留首诊病历与急诊记录，否则首诊那部分费用可能难以报销。所有票据、费用清单、诊断证明按时间顺序整理存档。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"健康"}},{"节号":13,"节名":"工伤认定与待遇实操","条号":9,"标题":"停工留薪期：原工资福利待遇不变，由单位按月支付","说人话":"养伤这段时间叫停工留薪期，工资福利照原来的发，由公司按月给——不是发低保，也不是只发基本工资。一般不超过 12 个月，特别严重的经鉴定确认可以再延长最多 12 个月。评上伤残等级后这项停发，改按伤残待遇走。生活不能自理需要护理的，由公司负责。","适用":"因工受伤或患职业病需要暂停工作接受治疗。","成本":"不花钱。需要拿到医疗机构出具的休息建议。","收益":"在停工留薪期内，原工资福利待遇不变，由所在单位按月支付。停工留薪期一般不超过 12 个月；伤情严重或者情况特殊，经设区的市级劳动能力鉴定委员会确认，可以适当延长，但延长不得超过 12 个月。工伤职工评定伤残等级后，停发原待遇，按伤残待遇规定执行；停工留薪期满后仍需治疗的，继续享受工伤医疗待遇。生活不能自理的工伤职工在停工留薪期需要护理的，由所在单位负责。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）第三十三条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"中——医疗机构的休息建议、诊断证明、工资流水需自己留存；停工留薪期时长常成为争议焦点","地域":"全国；停工留薪期的具体认定与延长程序由设区的市级劳动能力鉴定委员会办理","时效":"程序时效——停工留薪期工资属劳动报酬类争议，走仲裁，时效一年。起算点——自各月应发未发之日起算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本）","核对日期":"2026-10-03","备注":"停工留薪期的长度要有医疗证明支撑——每次复诊都让医生在病历上写建议休息期限，这是后续主张的依据。单位主张「你早就能上班了」的举证责任在它，但你需要用连续的医疗材料对抗。延长须经劳动能力鉴定委员会确认，流程先向当地社会保险行政部门或拨 12333 问清。停工期满仍需治疗的，继续享受工伤医疗待遇，别以为期满就什么都停了。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"大","口径":"金钱"}},{"节号":13,"节名":"工伤认定与待遇实操","条号":10,"标题":"劳动能力鉴定：申请、60 日结论、15 日再次鉴定","说人话":"伤情稳定后要去做劳动能力鉴定，定出伤残等级——等级直接决定能拿多少一次性补助金。市级 60 天出结论，必要时再延 30 天。不服的从收到结论起 15 天内申请省级再次鉴定，省级就是最终结论。等级差一级差好几个月工资，所以拿到结论当天先记下日期。","适用":"经治疗伤情相对稳定后存在残疾、影响劳动能力。","成本":"不花钱。鉴定不收费，但要准备完整的医疗资料。","收益":"劳动能力鉴定由用人单位、工伤职工或者其近亲属向设区的市级劳动能力鉴定委员会提出申请，并提供工伤认定决定和职工工伤医疗的有关资料。设区的市级劳动能力鉴定委员会应当自收到申请之日起 60 日内作出鉴定结论，必要时可以延长 30 日。申请鉴定的单位或者个人对结论不服的，可以在收到结论之日起 15 日内向省级劳动能力鉴定委员会提出再次鉴定申请，省级结论为最终结论。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）第二十一条、第二十三条、第二十五条、第二十六条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"中——工伤认定决定、病历、诊断证明、影像报告等医疗资料需要自己整理留档","地域":"全国；受理机关为设区的市级劳动能力鉴定委员会，再次鉴定由省级委员会办理","时效":"程序时效——市级自收到申请之日起 60 日内出结论（可延长 30 日）；不服的 15 日内申请再次鉴定。起算点——15 日自收到鉴定结论之日起算，不是作出之日。例外——省级劳动能力鉴定委员会的结论为最终结论。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本）","核对日期":"2026-10-03","备注":"15 日从「收到」起算——签收当天就在日历上标出来。劳动功能障碍分十个伤残等级（最重一级、最轻十级），生活自理障碍分三个等级（第二十二条），等级与待遇的对应关系见 13.12、13.13。鉴定结论应当及时送达申请鉴定的单位和个人（第二十五条第二款），没收到的要主动索取。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"健康"}},{"节号":13,"节名":"工伤认定与待遇实操","条号":11,"标题":"伤残情况变化：鉴定结论作出 1 年后可申请复查鉴定","说人话":"伤残等级不是定死的。结论出来满一年后，如果伤情明显变化（比如恢复得更好，或者出现并发症导致更重），可以申请复查鉴定调整等级。注意是「满一年后」才能申请，不是随时。复查鉴定的办理期限和初次一样。","适用":"已经评定伤残等级，之后伤情明显好转或恶化。","成本":"不花钱。需要重新收集医疗材料。","收益":"自劳动能力鉴定结论作出之日起 1 年后，工伤职工或者其近亲属、所在单位或者经办机构认为伤残情况发生变化的，可以申请劳动能力复查鉴定。复查鉴定的期限依照第二十五条第二款的规定执行（即 60 日内作出结论，必要时可延长 30 日）。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）第二十八条、第二十九条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"中——前后两次鉴定的医疗材料需完整留存，特别是影像与诊断证明的对比","地域":"全国；复查鉴定由设区的市级劳动能力鉴定委员会办理","时效":"程序时效——自鉴定结论作出之日起 1 年后可申请；复查鉴定结论 60 日内作出（可延长 30 日）。起算点——自原鉴定结论作出之日。例外——无特别时效豁免，但满一年是申请的起点，之后未设期限。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本）","核对日期":"2026-10-03","备注":"医疗材料要留一套复印件——复查鉴定靠的是前后对比，缺原始材料就无法证明「变化」。等级调整会改变一次性伤残补助金与伤残津贴（若已按前次等级领取，调整后的差额处理需另行核定），具体经办向当地社保经办机构或拨 12333 确认。第 8 节第 8.9 条写了鉴定与再次鉴定的完整流程。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"健康"}},{"节号":13,"节名":"工伤认定与待遇实操","条号":12,"标题":"一次性伤残补助金：1–10 级对应 27 到 7 个月本人工资","说人话":"伤残等级一到十级，一次性补助金对应 27 个月递减到 7 个月的本人工资。这笔钱由工伤保险基金出。等级差一级差好几个月工资，所以对鉴定结论不服要及时申请再次鉴定（13.10）。","适用":"已评定伤残等级，按等级领取一次性伤残补助金。","成本":"不花钱。核对等级与「本人工资」基数。","收益":"一次性伤残补助金标准——一级 27 个月、二级 25 个月、三级 23 个月、四级 21 个月（第三十五条）；五级 18 个月、六级 16 个月（第三十六条）；七级 13 个月、八级 11 个月、九级 9 个月、十级 7 个月的本人工资（第三十七条）。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）第三十五条第一款第一项、第三十六条第一款第一项、第三十七条第一款第一项、第六十四条第二款","效力位阶":"行政法规","主张强度":"可主张","举证难度":"易——伤残等级由鉴定结论确定，标准由条例明文规定，属官方核定渠道","地域":"全国","时效":"程序时效——由工伤保险基金按核定发放；对核定的待遇有异议可申请行政复议（60 日）或提起行政诉讼（六个月）。起算点——自知道核定结果之日。例外——无特别时效豁免。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本）","核对日期":"2026-10-03","备注":"「本人工资」指工伤职工因工作遭受事故伤害或者患职业病前 12 个月平均月缴费工资；高于统筹地区职工平均工资 300% 的按 300% 计算，低于 60% 的按 60% 计算（第六十四条第二款）。所以单位低报缴费基数会直接压低这一笔钱——在职期间核对缴费基数（见第 7 节第 7.1 条）在这里兑现。核定结果拿到后自己按等级和基数算一遍。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"大","口径":"金钱"}},{"节号":13,"节名":"工伤认定与待遇实操","条号":13,"标题":"一至四级伤残：按月伤残津贴＋生活护理费，退休后转养老金","说人话":"一到四级是最重的档：不用上班，劳动关系保留。一次性给一笔，之后每月发伤残津贴（本人工资的 75% 到 90%），比当地最低工资低的部分基金补上。退休后转领养老金，养老金比伤残津贴少的部分基金补差额。需要人护理的，另有一笔按月的生活护理费。这几笔分别核定，别混成一笔。","适用":"被鉴定为一至四级伤残。","成本":"不花钱。核对伤残津贴与护理费的核定。","收益":"保留劳动关系，退出工作岗位，享受：① 一次性伤残补助金（21 至 27 个月本人工资）；② 从工伤保险基金按月支付伤残津贴，标准为本人工资的一级 90%、二级 85%、三级 80%、四级 75%，伤残津贴实际金额低于当地最低工资标准的由工伤保险基金补足差额；③ 达到退休年龄并办理退休手续后停发伤残津贴，按国家有关规定享受基本养老保险待遇，基本养老保险待遇低于伤残津贴的由工伤保险基金补足差额。经劳动能力鉴定委员会确认需要生活护理的，另有生活护理费，按统筹地区上年度职工月平均工资的 50%（完全不能自理）、40%（大部分不能自理）、30%（部分不能自理） 按月支付。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）第三十五条、第三十四条、第四十条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"易——伤残等级与「本人工资」基数为核定依据，属官方渠道","地域":"全国；生活护理费基数随统筹地区上年度职工月平均工资变动","时效":"程序时效——由工伤保险基金按月发放；对核定待遇有异议可申请行政复议（60 日）或提起行政诉讼（六个月）。起算点——自知道核定结果之日。例外——伤残津贴、供养亲属抚恤金、生活护理费由统筹地区社会保险行政部门适时调整（第四十条）。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本）","核对日期":"2026-10-03","备注":"一至四级伤残职工由用人单位和职工个人以伤残津贴为基数缴纳基本医疗保险费（第三十五条第四款）——基数低意味着医保缴费低，这一点要注意。三笔钱的性质不同：一次性伤残补助金一次性给付、伤残津贴按月、生活护理费需经鉴定委员会确认后按月。第 5 节第 5.21 条从「离职与补偿」角度写过同一档待遇。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"大","口径":"金钱"}},{"节号":13,"节名":"工伤认定与待遇实操","条号":14,"标题":"五至六级伤残：安排工作或按月发伤残津贴，本人可提出解除","说人话":"五到六级伤残，公司要给你安排能干的工作；安排不了的，由公司按月发伤残津贴（本人工资的 60% 或 70%），并且要继续给你缴社保，低于最低工资的部分公司补。注意这一档解除要由你本人提出，解除时另有两笔补助（基金出一笔、公司出一笔，标准各省定）。","适用":"被鉴定为五级或六级伤残。","成本":"不花钱。核对单位是否安排了适当工作。","收益":"五级、六级伤残享受：① 一次性伤残补助金（五级 18 个月、六级 16 个月本人工资）；② 保留与用人单位的劳动关系，由用人单位安排适当工作；难以安排工作的，由用人单位按月发给伤残津贴，标准为五级 70%、六级 60% 的本人工资，并由用人单位按规定为其缴纳各项社会保险费，伤残津贴实际金额低于当地最低工资标准的由用人单位补足差额。经工伤职工本人提出，该职工可以与用人单位解除或者终止劳动关系，由工伤保险基金支付一次性工伤医疗补助金，由用人单位支付一次性伤残就业补助金（具体标准由省级政府规定）。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）第三十六条","效力位阶":"行政法规","主张强度":"可推定","举证难度":"中——伤残等级与工伤认定材料自己留存；「难以安排工作」的事实由双方各自举证","地域":"全国；一次性工伤医疗补助金与一次性伤残就业补助金标准由省级政府规定，省际差异大","时效":"程序时效——工伤待遇争议走仲裁，时效一年；对核定待遇有异议可申请行政复议（60 日）或提起行政诉讼（六个月）。起算点——伤残津贴自核定之日；两笔补助金自劳动关系解除或终止之日。例外——无特别时效豁免。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本）","核对日期":"2026-10-03","备注":"不确定点在两笔补助金的省级标准（条例只授权未给数字），必须查工作地所在省现行规定，可向当地社保经办机构或拨 12333 确认。这一档的解除权在职工本人——条文写的是「经工伤职工本人提出」，单位不能单方以此解除。与七至十级的区别是：七至十级在合同期满终止时也可触发两笔补助（见 5.22），五至六级则以本人提出为前提。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"健康"}},{"节号":13,"节名":"工伤认定与待遇实操","条号":15,"标题":"工亡三笔钱的算法与全国统一口径","说人话":"因工死亡有三笔：丧葬补助金（6 个月当地上年度职工月平均工资）、供养亲属抚恤金（配偶每月 40%、其他亲属每人 30%，总额不超过生前工资）、一次性工亡补助金（上一年度全国城镇居民人均可支配收入的 20 倍）。第三笔是全国统一算法，依据国家统计局公布的全国数据，不是当地数据。","适用":"职工因工死亡，近亲属准备申领待遇。","成本":"不花钱。近亲属需要准备关系证明与材料。","收益":"近亲属从工伤保险基金领取三笔钱：① 丧葬补助金为 6 个月的统筹地区上年度职工月平均工资；② 供养亲属抚恤金按职工本人工资的一定比例发给由其生前提供主要生活来源、无劳动能力的亲属——配偶每月 40%，其他亲属每人每月 30%，孤寡老人或者孤儿每人每月在上述标准的基础上增加 10%，核定的各供养亲属的抚恤金之和不应高于因工死亡职工生前的工资；③ 一次性工亡补助金标准为上一年度全国城镇居民人均可支配收入的 20 倍。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）第三十九条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"中——死亡证明、亲属关系证明、供养关系与无劳动能力证明需要家属收集","地域":"全国；丧葬补助金随统筹地区上年度职工月平均工资变动，一次性工亡补助金按全国城镇居民人均可支配收入统一计算","时效":"程序时效——待遇由工伤保险基金核定发放；对核定不服可申请行政复议（60 日）或提起行政诉讼（六个月）。起算点——自知道核定结果之日。例外——伤残职工在停工留薪期内因工伤导致死亡的，近亲属享受本条规定的待遇。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本，第三十九条）；https://www.gov.cn/lianbo/202601/content_7055181.htm（中国政府网·2025 年居民收入和消费支出情况，城镇居民人均可支配收入 56502 元）；https://www.jyg.gov.cn/rsj/ztzl/shbz/art/2026/art_7bc1fb2986ce4615a0dd0b463f3ea740.html（嘉峪关市人社局·2026 年度一次性工亡补助金标准说明）","核对日期":"2026-10-03","备注":"2026 年度一次性工亡补助金为 1130040 元——计算式为 56502 元 × 20 = 1130040 元。数据链：国家统计局于 2026-01-19 公布 2025 年全国城镇居民人均可支配收入 56502 元；《工伤保险条例》第三十九条定公式为上一年度全国城镇居民人均可支配收入的 20 倍。适用期间为 2026-01-01 至 2026-12-31 期间因工死亡的职工近亲属申领，全国统一标准，不分地域、不分户籍、不分行业。 次年 1 月国家统计局公布新数据后，标准随之上调，主张前请确认适用年度。丧葬补助金则相反，随统筹地区上年度职工月平均工资变动，属地方数据。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"金钱"}},{"节号":13,"节名":"工伤认定与待遇实操","条号":16,"标题":"供养亲属抚恤金：谁能领、领什么条件","说人话":"抚恤金不是所有亲属都有，要同时满足两个条件：一是身份落在八类亲属里，二是靠这位职工生前提供主要生活来源，且符合年龄或丧失劳动能力等具体情形。资格由社保经办机构核定，不是自己判断或单位说了算。","适用":"因工死亡职工的近亲属想申领供养亲属抚恤金，但不清楚自己是否符合条件。","成本":"不花钱。核对身份、年龄与生活来源。","收益":"因工死亡职工供养亲属是指该职工的配偶、子女、父母、祖父母、外祖父母、孙子女、外孙子女、兄弟姐妹。上述人员依靠因工死亡职工生前提供主要生活来源，并有下列情形之一的，可按规定申请供养亲属抚恤金：① 完全丧失劳动能力的；② 工亡职工配偶男年满 60 周岁、女年满 55 周岁的；③ 工亡职工父母男年满 60 周岁、女年满 55 周岁的；④ 工亡职工子女未满 18 周岁的；⑤ 工亡职工父母均已死亡，其祖父、外祖父年满 60 周岁，祖母、外祖母年满 55 周岁的；⑥ 工亡职工子女已经死亡或完全丧失劳动能力，其孙子女、外孙子女未满 18 周岁的；⑦ 工亡职工父母均已死亡或完全丧失劳动能力，其兄弟姐妹未满 18 周岁的。领取抚恤金的人员有下列情形之一的，停止享受抚恤金待遇；被判刑收监执行期间也停止享受，刑满释放仍符合领取资格的可按规定标准享受。供养亲属的资格由统筹地区社会保险经办机构核定。","依据":"《因工死亡职工供养亲属范围规定》（劳动和社会保障部令第 18 号）第二条、第三条、第四条、第五条、第六条","效力位阶":"部门规章","主张强度":"可主张","举证难度":"中——亲属关系证明、年龄证明、主要生活来源证明、丧失劳动能力的鉴定材料需家属收集","地域":"全国；资格由统筹地区社会保险经办机构核定","时效":"程序时效——待遇由社会保险经办机构核定；对核定不服可申请行政复议（60 日）或提起行政诉讼（六个月）。起算点——自知道核定结果之日。例外——领取资格发生变化（如子女满 18 周岁、配偶再婚等）时应停止享受，需及时申报。","来源":"https://www.gov.cn/zhengce/2022-08/31/content_5711291.htm（中国政府网人力资源和社会保障部栏目·因工死亡职工供养亲属范围规定全文）","核对日期":"2026-10-03","备注":"「依靠因工死亡职工生前提供主要生活来源」是独立的实质条件，仅符合年龄条件并不够。该规定第一条援引的「《工伤保险条例》第三十七条第一款第二项」是 2010 年修订前的条号，现行本对应第三十九条第一款第二项——这是该规章文本自身的沿革痕迹，不是引用错误，核条文时以现行条例的条号为准。资格核定与材料清单向参保地社保经办机构或拨 12333 确认。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"金钱"}},{"节号":13,"节名":"工伤认定与待遇实操","条号":17,"标题":"单位没缴工伤保险：全部待遇由单位按条例标准支付","说人话":"公司没给你缴工伤保险，你出了工伤，本来该基金出的钱全部由公司按同一套标准自己掏——待遇标准不变，但付款人从基金变成了公司。这时候公司有没有偿付能力就成了真问题，所以能走认定就先走认定，把责任和数额固定下来。","适用":"发生工伤，但单位没有依法参加工伤保险。","成本":"时间——待遇争议走仲裁，一般几个月；若单位无力支付，执行也可能耗时。","收益":"用人单位应当参加工伤保险而未参加的，由社会保险行政部门责令限期参加、补缴应当缴纳的工伤保险费，并自欠缴之日起按日加收万分之五的滞纳金；逾期仍不缴纳的，处欠缴数额 1 倍以上 3 倍以下的罚款。应当参加工伤保险而未参加的用人单位职工发生工伤的，由该用人单位按照条例规定的工伤保险待遇项目和标准支付费用。 用人单位参加工伤保险并补缴费用、滞纳金后，由工伤保险基金和用人单位依照条例规定支付新发生的费用。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）第六十二条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"中——工伤认定材料需自己准备；参保状态可自行查询","地域":"全国；一次性工伤医疗补助金、一次性伤残就业补助金标准由省级政府规定","时效":"程序时效——工伤认定申请单位 30 日内、劳动者一方 1 年内；待遇争议走仲裁，时效一年。起算点——工伤认定自事故伤害发生之日；待遇争议自知道权利被侵害之日。例外——单位补缴后只有「新发生的费用」由基金分担，此前已发生的仍由单位承担。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本）","核对日期":"2026-10-03","备注":"先做工伤认定，别先谈钱——认定结论是后面所有主张的地基，没有它连数额都算不出来。单位拒付的走仲裁；若单位确实无力支付，可考虑在执行阶段申请查询其财产，具体路径咨询当地人民法院立案窗口或法律援助机构。入职当月查一次参保状态（见第 3 节第 3.2 条）能提前发现这个问题。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"健康"}},{"节号":13,"节名":"工伤认定与待遇实操","条号":18,"标题":"非法用工单位伤亡人员：一次性赔偿，标准高于工伤保险待遇","说人话":"在一家本身就不合法的单位受了伤（没执照、被吊销、或者用了童工），走的不是工伤保险流程，而是「一次性赔偿」——标准比工伤保险待遇还高，因为按上年度职工年平均工资的倍数算，而且治疗期间的生活费、医疗费全由单位付。单位拒不支付的，可以向人社行政部门举报。","适用":"无营业执照、未经依法登记备案、或营业执照被吊销撤销的单位发生伤亡事故；或者用人单位使用童工造成伤残、死亡。","成本":"时间——争议按劳动争议处理，一般几个月；金钱——仲裁不收费。","收益":"一次性赔偿包括治疗期间的费用和一次性赔偿金。一次性赔偿金按等级支付：一级伤残为赔偿基数的 16 倍、二级 14 倍、三级 12 倍、四级 10 倍、五级 8 倍、六级 6 倍、七级 4 倍、八级 3 倍、九级 2 倍、十级 1 倍；赔偿基数指单位所在工伤保险统筹地区上年度职工年平均工资。造成死亡的，按上一年度全国城镇居民人均可支配收入的 20 倍支付一次性赔偿金，并按上一年度全国城镇居民人均可支配收入的 10 倍一次性支付丧葬补助等其他赔偿金。 治疗期间的生活费按统筹地区上年度职工月平均工资标准确定，医疗费、护理费、住院伙食补助费及交通费按《工伤保险条例》规定的标准和范围确定，全部由所在单位支付。","依据":"《非法用工单位伤亡人员一次性赔偿办法》（人力资源和社会保障部令第 9 号，2011-01-01 施行）第二条、第三条、第四条、第五条、第六条、第七条、第八条","效力位阶":"部门规章","主张强度":"可主张","举证难度":"中——需证明用工事实与伤亡事实；「非法用工单位」的主体状态可通过企业信用信息公示系统自行查询","地域":"全国；赔偿基数取单位所在工伤保险统筹地区上年度职工年平均工资","时效":"程序时效——单位拒不支付的，可向人力资源和社会保障行政部门举报，由其责令限期改正；就赔偿数额发生争议的按劳动争议处理，仲裁时效一年。起算点——自伤残鉴定或死亡之日；仲裁自知道权利被侵害之日。例外——无特别时效豁免。","来源":"https://www.gov.cn/zhengce/2022-08/31/content_5711332.htm（中国政府网人力资源和社会保障部栏目·非法用工单位伤亡人员一次性赔偿办法全文）","核对日期":"2026-10-03","备注":"这一条针对的是主体本身不合法的用工，与 13.17（单位合法但未参保）是两种不同情形，不要混用。核实单位主体状态可用国家企业信用信息公示系统——查不到登记信息、或状态显示吊销，就可能落入本办法。先固定用工事实（工资支付记录、工作安排记录、在场人证言），这一步比算赔偿数额更关键。举报与争议处理渠道向当地人力资源社会保障部门或拨 12333 确认。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"金钱"}},{"节号":13,"节名":"工伤认定与待遇实操","条号":19,"标题":"工伤复发的待遇：确认需要治疗的，按原待遇处理","说人话":"工伤治好了之后又复发，只要经确认需要治疗，就还按工伤待遇走：医疗费、辅助器具、停工留薪期都恢复。关键动作是「确认」——要有医疗机构的诊断和相应程序的确认，不能自己觉得复发了就直接去治然后要报销。","适用":"工伤职工工伤复发，需要再次治疗。","成本":"不花钱。需要经确认程序。","收益":"工伤职工工伤复发，确认需要治疗的，享受本条例第三十条（工伤医疗待遇）、第三十二条（辅助器具配置）、第三十三条（停工留薪期）规定的工伤待遇。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）第三十八条","效力位阶":"行政法规","主张强度":"可推定","举证难度":"中——复发的医疗诊断、与原工伤的关联性材料需自己留存；「确认」程序由经办机构或鉴定机构掌握","地域":"全国；确认程序的具体办理由统筹地区规定","时效":"程序时效——待遇争议走仲裁，时效一年；对核定不服可申请行政复议（60 日）或提起行政诉讼（六个月）。起算点——自知道核定结果之日。例外——无特别时效豁免。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本）","核对日期":"2026-10-03","备注":"不确定点在「确认需要治疗」的具体程序——由谁确认、需要哪些材料，条例未细化，各地经办规程不同，需向参保地社保经办机构或拨 12333 确认。关键材料是「与原工伤的关联性」：初次的工伤认定决定书、历次病历、影像资料要完整保留，缺了这些很难证明复发与工伤的因果链。复发治疗期间同样适用停工留薪期（原工资福利待遇不变，见 13.9）。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"健康"}},{"节号":13,"节名":"工伤认定与待遇实操","条号":20,"标题":"辅助器具配置：经确认后费用由基金支付","说人话":"工伤后需要装假肢、配轮椅这类辅助器具的，先经劳动能力鉴定委员会确认，确认后费用按国家标准由工伤保险基金出。两个要点：先确认再配置（先自己买了再申请报销可能不被支持），以及按国家标准（超标准的部分基金不一定出）。","适用":"因日常生活或者就业需要，需要安装假肢、矫形器、假眼、假牙、配置轮椅等辅助器具。","成本":"不花钱。需要经劳动能力鉴定委员会确认。","收益":"工伤职工因日常生活或者就业需要，经劳动能力鉴定委员会确认，可以安装假肢、矫形器、假眼、假牙和配置轮椅等辅助器具，所需费用按照国家规定的标准从工伤保险基金支付。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）第三十二条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"中——确认文件与配置票据需自己留存；「国家规定的标准」需向经办机构核实具体目录与限额","地域":"全国；辅助器具目录与费用标准的具体执行由统筹地区规定","时效":"程序时效——费用由基金按规定支付；对核定不服可申请行政复议（60 日）或提起行政诉讼（六个月）。起算点——自知道核定结果之日。例外——无特别时效豁免。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本）","核对日期":"2026-10-03","备注":"顺序很重要：先申请确认，再配置。自行先行配置再申请报销的，可能因不符合程序而不被支持。具体目录、限额与经办流程向参保地社保经办机构或拨 12333 确认。工伤复发需要重新配置的，适用 13.19 的复发待遇规则（第三十八条明确援引第三十二条）。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"中","口径":"健康"}},{"节号":13,"节名":"工伤认定与待遇实操","条号":21,"标题":"工伤待遇的停止情形：三种情形下停发","说人话":"三件事会让待遇停掉：条件没了（例如供养亲属不符合条件了）、不去做劳动能力鉴定、拒绝治疗。第②③项是「不配合」导致的，所以别因为跟公司或经办机构有矛盾就拒绝配合程序——那会直接停掉你自己的待遇。","适用":"正在享受工伤保险待遇，想确认哪些情况会导致停发。","成本":"不花钱。核对自身状态。","收益":"工伤职工有下列情形之一的，停止享受工伤保险待遇：① 丧失享受待遇条件的；② 拒不接受劳动能力鉴定的；③ 拒绝治疗的。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）第四十二条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"中——「是否拒不接受」「是否拒绝治疗」的事实认定在经办机构；相关通知与沟通记录需自己留存","地域":"全国；停发决定的作出与救济由统筹地区规定","时效":"程序时效——对停发决定不服可申请行政复议（60 日）或提起行政诉讼（六个月）。起算点——自知道停发决定之日。例外——无特别时效豁免。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本）","核对日期":"2026-10-03","备注":"对程序有异议，走异议渠道，不要用「不配合」表达——这与第 13.7 条的复议诉讼路径是两回事：前者是就决定提出异议，后者会直接导致停发。收到要求鉴定的通知而你认为不合理的，书面回复说明理由并要求复核，把配合动作做足，同时留痕。","成本标签":{"钱":"0","时间":"少","毅力":"些","收益":"中","口径":"健康"}},{"节号":13,"节名":"工伤认定与待遇实操","条号":22,"标题":"劳动能力鉴定的标准依据：伤残等级怎么定出来","说人话":"伤残等级不是凭感觉定的，有专门的国家标准（《劳动能力鉴定 职工工伤与职业病致残等级》）。分十级，一级最重、十级最轻；生活自理障碍另分三档。了解标准的意义在于：拿到鉴定结论后可以对照标准看等级是否合理，觉得偏低就及时申请再次鉴定。","适用":"想了解伤残等级是按什么标准评定的。","成本":"不花钱。可查询标准文本。","收益":"劳动能力鉴定是指劳动功能障碍程度和生活自理障碍程度的等级鉴定；劳动功能障碍分为十个伤残等级（最重的为一级，最轻的为十级）；生活自理障碍分为三个等级（生活完全不能自理、生活大部分不能自理、生活部分不能自理）。劳动能力鉴定标准由国务院社会保险行政部门会同国务院卫生行政部门等部门制定。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）第二十二条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"易——鉴定标准为公开的国家标准，等级由鉴定结论确定","地域":"全国；鉴定标准全国统一，具体适用中的裁量在鉴定委员会","时效":"程序时效——对市级鉴定结论不服的，15 日内申请省级再次鉴定；鉴定结论作出 1 年后可申请复查鉴定。起算点——自收到鉴定结论之日（再次鉴定）。例外——省级结论为最终结论。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本，第二十二条）","核对日期":"2026-10-03","备注":"具体的致残等级国家标准（GB/T 16180）本轮未打开官方标准页核对，故本条只写条例第二十二条确定的等级框架（十级＋三档护理），不写标准编号与具体条款。需要对照标准核对等级时，可向当地劳动能力鉴定委员会索取适用标准，或在国家标准全文公开系统检索。再次鉴定的时限见 13.10。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"中","口径":"健康"}},{"节号":13,"节名":"工伤认定与待遇实操","条号":23,"标题":"职工被派遣出境工作：国内工伤保险关系的中止与保留","说人话":"被派到境外工作，按当地法律必须参加当地工伤保险的，国内那份就中止；参加不了的，国内这份继续有效。所以出境前要问清两件事：目的地是否强制当地参保？如果不能参加，国内关系是否还在？这直接决定出事之后找谁赔。","适用":"被派遣出境工作，或跨境用工场景下发生工伤。","成本":"不花钱。需要确认目的地的参保要求。","收益":"职工被派遣出境工作，依据前往国家或者地区的法律应当参加当地工伤保险的，参加当地工伤保险，其国内工伤保险关系中止；不能参加当地工伤保险的，其国内工伤保险关系不中止。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）第四十四条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"中——派遣文件、目的地的参保要求材料需自己留存；国内关系是否中止需向参保地经办机构核实","地域":"全国；目的地的工伤保险制度差异很大，需按当地法律判断","时效":"程序时效——待遇争议走仲裁，时效一年；对核定不服可申请行政复议（60 日）或提起行政诉讼（六个月）。起算点——自知道核定结果之日。例外——无特别时效豁免。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本）","核对日期":"2026-10-03","备注":"出境前用书面方式确认参保安排：要求单位书面说明目的地是否参保、国内关系如何处理，并留存。这条的实操难点在于跨境事实取证与法律适用，涉及具体案件建议咨询执业律师；国内参保关系状态的核实可向参保地社保经办机构或拨 12333 确认。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"中","口径":"健康"}},{"节号":13,"节名":"工伤认定与待遇实操","条号":24,"标题":"再次发生工伤：按新认定的伤残等级享受伤残津贴","说人话":"同一个人再次发生工伤，不是把两次的等级相加，而是按新认定的伤残等级来享受伤残津贴。所以第二次伤害要重新走一遍工伤认定与劳动能力鉴定流程——原来的认定结论不能直接套用在新伤害上。","适用":"工伤职工在伤愈后再次发生工伤。","成本":"不花钱。需要就新的伤害重新走认定与鉴定程序。","收益":"职工再次发生工伤，根据规定应当享受伤残津贴的，按照新认定的伤残等级享受伤残津贴待遇。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）第四十五条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"中——第二次伤害的事故证明与诊疗记录需单独收集并重新申请认定","地域":"全国","时效":"程序时效——第二次工伤的认定申请同样适用单位 30 日、劳动者一方 1 年的时限。起算点——自第二次事故伤害发生之日或被诊断、鉴定为职业病之日。例外——特殊情况经报社会保险行政部门同意可适当延长。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本）","核对日期":"2026-10-03","备注":"第二次工伤要单独申请认定，别以为档案里已经有工伤记录就自动延伸。每次事故独立起算 30 日／1 年。第一次的认定材料与鉴定结论要保存好，用于比对与说明既往伤情。具体经办与津贴计算向参保地社保经办机构或拨 12333 确认。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"中","口径":"健康"}},{"节号":13,"节名":"工伤认定与待遇实操","条号":25,"标题":"职业病诊断地三选一，诊断与鉴定费用由单位承担","说人话":"职业病诊断不用回公司所在地，三个地方任选：公司所在地、你的户籍地、你的经常居住地。诊断机构不能拒绝你，而且诊断和鉴定的费用由公司承担——不是你掏。","适用":"怀疑患职业病，被单位要求「回公司所在地才能诊断」。","成本":"不花钱。诊断与鉴定费用由用人单位承担。","收益":"劳动者可以在用人单位所在地、本人户籍所在地或者经常居住地依法承担职业病诊断的医疗卫生机构进行职业病诊断。承担职业病诊断的医疗卫生机构不得拒绝劳动者进行职业病诊断的要求。职业病诊断、鉴定费用由用人单位承担。用人单位和医疗卫生机构发现职业病病人或者疑似职业病病人时，应当及时向所在地卫生行政部门和安全生产监督管理部门报告；确诊为职业病的，用人单位还应当向所在地劳动保障行政部门报告。","依据":"《职业病防治法》（2018-12-29 修正）第四十四条、第五十条、第五十三条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——职业史、职业病危害接触史等资料多由用人单位掌握，但有举证规则兜底（见 13.26）","地域":"全国；三地任选的权利由法律明文规定；具体诊断机构名单由省级卫生健康行政部门批准","时效":"程序时效——职业病诊断按诊断机构流程办理；确诊后申请工伤认定适用单位 30 日、劳动者一方 1 年。起算点——自被诊断、鉴定为职业病之日。例外——职业病病人的诊疗、康复费用及伤残后的社会保障按工伤保险规定执行。","来源":"https://wsjkw.sh.gov.cn/fl1/20180525/0012-31403.html（上海市卫生健康委员会·职业病防治法【2018 年修订】全文）","核对日期":"2026-10-03","备注":"确诊职业病后要走工伤认定——职业病属于应当认定为工伤的情形（条例第十四条第四项），认定后按工伤待遇处理，且行政部门对已取得职业病诊断证明书的不再调查核实（条例第十九条第一款），所以诊断环节的攻防最关键。诊断费用由单位承担；被要求自己先垫的，留存票据与要求其承担的书面记录。第 8 节第 8.14 条从制度角度写过同一问题。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"大","口径":"健康"}},{"节号":13,"节名":"工伤认定与待遇实操","条号":26,"标题":"单位不提供职业病诊断资料：诊断机构可结合自述作结论","说人话":"公司不给你提供工作场所的检测资料，不等于诊断做不成——诊断机构可以结合你的临床表现、检查结果和职业史，参考你的自述来下结论。所以你要做的是把自己的职业史写清楚：什么时候在哪个岗位、接触什么、每天多久、有没有防护用品。","适用":"单位拒绝或拖延提供职业病诊断、鉴定所需的资料。","成本":"不花钱。需要自己准备自述材料与旁证。","收益":"用人单位应当如实提供职业病诊断、鉴定所需的劳动者职业史和职业病危害接触史、工作场所职业病危害因素检测结果等资料。用人单位不提供工作场所职业病危害因素检测结果等资料的，诊断、鉴定机构应当结合劳动者的临床表现、辅助检查结果和劳动者的职业史、职业病危害接触史，并参考劳动者的自述、安全生产监督管理部门提供的日常监督检查信息等，作出职业病诊断、鉴定结论。","依据":"《职业病防治法》（2018-12-29 修正）第四十七条、第四十八条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——职业史与接触史的自述材料由自己写，旁证（工友证言、车间照片、岗位记录）需自己收集","地域":"全国","时效":"程序时效——职业病诊断按诊断机构流程办理；确诊后工伤认定适用一年期。起算点——自被诊断、鉴定为职业病之日。例外——对职业病诊断有争议的，可向设区的市级地方人民政府卫生行政部门申请鉴定。","来源":"https://wsjkw.sh.gov.cn/fl1/20180525/0012-31403.html（上海市卫生健康委员会·职业病防治法【2018 年修订】全文）","核对日期":"2026-10-03","备注":"职业史自述越具体越好：入厂时间、岗位名称、接触的化学品或粉尘名称、每天接触时长、防护用品发放情况、同岗位同事人数。旁证同样重要——工友联系方式、车间照片、排班表、工资条上的岗位津贴名目，在职期间就要收集，离职后这些材料都拿不到。诊断争议的鉴定程序可向当地卫生健康行政部门或拨 12333 咨询。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"健康"}},{"节号":13,"节名":"工伤认定与待遇实操","条号":27,"标题":"工伤认定的证据清单：从事故当场开始攒","说人话":"工伤这条链上每一环都要交材料，临时找会误事。按四个环节建档：① 认定环节——事故时间地点与经过的书面记录、诊疗记录、劳动关系材料；② 医疗环节——票据、费用清单、诊断证明、首诊病历；③ 鉴定环节——病历、影像报告、休息建议、工伤认定决定书；④ 待遇环节——核定通知书、发放记录、亲属关系材料（涉及工亡时）。每份材料留复印件，原件交出前先扫描。","适用":"还在工伤处理的早期阶段，想把每个环节要用的材料一次备齐。","成本":"不花钱。需要按环节逐项建档。","收益":"没有可直接援引的条文；本条是分环节的材料清单，其作用是为 13.1（时限）、13.5（申请材料）、13.10（鉴定材料）、13.15（工亡待遇）四条提供支撑材料。","依据":"无明文的全国统一规定；配套依据为《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订）第十七条至第二十条、第三十条、第三十九条","效力位阶":"无明文依据","主张强度":"倡导性","举证难度":"中——材料分布在自己、医院、单位三处，需要在各环节当场索取并留存","地域":"全国；各地对材料形式的要求不同","时效":"无特别时效——本条是建档动作，自身不受时效限制。起算点：不适用。例外：各环节的实体申请受各自时限约束（认定一年、再次鉴定 15 日等）。","来源":"无官方一手依据可援引（本条是材料清单）。其配套条文一手页：https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本）。","核对日期":"2026-10-03","备注":"唯一不能延后的一步是「事故当时的记录」——事故经过、在场人、监控时间点，当天不记就补不回来。其余三类材料随流程推进，但每次交材料前先复印／扫描留底，原件交出去往往要不回来。涉及工亡的，亲属关系材料要提前准备（见 13.16）。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"大","口径":"健康"}},{"节号":13,"节名":"工伤认定与待遇实操","条号":28,"标题":"工伤待遇算错的复核路径：先核定、再异议、再复议或诉讼","说人话":"觉得算错了，别只在窗口争。路径是：先拿到书面的核定结果，再按条文自己算一遍，算出差异后申请行政复议（60 日）或直接起诉（6 个月）。最容易算错的是「本人工资」——它是前 12 个月平均月缴费工资，不是实发工资，而且有 300%／60% 的上下限；单位低报基数就会压低这一项。","适用":"经办机构核定的工伤待遇数额你认为算错了。","成本":"不花钱。需要自己先按条文算一遍。","收益":"工伤职工或者其近亲属对经办机构核定的工伤保险待遇有异议的，可以依法申请行政复议，也可以依法向人民法院提起行政诉讼（第五十五条第五项）。核定涉及的基数与标准：一次性伤残补助金与伤残津贴按「本人工资」（前 12 个月平均月缴费工资，受统筹地区职工平均工资 300%／60% 上下限约束，第六十四条第二款）；丧葬补助金按 6 个月统筹地区上年度职工月平均工资；一次性工亡补助金按上年度全国城镇居民人均可支配收入的 20 倍（第三十九条）。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）第五十五条第五项、第六十四条第二款、第三十九条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"中——需要核定通知书与自己的工资／缴费记录；两者的差异就是主张的基础","地域":"全国；缴费基数上下限由各统筹地区每年公布","时效":"程序时效——行政复议申请期限 60 日；行政诉讼起诉期限 6 个月。起算点——自知道该行政行为之日（一般以收到核定结果之日起算）。例外——法律规定复议前置的须先经复议，具体以对应法律的规定为准。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本）","核对日期":"2026-10-03","备注":"60 日与 6 个月是上限，超过即丧失救济机会，所以拿到核定结果当天就标出日期。先自己算：把前 12 个月的平均月缴费工资（不是实发工资）拉出来，与统筹地区职工平均工资的 300%／60% 上下限比对，再乘对应月数。缴费基数问题可一并主张（第 7 节第 7.1 条）。核定与复议的具体办理向参保地社保经办机构或拨 12333 确认。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"金钱"}},{"节号":14,"节名":"仲裁与诉讼实操","条号":1,"标题":"立案前先算三件事：时效、请求金额、管辖","说人话":"动手之前算三样：① 时效还剩多久（在职欠薪不受一年限制，离职后一年内必须提）；② 去哪立案（你实际干活的地方或公司所在地，通常选前者）；③ 每条请求要多少钱（必须写具体数字，写「依法裁决」等于没写）。这三样算错一样，后面都白做。","适用":"准备申请劳动仲裁，但还没决定具体怎么写。","成本":"不花钱。花一两个小时把三件事算清。","收益":"时效——申请仲裁的时效期间为一年，从知道或应当知道权利被侵害之日起计算；劳动关系存续期间因拖欠劳动报酬发生争议的不受一年限制，劳动关系终止的自终止之日起一年内提出（第二十七条）。管辖——劳动争议由劳动合同履行地或者用人单位所在地的劳动争议仲裁委员会管辖；双方分别申请时由劳动合同履行地管辖（第二十一条）。请求——申请书应当载明仲裁请求和所根据的事实、理由、证据和证据来源（第二十八条）。","依据":"《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第二十一条、第二十七条、第二十八条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——管辖需要用工地点或公司所在地的材料；请求金额需要工资流水与加班记录支撑","地域":"全国；仲裁委员会的受理范围与管辖分工按属地确定","时效":"程序时效——仲裁申请时效一年，可中断、可中止。起算点——自知道或应当知道权利被侵害之日；劳动关系终止的，自终止之日起一年内提出。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年期间的限制。","来源":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（广东省人民政府门户网站·劳动争议调解仲裁法全文，页面来源标注中国人大网）","核对日期":"2026-10-03","备注":"「劳动合同履行地」要用材料固定——合同里约定的工作地点、考勤打卡记录、社保缴费单位、办公地址的邮件签名都能用；长期驻外地的另留租房合同或差旅记录。请求金额宁可逐项列清、不要把多项合成一个总数，否则裁决时无法按项支持。管辖有疑问时向拟申请地的仲裁委员会咨询或拨 12333。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"时间"}},{"节号":14,"节名":"仲裁与诉讼实操","条号":2,"标题":"申请书怎么写：请求逐项列、金额逐项算、事实按时间排","说人话":"申请书三块：请求（每一项写清是什么、多少钱）、事实与理由（按时间顺序写，别写成情绪叙述）、证据清单（哪份材料证明哪一项请求）。副本按对方人数准备——一个被申请人就交一份正本加一份副本。仲裁委一般有模板，去之前先要一份。","适用":"已经确定要申请仲裁，准备动笔写申请书。","成本":"不花钱。写一份完整的申请书，半天到一天。","收益":"申请人申请仲裁应当提交书面仲裁申请，并按照被申请人人数提交副本；仲裁申请书应当载明劳动者的姓名、性别、年龄、职业、工作单位和住所，用人单位的名称、住所和法定代表人或者主要负责人的姓名、职务；仲裁请求和所根据的事实、理由；证据和证据来源、证人姓名和住所。","依据":"《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第二十八条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——证据清单与证据来源需自己整理，每项请求都要能对应到材料","地域":"全国；申请表的格式与受理窗口由当地仲裁委员会规定","时效":"程序时效——仲裁申请时效一年；材料不齐的按仲裁委要求补正。起算点——自知道或应当知道权利被侵害之日。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制。","来源":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（劳动争议调解仲裁法全文，第二十八条）","核对日期":"2026-10-03","备注":"请求金额要能被算式支撑：例如「未休年休假折算 X 元＝折算天数 × 日工资 × 200%」，把算式写进事实与理由。事实按时间线写（入职、约定、发生争议、交涉、离职），每一段后面标注对应证据编号，方便仲裁员对照。副本数量、材料清单、是否需要身份证明材料，先去窗口或拨 12333 问一次。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"金钱"}},{"节号":14,"节名":"仲裁与诉讼实操","条号":3,"标题":"证据怎么组织：按请求分组、按时间排序、编号索引","说人话":"证据不要按「我有啥」排，要按「哪项请求需要什么」排。每项请求配一组证据，组内按时间顺序，全部编号（证据 1、2、3……），并在申请书里写清「证据 3 证明 X 事实」。这样仲裁员看一遍就能对上。别一次交一堆截图让对方自己去猜。","适用":"手里有零散材料，不知道怎么提交给仲裁庭。","成本":"不花钱。整理一次，几小时。","收益":"申请书应当载明证据和证据来源（第二十八条）。主张加班费的，劳动者应就加班事实的存在承担举证责任，有证据证明用人单位掌握加班事实存在的证据而用人单位不提供的，由用人单位承担不利后果（《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》第四十二条）。因用人单位作出的开除、除名、辞退、解除劳动合同、减少劳动报酬、计算劳动者工作年限等决定发生的争议，用人单位负举证责任（同解释第四十四条）。","依据":"《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第二十八条；《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》（法释〔2020〕26 号，2021-01-01 施行）第四十二条、第四十四条","效力位阶":"法律（第四十二条、第四十四条为司法解释）","主张强度":"可主张","举证难度":"中——材料需自己收集与编号；用人单位掌握的部分需在庭审中要求其提交","地域":"全国（该解释为全国统一适用）","时效":"程序时效——仲裁申请时效一年；举证期限按仲裁委指定。起算点——自知道或应当知道权利被侵害之日。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制。","来源":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（劳动争议调解仲裁法全文，第二十八条）；https://www.court.gov.cn/zixun/xiangqing/282121.html（最高人民法院官网·劳动争议解释（一）全文，第四十二条、第四十四条）","核对日期":"2026-10-03","备注":"用人单位掌握的证据要在庭审中明确要求其提交（举证责任规则见第 9 节第 9.9 条），光写进申请书不时不够，要在庭审口头再提一次并要求记入笔录。电子证据保留原始载体——截图之外尽量保留可核验的原始记录（邮件原文件、导出文件），各地对形式要求不同，可向当地劳动人事争议仲裁委员会或拨 12333 确认。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"金钱"}},{"节号":14,"节名":"仲裁与诉讼实操","条号":4,"标题":"追索劳动报酬等案件可申请先予执行","说人话":"如果是因为欠工资、要工伤医疗费、要补偿金而打官司，而且等钱等得急，可以向仲裁庭申请「先予执行」——先裁一部分让法院执行，不用等整个案子裁完。这是给着急用钱的人留的快车道。","适用":"被长期欠薪、需要工伤医疗费或补偿金，生活已经受影响，等不到裁决。","成本":"不花钱。需要提出申请并说明急需情况。","收益":"仲裁庭对追索劳动报酬、工伤医疗费、经济补偿或者赔偿金的案件，根据当事人的申请，可以裁决先予执行，移送人民法院执行。","依据":"《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第四十四条","效力位阶":"法律","主张强度":"可推定","举证难度":"中——需要证明追索事项属于法定范围、且存在急需的实际情况；欠薪记录、医疗费用单据需自己提供","地域":"全国；各地仲裁委对「先予执行」适用条件的把握不同","时效":"程序时效——随仲裁程序提出，不单独计算时效；仲裁申请本身受一年时效限制。起算点——自仲裁申请受理后、裁决作出前提出。例外——无特别时效豁免。","来源":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（劳动争议调解仲裁法全文，第四十四条）","核对日期":"2026-10-03","备注":"不确定点在「先予执行」的裁量条件与执行速度——条文只规定「可以裁决」，是否准予由仲裁庭判断，各地掌握尺度不同，需向当地劳动人事争议仲裁委员会咨询或拨 12333 确认。申请时把「急需」写具体（医疗费单据、家庭固定支出凭证），理由越具体越容易获准。第 9 节第 9.7 条从路径角度写过同一制度。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"大","口径":"金钱"}},{"节号":14,"节名":"仲裁与诉讼实操","条号":5,"标题":"仲裁审理时限：45 日，可延 15 日，逾期可直接起诉","说人话":"从受理到出裁决一般 45 天，复杂的最多再延 15 天，而且延期要经主任批准并书面通知当事人。超过这个期限还没出结果的，可以直接去法院起诉——不用无限期等。","适用":"仲裁申请已受理，想知道多久能有结果。","成本":"不花钱。记下受理日期即可。","收益":"仲裁庭裁决劳动争议案件，应当自劳动争议仲裁委员会受理仲裁申请之日起 45 日内结束；案情复杂需要延期的，经劳动争议仲裁委员会主任批准，可以延期并书面通知当事人，但是延长期限不得超过 15 日。逾期未作出仲裁裁决的，当事人可以就该劳动争议事项向人民法院提起诉讼。","依据":"《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第四十三条","效力位阶":"法律","主张强度":"可主张","举证难度":"易——受理通知书是计算起算点的关键凭证，需留存","地域":"全国","时效":"程序时效——受理之日起 45 日内结束，可延长 15 日；逾期未裁决的可向人民法院起诉。起算点——自劳动争议仲裁委员会受理仲裁申请之日。例外——逾期未作出仲裁裁决的，当事人可以就该劳动争议事项向人民法院提起诉讼。","来源":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（劳动争议调解仲裁法全文，第四十三条）","核对日期":"2026-10-03","备注":"受理通知书要留好，上面有受理日期，是算 45 天与主张「逾期未裁决」的唯一依据。延期须经主任批准并书面通知当事人——没收到书面延期通知的，可以据此主张。第 9 节第 9.6 条写过同一时限，本条补的是「没收到延期通知」这个程序抓手。","成本标签":{"钱":"0","时间":"中","毅力":"否","收益":"中","口径":"时间"}},{"节号":14,"节名":"仲裁与诉讼实操","条号":6,"标题":"庭审怎么说：三段式——事实、请求对应的依据、要求对方举证","说人话":"发言按三段走：① 事实——只讲时间、地点、做了什么、结果是什么，不讲情绪；② 请求对应依据——每项请求说清「根据哪条、算出来是多少」；③ 要求对方举证——凡是「这个决定是公司做的」，当场要求公司说明依据并提交证据，并请书记员记入笔录。第三段很多人不说，白白丢掉举证责任规则带来的优势。","适用":"第一次出庭，不知道从哪说起。","成本":"不花钱。提前写一份发言提纲。","收益":"劳动者主张加班费的，应就加班事实存在承担举证责任，有证据证明用人单位掌握加班事实存在的证据而用人单位不提供的，由用人单位承担不利后果（解释（一）第四十二条）；因用人单位的开除、除名、辞退、解除劳动合同、减少劳动报酬、计算工作年限等决定发生的争议，用人单位负举证责任（第四十四条）。","依据":"《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》（法释〔2020〕26 号，2021-01-01 施行）第四十二条、第四十四条；《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第二十八条","效力位阶":"司法解释（第二十八条为法律）","主张强度":"可主张","举证难度":"中——发言提纲需要提前把每项请求对应的证据与依据排好","地域":"全国（该解释为全国统一适用）","时效":"程序时效——仲裁申请时效一年；庭审按仲裁委通知的时间出席。起算点——自知道或应当知道权利被侵害之日。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制。","来源":"https://www.court.gov.cn/zixun/xiangqing/282121.html（最高人民法院官网·劳动争议解释（一）全文，第四十二条、第四十四条）；http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（劳动争议调解仲裁法全文，第二十八条）","核对日期":"2026-10-03","备注":"发言提纲提前写好并带进庭，现场临时组织容易漏项。举证责任分配是主张才适用的规则，第③段不说就等于放弃。核对笔录：签笔录前逐页看清，特别是自己提的举证要求与对方的陈述，与事实不符的当场要求更正。庭审的回避、延期等程序事项可向当地劳动人事争议仲裁委员会咨询或拨 12333。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"大","口径":"金钱"}},{"节号":14,"节名":"仲裁与诉讼实操","条号":7,"标题":"部分裁决是终局裁决，劳动者不服仍可起诉","说人话":"有些裁决是「终局」的，但不是对你也终局——公司不能再起诉，你作为劳动者不服仍可在收到裁决书 15 天内去法院起诉。反过来，公司想推翻终局裁决只能去中院申请撤销，门槛更高。所以别听到「终局」就以为没救了。","适用":"收到仲裁裁决书，想知道还能不能继续打。","成本":"时间——劳动者起诉的期限是 15 日；金钱——仲裁不收费，诉讼按法院标准交费。","收益":"下列劳动争议，除本法另有规定外，仲裁裁决为终局裁决，裁决书自作出之日起发生法律效力；劳动者对本法第四十七条规定的仲裁裁决不服的，可以自收到仲裁裁决书之日起 15 日内向人民法院提起诉讼；用人单位有证据证明终局裁决存在法定情形的，可以自收到裁决书之日起 30 日内向劳动争议仲裁委员会所在地的中级人民法院申请撤销裁决。对第四十七条规定以外的其他劳动争议案件的仲裁裁决不服的，当事人可以自收到裁决书之日起 15 日内向人民法院提起诉讼；期满不起诉的，裁决书发生法律效力。","依据":"《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第四十七条、第四十八条、第四十九条、第五十条","效力位阶":"法律","主张强度":"可主张","举证难度":"易——裁决书与送达签收记录是判断期限的唯一依据","地域":"全国","时效":"程序时效——劳动者起诉期限 15 日；用人单位申请撤销期限 30 日；非终局裁决的起诉期限 15 日。起算点——自收到仲裁裁决书之日。例外——期满不起诉的，裁决书发生法律效力。","来源":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（劳动争议调解仲裁法全文，第四十七条至第五十条）","核对日期":"2026-10-03","备注":"签收裁决书的日期必须记准——15 日很短。另外，解释（一）第十九条规定：仲裁裁决书未载明该裁决为终局裁决或者非终局裁决，劳动者依据第四十七条第一项追索劳动报酬、工伤医疗费、经济补偿或者赔偿金，如果涉及数项，每项确定的数额均不超过当地月最低工资标准十二个月金额的，应当按照终局裁决处理。终局裁决的具体范围见第四十七条列举，不要凭印象判断。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"中","口径":"金钱"}},{"节号":14,"节名":"仲裁与诉讼实操","条号":8,"标题":"用人单位申请撤销终局裁决：条件与各自路径","说人话":"注意两条路不一样：公司不服终局裁决只能去中院申请撤销，而且必须举证存在法定情形；你作为劳动者不服，直接去法院起诉就行，门槛低得多。所以「终局裁决」这四个字对你不是坏消息。","适用":"单位不服终局裁决去中院申请撤销，你想知道会怎么样。","成本":"时间——撤销程序不停止裁决的执行，但你需应对。","收益":"用人单位有证据证明终局裁决有下列情形之一的，可以自收到仲裁裁决书之日起 30 日内向劳动争议仲裁委员会所在地的中级人民法院申请撤销裁决：适用法律、法规确有错误的；劳动争议仲裁委员会无管辖权的；违反法定程序的；裁决所根据的证据是伪造的；对方当事人隐瞒了足以影响公正裁决的证据的；仲裁员在仲裁该案时有索贿受贿、徇私舞弊、枉法裁决行为的（第四十九条）。法院应当组成合议庭审查核实。劳动者的救济路径不同：劳动者对终局裁决不服的，是直接向人民法院提起诉讼（第四十八条）。","依据":"《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第四十八条、第四十九条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——应对撤销申请需围绕「是否存在法定撤销情形」组织材料","地域":"全国；由劳动争议仲裁委员会所在地的中级人民法院管辖","时效":"程序时效——用人单位申请撤销的期限为 30 日；撤销裁定的作出有法定审限。起算点——自用人单位收到仲裁裁决书之日。例外——第四十九条规定的中院裁定为终审裁定（解释（一）第二十二条）。","来源":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（劳动争议调解仲裁法全文，第四十八条、第四十九条）","核对日期":"2026-10-03","备注":"解释（一）第二十一条另有规则：劳动者依据第四十八条向基层法院起诉、用人单位依据第四十九条向中院申请撤销的，中级人民法院应当不予受理；已经受理的，应当裁定驳回申请。这条在实务中很关键——单位抢先申请撤销的做法不成立。具体程序向受诉人民法院立案窗口咨询。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"中","口径":"金钱"}},{"节号":14,"节名":"仲裁与诉讼实操","条号":9,"标题":"劳动仲裁不收费，但诉讼阶段可能有费用","说人话":"劳动仲裁不收费，这是法律写明的，可以放心。花钱的地方是请律师和（如果走到诉讼）法院的诉讼费。简单、证据清楚的案子（欠薪、二倍工资、年假折算）可以自己办；涉及违法解除定性、竞业限制、工伤等级这类复杂的，再考虑请律师。","适用":"担心打不起官司，想先确认成本。","成本":"金钱——劳动仲裁不收费；如果请律师，费用一般自己承担，不在败诉方负担的范围内；进入诉讼阶段按法院标准可能产生诉讼费。","收益":"劳动争议仲裁不收费。劳动争议仲裁委员会的经费由财政予以保障。","依据":"《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第五十三条","效力位阶":"法律","主张强度":"可主张","举证难度":"易——收费规则由法律明文规定","地域":"全国","时效":"无特别时效——仲裁收费规则本身不涉及时效。起算点：不适用，本条只讲费用。例外：案件实体权利的时效按第 9 节第 9.1 条计算。","来源":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（劳动争议调解仲裁法全文，第五十三条）","核对日期":"2026-10-03","备注":"符合条件的经济困难劳动者可申请法律援助，受理条件与窗口向当地法律援助机构或拨 12333 咨询。自己办的案子照样要把请求与金额写清，仲裁委不会替你算（见 14.2）。第 10 节第 10.10 条从「常见误解」角度写过同一问题。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"中","口径":"金钱"}},{"节号":14,"节名":"仲裁与诉讼实操","条号":10,"标题":"仲裁不公开、诉讼可能公开：隐私与职业影响的取舍","说人话":"仲裁这一环相对封闭，进入法院之后按民事诉讼的一般规则走（公开审理是常态，涉及个人隐私等情形可以申请不公开）。如果案子涉及敏感事实，提前想清楚：哪些事实必须写、哪些可以只写必要部分。这一条我给不了确定结论，各地做法也不同，需要按你所在的仲裁委与法院的实际做法判断。","适用":"担心打官司影响后续求职，想了解信息会不会公开。","成本":"不花钱。做一个取舍判断。","收益":"没有可直接援引的全国统一条文明确「劳动争议仲裁与诉讼的公开范围」。可确证的是程序差异：劳动争议仲裁是前置程序、不收费（第五十三条）；对裁决不服进入人民法院诉讼程序的，适用民事诉讼法关于公开审理的一般规则。","依据":"无明文的全国统一规定（指劳动争议案件的公开范围）。可确证的是《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第五十三条的仲裁不收费规则与第四十七条至第五十条的终局／起诉程序","效力位阶":"无明文依据","主张强度":"倡导性","举证难度":"易——属程序判断，不依赖证据","地域":"全国；与案件是否公开相关的具体把握由各仲裁委与法院掌握","时效":"无特别时效——本条是程序取舍判断。起算点：不适用。例外：实体请求受一年仲裁时效约束。","来源":"「公开范围」无官方一手依据可援引。 尝试过的路径：① 已打开《劳动争议调解仲裁法》官方全文页逐条核对，其中未规定仲裁与诉讼的公开范围；② 检索其他全国性规定未定位到专门条款。故按「无明文依据」处理，仅说明可确证的程序差异。已核对页面：http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（劳动争议调解仲裁法全文）。","核对日期":"2026-10-03","备注":"本条不给结论、不涉及金额，只提示在做维权决定时把「信息暴露」作为一项成本考虑。具体做法（能否申请不公开审理、裁决文书是否上网）向拟申请地的劳动人事争议仲裁委员会或受诉人民法院立案窗口咨询，或拨 12333。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"小","口径":"自由"}},{"节号":14,"节名":"仲裁与诉讼实操","条号":11,"标题":"裁决生效后对方不付钱：申请强制执行","说人话":"对方不付钱，你不需要重新起诉——拿生效的裁决书直接去法院申请强制执行。申请前确认两件事：裁决书已经生效（起诉期届满没人起诉），以及裁决确定的履行期限已经过了。这两条满足了，执行程序就能启动。","适用":"拿到生效的仲裁裁决书，对方在裁决确定的期限内不履行。","成本":"不花钱（申请执行不预交费用，执行费由被执行人负担）。","收益":"发生法律效力的仲裁裁决书、调解书，当事人可以依法向人民法院申请执行。追索劳动报酬、工伤医疗费、经济补偿或者赔偿金的案件，根据当事人申请，仲裁庭可以裁决先予执行，移送人民法院执行（第四十四条）。对仲裁裁决不服的起诉期限届满不起诉的，裁决书发生法律效力（第五十条）。","依据":"《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第四十四条、第五十条；《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》（法释〔2020〕26 号，2021-01-01 施行）第二十四条","效力位阶":"法律（第二十四条为司法解释）","主张强度":"可主张","举证难度":"中——需要生效裁决书与履行期限已过的证明；被执行人财产线索需自行提供或申请法院查询","地域":"全国；执行管辖与流程按民事诉讼法及当地法院规定","时效":"程序时效——申请执行的期限按民事诉讼法关于申请执行期间的规定（一般为二年，自法律文书规定履行期间的最后一日起计算）。起算点——自裁决书确定的履行期间最后一日起算。例外——执行中可申请查询被执行人财产，解释（一）第二十四条还规定了不予执行的法定情形。","来源":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（劳动争议调解仲裁法全文，第四十四条、第五十条）；https://www.court.gov.cn/zixun/xiangqing/282121.html（最高人民法院官网·劳动争议解释（一）全文，第二十四条）","核对日期":"2026-10-03","备注":"申请执行也有期限（一般二年），拿到生效裁决就尽快办，别等到对方转移了财产。被执行人财产线索越具体越好（开户行、经营场所、可查到的登记信息），这比空手申请有效。若被申请人提出不予执行抗辩，解释（一）第二十四条列举了法定情形，可向受诉人民法院咨询。执行程序细节向当地人民法院立案或执行窗口咨询。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"金钱"}},{"节号":14,"节名":"仲裁与诉讼实操","条号":12,"标题":"调解协议与支付令：两条比仲裁快的路","说人话":"有两条比仲裁快的路。一是支付令：前提是已经就欠薪、工伤医疗费、经济补偿或赔偿金达成调解协议而对方不履行——拿调解协议书直接向法院申请支付令，程序比诉讼短。二是调解协议：在调解组织主持下达成的协议有约束力，对方不履行可以直接起诉。两条都要求「事实清楚、对方无实质争议」——如果对方摆明了要争，还是走仲裁更稳。","适用":"对方愿意谈，想找一条比仲裁更快的路径拿到钱。","成本":"不花钱。但两条路都有前提条件。","收益":"支付令——因支付拖欠劳动报酬、工伤医疗费、经济补偿或者赔偿金事项达成调解协议，用人单位在协议约定期限内不履行的，劳动者可以持调解协议书依法向人民法院申请支付令，人民法院应当依法发出支付令（《劳动争议调解仲裁法》第十六条）；申请支付令被裁定终结督促程序后，劳动者依据调解协议直接提起诉讼的，人民法院应予受理（解释（一）第十三条）。调解协议效力——当事人在调解仲裁法第十条规定的调解组织主持下达成的具有劳动权利义务内容的调解协议，具有劳动合同的约束力，可以作为人民法院裁判的根据；仅就劳动报酬争议达成调解协议、用人单位不履行给付义务的，劳动者直接提起诉讼的，人民法院可以按照普通民事纠纷受理（解释（一）第五十一条）。","依据":"《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》（法释〔2020〕26 号，2021-01-01 施行）第十三条、第五十一条；《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第三十条第二款","效力位阶":"司法解释（第三十条为法律）","主张强度":"可推定","举证难度":"中——支付令要求债权债务关系明确；调解协议需在法定调解组织主持下达成并留存书面文本","地域":"全国；督促程序与调解协议的司法确认按民事诉讼法及当地法院规定","时效":"程序时效——支付令按督促程序规定；对调解协议提起诉讼按普通民事纠纷处理，适用三年诉讼时效；劳动仲裁路径仍为一年。起算点——自对方不履行给付义务之日。例外——无特别时效豁免。","来源":"https://www.court.gov.cn/zixun/xiangqing/282121.html（最高人民法院官网·劳动争议解释（一）全文，第十三条、第五十一条）；http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文，第三十条）","核对日期":"2026-10-03","备注":"不确定点在两条路径的适用条件与受理把握——支付令要求债权债务关系明确、无其他债务纠纷，调解协议要求由法定调解组织主持达成，各地法院把握不一，需向当地人民法院立案窗口或劳动人事争议仲裁委员会咨询，也可拨 12333。关键动作是「书面化」：调解一定要留下书面协议并写明给付金额与期限，口头谈成的不具备可执行性。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"金钱"}},{"节号":14,"节名":"仲裁与诉讼实操","条号":13,"标题":"一裁终局的金额线：每项不超过当地月最低工资十二个月","说人话":"终局与否有一条金额线：如果裁决涉及多项，每一项确定的数额都不超过当地月最低工资的 12 倍，就按终局裁决处理。注意是「每一项都」而不是「总数」——所以把请求拆成多项，可能让案子落入终局范围。终局对你不是坏事（你仍可起诉，公司只能申请撤销），但会影响公司的应对方式。","适用":"想知道自己这个案子会不会被认定为终局裁决。","成本":"不花钱。对照当地最低工资标准算一遍。","收益":"仲裁裁决书未载明该裁决为终局裁决或者非终局裁决，劳动者依据第四十七条第一项规定追索劳动报酬、工伤医疗费、经济补偿或者赔偿金，如果仲裁裁决涉及数项，每项确定的数额均不超过当地月最低工资标准十二个月金额的，应当按照终局裁决处理（解释（一）第十九条）。","依据":"《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》（法释〔2020〕26 号，2021-01-01 施行）第十九条；《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第四十七条","效力位阶":"司法解释（第四十七条为法律）","主张强度":"可主张","举证难度":"易——当地月最低工资标准可查，金额线可直接计算","地域":"全国；「当地月最低工资标准」按工作地现行标准，各省分档","时效":"程序时效——劳动者的起诉期限 15 日；用人单位的申请撤销期限 30 日。起算点——自收到仲裁裁决书之日。例外——期满不起诉的裁决书生效。","来源":"https://www.court.gov.cn/zixun/xiangqing/282121.html（最高人民法院官网·劳动争议解释（一）全文，第十九条）；http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（劳动争议调解仲裁法全文，第四十七条）","核对日期":"2026-10-03","备注":"这条金额线的实务意义：请求拆项得当，案子就落入终局范围；拆项过粗（合成一个大数），反而可能超出十二个月金额线而变成非终局。当地最低工资分档数值见第 3 节第 3.7 条引用的全国分省数据。是否终局最终以裁决书的载明为准，第四十七条列举的具体情形也需一并核对。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"中","口径":"时间"}},{"节号":14,"节名":"仲裁与诉讼实操","条号":14,"标题":"仲裁与诉讼的衔接：不服之后去哪一级法院","说人话":"作为劳动者，你不服裁决就是去基层人民法院起诉（第四十八条、第五十条的路径），不是去中院。中院那条路是给用人单位申请撤销终局裁决用的。两条路径不能搞混，去错法院会被裁定驳回、耽误时间。","适用":"对裁决不服，准备起诉，但不知道该去哪个法院。","成本":"不花钱。确认管辖法院后立案。","收益":"劳动者对终局裁决不服的，可以自收到仲裁裁决书之日起 15 日内向人民法院提起诉讼（第四十八条）；对终局裁决以外的其他劳动争议案件的仲裁裁决不服的，当事人可以自收到裁决书之日起 15 日内向人民法院提起诉讼（第五十条）。用人单位申请撤销终局裁决的，向劳动争议仲裁委员会所在地的中级人民法院提出（第四十九条）。","依据":"《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第四十八条、第四十九条、第五十条；《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》（法释〔2020〕26 号，2021-01-01 施行）第二十一条、第二十二条","效力位阶":"法律（第二十一条、第二十二条为司法解释）","主张强度":"可主张","举证难度":"易——裁决书载明的仲裁委所在地决定管辖；起诉期限由签收日出算","地域":"全国；基层法院与中院的案件分工按当地法院规定","时效":"程序时效——劳动者起诉期限 15 日；用人单位申请撤销期限 30 日。起算点——自收到仲裁裁决书之日。例外——中级人民法院作出的驳回申请或撤销裁决的裁定为终审裁定（第二十二条）。","来源":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（劳动争议调解仲裁法全文，第四十八条至第五十条）；https://www.court.gov.cn/zixun/xiangqing/282121.html（最高人民法院官网·劳动争议解释（一）全文，第二十一条、第二十二条）","核对日期":"2026-10-03","备注":"解释（一）第二十一条是实务中很有用的一条：劳动者向基层法院起诉、用人单位同时向中院申请撤销的，中级人民法院应当不予受理；已经受理的，应当裁定驳回申请。所以不必担心对方「抢先撤销」拖住你。受诉法院的立案材料与流程向当地人民法院立案窗口确认。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"中","口径":"时间"}},{"节号":14,"节名":"仲裁与诉讼实操","条号":15,"标题":"监察投诉与仲裁并行：两条路怎么配合","说人话":"两条路可以同时走，目标不同：监察要的是责令改正与行政处罚（也可能促成单位支付），仲裁要的是给你个人的给付。实操配合是：先投诉，让监察出面责令限期支付；如果它仍不付，再加付赔偿金（第 11 节第 11.6 条），同时把仲裁申请递上。注意监察有 2 年查处期限，越早越好。","适用":"想让行政部门先出面施压，同时不完全放弃仲裁。","成本":"不花钱。两条路的材料可以共用一套。","收益":"监察路径——任何组织或者个人对违反劳动保障法律、法规或者规章的行为，有权向劳动保障行政部门举报；对拖欠或未足额支付劳动报酬、拖欠工伤医疗费、经济补偿或者赔偿金的，劳动者可以向劳动行政部门投诉，劳动行政部门应当依法处理（《劳动保障监察条例》第九条、《劳动争议调解仲裁法》第九条）。监察期限——违法行为在 2 年内未被发现也未被举报、投诉的不再查处（《劳动保障监察条例》第二十条）。仲裁路径——一年时效，可中断（《劳动争议调解仲裁法》第二十七条）。","依据":"《劳动保障监察条例》（国务院令第 423 号，2004-12-01 施行）第九条、第二十条；《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第九条、第二十七条","效力位阶":"行政法规（《劳动争议调解仲裁法》条款为法律）","主张强度":"可推定","举证难度":"中——两条路共用同一套证据，但监察侧重违法行为事实、仲裁侧重个人权利受损","地域":"全国；受理机构为用人单位所在地的劳动保障行政部门与劳动人事争议仲裁委员会","时效":"程序时效——监察查处期限 2 年；仲裁时效一年，可中断、可中止。起算点——监察自违法行为发生之日；仲裁自知道或应当知道权利被侵害之日。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年仲裁时效限制。","来源":"https://www.gov.cn/zhengce/zhengceku/2008-03/28/content_7383.htm（中国政府网·劳动保障监察条例全文）；http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（劳动争议调解仲裁法全文，第九条、第二十七条）","核对日期":"2026-10-03","备注":"不确定点在两条路的效果差异与并行节奏——监察不保证拿到个人给付，仲裁不产生行政处罚，各地监察部门的处理力度也不同，故标「可推定」，具体把握向当地人力资源社会保障局劳动保障监察机构或拨 12333 确认。投诉时留一份回执，它既是监察受理的凭证，也是仲裁时效中断的证据（第 9 节第 9.14 条）。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"中","口径":"金钱"}},{"节号":14,"节名":"仲裁与诉讼实操","条号":16,"标题":"举证期限与逾期提交：别把证据留到开庭当天","说人话":"别指望「开庭当天再拿出来」——仲裁委会指定一个举证期限，过了期限提交的材料可能不被采纳。所以立案时就把能交的交齐，确实后补的（例如对方掌握、需申请调取的），在期限内书面提出调取申请并说明理由。","适用":"手里还有一部分材料没交，想确认什么时候必须交。","成本":"不花钱。按仲裁委指定的期限一次交齐。","收益":"没有可直接援引的全国统一条文规定劳动争议仲裁的举证期限与逾期后果；实践中由仲裁委员会指定举证期限，逾期提交可能不被组织质证。可确证的是申请仲裁应当提交书面申请并载明证据和证据来源（第二十八条）。","依据":"无明文的全国统一规定（指举证期限与逾期后果）。可确证的是《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第二十八条关于提交证据及来源的要求；举证责任分配见《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》（法释〔2020〕26 号，2021-01-01 施行）第四十二条、第四十四条","效力位阶":"无明文依据","主张强度":"倡导性","举证难度":"中——需要在立案阶段就把材料整理完毕","地域":"全国；举证期限与逾期处理由各仲裁委员会掌握","时效":"程序时效——按仲裁委指定的举证期限提交；仲裁申请本身受一年时效约束。起算点——自收到受理通知或举证通知之日。例外：无特别时效豁免。","来源":"「举证期限与逾期后果」无官方一手依据可援引。 尝试过的路径：① 已打开《劳动争议调解仲裁法》官方全文页逐条核对，仅第二十八条要求载明证据及来源，未规定举证期限与逾期后果；② 检索其他全国性规定未定位到专门条款。故按「无明文依据」处理。已核对页面：http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（劳动争议调解仲裁法全文）；https://www.court.gov.cn/zixun/xiangqing/282121.html（劳动争议解释（一）全文）。","核对日期":"2026-10-03","备注":"本条不给期限数字（具体期限由仲裁委指定），只提醒「一次交齐」这一动作。受理时问清举证期限并记下日期，这是本条唯一能落地的操作。逾期提交是否被采纳由仲裁委掌握，可向当地劳动人事争议仲裁委员会或拨 12333 确认本地做法。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"中","口径":"时间"}},{"节号":14,"节名":"仲裁与诉讼实操","条号":17,"标题":"仲裁申请可以撤回，撤回后时效怎么算","说人话":"撤回申请之后时效重新起算——因为申请仲裁这个动作本身已经让时效中断了。但别把这条当成可以无限拖的理由：中断的证据（申请回执、受理通知、撤回裁定）要留好，而且重新申请要重新排队。如果只是想边谈边保留压力，撤回不是唯一选项——可以申请延期开庭或调解。","适用":"已经立案，但想先跟对方谈，考虑撤回申请。","成本":"不花钱。撤回后重新申请需要重新走流程。","收益":"没有可直接援引的全国统一条文规定劳动争议仲裁撤回申请后时效如何计算。可确证的是时效中断规则：仲裁时效因当事人一方向对方当事人主张权利，或者向有关部门请求权利救济，或者对方当事人同意履行义务而中断，从中断时起重新计算（第二十七条第二款）——提起仲裁申请本身属于「向有关部门请求权利救济」。","依据":"无明文的全国统一规定（指撤回申请后时效的具体计算）。可确证的是《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第二十七条第二款的中断规则","效力位阶":"无明文依据","主张强度":"倡导性","举证难度":"中——中断证据（申请回执、受理通知、撤回裁定）需留存","地域":"全国；撤回与再申请的具体程序由各仲裁委员会掌握","时效":"程序时效——一年，可中断、可中止。起算点——自中断事由发生之日重新起算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制。","来源":"「撤回后时效计算」无官方一手依据可援引。 尝试过的路径：① 已打开《劳动争议调解仲裁法》官方全文页核对第二十七条，其中只规定中断与中止的一般规则，未专门规定撤回后的时效计算；② 检索其他全国性规定未定位到专门条款。故按「无明文依据」处理，只写可确证的中断规则。已核对页面：http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（劳动争议调解仲裁法全文，第二十七条）。","核对日期":"2026-10-03","备注":"本条不给「撤回了就一定安全」的结论。关键动作是留存中断证据：申请回执、受理通知书、撤回裁定各留一份，将来主张时效重新计算时用得上。是否撤回、撤回后能否立即再申请，向当地劳动人事争议仲裁委员会咨询或拨 12333。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"中","口径":"时间"}},{"节号":14,"节名":"仲裁与诉讼实操","条号":18,"标题":"申请仲裁前先做一次「请求—证据—金额」三栏对表","说人话":"做一张三栏表：左栏每一项请求（含算式与金额）；中栏支撑这项请求的证据编号；右栏法律依据（哪条哪款）。三栏里任何一栏空的，就说明那一项要么缺证据、要么缺依据，要么不该提。表做完再审一遍：金额有没有重复计算、请求之间有没有互相矛盾。","适用":"材料已经收集得差不多，准备正式提交。","成本":"不花钱。花一两个小时对表。","收益":"没有可直接援引的条文；本条是一份自查方法。其法律作用是把《劳动争议调解仲裁法》第二十八条要求的「仲裁请求＋事实理由＋证据及来源」三要素做成可核对的表格，避免请求与证据脱节。","依据":"无明文的全国统一规定；配套依据为《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第二十八条关于申请书应载明仲裁请求、事实理由、证据及来源的要求","效力位阶":"无明文依据","主张强度":"倡导性","举证难度":"中——三栏对表要求每项请求都能落到证据与条号","地域":"全国；各处对申请书的格式要求不同","时效":"无特别时效——本条是提交前的自查方法。起算点：不适用。例外：各请求受一年仲裁时效约束（第 9 节第 9.1 条）。","来源":"无官方一手依据可援引（本条是自查方法）。其配套条文一手页：http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（劳动争议调解仲裁法全文，第二十八条）。","核对日期":"2026-10-03","备注":"最常见的两个错误都出在这张表上：一是请求金额没有算式（仲裁员无法支持），二是多个请求重复计算同一笔钱（例如把「被迫解除经济补偿」和「违法解除赔偿金」同时列为请求）。第 14.2 条写了申请书的写法，本条是提交前的最后一道自查。具体格式要求向当地劳动人事争议仲裁委员会或拨 12333 确认。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"金钱"}},{"节号":14,"节名":"仲裁与诉讼实操","条号":19,"标题":"仲裁员的回避与程序异议","说人话":"觉得承办人跟对方有关系、或者程序上不对，当场提出来——回避申请可以口头也可以书面。这类异议过了这一庭再提效力就弱很多。另一类程序异议（例如没收到延期通知、举证期限没通知）也要在庭审中当庭提出并请书记员记入笔录。","适用":"认为承办人员与对方有利害关系，或认为程序有问题。","成本":"不花钱。需要在庭审中及时提出。","收益":"《劳动争议调解仲裁法》第三十三条规定仲裁员有下列情形之一的应当回避，当事人也有权以口头或者书面方式申请其回避：是本案当事人或者当事人、代理人的近亲属的；与本案有利害关系的；与本案当事人、代理人有其他关系，可能影响公正裁决的；私自会见当事人、代理人，或者接受当事人、代理人请客送礼的。工伤保险条例第二十条另有类似规定：社会保险行政部门工作人员与工伤认定申请人有利害关系的，应当回避。","依据":"《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第三十三条；《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）第二十条","效力位阶":"法律（《工伤保险条例》条款为行政法规）","主张强度":"可主张","举证难度":"中——回避事由需要具体事实支撑；口头提出即可，但书面提出更易留痕","地域":"全国；回避的决定与程序由各仲裁委员会与行政部门掌握","时效":"程序时效——回避申请应在庭审中及时提出；仲裁申请本身受一年时效限制。起算点——自知悉回避事由之日。例外——无特别时效豁免。","来源":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（劳动争议调解仲裁法全文，第三十三条）；https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本，第二十条）","核对日期":"2026-10-03","备注":"注意时效性：回避与程序异议都要在庭上及时提，事后主张的效力弱。书面提出时写明具体事由与依据，副本交仲裁委留存。核对笔录同样重要——把提出的异议确认记入笔录，这是后续主张程序违法的依据。第四十九条还把「违反法定程序」列为用人单位申请撤销终局裁决的法定情形之一。","成本标签":{"钱":"0","时间":"少","毅力":"些","收益":"中","口径":"时间"}},{"节号":14,"节名":"仲裁与诉讼实操","条号":20,"标题":"工伤认定与劳动仲裁的顺序：先认定，再谈钱","说人话":"顺序不能倒：先确认劳动关系（如果需要）→ 再申请工伤认定 → 再做劳动能力鉴定 → 最后才谈待遇数额。每往前一步都要等前一步的结果，所以要把每个环节的时限倒排，特别注意认定申请的一年期不会被前面的步骤吃掉。","适用":"工伤职工同时面临待遇争议与劳动关系争议，不确定先做哪一步。","成本":"时间——两条程序串行会让整体周期变长；需要提前规划顺序。","收益":"认定前置——工伤待遇以工伤认定与劳动能力鉴定为前提（《工伤保险条例》第十七条、第二十一条）；劳动关系确认前置——工伤认定申请须提交与用人单位存在劳动关系的证明材料（第十八条第二项），劳动关系有争议时需先解决该争议。待遇争议处理——职工与用人单位发生工伤待遇方面的争议，按照处理劳动争议的有关规定处理（第五十四条）。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）第十七条、第十八条、第二十一条、第五十四条；《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第二十七条","效力位阶":"行政法规（《劳动争议调解仲裁法》条款为法律）","主张强度":"可主张","举证难度":"中——劳动关系确认、认定、鉴定三环各有材料要求，需分环准备","地域":"全国；各环节的受理机关与办理时限由属地规定","时效":"程序时效——工伤认定：单位 30 日、劳动者一方 1 年；待遇争议仲裁：一年；劳动能力鉴定：受理后 60 日（可延 30 日）。起算点——认定自事故伤害发生之日；待遇争议自知道权利被侵害之日。例外——特殊情况经报社会保险行政部门同意可适当延长申请时限。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本）；http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（劳动争议调解仲裁法全文，第二十七条）","核对日期":"2026-10-03","备注":"最容易出事的是把一年期耗在劳动关系确认上——所以劳动关系有争议时要并行推进：一边申请确认，一边在一年期内把工伤认定申请先递上去（材料不齐会被一次性告知补正，不构成驳回）。第 8 节第 8.1 条、第 13.1 条写了认定时限，第 13.5 条写了申请材料。顺序规划可向当地社会保险行政部门或拨 12333 咨询。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"健康"}},{"节号":14,"节名":"仲裁与诉讼实操","条号":21,"标题":"不服裁决后起诉：起诉状写什么、期限怎么算","说人话":"起诉期只有 15 天，从收到裁决书那天算。起诉状的核心是：把一审要主张的请求写清（可以与仲裁请求一致，也可依法调整），附上裁决书与证据。别把 15 天耗在犹豫上——先把起诉状递进去，材料可以后补。","适用":"已经决定对裁决不服，准备向法院起诉。","成本":"时间——起诉期限 15 日，很短；金钱——诉讼费按法院标准交纳（符合条件可申请缓减免）。","收益":"劳动者对终局裁决不服的，可以自收到仲裁裁决书之日起 15 日内向人民法院提起诉讼（第四十八条）；对终局裁决以外的其他劳动争议案件的仲裁裁决不服的，当事人可以自收到裁决书之日起 15 日内向人民法院提起诉讼；期满不起诉的，裁决书发生法律效力（第五十条）。","依据":"《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第四十八条、第五十条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——起诉状、裁决书与送达凭证是基础材料；证据沿用仲裁阶段的一套","地域":"全国；受诉法院与立案材料按当地法院规定","时效":"程序时效——15 日。起算点——自收到仲裁裁决书之日。例外——期满不起诉的，裁决书发生法律效力，不再有起诉机会。","来源":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（劳动争议调解仲裁法全文，第四十八条、第五十条）","核对日期":"2026-10-03","备注":"签收裁决书的日期是关键——建议签收当天就在日历上标出第 15 日。起诉状的请求项要与仲裁请求对照，超出部分可能不被支持；各地法院对请求调整的把握不同，可向受诉人民法院立案窗口咨询。诉讼费的交纳与缓减免条件也向立案窗口确认。","成本标签":{"钱":"少","时间":"中","毅力":"是","收益":"中","口径":"金钱"}},{"节号":14,"节名":"仲裁与诉讼实操","条号":22,"标题":"打赢了但对方是空壳：执行前先查财产线索","说人话":"拿到能赢的裁决只是第一步，钱到账才算。提前做两件事：一是用国家企业信用信息公示系统查对方的主体状态（有没有被吊销、有没有实缴、股东是谁）；二是留意可查的财产线索（经营场所、设备、银行账户、应收款）。这些信息越早收集越好，因为对方可能在诉讼期间就开始转移。","适用":"担心即使胜诉也拿不到钱。","成本":"不花钱。可先自行查询公开信息。","收益":"生效裁决书可以依法申请人民法院执行；商事主体登记信息（法定代表人、股东、出资、经营范围）通过国家企业信用信息公示系统公开可查。用人单位未依法参加工伤保险的，其工伤待遇由单位按条例标准支付（《工伤保险条例》第六十二条）——这类情形下对方的偿付能力尤其关键。","依据":"《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第四十四条、第五十条；《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）第六十二条","效力位阶":"法律（《工伤保险条例》条款为行政法规）","主张强度":"可推定","举证难度":"中——主体与财产线索可自行查询公开信息；银行账户等需通过执行程序查询","地域":"全国；执行程序与财产查询按民事诉讼法及当地法院规定","时效":"程序时效——申请执行期限一般二年（自法律文书规定履行期间最后一日起算）。起算点——自裁决书确定的履行期间最后一日起算。例外——追索劳动报酬、工伤医疗费等案件可申请先予执行（第四十四条）。","来源":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（劳动争议调解仲裁法全文，第四十四条、第五十条）；https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本，第六十二条）","核对日期":"2026-10-03","备注":"不确定点在执行到位的实际可能性——这取决于对方财产状况，法律不保证执行结果，故标「可推定」。两个可提前做的动作：用公示系统查主体状态（能看出是不是空壳）；对工伤未参保情形，评估单位的实际支付能力后再决定是否接受分期和解。执行程序细节向当地人民法院立案或执行窗口咨询。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"中","口径":"金钱"}},{"节号":14,"节名":"仲裁与诉讼实操","条号":23,"标题":"和解与调解：可以谈，但要把「一次性了结」的范围写清","说人话":"谈和解不是错，但协议里「一次性了结」的范围要写清：了结的是哪几项、金额多少、什么时候付、社保缴到几月、离职证明怎么写。空白式的「双方再无其他争议」最危险——它可能把你还没算清的加班费、年假、工伤待遇一起勾掉。签之前把第 14.18 条那张三栏表拿出来对一遍。","适用":"对方提出和解或调解，愿意给一笔钱「一次了结」。","成本":"不花钱。但签错条款的代价可能高于拿到的钱。","收益":"明文层：劳动者与用人单位就解除或者终止劳动合同办理相关手续、支付工资报酬、加班费、经济补偿或者赔偿金等达成的协议，不违反法律、行政法规的强制性规定，且不存在欺诈、胁迫或者乘人之危情形的，应当认定有效；存在重大误解或者显失公平情形，当事人请求撤销的，人民法院应予支持（解释（一）第三十五条第二款）。","依据":"《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》（法释〔2020〕26 号，2021-01-01 施行）第三十五条第二款；《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第五条","效力位阶":"司法解释（第五条为法律）","主张强度":"可推定","举证难度":"中——协议文本需留存；主张「重大误解或显失公平」需举证签约时的情形","地域":"全国；对「显失公平」与「重大误解」的认定各地裁量不同","时效":"程序时效——主张撤销协议需在法定期间内提出（按民法典关于撤销权行使期间的规定）；劳动仲裁时效一年。起算点——自知道或应当知道撤销事由之日。例外——无特别时效豁免。","来源":"https://www.court.gov.cn/zixun/xiangqing/282121.html（最高人民法院官网·劳动争议解释（一）全文，第三十五条）；http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（劳动争议调解仲裁法全文，第五条）","核对日期":"2026-10-03","备注":"不确定点在「显失公平」的认定门槛（与法定应得数额的差距要达到什么程度），各地裁量不一，需向当地劳动人事争议仲裁委员会或拨 12333 确认。签字前的三个动作：算出法定应得总额作为参照；把了结项逐项写进协议；在协议上不写「放弃一切请求」这类概括条款，或写明「本协议仅了结以下列举事项」。第 5 节第 5.3 条写了协商解除的谈判要点。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"大","口径":"金钱"}},{"节号":14,"节名":"仲裁与诉讼实操","条号":24,"标题":"裁决书的送达与签收：日期就是期限","说人话":"签收那天起，15 天（你）／30 天（公司）开始跑。所以签收当天就把日期记下来，并且在日历上标出第 15 日。不同意裁决内容的，不用等对方动静——你的 15 天是独立的、不会因为对方是否申请撤销而顺延。","适用":"等裁决书，或者已经收到。","成本":"不花钱。签收当天记录日期。","收益":"裁决书送达是多个期限的起算点：劳动者起诉期限 15 日（第四十八条、第五十条）、用人单位申请撤销期限 30 日（第四十九条）均自收到裁决书之日起算。仲裁庭逾期未作出裁决的，当事人可以就该劳动争议事项向人民法院提起诉讼（第四十三条）。","依据":"《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第四十三条、第四十八条、第四十九条、第五十条","效力位阶":"法律","主张强度":"可主张","举证难度":"易——送达凭证与签收记录是期限起算的唯一依据","地域":"全国","时效":"程序时效——劳动者起诉 15 日；用人单位申请撤销 30 日。起算点——自收到仲裁裁决书之日。例外——期满不起诉的裁决书生效。","来源":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（劳动争议调解仲裁法全文，第四十三条、第四十八条至第五十条）","核对日期":"2026-10-03","备注":"签收时核对裁决书内容：裁决主文的金额与项目是否与请求一致、是否载明为终局裁决（影响 14.13 的金额线判断）、落款日期与送达日期分别是哪天。送达日期与落款日期不是同一天，起算的是送达日期。送达方式与生效证明的开具向当地劳动人事争议仲裁委员会咨询或拨 12333。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"中","口径":"时间"}},{"节号":14,"节名":"仲裁与诉讼实操","条号":25,"标题":"一次仲裁能提多项请求吗：可以，但要避免互相矛盾","说人话":"多项请求可以一次提，但互相矛盾的不能同时提。最典型的是「违法解除赔偿金（2N）」和「被迫解除经济补偿（N）」——两者是对同一段劳动关系解除的不同定性，同时主张会被要求择一。另一个常见问题是重复计算：把同一笔加班费既算在「欠薪」里又单列「加班费」。提交前用第 14.18 条的三栏表查一遍重复与矛盾。","适用":"手里同时有欠薪、加班费、年假、被迫解除补偿等多个请求。","成本":"不花钱。需要一次性梳理清。","收益":"没有可直接援引的条文限定一次仲裁的请求项数。可确证的是申请书应载明仲裁请求和所根据的事实、理由（第二十八条）；违法解除赔偿金与经济补偿是替代关系——《劳动合同法》第四十八条规定劳动者要求继续履行的应当继续履行，不要求继续履行或者已经不能继续履行的，用人单位应当依第八十七条支付赔偿金（即经济补偿标准的二倍）。","依据":"无明文的全国统一规定（指请求项数）。可确证的是《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第二十八条的申请书要求；《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第四十八条、第八十七条关于赔偿金与经济补偿的替代关系","效力位阶":"无明文依据","主张强度":"倡导性","举证难度":"中——需要把多项请求的算式与依据分别列清","地域":"全国；对矛盾请求的处理方式由各仲裁委员会掌握","时效":"程序时效——一年，可中断；各项请求分别计算。起算点——自知道或应当知道权利被侵害之日。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制。","来源":"「请求项数与矛盾处理」无官方一手依据可援引。 尝试过的路径：① 已打开《劳动争议调解仲裁法》官方全文页，第二十八条只规定申请书内容，未限制请求项数；② 已打开中国人大网劳动合同法全文，第四十八条、第八十七条确认赔偿金与经济补偿的替代关系；③ 检索其他全国性规定未定位到专门条款。故按「无明文依据」处理。已核对页面：http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html、http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html。","核对日期":"2026-10-03","备注":"本条不给「能提几项」的数量结论，重点在避免矛盾与重复。三处最容易出错：① 2N 与 N 同时提；② 欠薪与加班费重复计算同一笔；③ 未休年假折算把已付的正常工资部分又算一遍（应主张 200% 差额，见第 5 节第 5.8 条）。是否合并、如何择一，向当地劳动人事争议仲裁委员会或拨 12333 确认。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"金钱"}},{"节号":14,"节名":"仲裁与诉讼实操","条号":26,"标题":"仲裁笔录与庭审录音：核对与留存","说人话":"签笔录之前逐页看清——特别是你的请求金额、提出的举证要求、对方承认了哪些事实。发现遗漏或记错，当场申请补正；如果记录人员不补正，要求把「你申请补正而未被采纳」这件事记进笔录——这也是法条明文给的权利。","适用":"庭审结束要签笔录，或者想留一份庭审记录。","成本":"不花钱。核对笔录需要十几分钟。","收益":"《劳动争议调解仲裁法》第四十条规定仲裁庭应当将开庭情况记入笔录；当事人和其他仲裁参与人认为对自己陈述的记录有遗漏或者差错的，有权申请补正；不予补正的，应当记录该申请。笔录由仲裁员、记录人员、当事人和其他仲裁参与人签名或者盖章。","依据":"《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第四十条","效力位阶":"法律","主张强度":"可主张","举证难度":"易——笔录是庭审现场形成的书面记录，可当场核对","地域":"全国；庭审记录与录音的具体做法由各仲裁委员会掌握","时效":"程序时效——补正申请应在签名或盖章前当庭提出。起算点——庭审当场。例外——不予补正的应当记录该申请，该申请本身即成为后续主张的依据。","来源":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（劳动争议调解仲裁法全文，第四十条）","核对日期":"2026-10-03","备注":"不要因为时间紧就草草签字——签了笔录之后再说「当时记错了」很难被采信。庭审全程自己另做一份笔记（时间、谁说了什么、你的主张），与笔录对照。笔录能否复印或拍照带走，向当地劳动人事争议仲裁委员会咨询或拨 12333 确认。","成本标签":{"钱":"0","时间":"少","毅力":"些","收益":"中","口径":"时间"}},{"节号":14,"节名":"仲裁与诉讼实操","条号":27,"标题":"从立案到拿钱：完整时间表与卡点","说人话":"一条链的卡点通常在三处：① 证据——离职后账号失效，所有取证必须在离职前做完；② 时限——仲裁一年、工伤认定一年、起诉 15 日，每个都不能靠感觉记；③ 执行——赢了不等于拿到，对方是空壳时这一点最现实。把这三处提前处理掉，其余就是走流程。","适用":"想知道整个流程大概要多久、哪一步最容易卡住。","成本":"时间——整条链条通常数个月到一年以上，取决于是否进入诉讼与执行。","收益":"各环节的法定时限：仲裁受理后 45 日内结束，可延期 15 日（第四十三条）；对非终局裁决不服的起诉期限 15 日（第五十条）；用人单位申请撤销终局裁决 30 日（第四十九条）；工伤认定 60 日（事实清楚 15 日，第二十条）；劳动能力鉴定 60 日（可延 30 日，第二十五条）；对市级鉴定结论不服的再次鉴定申请 15 日（第二十六条）；申请执行期限一般 二年。","依据":"《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第四十三条、第四十九条、第五十条；《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）第二十条、第二十五条、第二十六条","效力位阶":"法律（《工伤保险条例》条款为行政法规）","主张强度":"可主张","举证难度":"中——各环节材料需分阶段准备，证据类最耗时","地域":"全国；实际审理与执行时长受当地案件量与办案节奏影响","时效":"程序时效——仲裁 45＋15 日；起诉 15 日；撤销 30 日；工伤认定 60／15 日；鉴定 60＋30 日；再次鉴定 15 日；申请执行一般二年。起算点——分别见各程序规定。例外——仲裁时效一年（在职欠薪不受一年限制）；工伤认定单位 30 日、劳动者一方 1 年。","来源":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（劳动争议调解仲裁法全文）；https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本）","核对日期":"2026-10-03","备注":"这张表的作用是把「感觉上还有时间」变成具体日期——把每个节点的截止日在日历上标出来。申请执行期限一般二年这一点最容易被忽略：赢了之后对方拖着不给、你也不申请执行，两年后就难办了（见 14.11）。实际案件周期与本地办案节奏向当地劳动人事争议仲裁委员会、人民法院立案窗口或拨 12333 咨询。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"中","口径":"金钱"}},{"节号":14,"节名":"仲裁与诉讼实操","条号":28,"标题":"劳动人事争议仲裁的受案范围：哪些争议能立上案","说人话":"受理范围是逐项列举的，对着看最快：确认劳动关系、订立到终止合同、辞退辞职离职、工时休假社保福利培训劳动保护、劳动报酬与工伤医疗费与经济补偿赔偿金。你的争议多半能对上其中一项。对不上或拿不准的，带着材料去窗口问一次，或拨 12333，别自己猜。","适用":"不确定自己的争议属不属于仲裁受理范围。","成本":"不花钱。对照范围判断，或直接问窗口。","收益":"中华人民共和国境内的用人单位与劳动者发生的下列劳动争议，适用本法：① 因确认劳动关系发生的争议；② 因订立、履行、变更、解除和终止劳动合同发生的争议；③ 因除名、辞退和辞职、离职发生的争议；④ 因工作时间、休息休假、社会保险、福利、培训以及劳动保护发生的争议；⑤ 因劳动报酬、工伤医疗费、经济补偿或者赔偿金等发生的争议；⑥ 法律、法规规定的其他劳动争议。","依据":"《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第二条、第五条、第二十一条","效力位阶":"法律","主张强度":"可推定","举证难度":"易——受理范围属程序判断，不依赖实体证据","地域":"全国；具体受理范围与不予受理的处理由各仲裁委员会按属地掌握","时效":"程序时效——仲裁申请时效一年；不予受理的救济按相关程序规定。起算点——自知道或应当知道权利被侵害之日。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年期间的限制。","来源":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（劳动争议调解仲裁法全文，第二条、第五条、第二十一条）","核对日期":"2026-10-03","备注":"本条提示的是「先确认能不能立案」这个动作，而不是给范围清单——第二条各项的具体表述较长，建议直接查阅条文原文或向窗口确认。两类争议要特别注意区分：一是社保补缴类，行政征缴路径通常更直接（第 7 节第 7.5 条）；二是纯民事纠纷（例如离职后与公司的借款、报销），可能不属劳动争议范围，需走普通民事诉讼。受理判断向当地劳动人事争议仲裁委员会咨询或拨 12333。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"中","口径":"时间"}},{"节号":15,"节名":"应届生与第一份工作","条号":1,"标题":"三方协议不是劳动合同，两者解决的是不同问题","说人话":"三方协议是毕业生、学校、用人单位三方的就业约定，作用是纳入就业计划；劳动合同是你和公司的劳动关系约定。签了三方不等于有劳动关系，入职后还要签劳动合同。违约怎么办，看协议里怎么写的——条文把它交给「按协议书有关条款办理」。所以签字前把违约条款逐字读完，比事后争论重要得多。","适用":"校招期间被要求签《毕业生就业协议书》（三方协议），想弄清它和劳动合同的关系。","成本":"不花钱。读懂协议里的违约条款，几分钟。","收益":"现存的国家层面专门规定是《普通高等学校毕业生就业工作暂行规定》（1997 年发布，教育部主管）：经供需见面和双向选择后，毕业生、用人单位和高等学校应当签订毕业生就业协议书，作为制定就业计划和派遣的依据。该规定同时明确：对违反就业协议或不履行定向、委托培养合同的用人单位、毕业生、高等学校，按协议书或合同书的有关条款办理，并依法承担赔偿责任。而劳动合同确立的是劳动关系，适用《劳动合同法》。两者性质、签约主体、救济渠道都不同。","依据":"《普通高等学校毕业生就业工作暂行规定》第二十四条、第四十八条；《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第十条","效力位阶":"部门规章（教育部官网该页「信息类别」自标注为部门规章；国家教委，教学〔1997〕6 号）；《劳动合同法》条款为法律","主张强度":"可推定","举证难度":"中——三方协议文本、违约条款、双方往来沟通记录需自己留存","地域":"全国；三方协议的文本与执行长期由各省级毕业生就业主管部门与高校细化，实际尺度差异较大","时效":"程序时效——三方协议违约属民事争议，适用民事诉讼时效三年；劳动关系争议走仲裁，时效一年。起算点——自违约行为发生之日。例外——无特别时效豁免。","来源":"https://hudong.moe.gov.cn/srcsite/A02/s5911/moe_621/199703/t19970324_81877.html（教育部官网·普通高等学校毕业生就业工作暂行规定全文，第二十四条、第四十八条）；http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文）","核对日期":"2026-10-03","备注":"先说这一条的阶段属性，因为它决定你怎么用它——该规定未检索到废止文件，仍挂在教育部官网，其第二十四条、第四十八条条文本身可作依据（三方协议的定位、以及违约责任按协议条款处理的方式）。但「查不到废止」不等于整部规定都还能照办：它制定于毕业生「计划分配」时期，其核心制度（就业计划、派遣、报到证）已被 2023 年那份取消就业报到证的通知取代（见第 15.21 条）。所以引它的条文可以，但别指望按 1997 年的流程办事——就业计划与派遣这一套大部分已不适用。这是本仓库第一例「法规本身未废止、但所依托制度已被取代」的情形，也是本条主张强度标「可推定」的实体理由：条文能引，流程不能照搬。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"中","口径":"自由"}},{"节号":15,"节名":"应届生与第一份工作","条号":2,"标题":"offer 的法律性质：不是劳动关系，但撤销有边界","说人话":"offer 本身不产生劳动关系，但它可能构成一个有法律意义的承诺。关键看它有没有写「有效期至某日」「不可撤销」，以及你有没有为它做了实际准备（例如辞职、退租、拒绝其他 offer）。这两种情形下它就不能随便撤销。所以收到 offer 后：把确认接受的邮件留好，把为它做的准备留痕（退掉其他 offer 的邮件、租房合同），这些是日后主张损失的依据。","适用":"收到录用通知（offer）后公司反悔撤回，或者你自己想拒掉已接受的 offer。","成本":"时间——争议走民事诉讼；金钱——按法院标准交费。","收益":"录用通知在民事法律上通常按要约处理：《民法典》规定要约可以撤销，但有两种情形除外——① 要约人以确定承诺期限或者其他形式明示要约不可撤销；② 受要约人有理由认为要约是不可撤销的，并已经为履行合同做了合理准备工作。此外，当事人在订立合同过程中有假借订立合同恶意磋商、故意隐瞒重要事实或提供虚假情况、其他违背诚信原则的行为，造成对方损失的，应当承担赔偿责任。若双方约定的「认购书、订购书、预订书」构成预约合同，一方不履行订立合同的义务，对方可请求其承担预约合同的违约责任。","依据":"《民法典》第四百七十六条、第四百七十七条、第四百九十五条、第五百条","效力位阶":"法律","主张强度":"可推定","举证难度":"中——offer 原文、接受确认、为履行做的准备材料需自己留存；实际损失的举证责任在主张方","地域":"全国；「已经为履行做了合理准备工作」的认定与损失数额，个案差异大","时效":"程序时效——民事诉讼时效三年。起算点——自知道或应当知道权利受损害之日。例外——无特别时效豁免；此争议不属劳动争议，不走仲裁前置。","来源":"https://www.spp.gov.cn/spp/ssmfdyflvdtpgz/202008/t20200831_478413.shtml（最高人民检察院官网·民法典第三编合同全文，第四百七十六条、第四百七十七条、第四百九十五条、第五百条）","核对日期":"2026-10-03","备注":"不确定点在于「offer 争议是否属劳动争议」——录用通知签订于劳动关系建立之前，各地对由此产生的争议按民事纠纷还是劳动争议受理，口径不完全一致，故标「可推定」，立案前应向当地人民法院立案窗口或劳动人事争议仲裁委员会确认。最有效的自我保护是让对方把条件写进书面：岗位、薪资、工作地点、试用期、报到日期、有效期、是否可撤销。第 15.20 条写口头承诺的举证问题。","成本标签":{"钱":"少","时间":"多","毅力":"是","收益":"中","口径":"金钱"}},{"节号":15,"节名":"应届生与第一份工作","条号":3,"标题":"「入职不满一个月不用缴社保」不成立：30 日从用工之日起算","说人话":"条文写的是「用工之日起三十日内」，起算点是上班第一天，不是转正、不是试用期满、也不是「满一个月」。所以「下个月再给你交」这种说法本身就是违法线索——它把起算点往后推了。入职当月自己查一次参保状态，显示未参保就书面要求单位办理并留痕。","适用":"入职时被告知「转正后再缴社保」「满一个月才缴」。","成本":"不花钱。查一次参保状态。","收益":"用人单位应当自用工之日起三十日内为其职工向社会保险经办机构申请办理社会保险登记。未办理社会保险登记的，由社会保险经办机构核定其应当缴纳的社会保险费。","依据":"《社会保险法》（2018-12-29 修正）第五十八条","效力位阶":"法律","主张强度":"可主张","举证难度":"易——参保状态属官方系统记录，可自行查询","地域":"全国；缴费基数上下限与办理时限的具体执行口径由参保地确定","时效":"程序时效——补缴走社会保险费征收机构责令限期缴纳或补足，属行政征缴路径；主张因未参保造成的待遇损失赔偿走仲裁，时效一年。起算点——补缴类自欠缴之日；待遇损失自知道或应当知道损失发生之日。例外——社会保险费征缴不适用劳动关系终止后一年内的仲裁时效限制。","来源":"http://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_296659.html（中国人大网·社会保险法全文，第五十八条）","核对日期":"2026-10-03","备注":"这条对第一份工作特别重要：一旦在未参保期间发生工伤，全部工伤待遇由用人单位按条例标准支付（《工伤保险条例》第六十二条），而应届生入职初期往往还没被纳入。所以第一个月就查参保状态，别等到出事。缴费基数按实际工资而非最低档（见 15.24 与第 7 节第 7.1 条）；具体办理流程向参保地社保经办机构或拨 12333 确认。","成本标签":{"钱":"0","时间":"少","毅力":"些","收益":"大","口径":"健康"}},{"节号":15,"节名":"应届生与第一份工作","条号":4,"标题":"试用期长度按合同期限分档，同一单位只能约定一次","说人话":"试用期多长是合同期限决定的：合同 1 年 → 试用期最长 2 个月；3 年 → 最长 6 个月；不到 3 个月或者以完成某项工作为期限的 → 根本不能约定试用期。同一家公司跟你一辈子只能约定一次。另外注意：合同里只写试用期、不写合同期限的，那个「试用期」就是合同期限。工资不得低于约定工资的八成，也不低于当地最低工资。","适用":"第一次签劳动合同，合同里写有试用期。","成本":"不花钱。签字前对着合同期限核一遍试用期，三十秒。","收益":"劳动合同期限三个月以上不满一年的，试用期不得超过一个月；一年以上不满三年的，不得超过二个月；三年以上固定期限和无固定期限的，不得超过六个月。同一用人单位与同一劳动者只能约定一次试用期。以完成一定工作任务为期限的劳动合同或者劳动合同期限不满三个月的，不得约定试用期。试用期包含在劳动合同期限内；劳动合同仅约定试用期的，试用期不成立，该期限为劳动合同期限。试用期工资不得低于本单位相同岗位最低档工资或者劳动合同约定工资的百分之八十，并不得低于用人单位所在地的最低工资标准。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第十九条、第二十条、第八十三条","效力位阶":"法律","主张强度":"可主张","举证难度":"易——合同文本本身即可证明约定内容；超期部分可要求按试用期满月工资标准赔偿","地域":"全国；当地最低工资标准按工作地现行标准","时效":"程序时效——仲裁申请时效一年。起算点——自知道或应当知道权利被侵害之日；主张超期履行赔偿金的，一般自超期履行期间起算。例外——无特别时效，不适用劳动报酬类例外。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文，第十九条、第二十条、第八十三条）","核对日期":"2026-10-03","备注":"「只签试用期合同」是常见坑，法律上不成立——该期限直接被视为合同期限（第十九条第四款）。另注意违法约定试用期且已履行的，按试用期满月工资为标准、就超过法定试用期的期间支付赔偿金（第八十三条）。签字前把「合同期限」和「试用期」两栏对着上表核一遍，这是签字前三十秒能做完的事。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"中","口径":"金钱"}},{"节号":15,"节名":"应届生与第一份工作","条号":5,"标题":"试用期被辞：单位必须说明理由，且限于法定情形","说人话":"试用期不是「随时让你走」的阶段。公司要辞你，得落在法定情形里，而且必须说明理由——说不出来、拿不出证据，就是违法解除，赔偿按经济补偿的两倍算。所以被辞时第一件事是要一份写明理由的书面通知；只有口头通知的，当天用邮件或聊天向对方确认「你刚才以什么理由解除」，把答复留底。","适用":"试用期内被用人单位单方解除劳动合同。","成本":"时间——仲裁立案到裁决一般几个月；金钱——劳动仲裁不收费。","收益":"在试用期中，除劳动者有第三十九条（过失性解除）和第四十条第一项、第二项（医疗期满不能从事原工作或另行安排的工作；不能胜任工作经培训或调岗仍不能胜任）规定的情形外，用人单位不得解除劳动合同；用人单位在试用期解除劳动合同的，应当向劳动者说明理由。违法解除的，劳动者可以要求继续履行，或者要求按经济补偿标准的二倍支付赔偿金。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第二十一条、第三十九条、第四十条第一项与第二项、第四十八条、第八十七条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——解除通知与理由由单位出具，自己可留存；「不符合录用条件」的举证责任在单位，但它往往靠入职时有没有明确告知录用条件","地域":"全国","时效":"程序时效——仲裁申请时效一年。起算点——自收到解除通知之日。例外——无特别时效，不适用劳动报酬类例外。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文，第二十一条、第三十九条、第四十条、第四十八条、第八十七条）","核对日期":"2026-10-03","备注":"入职时把「录用条件」书面化，是防这一条最有效的动作——招聘启事截图、岗位说明书、考核标准各留一份。单位拿不出录用条件，「不符合录用条件」就无从证明。另注意解雇理由一旦写定，事后很难由它改成别的理由，所以不要在没有理由或理由含糊的文件上签字。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"金钱"}},{"节号":15,"节名":"应届生与第一份工作","条号":6,"标题":"「应届生身份」不是法律概念：能问到的只有招考公告与本地口径","说人话":"这一条我不能给你一个统一的失效时间点，因为「应届生」根本不是法律术语——它是一个招生和招聘口径。同一个你，在 A 单位算应届、在 B 单位可能不算。所以别到处打听「几年内算应届」，正确做法是把你要报的那个岗位的公告找出来，逐字读它对毕业年份、择业期、社保记录、派遣手续的要求。","适用":"想确认自己还算不算应届生，能不能报考只面向应届生的岗位、享受相关落户与补贴政策。","成本":"不花钱。但要把要报的岗位公告逐条读一遍。","收益":"没有可直接援引的全国统一法律条文。现行法律与行政法规中没有「应届毕业生身份」的定义、认定标准与失效时点；实践中该身份由各类招考公告、用人单位招聘简章、学校与地方人社部门的政策口径分别界定，标准互不相同。","依据":"无明文的全国统一规定（指「应届毕业生身份」的认定与失效时点）。可比较的是《普通高等学校毕业生就业工作暂行规定》第二十四条关于就业协议书作为「制定就业计划和派遣的依据」的规定，但该条也未界定「应届生身份」","效力位阶":"无明文依据","主张强度":"倡导性","举证难度":"易——判断依据在招考公告与招聘简章里，属可自行获取的公开文本","地域":"地方与单位口径差异很大，必须以拟报考岗位的公告与当地人社部门口径为准","时效":"无特别时效——身份认定本身不适用时效制度。起算点：不适用。例外：由该身份衍生的具体权利主张（如政策补贴的发放争议）适用各自程序的时效。","来源":"「应届毕业生身份」无官方一手依据可援引。 尝试过的路径：① 已打开中国人大网劳动合同法全文、中国政府网社会保险法页、教育部《普通高等学校毕业生就业工作暂行规定》全文，均无「应届毕业生身份」的定义条款；② 检索国家层面关于应届生身份认定与失效时点的统一规定，未定位到可作依据的文件；③ 检索到的相关表述多为地方招考公告、学校就业指导口径与用人单位招聘简章，属地方与单位口径，非全国性规范。故按「无明文依据」处理。已核对页面：https://hudong.moe.gov.cn/srcsite/A02/s5911/moe_621/199703/t19970324_81877.html（教育部·普通高等学校毕业生就业工作暂行规定全文）","核对日期":"2026-10-03","备注":"这一条刻意不写「统一规则」，因为写任何统一规则都是编的。 要问就问三处：① 拟报考单位或岗位的招考公告原文（最权威，逐条读毕业年份与择业期要求）；② 学校就业指导中心（掌握本校的口径与派遣手续）；③ 当地人力资源和社会保障部门（落户、补贴类政策的口径），或拨 12333。常见的影响因素（各地不同，仅供核对公告时参考，不是规则）：是否已签订劳动合同、是否已有社保缴费记录、是否在择业期内、毕业年份、是否办理过派遣。任何一条都别当通则用——以你要报的那个公告为准。","成本标签":{"钱":"0","时间":"中","毅力":"否","收益":"中","口径":"自由"}},{"节号":15,"节名":"应届生与第一份工作","条号":7,"标题":"招聘中的性别与婚育歧视：明文禁止，可直接起诉","说人话":"招聘时问婚育、把怀孕测试当入职体检、写「男性优先」、要求承诺几年内不结婚不生孩子——这些都被法律逐条点名禁止，你可以向人社部门投诉，也可以直接去法院起诉。但要说实话：能不能赢在证据上。对方通常不会把歧视理由写下来，所以招聘页面截图、面试通知、聊天记录、录音要在当时就留住。","适用":"校招或入职环节，因性别、婚育状况被拒绝录用、被提高录用标准，或被要求作出限制结婚生育的承诺。","成本":"时间——投诉到行政部门或诉讼，周期不定；金钱——向劳动保障监察投诉不收费，民事诉讼有诉讼费。","收益":"用人单位在招录（聘）过程中，除国家另有规定外，不得：① 限定为男性或者规定男性优先；② 除个人基本信息外，进一步询问或者调查女性求职者的婚育情况；③ 将妊娠测试作为入职体检项目；④ 将限制结婚、生育或者婚姻、生育状况作为录（聘）用条件；⑤ 其他以性别为由拒绝录（聘）用妇女或者差别化地提高对妇女录（聘）用标准的行为。人力资源和社会保障部门应当将招聘、录取、晋职、晋级、评聘专业技术职称和职务、培训、辞退等过程中的性别歧视行为纳入劳动保障监察范围。此外，劳动者依法享有平等就业和自主择业的权利，用人单位招用人员应当提供平等的就业机会和公平的就业条件，不得实施就业歧视；实施就业歧视的，劳动者可以向人民法院提起诉讼。用人单位招用人员，除国家规定的不适合妇女的工种或者岗位外，不得以性别为由拒绝录用妇女或者提高对妇女的录用标准。","依据":"《妇女权益保障法》（2022-10-30 修订，2023-01-01 施行）第四十三条、第四十九条；《就业促进法》（2007-08-30 通过，2008-01-01 施行）第三条、第二十六条、第二十七条、第六十二条","效力位阶":"法律","主张强度":"可主张","举证难度":"难——歧视理由通常不出现在书面材料里，需要招聘信息截图、面试录音、聊天记录等外部证据；因果关系难以证明","地域":"全国；各地劳动保障监察对就业歧视的受理范围与处理力度不完全一致","时效":"程序时效——向劳动保障监察投诉的，违法行为在 2 年内未被发现也未被举报、投诉的不再查处；向法院起诉的按民事诉讼时效三年。起算点——自知悉被拒绝录用或差别对待之日。例外——无特别时效豁免；就业歧视之诉与劳动争议仲裁是两条路径，不适用仲裁前置。","来源":"https://www.spp.gov.cn/spp/fl/202210/t20221030_591251.shtml（最高人民检察院官网·妇女权益保障法全文，2022 修订）；http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2521206.html（广东省人民政府门户网站·就业促进法全文，页面来源标注中国人大网）","核对日期":"2026-10-03","备注":"举证难度标「难」——取证时机在被拒录的当场和事后第一时间：招聘页面与岗位要求截图、面试通知、拒录邮件或聊天记录立即留存；涉及婚育、生育计划的询问能录音就录音，事后补不回来。第四十三条五项禁止行为可以当证据清单用，截图时对着这五项找。各地受理口径向当地人力资源社会保障局劳动保障监察机构或拨 12333 确认。第 3 节第 3.22 条从入职签约角度写过同一问题。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"中","口径":"自由"}},{"节号":15,"节名":"应届生与第一份工作","条号":8,"标题":"在校生实习与劳动关系的区分：一般不走劳动合同那一套","说人话":"在校生实习的性质是教育教学活动，不是劳动关系——所以加班费、经济补偿、无固定期限这些规则通常不适用，走的是实习协议。但实习协议必须签，而且你必须拿到一份；顶岗实习的协议里还要写明报酬怎么算、怎么发。签之前逐条看：有没有报酬条款、工作时间怎么约定、出了事故谁负责。","适用":"在校期间参加实习，想知道自己算不算劳动者、能不能主张加班费与经济补偿。","成本":"不花钱。先分清是哪种实习。","收益":"现存的国家层面专门规定是《职业学校学生实习管理规定》（2016 年，教育部等五部门印发），适用于实施全日制学历教育的中等职业学校和高等职业学校学生按培养方案进行的实践性教育教学活动，分为认识实习、跟岗实习和顶岗实习。该规定要求：学生参加跟岗实习、顶岗实习前，职业学校、实习单位、学生三方应签订实习协议，协议文本由当事方各执一份；未按规定签订实习协议的，不得安排学生实习。实习协议应明确各方责任、权利和义务，顶岗实习的实习协议内容还应当包括实习报酬及支付方式。","依据":"《职业学校学生实习管理规定》（教育部等五部门，2016 年印发）第二条、第十二条、第十三条","效力位阶":"规范性文件","主张强度":"可推定","举证难度":"中——实习协议文本、报酬支付记录、实习安排通知需自己留存","地域":"全国；该规定适用对象为职业学校学生，普通高校本科生的实习另有各校与地方做法，实践中差异较大","时效":"程序时效——因实习协议发生的争议一般按民事纠纷处理，诉讼时效三年；若被认定为劳动关系则走仲裁，时效一年。起算点——自知道或应当知道权利受损害之日。例外——无特别时效豁免。","来源":"https://www.gov.cn/gongbao/content/2016/content_5095761.htm（中国政府网国务院公报 2016 年第 21 号·职业学校学生实习管理规定全文）","核对日期":"2026-10-03","备注":"两个要点要分清：① 本条规定的适用对象是中等与高等职业学校学生，普通高校本科生的实习不直接适用，其定性更多依赖个案与地方裁审口径；② 「在校生实习一般不构成劳动关系」不等于实习期间没有保护——实习协议、报酬约定、安全责任都受协议与相关规定的约束（见第 15.9 条）。具体定性建议先咨询学校就业或学籍管理部门，争议时向当地劳动人事争议仲裁委员会或人民法院立案窗口确认。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"中","口径":"自由"}},{"节号":15,"节名":"应届生与第一份工作","条号":9,"标题":"顶岗实习的报酬与禁止事项：不得低于同岗位试用期工资的 80%","说人话":"顶岗实习的报酬有底线——原则上不低于同岗位试用期工资的 80%，而且必须用货币按时给，不能用补贴、餐券、实物替代。同时，法定节假日实习、加班、夜班都被明文禁止。实习单位收押金、扣身份证、要担保同样被禁止——这几条与正式员工的保护规则是一致的。","适用":"参加顶岗实习，担心被当作廉价劳动力。","成本":"不花钱。核对实习协议里的报酬条款。","收益":"接收学生顶岗实习的实习单位，应参考本单位相同岗位的报酬标准和顶岗实习学生的工作量、工作强度、工作时间等因素，合理确定顶岗实习报酬，原则上不低于本单位相同岗位试用期工资标准的 80%，并按照实习协议约定，以货币形式及时、足额支付给学生。跟岗与顶岗实习期间，除相关专业和岗位有特殊要求并报上级主管部门备案外，实习单位应遵守国家关于工作时间和休息休假的规定，并不得安排学生从事高空、井下、放射性、有毒、易燃易爆及其他具有较高安全风险的实习，不得安排学生在法定节假日实习，不得安排学生加班和夜班。此外，职业学校和实习单位不得向学生收取实习押金、顶岗实习报酬提成、管理费或者其他形式的实习费用，不得扣押学生的居民身份证，不得要求学生提供担保或者以其他名义收取学生财物。","依据":"《职业学校学生实习管理规定》（教育部等五部门，2016 年印发）第十六条、第十七条、第十九条","效力位阶":"规范性文件","主张强度":"可主张","举证难度":"中——实习协议、排班记录、报酬发放记录需自己留存；岗位试用期工资标准可能需实习单位提供","地域":"全国；适用对象为职业学校学生，普通高校本科生实习另有各校与地方做法","时效":"程序时效——按实习协议争议一般走民事诉讼，时效三年；被认定为劳动关系的走仲裁，时效一年。起算点——自知道或应当知道权利受损害之日。例外——无特别时效豁免。","来源":"https://www.gov.cn/gongbao/content/2016/content_5095761.htm（中国政府网国务院公报 2016 年第 21 号·职业学校学生实习管理规定全文，第十六条、第十七条、第十九条）","核对日期":"2026-10-03","备注":"「原则上不低于 80%」里的「原则上」是条文原文，实践中有例外空间，所以本条按可主张处理但仍要注意个案差异。「同岗位试用期工资标准」由实习单位掌握，可在争议中要求其提供。第 16 条的禁止事项（法定节假日、加班、夜班）是明文禁止，相对更硬。普通高校本科生的实习不直接适用本规定，具体保护路径先咨询学校就业管理部门。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"中","口径":"金钱"}},{"节号":15,"节名":"应届生与第一份工作","条号":10,"标题":"实习期间受伤：按实习责任保险与协议约定处理，不是工伤那套","说人话":"实习期间受伤，赔付顺序是先走实习责任保险，超出部分按实习协议约定的责任分担——这跟正式员工的工伤保险是两套机制。所以实习协议里「出了事故谁负责」这一条必须看清，签之前就要看到。另外，事故当时的就医记录、诊断证明、费用票据要当场留好。","适用":"实习期间发生人身伤害。","成本":"时间——按保险合同理赔或按协议约定处理，周期视流程而定。","收益":"学生在实习期间受到人身伤害，属于实习责任保险赔付范围的，由承保保险公司按保险合同赔付标准进行赔付；不属于保险赔付范围或者超出保险赔付额度的部分，由实习单位、职业学校及学生按照实习协议约定承担责任。职业学校和实习单位应当妥善做好救治和善后工作。","依据":"《职业学校学生实习管理规定》（教育部等五部门，2016 年印发）第三十六条","效力位阶":"规范性文件","主张强度":"可推定","举证难度":"难——需要证明伤害发生在实习期间且与实习活动相关，关键材料是事故当场的记录与协议约定","地域":"全国；保险方案与赔付标准由各校与实习单位投保情况决定，差异较大","时效":"程序时效——保险理赔按保险合同约定；协议责任分担争议按民事诉讼时效三年。起算点——自知道或应当知道权利受损害之日。例外——若被认定为劳动关系，则适用工伤认定一年期与工伤待遇规则。","来源":"https://www.gov.cn/gongbao/content/2016/content_5095761.htm（中国政府网国务院公报 2016 年第 21 号·职业学校学生实习管理规定全文，第三十六条）","核对日期":"2026-10-03","备注":"举证难度标「难」——取证时机在事故当场与就医第一时间：事故经过与在场人记录、就诊记录与诊断证明、费用票据、实习排班表，当天留存。动手前先问清三件事：学校有没有投保实习责任保险、保额多少、理赔流程是什么（问学校就业或学籍管理部门）；实习协议里责任分担条款怎么写的。涉及具体案件的赔偿比例，建议咨询执业律师；是否可能被认定为劳动关系的判断，向当地劳动人事争议仲裁委员会或拨 12333 确认。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"中","口径":"健康"}},{"节号":15,"节名":"应届生与第一份工作","条号":11,"标题":"劳动合同的必备条款：第一份合同该核哪几栏","说人话":"签字前把这九样对着找一遍。对第一份工作最要紧的是第 ③④⑥ 三项：合同期限（决定试用期长短）、工作内容和工作地点（决定将来能不能被随意调岗）、劳动报酬（决定加班费和经济补偿的基数）。这三项空着或写得含糊，将来出争议你就没有依据。","适用":"第一次签劳动合同，准备签字。","成本":"不花钱。逐条核对一次，约十分钟。","收益":"劳动合同应当具备以下条款：① 用人单位的名称、住所和法定代表人或者主要负责人；② 劳动者的姓名、住址和居民身份证或者其他有效身份证件号码；③ 劳动合同期限；④ 工作内容和工作地点；⑤ 工作时间和休息休假；⑥ 劳动报酬；⑦ 社会保险；⑧ 劳动保护、劳动条件和职业危害防护；⑨ 法律、法规规定应当纳入劳动合同的其他事项。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第十七条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——合同文本自己应留存；缺项导致的损害需另行举证","地域":"全国","时效":"程序时效——未载明必备条款的由劳动行政部门责令改正；造成损害的赔偿请求走仲裁，时效一年。起算点——自知道或应当知道损害发生之日。例外——无特别时效，不适用劳动报酬类例外。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文，第十七条）","核对日期":"2026-10-03","备注":"缺一项不等于合同无效——法律后果是责令改正加赔偿损害，而损害需要单独证明。所以真正要紧的是把关键条款写具体：工资写清基本工资与绩效/补贴的构成，工作地点写到城市或具体地址，岗位职责写清主要工作内容，工作时间写清哪种工时制（标准工时、综合计算还是不定时，后两种需经审批——见第 4 节第 4.3 条）。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"金钱"}},{"节号":15,"节名":"应届生与第一份工作","条号":12,"标题":"签字后必须拿到自己那份合同文本","说人话":"签完字必须拿到属于你的那一份，这是法律写明的，不是公司施舍。人事说「统一保管」「回头给你」都不算。拿不到就当场拍照每一页——包括签字页和盖章页——并当天用邮件或聊天向对方确认「已要求提供合同文本，尚未收到」，把这条记录留下。","适用":"签完合同，人事说「统一保管」「回头给你」。","成本":"不花钱。签字当场多要一份，几分钟。","收益":"劳动合同由用人单位与劳动者协商一致，并经用人单位与劳动者在劳动合同文本上签字或者盖章生效。劳动合同文本由用人单位和劳动者各执一份。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第十六条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——能否拿到文本取决于当场是否坚持；拿不到时照片、扫描件、电子版是替代证据","地域":"全国","时效":"程序时效——用人单位未将合同文本交付劳动者的，由劳动行政部门责令改正；造成损害的承担赔偿责任，赔偿请求走仲裁，时效一年。起算点——自知道或应当知道损害发生之日。例外——无特别时效，不适用劳动报酬类例外。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文，第十六条）","核对日期":"2026-10-03","备注":"电子签的要把签署完成后的 PDF 下载到个人设备并另存云端，不要只留在公司系统里——离职后账号停用就取不到了。第一份合同尤其要留：它是后续所有主张（试用期、工资基数、工龄）的起点凭据。第 3 节第 3.4 条从入职签约角度写过同一问题。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"大","口径":"自由"}},{"节号":15,"节名":"应届生与第一份工作","条号":13,"标题":"不能只签试用期合同","说人话":"法律上不存在「只签试用期」这种合同。公司只给你一份写着「试用期三个月」的合同，那这三个月的性质就是合同期限，不是试用期——意味着它不能再拿「试用期不合格」来辞你。所以碰到这种文本，先不要按它的说法理解自己的身份。","适用":"公司只给你一份「试用期合同」，说转正后再签正式合同。","成本":"不花钱。看合同的期限栏怎么写的。","收益":"试用期包含在劳动合同期限内。劳动合同仅约定试用期的，试用期不成立，该期限为劳动合同期限。 此外，劳动合同期限不满三个月的，不得约定试用期；以完成一定工作任务为期限的劳动合同，不得约定试用期。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第十九条","效力位阶":"法律","主张强度":"可主张","举证难度":"易——合同文本本身即可证明约定内容","地域":"全国","时效":"程序时效——仲裁申请时效一年。起算点——自知道或应当知道权利被侵害之日。例外——无特别时效，不适用劳动报酬类例外。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文，第十九条）","核对日期":"2026-10-03","备注":"做法上更稳的是要求签完整的劳动合同，把合同期限与试用期同时写清。已经签了「只有试用期」文本的，保留原件——它是判断你实际身份的关键证据。若公司据此以「试用期不合格」解除，可援引第十九条第四款主张该期间为合同期限，进而主张违法解除（见 15.5）。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"中","口径":"自由"}},{"节号":15,"节名":"应届生与第一份工作","条号":14,"标题":"入职不得收押金、不得扣押证件","说人话":"公司没有任何权力收你的押金，也没有权力扣你的身份证和毕业证原件。现场要你交钱或交证件，直接拒绝；已经交了的可以要回来，还可以向劳动监察投诉。特别注意「毕业证原件代管」这类说法——原件交出去就很难要回，入职只提供复印件并注明用途即可。","适用":"入职时被要求交押金、保证金、服装费、培训费，或者把身份证、毕业证、资格证原件交给单位「保管」。","成本":"不花钱。当场拒绝或要求退还。","收益":"用人单位招用劳动者，不得扣押劳动者的居民身份证和其他证件，不得要求劳动者提供担保或者以其他名义向劳动者收取财物。违反的由劳动行政部门责令限期退还劳动者本人，并依照有关法律规定给予处罚。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第九条、第八十四条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——收据、转账记录、聊天记录需自己留存；没有书面收据时，转账备注与聊天记录是关键","地域":"全国","时效":"程序时效——由劳动行政部门责令限期退还，属行政查处路径；走仲裁要钱的，适用仲裁申请时效一年。起算点——自知道或应当知道权利被侵害之日，实务中多按交款之日起算。例外——无特别时效豁免，不适用劳动报酬类例外。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文，第九条、第八十四条）","核对日期":"2026-10-03","备注":"交钱时当场要收据，注明款项性质；只有转账记录的，转账备注写清「XX公司押金」。用「不交钱就不办入职」施压的，先保留证据再决定是否交，事后凭证据主张退还。毕业证、学位证只交复印件，并在复印件上写明「仅供办理入职使用」。第 3 节第 3.1 条写过同一问题。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"中","口径":"金钱"}},{"节号":15,"节名":"应届生与第一份工作","条号":15,"标题":"不要签空白合同，也不要在没读过的文件上签字","说人话":"空白合同的风险在于你签的时候不知道里面会填什么，事后它填上对你不利的数字，你很难证明「当时是空的」。所以两条底线：关键栏位空白的合同不签（工资、期限、岗位、工作地点）；没读过的文件不签——尤其那些标题写着「承诺书」「确认书」「放弃声明」的。已经签了空白文件的，尽快要求补填并留存当时的沟通记录。","适用":"入职现场被要求在一叠文件上快速签字，或者拿到的是关键栏位空白的合同。","成本":"不花钱。坚持读完再签，多花二十分钟。","收益":"这属于用人单位免除自己的法定责任、排除劳动者权利的情形——下列劳动合同无效或者部分无效：① 以欺诈、胁迫的手段或者乘人之危，使对方在违背真实意思的情况下订立或者变更劳动合同的；② 用人单位免除自己的法定责任、排除劳动者权利的；③ 违反法律、行政法规强制性规定的。劳动合同被确认无效，劳动者已付出劳动的，用人单位应当向劳动者支付劳动报酬；给对方造成损害的，有过错的一方应当承担赔偿责任。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第二十六条、第二十八条、第八十六条","效力位阶":"法律","主张强度":"可推定","举证难度":"难——「签字时是空白的」这一事实极难证明，需要当时的照片、录音或第三方在场证言","地域":"全国；对空白合同效力的认定，各地裁审口径不同","时效":"程序时效——仲裁申请时效一年。起算点——自知道或应当知道权利被侵害之日。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文，第二十六条、第二十八条、第八十六条）","核对日期":"2026-10-03","备注":"举证难度标「难」——取证时机就在签字当场：① 对空白栏位拍照（带当天日期可见的水印或同框其他文件）；② 要求对方先把关键栏位填好再签；③ 对方坚持先签的，在签字页旁边写明「本条以下栏位签字时为空」，并让对方在同一页签字或至少被你拍照留存。这三条都要在签字当时做，事后补不了。 不确定点在空白合同的效力认定，各地口径不一，可向当地劳动人事争议仲裁委员会或拨 12333 咨询。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"大","口径":"自由"}},{"节号":15,"节名":"应届生与第一份工作","条号":16,"标题":"培训费与服务期：违约金只能约定在两种情形","说人话":"能让你赔违约金的只有两种情况：公司真花钱送你专项培训并约定了服务期，或者签了竞业限制。「入职培训费」「岗前培训费」「工装费」这类一般不算专项培训费。就算是真的专项培训，违约金也有两条上限：不超过培训费总额，且只按你没干满的那部分分摊——不是全额照赔。","适用":"入职时公司安排培训并要求签服务期协议，约定提前离职要赔钱。","成本":"不花钱。核对协议里的对价与金额。","收益":"用人单位为劳动者提供专项培训费用，对其进行专业技术培训的，可以与该劳动者订立协议，约定服务期。劳动者违反服务期约定的，应当按照约定向用人单位支付违约金；违约金的数额不得超过用人单位提供的培训费用，且不得超过服务期尚未履行部分所应分摊的培训费用。除服务期（第二十二条）和竞业限制（第二十三条）两种情形外，用人单位不得与劳动者约定由劳动者承担违约金。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第二十二条、第二十五条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——服务期协议文本自己应留存；培训费凭证由单位掌握，可要求其出示","地域":"全国","时效":"程序时效——用人单位主张违约金走仲裁，时效一年。起算点——自劳动者提出解除之日。例外——无特别时效豁免。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文，第二十二条、第二十五条）","核对日期":"2026-10-03","备注":"有权要求单位出示培训费凭证——发票、付款记录、培训机构合同。出示不了或金额对不上的，违约金的基础就不牢（见第 3 节第 3.13 条）。另注意以特殊待遇（落户、安家费、购房补贴）为对价的服务期，违约属赔偿损失责任，由法院综合实际损失、过错程度、已履行年限酌定（解释（二）第十二条），不是照约定数字付。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"金钱"}},{"节号":15,"节名":"应届生与第一份工作","条号":17,"标题":"变更劳动合同要书面协商一致：调岗降薪不能只听通知","说人话":"岗位、地点、工资这些写在合同里的东西，公司要改必须你同意，而且得写在书面上。它发通知、开会宣布，不算你同意。收到这种通知当天回一句「不同意变更，要求按原合同履行」，用邮件或聊天发出去并留底——这一步是后面所有主张的起点。","适用":"入职后被通知「岗位调整」「薪资结构调整」，并未与你协商。","成本":"不花钱。收到通知当天书面回复一次。","收益":"用人单位与劳动者协商一致，可以变更劳动合同约定的内容。变更劳动合同，应当采用书面形式。 变更后的劳动合同文本由用人单位和劳动者各执一份。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第三十五条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——原合同文本、变更通知、你的书面回复由自己留存；单位若主张已协商一致，须举证","地域":"全国","时效":"程序时效——仲裁申请时效一年。起算点——自变更通知送达之日，或自按新条件实际履行之日。例外——无特别时效，不适用劳动报酬类例外。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文，第三十五条）","核对日期":"2026-10-03","备注":"注意一个反向规则：协商一致变更劳动合同虽未采用书面形式，但已实际履行口头变更超过一个月，变更内容不违反法律、行政法规且不违背公序良俗的，当事人以未采用书面形式为由主张变更无效的，人民法院不予支持（解释（一）第四十三条）。也就是说沉默着按新条件干满一个月，可能被视为同意。有异议就要在当期提出来并留痕。第 4 节第 4.1、4.2 条写了在职期间的处理细节。","成本标签":{"钱":"0","时间":"少","毅力":"些","收益":"大","口径":"自由"}},{"节号":15,"节名":"应届生与第一份工作","条号":18,"标题":"工资总额与社保基数按实际工资申报，不是按最低档","说人话":"社保基数应当按你的实际工资申报，不是按当地最低档。公司按最低档报，你现在到手多几十块，将来少的是养老金、工伤赔偿、失业金。入职第一个月就核一次：把缴费明细里的基数与工资条上的应发工资并排看，对不上就书面要求按实际工资申报并留痕。","适用":"核对入职后第一个月的社保缴费基数。","成本":"不花钱。查一次缴费明细，与工资条比对。","收益":"用人单位应当自行申报、按时足额缴纳社会保险费，非因不可抗力等法定事由不得缓缴、减免；应当按月将缴纳社会保险费
