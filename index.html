的明细情况告知本人。未按时足额缴纳的，由社会保险费征收机构责令限期缴纳或补足，并自欠缴之日起按日加收万分之五的滞纳金；逾期仍不缴纳的，处欠缴数额一倍以上三倍以下罚款。此外，用人单位未办理社会保险登记的，由社会保险经办机构核定其应当缴纳的社会保险费。","依据":"《社会保险法》（2018-12-29 修正）第五十八条、第六十条、第六十三条、第八十六条","效力位阶":"法律","主张强度":"可主张","举证难度":"易——缴费明细属官方系统记录，可自行查询打印；工资流水可自行导出","地域":"全国；缴费基数上下限由参保地每年公布","时效":"程序时效——补缴走社会保险费征收机构责令限期缴纳或补足，属行政征缴路径；主张待遇损失赔偿走仲裁，时效一年。起算点——补缴类自欠缴之日；待遇损失自知道或应当知道损失发生之日。例外——社会保险费征缴不适用劳动关系终止后一年内的仲裁时效限制。","来源":"http://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_296659.html（中国人大网·社会保险法全文，第五十八条、第六十条、第六十三条、第八十六条）","核对日期":"2026-10-03","备注":"低报基数最直接的后果在工伤上——一次性伤残补助金与伤残津贴按「本人工资」即前 12 个月平均月缴费工资计算，基数低报会同步压低这些待遇（见第 13 节第 13.12 条）。入职第一个月就查这件事比离职后翻旧账有效得多；每月查询后截图或导出按月命名，形成连续记录。缴费基数上下限与办理流程向参保地社保经办机构或拨 12333 确认。","成本标签":{"钱":"0","时间":"少","毅力":"些","收益":"大","口径":"健康"}},{"节号":15,"节名":"应届生与第一份工作","条号":19,"标题":"「满一年才缴公积金」不成立：录用之日起 30 日内办缴存登记","说人话":"公积金从录用之日起 30 日内就要办缴存登记，没有「满一年才给缴」这一说。公积金和社保是两套系统、两套罚则，可以分别投诉。查不到缴存记录就书面要求单位办理；不给办可向工作地住房公积金管理中心投诉。","适用":"入职时被告知「公积金满一年才给缴」，或者一直查不到缴存记录。","成本":"不花钱。查一次缴存明细。","收益":"单位录用职工的，应当自录用之日起 30 日内向住房公积金管理中心办理缴存登记，并办理职工住房公积金账户的设立或者转移手续。单位应当按时、足额缴存住房公积金，不得逾期缴存或者少缴。单位不办理缴存登记或者不为职工办理账户设立手续的，由住房公积金管理中心责令限期办理；逾期不办理的，处 5 万元以上 30 万元以下的罚款。单位逾期不缴或者少缴的，责令限期缴存；逾期仍不缴存的，可以申请人民法院强制执行。","依据":"《住房公积金管理条例》（1999 年国务院令第 262 号发布，经 2002-03-24 第一次修订、2019-03-24 第二次修订、2026-08-10 第三次修订）第十五条、第二十条、第三十九条、第四十条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"易——缴存明细可自行查询，属官方系统记录","地域":"全国；缴存比例区间与办理流程由各地住房公积金管理委员会、公积金管理中心规定","时效":"程序时效——单位逾期不缴或少缴的，可向住房公积金管理中心投诉，属行政投诉路径，不受仲裁一年时效约束；若走仲裁主张损失赔偿，适用仲裁时效一年。起算点——行政投诉自知道或应当知道未缴、少缴之日。例外——无特别时效豁免。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=1822（国家行政法规库·住房公积金管理条例现行本；版本说明载明 1999 年国务院令第 262 号发布，2002-03-24 第一次修订、2019-03-24 第二次修订、2026-08-10 第三次修订）","核对日期":"2026-10-03","备注":"版本提示：2026-08-10 第三次修订把罚则条号后移（不办缴存登记／不办账户设立由原第三十七条移至第三十九条，罚款由「1 万元以上 5 万元以下」提高到「5 万元以上 30 万元以下」），第十八条的缴存比例另新增「不得高于国家规定的最高缴存比例」这一上限。引用时务必认准现行本（旧版页面不标废止）。缴存比例下限与上限见第 2 节第 9 条；办理流程向工作地住房公积金管理中心或拨 12333 确认。","成本标签":{"钱":"0","时间":"少","毅力":"些","收益":"中","口径":"金钱"}},{"节号":15,"节名":"应届生与第一份工作","条号":20,"标题":"校招口头承诺与书面合同不一致：以书面为准，口头承诺要留证","说人话":"这一条不给「口头承诺一律算数」的结论，但给两条能用的依据：公司有如实告知义务（第八条），以及故意隐瞒重要事实或提供虚假情况造成损失要赔偿（民法典第五百条）。所以你要做的是把承诺变成可证明的东西：宣讲会的 PPT 截图、面试沟通记录、offer 里写的条件、微信群里的 HR 答复——这些都留好，比对合同文本的差异。差异明显且是公司明知不符的，可以据此主张。","适用":"面试或宣讲时被承诺薪资、职级、期权、户口、工作地点，签合同时发现不一样。","成本":"不花钱。把宣讲材料、面试沟通、offer 都留一份。","收益":"没有可直接援引的条文规定口头承诺的效力。可确证的是：劳动合同应当具备劳动报酬、工作内容和工作地点等必备条款（第十七条）；用人单位招用劳动者时，应当如实告知工作内容、工作条件、工作地点、职业危害、安全生产状况、劳动报酬，以及劳动者要求了解的其他情况（第八条）。合同订立过程中故意隐瞒与订立合同有关的重要事实或者提供虚假情况、有其他违背诚信原则的行为，造成对方损失的，应当承担赔偿责任（《民法典》第五百条）。","依据":"无明文的全国统一规定（指口头承诺与合同不一致时的效力规则）。可确证的是《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第八条、第十七条；《民法典》第五百条","效力位阶":"无明文依据","主张强度":"倡导性","举证难度":"难——口头承诺的事后还原依赖宣讲材料、录音、聊天记录，签约后很难补取","地域":"全国；对口头承诺效力的认定，各地裁审口径差异较大","时效":"程序时效——主张赔偿按民事诉讼时效三年；劳动关系争议走仲裁，时效一年。起算点——自知道或应当知道权利受损害之日。例外——无特别时效豁免。","来源":"「口头承诺的效力规则」无官方一手依据可援引。 尝试过的路径：① 已打开中国人大网劳动合同法全文核对第八条与第十七条，条文规定告知义务与必备条款，但未规定口头承诺与合同不一致时的效力；② 已打开最高人民检察院官网民法典第三编合同全文核对第五百条（缔约过失），条文解决的是隐瞒或虚假陈述的赔偿责任，未直接规定口头承诺的效力；③ 检索其他全国性规定未定位到对应条款。故按「无明文依据」处理，只写可确证的告知义务与缔约过失责任。已核对页面：http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文）；https://www.spp.gov.cn/spp/ssmfdyflvdtpgz/202008/t20200831_478413.shtml（最高人民检察院官网·民法典第三编合同全文）","核对日期":"2026-10-03","备注":"举证难度标「难」——取证时机在宣讲、面试与 offer 阶段，也就是签约之前。具体动作：宣讲会与面试通知截图、offer 原件、HR 沟通记录按时间归档；在签字前就把差异提出来，要求对方书面确认（邮件回复「确认薪资构成为……，与 offer 一致」），对方确认或否认都是证据。若差异重大，签字前是唯一的谈判窗口。具体效力判断建议咨询执业律师；劳动争议的受理与口径向当地劳动人事争议仲裁委员会或拨 12333 确认。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"大","口径":"金钱"}},{"节号":15,"节名":"应届生与第一份工作","条号":21,"标题":"报到证已取消：落户与档案转递不再以它为必需材料","说人话":"报到证从 2023 年起就不再发放了，也不再是落户、档案接收、招聘录用的必需材料。所以如果现在还有人拿「没报到证办不了」来卡你，那是过时的说法。落户与档案的具体办理，直接问拟落户地公安机关户政窗口和档案接收单位（或当地公共就业和人才服务机构）。","适用":"听到「报到证必须交」「没有报到证不能落户/不能接收档案」的说法。","成本":"不花钱。确认一次即可。","收益":"据五部门联合印发的《关于做好取消普通高等学校毕业生就业报到证有关衔接工作的通知》，自 2023 年起，不再发放《全国普通高等学校本专科毕业生就业报到证》和《全国毕业研究生就业报到证》，取消就业报到证补办、改派手续，不再将就业报到证作为办理高校毕业生招聘录用、落户、档案接收转递等手续的必需材料。","依据":"《关于做好取消普通高等学校毕业生就业报到证有关衔接工作的通知》（中组部、人力资源社会保障部、教育部、公安部、国资委，2023 年印发）","效力位阶":"规范性文件","主张强度":"可主张","举证难度":"易——该通知内容公开发布，可直接引用","地域":"全国；落户与档案转递的具体经办要求仍由各地公安、人社与档案接收单位规定","时效":"无特别时效——政策适用本身不涉及时效。起算点：不适用。例外：由落户或档案问题引发的具体争议，适用相应程序的时效。","来源":"https://www.gov.cn/zhengce/zhengceku/202305/content_6857485.htm（中国政府网·国务院政策文件库 > 国务院部门文件，通知全文六项；页头载明发文机关「中共中央组织部 人力资源社会保障部 教育部 公安部 国资委」与发文字号「人社部发〔2023〕26号」，来源「人力资源社会保障部网站」）","核对日期":"2026-10-03","备注":"本条依据是一手全文页（国务院政策文件库的国务院部门文件），不是报道页。引用时不写「第X条」——该通知用「一、二、三……」分项，没有条号，给它编条号就是事故。落户与档案的具体经办口径（需要哪些材料、走哪个窗口）各地不同，须向拟落户地公安机关户政窗口、档案接收单位或当地公共就业和人才服务机构确认，也可拨 12333。第 15.22 条写档案与户口的转递。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"中","口径":"自由"}},{"节号":15,"节名":"应届生与第一份工作","条号":22,"标题":"档案与户口的转递：问清接收单位再动","说人话":"这一条不给统一流程，因为流程本来就是各地各单位定的。要做的是在毕业前把两个问题问清：① 我的档案转到哪里（单位有没有档案保管权？没有的话转到哪个公共就业和人才服务机构？）；② 我的户口迁到哪里（单位集体户？人才集体户？原籍？）。档案别自己拿着——个人自持档案在多数地方不被接收，还会影响将来的政审、职称、退休手续。","适用":"毕业时处理人事档案与户口迁移，或者入职后要办转递。","成本":"不花钱。但跑手续需要时间。","收益":"没有可直接援引的全国统一条文规定毕业生档案与户口的具体转递流程与时限。可确证的是：自 2023 年起，就业报到证不再作为办理落户、档案接收转递等手续的必需材料（见 15.21）。具体的接收单位、材料清单与时限，由档案接收单位（用人单位或其委托的公共就业和人才服务机构）与拟落户地公安机关分别规定。","依据":"无明文的全国统一规定（指档案与户口转递的具体流程与时限）。可确证的是《关于做好取消普通高等学校毕业生就业报到证有关衔接工作的通知》（2023 年印发）关于就业报到证不再作为档案接收转递等手续必需材料的规定","效力位阶":"无明文依据","主张强度":"倡导性","举证难度":"中——需要与学校、用人单位、档案接收机构、公安机关多方确认，凭据是自己的申请与回执","地域":"各地经办口径差异很大，必须以档案接收单位与拟落户地公安机关的规定为准","时效":"无特别时效——经办流程本身不适用时效。起算点：不适用。例外：由档案丢失、迟延转递造成的损害赔偿，适用民事诉讼时效。","来源":"「档案与户口转递流程」无官方一手依据可援引。 尝试过的路径：① 已打开中国政府网关于取消就业报到证的发布页，其内容限于取消报到证，未规定档案与户口的转递流程；② 检索国家层面关于毕业生档案与户口转递的统一规范文件，未定位到可作依据的条文；③ 检索到的相关表述多为各校就业指导口径与地方人社、公安部门办事指南，属地方口径。故按「无明文依据」处理。已核对页面：https://www.gov.cn/lianbo/bumen/202305/content_6857482.htm（中国政府网·五部门发文取消高校毕业生就业报到证）","核对日期":"2026-10-03","备注":"本条不给统一流程。要问的三处：学校就业指导中心或学籍管理部门（派遣与档案去向）、用人单位人事部门或档案接收的公共就业和人才服务机构（接收条件与材料）、拟落户地公安机关户政窗口（迁移条件）。两个易错的点：① 档案个人自持多数地方不接收，尽量走公对公转递；② 转递后主动确认「档案已到」，保留转递单号与接收回执——这两样是日后追溯的唯一凭据。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"中","口径":"自由"}},{"节号":15,"节名":"应届生与第一份工作","条号":23,"标题":"实习期与试用期的区别：两段不同的期限，不能混着用","说人话":"这两段不是同一种东西。实习期是学校培养方案的一部分，试用期是劳动合同的一个阶段。公司先说「实习三个月」再说「试用三个月」，是把两段接在一起用——你要问清的是：这六个月里哪一段有劳动合同、哪一段有社保。拿到毕业证之后还继续「实习」的，要格外注意这一段的性质。","适用":"公司说「先实习三个月，转正后再试用三个月」，或者把实习期当试用期用。","成本":"不花钱。分清自己当前处于哪一段。","收益":"在校生实习走的是实习协议（15.8）；试用期是劳动合同期限内的一个阶段（第十九条），受《劳动合同法》调整。两者性质不同：实习期不产生劳动关系，试用期产生劳动关系且单位受第二十一条的限制（解除须说明理由、限于法定情形）。实习期不能折抵试用期的法定长度。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第十九条、第二十一条；《职业学校学生实习管理规定》（教育部等五部门，2016 年印发）第二条、第十二条","效力位阶":"法律（《职业学校学生实习管理规定》为规范性文件）","主张强度":"可推定","举证难度":"中——需要确定毕业生身份与用工事实的时点；劳动合同、实习协议、社保缴费起始月份是关键材料","地域":"全国；毕业前后过渡期用工关系的定性，各地裁审口径不同","时效":"程序时效——若主张劳动关系项下的权利，仲裁时效一年。起算点——自知道或应当知道权利被侵害之日。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文，第十九条、第二十一条）；https://www.gov.cn/gongbao/content/2016/content_5095761.htm（中国政府网国务院公报 2016 年第 21 号·职业学校学生实习管理规定全文）","核对日期":"2026-10-03","备注":"不确定点在取得毕业证前后过渡期的用工关系定性——已毕业但仍在「实习期」的，各地对这种安排按劳动关系还是其他关系处理，口径不一，故标「可推定」，需向当地劳动人事争议仲裁委员会或拨 12333 确认。自查动作：把劳动合同签订日、社保首次缴费月份、毕业证日期三个时间点列出来，看三者是否衔接。毕业后仍无劳动合同、无社保的，可主张自用工之日起建立劳动关系（第 3 节第 3.3 条）。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"中","口径":"自由"}},{"节号":15,"节名":"应届生与第一份工作","条号":24,"标题":"第一份工作的自查清单：入职第一个月做完这六件事","说人话":"入职第一个月把这六件事做完：① 拿到劳动合同自己那份（第十六条），核对期限、岗位、地点、工资、社保五栏；② 查一次社保参保状态与缴费基数，与工资对比（第五十八条）；③ 查一次公积金缴存记录（公积金条例第十五条）；④ 把 offer、宣讲材料、入职沟通记录归档（15.20）；⑤ 确认试用期约定是否在法定档位内（第十九条）；⑥ 建立按月留档习惯：工资条、缴费明细、考勤记录当月导出。","适用":"刚入职，想把该留的东西一次留齐。","成本":"不花钱。第一个月内抽出两小时。","收益":"没有可直接援引的条文；本条是动作清单。其法律作用是为劳动者一侧的举证责任提供材料（加班费举证责任见解释（一）第四十二条；用人单位对解除、减薪等决定负举证责任见第四十四条），并覆盖本节各条主张所需的凭据。","依据":"无明文的全国统一规定；配套依据为《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第十六条、第十七条、第十九条；《社会保险法》（2018-12-29 修正）第五十八条、第六十条；《住房公积金管理条例》（1999 年国务院令第 262 号发布，2026-08-10 第三次修订）第十五条；《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》（法释〔2020〕26 号，2021-01-01 施行）第四十二条、第四十四条","效力位阶":"无明文依据","主张强度":"倡导性","举证难度":"中——六项都要在入职第一个月主动做，之后账号与数据可能取不到","地域":"全国；各地对材料形式的要求不同","时效":"无特别时效——本条是留档动作，自身不受时效限制。起算点：不适用。例外：所支撑的实体主张受各自时效约束（仲裁一年等）。","来源":"无官方一手依据可援引（本条是动作清单）。其配套条文一手页：http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文）；http://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_296659.html（中国人大网·社会保险法全文）；https://xzfg.moj.gov.cn/front/law/detail?LawID=1822（国家行政法规库·住房公积金管理条例现行本）；https://www.court.gov.cn/zixun/xiangqing/282121.html（最高人民法院官网·劳动争议解释（一）全文）","核对日期":"2026-10-03","备注":"六项里最容易被跳过的是第 ④ 项与第 ⑥ 项：offer 与宣讲材料在入职后往往被丢进邮箱深处，工资条与缴费明细不按月导出则几个月后自动清理。这两个动作错过就没有补救。 电子工资条建议每月到账当天导出并按月命名（第 4 节第 4.15 条）。具体查询渠道向参保地社保经办机构、工作地公积金管理中心或拨 12333 确认。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"自由"}}];
const q = document.getElementById('q');
const list = document.getElementById('list');
const meta = document.getElementById('meta');
const filtersEl = document.getElementById('filters');
const groupsEl = document.getElementById('groups');

// 筛选维度：按证据判断的三个关键字段，加成本标签里最常被筛的两项
const DIMS = [
  {key:'主张强度', label:'主张强度'},
  {key:'举证难度', label:'举证难度'},
  {key:'效力位阶', label:'效力位阶'},
];
const COST = [
  {tag:'钱', label:'花费'},
  {tag:'时间', label:'时间'},
  {tag:'毅力', label:'毅力'},
];
const active = new Map(); // 维度 -> Set(取值)
const activeCost = new Map();

const clean = (v) => (v || '').split(/[——（(]/)[0].trim();
const values = (key) => {
  const s = new Set();
  DATA.forEach(e => { const v = clean(e[key]); if (v) s.add(v); });
  return [...s].sort();
};

// 顶部筛选条
DIMS.forEach(d => {
  const vals = values(d.key);
  if (vals.length < 2) return;
  const row = document.createElement('div');
  row.className = 'fgroup';
  row.innerHTML = '<span>' + d.label + '</span>';
  vals.forEach(v => {
    const b = document.createElement('button');
    b.className = 'chip'; b.type = 'button'; b.textContent = v;
    b.setAttribute('aria-pressed','false');
    b.onclick = () => {
      const set = active.get(d.key) || new Set();
      if (set.has(v)) set.delete(v); else set.add(v);
      if (set.size) active.set(d.key, set); else active.delete(d.key);
      b.setAttribute('aria-pressed', set.has(v) ? 'true' : 'false');
      render(); syncUrl();
    };
    row.appendChild(b);
  });
  groupsEl.appendChild(row);
});
COST.forEach(c => {
  const vals = [...new Set(DATA.map(e => (e.成本标签||{})[c.tag]).filter(Boolean))].sort();
  if (!vals.length) return;
  const row = document.createElement('div');
  row.className = 'fgroup';
  row.innerHTML = '<span>' + c.label + '</span>';
  vals.forEach(v => {
    const b = document.createElement('button');
    b.className = 'chip'; b.type = 'button'; b.textContent = v;
    b.setAttribute('aria-pressed','false');
    b.onclick = () => {
      const set = activeCost.get(c.tag) || new Set();
      if (set.has(v)) set.delete(v); else set.add(v);
      if (set.size) activeCost.set(c.tag, set); else activeCost.delete(c.tag);
      b.setAttribute('aria-pressed', set.has(v) ? 'true' : 'false');
      render(); syncUrl();
    };
    row.appendChild(b);
  });
  groupsEl.appendChild(row);
});

const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

function match(e, term) {
  if (!term) return true;
  const hay = [e.标题, e.说人话, e.成本, e.收益, e.依据, e.备注, e.适用, e.时效, e.地域, e.节名].join(' ').toLowerCase();
  return term.toLowerCase().split(/\s+/).every(t => hay.includes(t));
}

function render() {
  const term = q.value.trim();
  const rows = DATA.filter(e => {
    for (const [k, set] of active) if (!set.has(clean(e[k]))) return false;
    for (const [tag, set] of activeCost) if (!set.has((e.成本标签||{})[tag])) return false;
    return match(e, term);
  });

  list.textContent = '';
  if (!rows.length) {
    const d = el('div','empty','没有匹配的条目。试试减少筛选条件，或换一个关键词。');
    list.appendChild(d);
  }
  rows.forEach(e => list.appendChild(card(e)));
  meta.textContent = '显示 ' + rows.length + ' / ' + DATA.length + ' 条' + (term ? '（关键词：「' + term + '」）' : '');
}

function card(e) {
  const c = el('article','card');
  const h = el('h2');
  h.appendChild(el('span','num', e.节号 + '.' + e.条号));
  h.appendChild(document.createTextNode(e.标题));
  c.appendChild(h);

  const b = el('div','badges');
  b.appendChild(el('span','badge section', '第 ' + e.节号 + ' 节 · ' + e.节名));
  if (e.主张强度) b.appendChild(el('span','badge ' + claimClass(e.主张强度), '主张强度：' + clean(e.主张强度)));
  if (e.举证难度) b.appendChild(el('span','badge ' + proofClass(e.举证难度), '举证难度：' + clean(e.举证难度)));
  if (e.效力位阶) b.appendChild(el('span','badge', e.效力位阶));
  if (e.核对日期) b.appendChild(el('span','badge', '核对 ' + e.核对日期));
  c.appendChild(b);

  if (e.说人话) c.appendChild(el('p','plain', e.说人话));

  const det = el('details');
  det.appendChild(el('summary', null, '展开全部字段（成本 / 收益 / 依据 / 时效 / 来源 / 备注）'));
  const dl = el('dl','fields');
  [['适用',e.适用],['成本',e.成本],['收益',e.收益],['依据',e.依据],['时效',e.时效],['地域',e.地域],['来源',e.来源],['备注',e.备注]]
    .forEach(([k,v]) => {
      if (!v) return;
      const row = el('div','field');
      row.appendChild(el('dt', null, k));
      const dd = el('dd');
      if (k === '备注' || k === '来源') {
        const n = el('div', k === '备注' ? 'note' : '', v);
        dd.appendChild(n);
      } else {
        dd.textContent = v;
      }
      row.appendChild(dd);
      dl.appendChild(row);
    });
  det.appendChild(dl);
  c.appendChild(det);
  return c;
}

function claimClass(v) {
  const s = clean(v);
  return s === '可主张' ? 'claim-strong' : s === '可推定' ? 'claim-mid' : 'claim-weak';
}
function proofClass(v) {
  const s = clean(v);
  return s === '易' ? 'proof-easy' : s === '中' ? 'proof-mid' : 'proof-hard';
}

// 筛选用 URL query 保存，便于分享
function syncUrl() {
  const p = new URLSearchParams();
  if (q.value.trim()) p.set('q', q.value.trim());
  for (const [k,set] of active) if (set.size) p.set(k, [...set].join(','));
  for (const [t,set] of activeCost) if (set.size) p.set('成本' + t, [...set].join(','));
  const s = p.toString();
  history.replaceState(null, '', s ? '?' + s : location.pathname);
}
q.addEventListener('input', () => { render(); syncUrl(); });

// 初始化：从 URL 恢复状态
(function init(){
  const p = new URLSearchParams(location.search);
  if (p.get('q')) q.value = p.get('q');
  for (const [k,v] of p) {
    if (k === 'q') continue;
    if (k.startsWith('成本')) activeCost.set(k.slice(2), new Set(v.split(',')));
    else active.set(k, new Set(v.split(',')));
  }
  // 恢复按钮态
  document.querySelectorAll('.chip').forEach(btn => {
    const label = btn.textContent;
    const row = btn.parentElement;
    const dim = row.firstElementChild.textContent;
    let on = false;
    if (dim === '主张强度' || dim === '举证难度' || dim === '效力位阶') {
      const set = active.get(dim); on = !!(set && set.has(label));
    } else {
      const tag = dim === '花费' ? '钱' : dim;
      const set = activeCost.get(tag); on = !!(set && set.has(label));
    }
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
})();

render();
</script>
</body>
</html>
