const DATA = [{"节号":1,"节名":"签合同之前","条号":1,"标题":"用工一个月内必须签书面劳动合同，不签要付二倍工资","说人话":"上班满一个月公司还不跟你签书面合同，从第二个月起它得给你双份工资，最多十一份。满一年还没签，法律上就当你们已经签了无固定期限合同——但这个「当作已签」的期间，法院不支持再要二倍工资了。","适用":"所有建立劳动关系的用工。用人单位自用工之日起满一个月未与劳动者订立书面劳动合同。","成本":"时间——主张二倍工资要走劳动仲裁，立案到裁决一般几个月；金钱——仲裁不收费，律师费通常自己承担。举证主要靠工资流水和考勤记录，可自行取得。","收益":"自用工满一个月的次日起，到补订书面合同的前一日止，每月支付二倍工资，最长支付十一个月。满一年仍未订立的，视为双方已订立无固定期限劳动合同。","依据":"《劳动合同法》第十条、第八十二条；《劳动合同法实施条例》第六条、第七条","效力位阶":"法律（第八十二条为法律条文；实施条例为行政法规）","主张强度":"可主张","举证难度":"易——工资流水、考勤记录、工作沟通记录可自证用工起止时间；未签合同这一事实本身由用人单位举证反驳","地域":"全国","时效":"仲裁申请时效一年。二倍工资按月各自产生独立请求权，逐月起算，需逐月主张；起算点为用工满一个月的次日，截止于补订合同前一日","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文；该页为 2007 年通过之原文，本书引用的现行版本为 2012-12-28 修正、2013-07-01 施行，版本依据见 sources/法规清单.md）；https://www.gov.cn/zhengce/zhengceku/2008-09/19/content_6630.htm（实施条例全文）","核对日期":"2026-10-03","备注":"例外情形下可能不支持二倍工资——不可抗力、劳动者本人故意或重大过失（例如负责签订合同的人事人员自己没有签）、医疗期与孕期产期哺乳期等法定顺延期间。满一年后「视为已订立无固定期限合同」的期间不再支持二倍工资（最高人民法院劳动争议解释（二）第九条），别把拟制期间当成二倍工资窗口。","成本标签":{"钱":"0","时间":"中","毅力":"否","收益":"大","口径":"金钱"}},{"节号":1,"节名":"签合同之前","条号":2,"标题":"试用期长度按合同期限分档，同一单位只能约定一次","说人话":"试用期最长多长是法律按合同期限定死的——合同签三个月到一年，试用期最多一个月；一年到三年，最多两个月；三年以上或者无固定期限，最多六个月；合同不到三个月，或者以完成一项工作为期限的，根本不能约定试用期。同一个单位跟你只能约定一次试用期。约超了、重复约了，超出那部分按试用期满后的月工资赔你。","适用":"所有约定试用期的劳动合同。","成本":"不额外花钱。需要核对一次合同文本，几分钟。","收益":"超出法定上限的试用期约定无效，已履行的超期部分可以主张赔偿金，标准为试用期满月工资。","依据":"《劳动合同法》第十九条、第八十三条","效力位阶":"法律","主张强度":"可主张","举证难度":"易——合同文本本身即可证明约定内容；换签新合同时再次约定试用期的，新旧合同对比即可","地域":"全国","时效":"仲裁申请时效一年，自知道或应当知道权利被侵害之日起算。主张超期履行赔偿金的，一般自超期履行期间起算","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文；该页为 2007 年通过之原文，本书引用条文的现行版本为 2012-12-28 修正，版本依据见 sources/法规清单.md）","核对日期":"2026-10-03","备注":"试用期包含在劳动合同期限内。合同只约定试用期、没有约定合同期限的，试用期不成立，那个期限就是合同期限。签合同前把「合同期限」和「试用期」两栏对着上表核一遍，这是签字前三十秒能做完的事。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"中","口径":"金钱"}},{"节号":1,"节名":"签合同之前","条号":3,"标题":"试用期工资不得低于约定工资的八成，也不得低于当地最低工资","说人话":"试用期工资有两条下限，得同时满足：一是不低于本单位同岗位最低档工资或者合同约定工资的八成，二是不低于当地最低工资标准。只满足一条不算合法。","适用":"所有处于试用期的劳动者。","成本":"不花钱。核对一次工资条和合同约定的工资数额。","收益":"低于法定下限的部分可主张补足差额。","依据":"《劳动合同法》第二十条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——工资流水和合同约定的工资数额自己拿得到；「本单位相同岗位最低档工资」由用人单位掌握，可能需其举证","地域":"当地最低工资标准由各省、自治区、直辖市确定并定期调整，需查工作地的现行标准","时效":"仲裁申请时效一年，逐月起算。拖欠劳动报酬的争议在劳动关系存续期间不受一年限制，劳动关系终止的，自终止之日起一年内提出（《劳动争议调解仲裁法》第二十七条）","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文；该页为 2007 年通过之原文，本书引用条文的现行版本为 2012-12-28 修正，版本依据见 sources/法规清单.md）；当地最低工资标准以省、市人社部门官方发布为准","核对日期":"2026-10-03","备注":"「百分之八十」的比较基准在实务中有两种理解——按合同约定工资，或按本单位相同岗位最低档工资，取对劳动者有利的口径主张。地方裁审口径可能不同，主张前可向当地劳动人事争议仲裁委员会或 12333 确认。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"中","口径":"金钱"}},{"节号":1,"节名":"签合同之前","条号":4,"标题":"试用期不是「想辞就辞」，单位要说明理由","说人话":"试用期内公司不能随便让你走。只有你严重违纪、严重失职、试用期被证明不符合录用条件，或者因病、不能胜任工作这几类法定情形，它才能解除，而且必须向你说明理由。说不出理由、拿不出证据，就是违法解除，赔偿按经济补偿的两倍算。","适用":"处于试用期的劳动者，被用人单位单方解除劳动合同的情形。","成本":"时间——申请仲裁到裁决一般几个月；需要保存解除通知、考核记录和沟通记录。","收益":"违法解除的，可要求继续履行合同，或者要求支付赔偿金，标准为经济补偿标准的二倍。","依据":"《劳动合同法》第二十一条、第三十九条、第四十条第一项与第二项、第四十八条、第八十七条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——解除通知和理由由用人单位给出，可留存；「不符合录用条件」的举证责任在用人单位，但它往往依赖入职时是否明确了录用条件","地域":"全国","时效":"仲裁申请时效一年，自收到解除通知之日起算","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文；该页为 2007 年通过之原文，本书引用条文的现行版本为 2012-12-28 修正，版本依据见 sources/法规清单.md）","核对日期":"2026-10-03","备注":"关键在入职时用人单位有没有把「录用条件」写清楚并让你签收。 如果从头到尾没有书面录用条件，它主张「不符合录用条件」就很难成立。所以签合同时把岗位职责、考核标准问清楚，本身就是防御动作。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"大","口径":"自由"}},{"节号":1,"节名":"签合同之前","条号":5,"标题":"连续两次固定期限合同之后，第三次该提无固定期限","说人话":"连续签过两次固定期限合同，第三次续签时你可以要求签无固定期限合同，公司原则上必须签。关键是必须在签字之前书面提出——先签了固定期限的文本再去主张，实务上很难翻过来。","适用":"已连续订立二次固定期限劳动合同，且不存在《劳动合同法》第三十九条、第四十条第一项与第二项规定情形的劳动者，再次续订时。","成本":"时间——提一次书面主张几分钟，但一旦涉诉可能几个月；不花钱。","收益":"除劳动者自己要求订立固定期限合同外，用人单位应当订立无固定期限劳动合同。这是法律给的选择权，不是恩赐。","依据":"《劳动合同法》第十四条第二款第三项、第九十七条第一款","效力位阶":"法律","主张强度":"可主张（权利本身）；在签署固定期限文本之后再主张能否翻转，属可推定，实务支持率低","举证难度":"中——历次合同文本需要劳动者自行留存（法律要求双方各执一份），丢了就要向单位调取或用社保缴费记录、工资流水佐证在职历史","地域":"全国","时效":"仲裁申请时效一年。起算点：自续订节点届至之日起算——权利在这一刻产生，就要在这一刻书面提出。主张订立无固定期限合同的，应在签署续订文本之前提出；签了固定期限文本再主张，起算点与主张力都会变得不利","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文；该页为 2007 年通过之原文，本书引用条文的现行版本为 2012-12-28 修正，版本依据见 sources/法规清单.md）","核对日期":"2026-10-03","备注":"「连续订立二次」的次数认定已扩张（最高人民法院劳动争议解释（二）第十条）：① 双方协商延长合同期限累计达到一年以上、延长期届满的；② 约定合同期满后自动续延、续延期届满的；③ 劳动者非因本人原因仍在原工作场所与岗位工作、用人单位变换合同订立主体但继续劳动管理、合同期限届满的；④ 以其他违反诚信原则的规避行为再次订立合同、期限届满的，人民法院也认定为符合「连续订立二次」。这意味着判断「这是第几次」不能只看手里有几份合同文本——历次延期协议和换主体重签都可能已被计入。 签续签文本前，把历次合同、延期协议、主体变更记录理一遍。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"大","口径":"自由"}},{"节号":1,"节名":"签合同之前","条号":6,"标题":"合同期满后继续上班超过一个月，可以要求按原条件续订","说人话":"合同到期了，公司既不说签也不让你走，你继续上班超过一个月，就可以要求按原来的条件把合同续上；如果本来就已经符合签无固定期限合同的条件，可以要求按原条件签无固定期限合同。","适用":"劳动合同期满后劳动者仍在原用人单位工作，用人单位未表示异议，超过一个月未订立新合同。","成本":"时间——主张走仲裁，一般几个月；需要留存期满后继续上班的证据。","收益":"可请求用人单位以原条件续订劳动合同；此时已符合订立无固定期限合同情形的，可请求以原条件订立无固定期限劳动合同。","依据":"最高人民法院《关于审理劳动争议案件适用法律问题的解释（二）》（法释〔2025〕12 号）第十一条；《劳动合同法》第十四条","效力位阶":"司法解释","主张强度":"可主张","举证难度":"中——需要证明「期满后仍在工作」和「超过一个月」。考勤记录、工资发放记录、工作沟通记录都可以用，但这些记录在单位系统里，离职后可能无法再取，在职期间就要导出","地域":"全国","时效":"仲裁申请时效一年。一个月是法律事实的固定节点，从期满之日起算","来源":"http://gongbao.court.gov.cn/Details/bb72019c45453f84d920bd6375573e.html（最高人民法院公报·解释（二）全文，第十一条；2026-10-03 实测 HTTP 200 并逐字比对通过）","核对日期":"2026-10-03","备注":"本条法律依据是 2025-09-01 施行的最高人民法院劳动争议解释（二）。该解释较新，部分地方仲裁委与法院的裁判口径可能仍在跟进，条款适用以个案为准。查询渠道：当地劳动人事争议仲裁委员会。","成本标签":{"钱":"0","时间":"中","毅力":"否","收益":"大","口径":"自由"}},{"节号":1,"节名":"签合同之前","条号":7,"标题":"合同期满恰逢法定顺延情形，顺延期间不触发二倍工资","说人话":"合同到期时你正好在医疗期、孕期产期哺乳期这类法律不许公司解除的情形里，合同会自动顺延到情形消失才终止。但别指望在顺延期里再要一份「没签合同」的二倍工资——法院认定这属于依法自动续延，不算未订立书面合同。","适用":"劳动合同期满时，劳动者正处于《劳动合同法》第四十二条规定的不得解除情形，或者服务期尚未到期、工会任期未届满。","成本":"不花钱。需要判断自己是否处于这些情形，可能要与人力资源部门或律师确认。","收益":"明确预期——顺延期间不触发未订立书面劳动合同的二倍工资；顺延至相应情形消失时合同终止。","依据":"《劳动合同法》第四十二条、第四十五条；《劳动合同法实施条例》第十七条；最高人民法院劳动争议解释（二）第八条","效力位阶":"法律 + 行政法规 + 司法解释","主张强度":"可主张（顺延本身的认定明确）；二倍工资在顺延期间不支持，此为确定的否定结论","举证难度":"中——需要证明处于第四十二条情形（医疗期证明、孕期证明等）；服务期与工会任期由相应文件证明","地域":"全国","时效":"仲裁申请时效一年，自相应情形消失、合同终止之日起算","来源":"http://gongbao.court.gov.cn/Details/bb72019c45453f84d920bd6375573e.html（最高人民法院公报·解释（二）全文，第八条；2026-10-03 实测 HTTP 200）","核对日期":"2026-10-03","备注":"例外要记住：第四十二条第二项（患职业病或者因工负伤并被确认丧失或者部分丧失劳动能力）不适用顺延，其合同终止按工伤保险的规定执行。别把这两类混在一起。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"中","口径":"金钱"}},{"节号":1,"节名":"签合同之前","条号":8,"标题":"「自愿放弃缴纳社保」的承诺无效，但仍可据此被迫离职","说人话":"入职时被要求签「自愿放弃社保」的承诺书，那个承诺在法律上是无效的——社保是强制义务，签了也不算数。你照样可以「公司没依法缴社保」为由辞职并要经济补偿。但要注意：如果公司事后依法补缴了，它可以要求你把之前按月发给你的「社保补贴」类补偿款退回去。","适用":"曾签署过自愿放弃缴纳社会保险费的承诺书或协议的劳动者。","成本":"时间——主张被迫解除并索要补偿走仲裁，一般几个月；需要留存签署过的承诺书。","收益":"该承诺或约定无效，不影响劳动者依《劳动合同法》第三十八条第三项解除合同并主张经济补偿。","依据":"《劳动合同法》第三十八条第三项、第四十六条第一项、第四十七条；最高人民法院劳动争议解释（二）第十九条；《社会保险法》第五十八条、第六十条","效力位阶":"法律 + 司法解释","主张强度":"可主张","举证难度":"中——承诺书、工资条里的「社保补贴」项目、社保缴费记录都要留存；补缴是否已发生由用人单位主张并举证","地域":"全国","时效":"仲裁申请时效一年，自解除劳动合同之日起算（被迫解除的起算点是解除行为发生日）","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文）；http://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_296659.html（中国人大网·社会保险法全文，含 2018 修正说明）；最高人民法院劳动争议解释（二）全文见 http://gongbao.court.gov.cn/Details/bb72019c45453f84d920bd6375573e.html","核对日期":"2026-10-03","备注":"如果打算走这条路，辞职时书面通知里写的理由必须是「用人单位未依法为劳动者缴纳社会保险费」。 写成「个人原因」就拿不到经济补偿，事后翻案极难。这是本书里最容易因为一个词丢掉一整笔钱的地方。","成本标签":{"钱":"0","时间":"中","毅力":"否","收益":"大","口径":"金钱"}},{"节号":1,"节名":"签合同之前","条号":9,"标题":"单位不续签、或者降低条件续签，都要付经济补偿","说人话":"合同到期，公司不续签，要给你按工龄算的补偿；公司续签但把条件降低了、你不同意，它也照样要付。只有一种情况它不用付——它维持原条件甚至提高条件，是你不愿意续。","适用":"固定期限劳动合同期满终止的情形。","成本":"时间——协商不成走仲裁，一般几个月。","收益":"按工作年限计算的经济补偿，每满一年一个月工资。单位维持或提高原条件续签而劳动者不同意的，单位不付补偿；单位降低条件的，仍应支付。","依据":"《劳动合同法》第四十四条第一项、第四十六条第五项、第四十七条；《劳动合同法实施条例》第二十七条","效力位阶":"法律 + 行政法规","主张强度":"可主张","举证难度":"中——合同文本、终止通知、历年工资流水可自证；「续签条件是否低于原合同」由主张免付的用人单位举证","地域":"全国","时效":"仲裁申请时效一年，自合同终止之日起算","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文；该页为 2007 年通过之原文，本书引用条文的现行版本为 2012-12-28 修正，版本依据见 sources/法规清单.md）；https://www.gov.cn/zhengce/zhengceku/2008-09/19/content_6630.htm","核对日期":"2026-10-03","备注":"「月工资」的口径是按应得工资算，包括计件工资、奖金、津贴和补贴等货币性收入，不是只算基本工资（实施条例第二十七条）。工作不满十二个月的按实际月数平均。月工资高于用人单位所在地上年度职工月平均工资三倍的，按三倍封顶、年限最高不超过十二年。续签谈判时，把「降低条件」的证据留好——降的是哪一项、原来说多少、现在说多少，写到书面上。","成本标签":{"钱":"0","时间":"中","毅力":"否","收益":"大","口径":"金钱"}},{"节号":1,"节名":"签合同之前","条号":10,"标题":"经济补偿按工龄三年零五个月算成四个月","说人话":"经济补偿的算法是：在这个单位每满一年算一个月工资；六个月以上不满一年，按一年算；不满六个月，算半个月。比如干了三年零五个月，是三个月加半个月，共三点五个月；干了三年零七个月，按四年算，共四个月。","适用":"任何需要计算经济补偿的场合。","成本":"不花钱。算一次几分钟。","收益":"算清应得数额，谈判和仲裁时心里有数。","依据":"《劳动合同法》第四十七条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——工作年限靠合同和社保记录自证；月工资基数靠离职前十二个月工资流水，需要自己提前导出来","地域":"全国","时效":"仲裁申请时效一年，自解除或终止之日起算","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文；该页为 2007 年通过之原文，本书引用条文的现行版本为 2012-12-28 修正，版本依据见 sources/法规清单.md）","核对日期":"2026-10-03","备注":"月工资基数是解除或终止前十二个月的平均应得工资，含奖金、津贴、补贴（实施条例第二十七条），且是「应得」不是「实发」。离职前先把近十二个月的工资条和个税收入记录导出——离职后系统账号失效，这一项常常取不到。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"中","口径":"金钱"}},{"节号":1,"节名":"签合同之前","条号":11,"标题":"离职时单位必须给证明，并在十五日内转社保","说人话":"离职时公司必须给你一份解除或终止劳动合同的证明，而且要在十五天内把你的档案和社保关系转出去。证明必须写四样：合同期限、解除或终止日期、工作岗位、在本单位的工作年限。少写了、夹带了对你不利的内容，当场就可以要求改。它不给你、或者耽误你领失业金，要担赔偿责任。","适用":"劳动合同解除或终止的所有情形。","成本":"不花钱。核对一次离职证明的四项内容，几分钟。","收益":"单位应在解除或终止时出具证明，并在十五日内办理档案和社会保险关系转移手续。不出具或内容不全影响你后续就业、领取失业金的，可主张赔偿。","依据":"《劳动合同法》第五十条、第八十九条；《劳动合同法实施条例》第二十四条","效力位阶":"法律 + 行政法规","主张强度":"可主张","举证难度":"易——证明文件本身、社保缴费记录的断缴月份都可以自证","地域":"全国","时效":"仲裁申请时效一年。起算点：自劳动合同解除或终止之日起算。但离职证明是领失业保险金的必要材料，拖着不办会直接损失失业金——这一项的损失发生在离职当时，事后主张赔偿要另外证明损害","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文；该页为 2007 年通过之原文，本书引用条文的现行版本为 2012-12-28 修正，版本依据见 sources/法规清单.md）；https://www.gov.cn/zhengce/zhengceku/2008-09/19/content_6630.htm","核对日期":"2026-10-03","备注":"经济补偿在办结工作交接时支付。单位对已解除或终止的劳动合同文本至少保存二年备查，那是课给单位的义务；劳动者自己也要留存文本，法律要求双方各执一份。离职当天就把证明拿到手并拍照留存，别等以后去要。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"中","口径":"金钱"}},{"节号":1,"节名":"签合同之前","条号":12,"标题":"劳动者的违约金只有两种情形合法","说人话":"法律只允许两种情形让劳动者赔违约金：一是公司花了专项培训费、约定服务期，你没干满；二是违反了竞业限制约定。除此之外，「违反在职不注册承诺赔十万」这类条款，违约金部分站不住。但注意——违约金站不住不等于没有责任，公司还能按实际损失向你索赔。","适用":"劳动合同中出现「由劳动者承担违约金」条款的场合。","成本":"不花钱。审一次合同，几分钟。","收益":"避开不合法违约金的坑；条款超出法定范围的，可主张不受约束（但用人单位仍可依法主张实际损失赔偿）。","依据":"《劳动合同法》第二十二条、第二十三条、第二十五条、第九十条","效力位阶":"法律","主张强度":"可主张（违约金条款超出法定范围的抗辩）；用人单位另行主张实际损失赔偿的可能性同时存在，属可推定","举证难度":"中——合同文本自证条款内容；实际损失由用人单位举证","地域":"全国","时效":"仲裁申请时效一年。起算点：自劳动合同解除或终止之日起算（条款效力争议随解除行为一并产生）；若争议焦点是已支付违约金的返还，起算点按付款之日与解除之日中较晚者认定，以个案裁审为准","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文；该页为 2007 年通过之原文，本书引用条文的现行版本为 2012-12-28 修正，版本依据见 sources/法规清单.md）","核对日期":"2026-10-03","备注":"以专项培训费为对价的服务期，适用第二十二条违约金框架，违约金不得超过培训费并按未履行部分分摊。以特殊待遇为对价的服务期（落户、购房或租房补贴、安家费等），属赔偿损失责任而非违约金——依最高人民法院劳动争议解释（二）第十二条，法院综合实际损失、过错程度、已履行年限酌定。签这类条款前先看清对价是什么、可能要赔多少。 具体条款的效力判断涉及个案，签约前建议咨询律师。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"中","口径":"金钱"}},{"节号":2,"节名":"在职工资与工时","条号":1,"标题":"加班费三档：平日一点五倍、休息日两倍、法定节假日三倍","说人话":"加班费分三档：平时加班一点五倍工资；周末加班如果没法安排补休，两倍；元旦春节这类法定节假日加班，三倍，而且不能用补休顶掉，必须给钱。","适用":"用人单位安排劳动者延长工作时间、休息日工作、法定休假日工作的情形。","成本":"时间——主张加班费走仲裁，一般几个月；取证要趁在职时做，离职后系统权限没了就取不到。","收益":"平日延长工作时间不低于工资的百分之一百五十；休息日工作又不能安排补休的不低于百分之二百；法定休假日工作不低于百分之三百。","依据":"《劳动法》第四十四条","效力位阶":"法律","主张强度":"可主张","举证难度":"难——加班事实通常由劳动者初步举证，而考勤记录、审批记录在单位系统里。取证时机：在职期间就要导出。 加班审批单、门禁记录、工作群里的任务安排、深夜发送的邮件与文件修改时间，都是加班的佐证","地域":"全国","时效":"仲裁申请时效一年。拖欠劳动报酬的争议在劳动关系存续期间不受一年限制；劳动关系终止的，自终止之日起一年内提出（《劳动争议调解仲裁法》第二十七条）。这一条对追讨加班费至关重要——在职期间可以一直追","来源":"http://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_296651.html（中国人大网·劳动法全文，页内载明 1994-07-05 通过、2009-08-27 第一次修正、2018-12-29 第二次修正；2026-10-03 实测 HTTP 200 并逐字比对第四十四条通过）","核对日期":"2026-10-03","备注":"加班费的举证是这一类主张的主要障碍，不是法律有没有规定。 单位掌握考勤记录却拒不提供的，可请求仲裁委或法院责令其提供；但你自己先要有初步证据证明加过班。另外，如果单位实行综合计算工时制或不定时工作制，加班费规则不同——要看有没有劳动行政部门的批准文件，不是公司自己宣布就算。","成本标签":{"钱":"0","时间":"中","毅力":"否","收益":"大","口径":"金钱"}},{"节号":2,"节名":"在职工资与工时","条号":2,"标题":"单位不付加班费，先投诉才能拿到加付赔偿金","说人话":"公司欠你加班费，先去人力资源社会保障部门投诉，它会责令公司限期给。公司到期还不给，才有那笔「再赔你一半到一倍」的加付赔偿金。注意顺序：得先走行政责令这一步，直接去仲裁要不到加付部分。","适用":"用人单位安排加班但不支付加班费的情形。","成本":"时间——行政投诉一般数周内有反馈；金钱——投诉不收费。","收益":"劳动行政部门责令限期支付，逾期仍不支付的，加付应付金额百分之五十以上百分之一百以下的赔偿金。","依据":"《劳动合同法》第八十五条第三项","效力位阶":"法律","主张强度":"可主张（但要满足「先经行政责令、逾期仍不支付」这个前提）","举证难度":"中——投诉需要提供加班事实与未付加班费的证据；行政责令的程序性文件由行政部门出具","地域":"全国","时效":"仲裁申请时效一年。起算点：自用人单位应支付而未支付之日起算；行政投诉应及时提出，欠薪状态持续期间的投诉不受一年限制约束。加付赔偿金以行政责令程序为前提，先投诉再谈加付","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文）","核对日期":"2026-10-03","备注":"第八十五条列了四种情形都适用这条路径：未按约定或国家规定及时足额支付劳动报酬、低于当地最低工资标准支付、安排加班不支付加班费、解除或终止合同未依法支付经济补偿。「行政责令是加付前提」这一点很多人不知道，直接跳过投诉去仲裁，加付那部分拿不到。投诉渠道：拨打 12333，或向用人单位所在地人力资源社会保障部门劳动保障监察机构投诉。","成本标签":{"钱":"0","时间":"中","毅力":"否","收益":"中","口径":"金钱"}},{"节号":2,"节名":"在职工资与工时","条号":3,"标题":"连续工作满一年，就有带薪年休假","说人话":"只要连续工作满一年，就有带薪年假。天数看的是你这辈子累计工作了多少年，不是在这家公司干了几年：累计满一年不到十年，五天；满十年不到二十年，十天；满二十年以上，十五天。","适用":"机关、团体、企业、事业单位、民办非企业单位、有雇工的个体工商户等单位中，连续工作满十二个月的职工。","成本":"不花钱。算一次天数，几分钟。","收益":"累计工作满一年不满十年的，年休假五天；满十年不满二十年的，十天；满二十年以上的，十五天。国家法定休假日、休息日不计入年休假假期。","依据":"《职工带薪年休假条例》第二条、第三条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"中——累计工作年限要靠自己举证（历次劳动合同、社保缴费记录、离职证明），这一点最容易吃亏，因为很多人换过几家公司，档案没理清","地域":"全国","时效":"仲裁申请时效一年。起算点：自当年度终了、用人单位未安排亦未支付之日起算；跨年度主张年休假的，部分裁审机构按当年度终了起算、部分按离职之日起算，以个案裁审为准","来源":"https://www.gov.cn/zhengce/2007-12/16/content_2602498.htm（中国政府网·全文）","核对日期":"2026-10-03","备注":"「累计工作」不等于「在本单位工作」——这一点的直接条文依据是《企业职工带薪年休假实施办法》第四条：「年休假天数根据职工累计工作时间确定。职工在同一或者不同用人单位工作期间，以及依照法律、行政法规或者国务院规定视同工作期间，应当计为累计工作时间。」跳槽时把每段工作的合同、社保记录、离职证明留好，到主张年假时就是天数依据。不享受当年年休假的情形见《条例》第四条：依法享受寒暑假且天数多于年休假的；请事假累计二十天以上且单位按规定不扣工资的；累计工作满一年不满十年请病假累计二个月以上的、满十年不满二十年累计三个月以上的、满二十年以上累计四个月以上的。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"中","口径":"时间"}},{"节号":2,"节名":"在职工资与工时","条号":4,"标题":"应休未休的年假，按日工资三倍折算","说人话":"公司不让你休年假，那几天要按日工资的三倍给你钱。注意是三倍里含了本来就要发的那一份工资，所以实际多拿的是两倍。","适用":"用人单位确因工作需要不能安排职工休年休假，经职工本人同意后不安排的情形。","成本":"时间——离职节点或年底核算时对一次账，几分钟。","收益":"按日工资收入的百分之三百支付年休假工资报酬，其中包含正常工作期间的工资收入，即额外补百分之二百。","依据":"《职工带薪年休假条例》第五条第三款；《企业职工带薪年休假实施办法》第十条","效力位阶":"行政法规 + 部门规章","主张强度":"可主张","举证难度":"中——工资流水和年假审批记录可自证；「单位已安排而本人不休」与「单位未安排」的区分是争点，休假审批记录和书面安排通知是关键证据","地域":"全国","时效":"仲裁申请时效一年。实务中部分裁审机构认为年休假工资中的「额外百分之二百」属福利性质、适用一年时效，而非劳动报酬的不受限制待遇——这一点地方口径不一，主张前向当地劳动人事争议仲裁委员会或 12333 确认","来源":"https://www.gov.cn/zhengce/2007-12/16/content_2602498.htm；https://www.gov.cn/gongbao/content/2009/content_1265995.htm（实施办法全文）","核对日期":"2026-10-03","备注":"用人单位主张「是职工本人不休」的，需要有职工书面提出的不休假记录。 如果公司只是没安排，也没留下你要求休假的记录，法律上通常认定为「未安排」而不是「你放弃」。所以想休假要留痕，被拒绝也要留痕。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"中","口径":"金钱"}},{"节号":2,"节名":"在职工资与工时","条号":5,"标题":"年中新入职，当年年假按剩余日历天数折算","说人话":"年中入职的人，当年的年假不是按全年给，而是按你入职后到年底还剩多少天折算。折算下来不足一整天的那部分不享受。「剩余日历天数」是从入职那天算到年底的自然日，不是工作日，也不是你在单位干了几个月。注意这个折算方向和你离职那年正好相反：入职看「还剩多少天」，离职看「已经过了多少天」。","适用":"新入职职工满足连续工作满十二个月的条件后，当年度年休假的折算。","成本":"不花钱。入职当年算一次，几分钟。","收益":"当年度年休假天数 =（当年度在本单位剩余日历天数 ÷ 365 天）× 职工本人全年应当享受的年休假天数，折算后不足一整天的部分不享受。","依据":"《企业职工带薪年休假实施办法》第五条","效力位阶":"部门规章","主张强度":"可主张","举证难度":"中——入职日期由劳动合同和入职记录自证；全年应享受天数取决于累计工作年限（见 2.3），换过单位的人要自行举证历段工作经历","地域":"全国","时效":"仲裁申请时效一年。起算点：自当年度结束、用人单位未安排亦未支付之日起算；跨年度主张的，部分裁审机构按当年度终了起算，以个案裁审为准","来源":"https://www.gov.cn/gongbao/content/2009/content_1265995.htm（中国政府网·国务院公报，第五条）","核对日期":"2026-10-03","备注":"这个折算公式和离职时的折算公式（见 2.6）方向相反，容易记混：入职当年看的是剩余日历天数，离职当年看的是已过日历天数。两个公式都在《实施办法》里，条号相邻，核对时看清楚是哪一条。全年应享受天数是按累计工作年限定的（满 1 年不满 10 年 5 天，满 10 年不满 20 年 10 天，满 20 年以上 15 天），不是按在本单位干了几年。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"小","口径":"金钱"}},{"节号":2,"节名":"在职工资与工时","条号":6,"标题":"离职时年假按当年在职天数折算，不足一天不算","说人话":"年中离职，年假按你在单位待了多少天折算，不足一天的部分不给钱，公司多放给你的也不会追回。离职前自己按公式算一遍，别等人力资源部门报个数就签字。","适用":"劳动合同解除或终止时，当年度未安排职工休满应休年休假的情形。","成本":"不花钱。离职前算一次，几分钟。","收益":"应折算未休天数 =（当年度在本单位已过日历天数 ÷ 365）× 全年应休天数 − 当年度已安排天数。折算后不足一整天的部分不支付；单位已安排多于折算数的，多出的部分不扣回。","依据":"《企业职工带薪年休假实施办法》第十二条","效力位阶":"部门规章","主张强度":"可主张","举证难度":"中——离职日期、当年度已休天数、累计工作年限三项都要有据可查","地域":"全国","时效":"仲裁申请时效一年，自离职之日起算","来源":"https://www.gov.cn/gongbao/content/2009/content_1265995.htm","核对日期":"2026-10-03","备注":"这个公式里两个数容易算错：一是「已过日历天数」按自然日算，不是工作日；二是「全年应休天数」看累计工作年限，不是在本单位的年限（见 2.3）。离职结算单签字前把这两项核一遍。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"中","口径":"金钱"}},{"节号":2,"节名":"在职工资与工时","条号":7,"标题":"用工三十日内必须办社保登记","说人话":"上班三十天内公司就得给你办社保登记，以后每个月按时足额缴，还要把缴费明细告诉你。查明细是你自己的事——各地政务服务平台和社保官方应用都能查缴费基数、险种和到账月份，一个季度核一次。","适用":"所有用人单位与职工。","成本":"不花钱。查一次社保缴费记录，几分钟。","收益":"单位应自用工之日起三十日内办理社会保险登记，按时足额缴纳，并按月将缴纳明细告知本人。","依据":"《社会保险法》第五十八条、第六十条","效力位阶":"法律","主张强度":"可主张","举证难度":"易——社保缴费记录可在官方渠道自行查询并打印，属官方系统记录","地域":"缴费基数上下限和比例由各省市确定，需查参保地现行标准","时效":"仲裁申请时效一年；社保欠缴的补缴属行政征收事项，可向社保征收机构或劳动保障监察部门投诉，不受仲裁时效限制的路径通常更有效","来源":"http://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_296659.html（中国人大网·社会保险法全文，含 2018 修正说明）","核对日期":"2026-10-03","备注":"重点核对三件事：基数是否按实际工资申报（不是按最低档）、五险是否齐全、有没有断缴漏缴。基数按最低档缴是常见做法，会导致养老、医疗、失业金、生育待遇全面缩水，而当事人往往多年不知道。发现少缴，可向社会保险费征收机构反映，由征收机构责令限期缴纳或补足。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"大","口径":"金钱"}},{"节号":2,"节名":"在职工资与工时","条号":8,"标题":"单位欠缴社保，按日加收万分之五滞纳金","说人话":"公司少缴或欠缴社保，社保征收机构会责令它补上，而且从欠缴那天起每天加收万分之五的滞纳金；还是不缴，罚款是欠缴额的一倍到三倍。这笔钱是向公司收的，不是从你工资里扣。","适用":"用人单位未按时足额缴纳社会保险费的情形。","成本":"不花钱。向征收机构反映，提交社保缴费记录即可。","收益":"由征收机构责令限期缴纳或补足，自欠缴之日起按日加收万分之五滞纳金；逾期仍不缴纳的，处欠缴数额一倍以上三倍以下罚款。","依据":"《社会保险法》第六十三条、第八十六条","效力位阶":"法律","主张强度":"可主张（补缴由行政机关强制）；滞纳金和罚款是行政责任，不直接支付给劳动者","举证难度":"易——社保缴费记录可自行查询","地域":"由参保地社会保险费征收机构执行，各地经办流程不同","时效":"属社会保险费征收事项，向征收机构反映即可，不受劳动仲裁时效限制","来源":"http://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_296659.html（中国人大网·社会保险法全文，含 2018 修正说明）","核对日期":"2026-10-03","备注":"注意区分两条路：一条是要求补缴（找征收机构，行政路径）；一条是因未依法缴纳社保而被迫解除并主张经济补偿（找仲裁，民事路径）。两者可以并行，但主张的对象不同，别搞混。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"中","口径":"金钱"}},{"节号":2,"节名":"在职工资与工时","条号":9,"标题":"公积金缴存比例不得低于百分之五，逾期不缴可申请法院强制执行","说人话":"公积金单位和个人缴存比例都不能低于你上一年度月平均工资的百分之五，同时也不能高于国家规定的上限。公司不缴或少缴，管理中心会责令限期补上，到期还不动，可以直接申请法院强制执行；连缴存登记或账户设立都不办的，罚款是五万到三十万。","适用":"所有缴存住房公积金的单位与职工。","成本":"不花钱。查一次公积金明细，几分钟。","收益":"单位应按时足额缴存，不得逾期或少缴；缴存比例不得低于职工上一年度月平均工资的百分之五，也不得高于国家规定的最高缴存比例。逾期不缴或少缴的，责令限期缴存，逾期仍不缴的可申请人民法院强制执行。单位不办理缴存登记或不为职工办理账户设立手续的，可处五万元以上三十万元以下罚款。","依据":"《住房公积金管理条例》（2026-08-10 第三次修订）第十五条、第十八条、第二十条、第三十九条、第四十条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"易——公积金缴存明细可在公积金管理中心官方渠道查询","地域":"缴存基数上下限和具体比例由各地住房公积金管理委员会拟订、报省级人民政府批准，需查缴存地现行规定","时效":"属行政管理事项，向住房公积金管理中心投诉不受劳动仲裁时效约束，管理中心责令限期缴存、逾期可申请人民法院强制执行。但如果你走仲裁主张因欠缴造成的损失赔偿，适用一年时效，自知道权利被侵害之日起算——两条路径时效规则不同，别混用","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=1822（国家行政法规库·住房公积金管理条例现行本；版本说明载明 1999-04-03 国务院令第 262 号发布、2002-03-24 第一次修订、2019-03-24 第二次修订、2026-08-10 第三次修订；2026-10-03 实测 HTTP 200 并逐字比对第十八条、第三十九条通过）","核对日期":"2026-10-03","备注":"公积金和社保是两个独立系统、两套投诉渠道，公积金找住房公积金管理中心，社保找社保征收机构或劳动保障监察部门。另外，录用三十日内要办缴存登记，离职三十日内要办变更登记与账户转移或封存——离职时确认封存或转移是否办妥，这直接影响后续公积金贷款的连续性认定，地方口径不同，以缴存地住房公积金管理中心发布为准。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"中","口径":"金钱"}},{"节号":2,"节名":"在职工资与工时","条号":10,"标题":"单位被责令付钱还不付，才加付赔偿金","说人话":"公司欠你钱，先去投诉让它限期给。它到期还不给，才轮到那笔加付赔偿金，比例是应付金额的一半到一倍。顺序不能跳：直接去仲裁，加付那部分拿不到。","适用":"用人单位未按劳动合同约定或国家规定及时足额支付劳动报酬、低于当地最低工资标准支付、安排加班不付加班费、解除或终止合同未依法支付经济补偿这四种情形。","成本":"时间——先行政投诉、再仲裁，整体周期比直接仲裁长；金钱——投诉不收费。","收益":"劳动行政部门责令限期支付；逾期不支付的，加付应付金额百分之五十以上百分之一百以下的赔偿金。","依据":"《劳动合同法》第八十五条","效力位阶":"法律","主张强度":"可主张（以行政责令程序为前提）","举证难度":"中——欠付事实的证据加上行政责令的文件","地域":"全国","时效":"仲裁申请时效一年，起算点：自用人单位应支付而未支付之日起算；行政投诉应及时提出，欠薪状态持续期间的投诉不受一年限制约束","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文）","核对日期":"2026-10-03","备注":"这一条把「行政路径」和「仲裁路径」的顺序关系讲清了，是很多人吃亏的地方。实际操作上，投诉和仲裁准备可以同时推进，但加付赔偿金的主张要等行政责令那一步出结果。","成本标签":{"钱":"0","时间":"多","毅力":"些","收益":"中","口径":"金钱"}},{"节号":2,"节名":"在职工资与工时","条号":11,"标题":"规章制度没公示告知，不能拿来解除合同","说人话":"公司的员工手册、考勤制度、奖惩制度这类直接管到你切身利益的规矩，必须走讨论协商程序，而且必须公示或者告诉你。没告诉过你、你也没签收过的制度，不能拿来当解除你合同的理由。 所以入职时那份「员工手册签收页」很关键——签了就是知道，没签它举证就难。","适用":"用人单位以「严重违反用人单位的规章制度」为由解除劳动合同的情形。","成本":"不花钱。核对一次员工手册签收记录。","收益":"直接涉及劳动者切身利益的规章制度，应当经职工代表大会或全体职工讨论、与工会或职工代表平等协商确定，并公示或告知劳动者。未履行程序的制度，不能作为解除依据。","依据":"《劳动合同法》第四条","效力位阶":"法律","主张强度":"可推定——制度未经民主程序或未公示告知的抗辩方向明确，但「是否属于直接涉及切身利益」「公示告知是否充分」在个案中有裁量空间","举证难度":"中——公示告知的证据由用人单位举证（签收记录、培训记录、系统公告），对劳动者相对有利；但劳动者也要留意自己有没有签过","地域":"全国","时效":"仲裁申请时效一年，自收到解除通知之日起算","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文）","核对日期":"2026-10-03","备注":"不确定点：第四条要求的是「讨论协商 + 公示告知」，但个案中对程序充分性的认定有差异，且劳动者主张「没被告知」时，用人单位举证到什么程度各地口径不完全一致。查询渠道：当地劳动人事争议仲裁委员会，或拨打 12333。 实务建议：签收任何制度文件前先看清内容，签了之后自己留一份版本和日期。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"中","口径":"自由"}},{"节号":3,"节名":"入职与签约","条号":1,"标题":"入职时不得收押金、不得扣押身份证","说人话":"公司没有任何权力收你的押金、保证金，也没有权力扣你的身份证和证书原件。现场要你交钱或者交证件，你直接拒绝；已经交了的，可以要回来，还可以向劳动监察投诉，单位会被处罚。","适用":"入职或用工期间，用人单位要求交押金、保证金、服装费、培训费，或者要求把身份证、毕业证、资格证原件交给单位「保管」的。","成本":"不花钱。当场拒绝或要求退还，耗时几分钟。","收益":"已收的钱可要求全额退还，已扣押的证件可要求限期退还；用人单位另会被劳动行政部门处罚。这一条没有上限金额，交了多少退多少。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第九条、第八十四条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——收据、转账记录、聊天记录需要自己留存；没有书面收据时，转账备注和聊天记录是关键","地域":"全国","时效":"程序时效——用人单位违反规定收取财物的，由劳动行政部门责令限期退还，行政查处路径不走仲裁时效；走仲裁要钱的，适用仲裁申请时效一年。起算点——自知道或应当知道权利被侵害之日，实务中多按交款之日起算。例外——无特别时效豁免，不适用「拖欠劳动报酬不受一年限制」的例外。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文）","核对日期":"2026-10-03","备注":"交钱时当场要收据，注明款项性质；只有转账记录的，转账备注写清「XX公司押金」。用「不交钱就不办入职」施压的，先保留证据再决定是否交。若单位以「培训费」名义收费，同时看第二十二条的服务期规则——真正的专项培训费是按服务期分摊的，不是入职一次性收取。第九条把「扣押证件」和「收取财物」并列为两项禁止行为，第八十四条对两者的处理也是分列的，主张时按实际情形对号。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"中","口径":"金钱"}},{"节号":3,"节名":"入职与签约","条号":2,"标题":"用工之日起三十日内必须办社保登记，入职当月就该有","说人话":"公司从你上班第一天起三十天内就得给你办社保登记，试用期也一样。你可以自己查缴费明细，看到「未参保」「断缴」就被动的是你的医保报销和工伤保障——万一这期间出了工伤，钱得公司自己掏。这是每月花两分钟就能查的事。","适用":"所有建立劳动关系的用工，无论试用期、无论劳动者是否「自愿放弃」。重点核入职第一个月是否已登记参保。","成本":"不花钱。每月自查一次社保缴费明细。","收益":"用人单位未办登记的，由社保经办机构核定其应缴数额；未按时足额缴纳的，责令限期缴纳或补足，并自欠缴之日起按日加收万分之五滞纳金，逾期仍不缴纳的会被处罚款。对劳动者的直接收益是养老保险缴费年限、医疗保险报销资格、工伤保障不断档——工伤这一项最要紧，未参保期间发生工伤，全部待遇由单位按条例标准支付。","依据":"《社会保险法》（2018-12-29 修正）第五十八条、第六十条、第六十三条、第八十六条","效力位阶":"法律","主张强度":"可主张","举证难度":"易——社保缴费记录属官方系统记录，可自行查询打印，不依赖单位配合","地域":"全国；缴费基数上下限、办理时限的具体执行口径由参保地确定","时效":"程序时效——补缴走社保征收机构责令限期缴纳或补足，属行政征缴路径；劳动者主张因未参保造成的待遇损失赔偿，走仲裁，时效一年。起算点——补缴类自欠缴之日起算；待遇损失赔偿自知道或应当知道损失发生之日起算。例外——社会保险费的征缴属行政管理，不适用「劳动关系终止后一年内」的仲裁时效限制。","来源":"http://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_296659.html（社会保险法 2018 修正全文）；https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本，2003 年国务院令第 375 号公布、2010-12-20 修订）","核对日期":"2026-10-03","备注":"签过「自愿放弃社保」承诺书的，该承诺无效，不影响主张（最高人民法院劳动争议解释（二）第十九条）；但单位事后依法补缴的，可以要求劳动者返还此前已支付的社保补偿款（例如按月随工资发的「社保补贴」）。真要断缴时，参保地口径各不相同，先打 12333 或问参保地社保经办机构。","成本标签":{"钱":"0","时间":"少","毅力":"些","收益":"大","口径":"健康"}},{"节号":3,"节名":"入职与签约","条号":3,"标题":"没签合同时，哪些材料能证明劳动关系","说人话":"没签合同不等于没有劳动关系。工资转账记录、考勤打卡、工牌工服、社保缴费记录、工作群聊天记录、同事证言，这些凑起来就能证明你在这里上班。从现在起把工资流水每月导出一次存好，这是最省力也最有用的那一样。","适用":"单位不签书面合同又不承认存在劳动关系；或者发生工伤、欠薪，需要先证明「我在这里上过班」的。","成本":"不花钱。需要入职后头一个月内有意识地留存材料。","收益":"能够认定劳动关系，才能启动仲裁、工伤认定和监察投诉。材料本身不产生金额，它是所有其他主张的入口。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第七条；《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）第十八条；《社会保险法》（2018-12-29 修正）第四条","效力位阶":"法律（《工伤保险条例》为行政法规）","主张强度":"可主张","举证难度":"中——工资流水、考勤截图、聊天记录需要自己主动留存；社保缴费记录可自行查询；单位掌握的考勤原始数据可申请仲裁委调取","地域":"全国","时效":"程序时效——确认劳动关系之诉走仲裁前置，时效一年。起算点——自知道或应当知道权利被侵害之日；工伤场景下，确认劳动关系往往与工伤认定一年期交织，起算点按事故发生之日把握更稳。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）；https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本，2003 年国务院令第 375 号公布、2010-12-20 修订）","核对日期":"2026-10-03","备注":"公章文件最强，财务打款次之，聊天记录再次。让单位出具在职证明、收入证明、盖章的工牌或考勤单，比事后解释截图有用得多。工作账号、内部系统权限在离职当天失效，离职前先导出工资条、考勤、审批记录。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"金钱"}},{"节号":3,"节名":"入职与签约","条号":4,"标题":"合同文本必须自己留一份，签字后当场要","说人话":"签完字必须拿到属于你的那一份，这是法律规定的，不是公司施舍。人事说「统一保管」「回头给你」都不算。拿不到就当场拍照每一页，包括签字页和盖章页。","适用":"所有签订或续签劳动合同、保密协议、竞业限制协议、服务期协议的场合。","成本":"不花钱。签字当场多要一份文本，几分钟。","收益":"文本原件是对抗「改口径」「不认账」最直接的东西。合同期限、岗位、工作地点、工资构成、试用期、限制性条款，全都只有拿到文本才能核对。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第十六条、第八十一条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——能否拿到文本取决于当场是否坚持；拿不到时照片、扫描件、邮件发送的电子版是替代证据","地域":"全国","时效":"程序时效——用人单位未将合同文本交付劳动者的，由劳动行政部门责令改正；造成损害的承担赔偿责任，赔偿请求走仲裁，时效一年。起算点——自知道或应当知道损害发生之日。例外——无特别时效，不适用劳动报酬类例外。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）","核对日期":"2026-10-03","备注":"电子签的，把签署完成后的 PDF 下载到个人设备并另存云端，不要只留在公司系统里。续签时新旧两份都要留——判断「这是第几次固定期限合同」要靠历次文本，只留最新一份会让自己算不清（见 3.13）。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"大","口径":"自由"}},{"节号":3,"节名":"入职与签约","条号":5,"标题":"单位单方调岗降薪，变更合同必须书面协商一致","说人话":"岗位和工资是合同里定死的，公司要改必须你同意，而且得改在书面上。直接通知你换岗降薪、你不同意就逼你走，属于违法变更——这一步走成「公司先违法」，责任在它。收到通知别签字，回复一句「不同意变更，要求按原合同履行」并留底。","适用":"在职期间被通知「明天去另一个部门」「岗位调整为 XX，薪资相应调整」，而你并未同意。","成本":"时间——主张走仲裁，立案到裁决一般几个月；金钱——仲裁不收费，律师费通常自己承担。","收益":"岗位和劳动报酬都是劳动合同必备条款（第十七条），变更须双方协商一致并采用书面形式。单方变更不发生效力；据此被迫解除的，可主张经济补偿，违法解除的按二倍标准主张赔偿金。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第十七条、第三十五条、第三十八条、第四十六条第一项、第四十八条、第八十七条","效力位阶":"法律","主张强度":"可推定","举证难度":"中——原合同文本、调岗通知、工资流水由自己留存；「生产经营需要」的合理性由用人单位举证","地域":"全国；对「合理调岗」的认定各地裁审口径不一，同一城市不同仲裁委也可能不同","时效":"程序时效——仲裁申请时效一年。起算点——自收到调岗降薪通知之日，或自实际按新岗位新工资履行之日；被迫解除的，自解除之日。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）","核对日期":"2026-10-03","备注":"不确定点在「合理调岗」的边界——不降薪、不改变工作地点、与原岗位相近的调整，部分地方认可属用工自主权范围。各地口径差异较大，主张前向当地劳动人事争议仲裁委员会或拨 12333 确认本地裁审尺度。不要在调岗通知上签「同意」，签了之后再主张几乎不可能翻回来。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"金钱"}},{"节号":3,"节名":"入职与签约","条号":6,"标题":"试用期长度按合同期限分档，只能约定一次","说人话":"试用期最长多长是法律按合同期限定死的——合同三个月到一年，试用期最多一个月；一年到三年，最多两个月；三年以上或无固定期限，最多六个月；不满三个月，或者以完成某项工作为期限的，根本不能约定试用期。同一个单位跟你一辈子只能约定一次试用期。约超了、重复约了，超出那部分按试用期满后的月工资赔你。","适用":"新签或续签劳动合同时约定了试用期的。重点核「档位对不对」「是不是又约了一次」。","成本":"不花钱。签字前对着合同期限核一遍试用期，三十秒。","收益":"超出法定上限的试用期部分无效，已履行的超期部分，可要求按试用期满月工资标准支付赔偿金。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第十九条、第八十三条","效力位阶":"法律","主张强度":"可主张","举证难度":"易——合同文本本身就能证明约定内容；换签时新旧合同对比即可","地域":"全国","时效":"程序时效——仲裁申请时效一年。起算点——自知道或应当知道权利被侵害之日；主张超期履行赔偿金的，一般自超期履行期间起算。例外——无特别时效，不适用劳动报酬类例外。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）","核对日期":"2026-10-03","备注":"试用期包含在劳动合同期限内。合同只写试用期、没写合同期限的，试用期不成立，那段期限就是合同期限。第六节第 6.2 条讲了另一种常见写法——用「试用期不合格」解除，理由和证据要求完全不同。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"中","口径":"金钱"}},{"节号":3,"节名":"入职与签约","条号":7,"标题":"试用期工资的两条下限，必须同时满足","说人话":"试用期工资有两条线，得同时过——不低于本单位同岗位最低档工资、或者合同约定工资的八成（这两个哪个都行，取对你有利的），并且不低于当地最低工资标准。只满足一条不合法。","适用":"处于试用期、拿试用期工资的劳动者。","成本":"不花钱。核对一次合同约定工资数额和工资条。","收益":"低于法定下限的部分可要求补足差额。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第二十条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——工资流水和合同约定数额自己拿得到；「本单位相同岗位最低档工资」由单位掌握，可能需其举证","地域":"全国；「当地最低工资标准」各省、自治区、直辖市分别确定并定期调整，以工作地现行标准为准","时效":"程序时效——仲裁申请时效一年；属劳动报酬类。起算点——逐月起算，每月工资差额各自起算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文）；http://114.255.111.180/SYrlzyhshbzb/laodongguanxi_/fwyd/202601/t20260112_565296.html（人力资源和社会保障部「全国各省、自治区、直辖市最低工资标准情况（截至 2026 年 1 月 1 日）」，发布日期 2026-01-12，站内栏目为「首页 > 劳动关系 > 服务园地」；页面以 IP 形式发布，2026-10-03 实测 HTTP 200 并取到全表）。该文的域名版是 https://www.mohrss.gov.cn/SYrlzyhshbzb/laodongguanxi_/fwyd/202601/t20260112_565296.html，但该站对自动化请求返回反爬挑战页、抓不到正文，故复核时用 IP 地址版取数。","核对日期":"2026-10-03","备注":"「百分之八十」的比较基准实务中有两种理解——按合同约定工资，或按本单位相同岗位最低档工资，取对劳动者有利的口径主张。最低工资标准是地方数据，第一档从 2540 元（北京）到 2740 元（上海）不等，同省还有分档，务必按工作地现行标准核。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"中","口径":"金钱"}},{"节号":3,"节名":"入职与签约","条号":8,"标题":"试用期不是「想辞就辞」，解除必须说明理由","说人话":"试用期内公司不能随口让你走。只有你严重违纪、严重失职、被证明不符合录用条件，或者因病不能工作、不能胜任工作这几类情形，它才能解除，而且必须向你说明理由。说不出理由、拿不出证据，就是违法解除，赔偿按经济补偿的两倍算。","适用":"处于试用期，被用人单位单方解除劳动合同的。","成本":"时间——仲裁立案到裁决一般几个月；需要保存解除通知、考核记录、沟通记录。","收益":"违法解除的，可要求继续履行合同，或要求支付赔偿金，标准为经济补偿标准的二倍。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第二十一条、第三十九条、第四十条第一项与第二项、第四十八条、第八十七条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——解除通知和理由由单位出具，自己可留存；「不符合录用条件」的举证责任在单位，但它往往靠入职时有没有明确告知录用条件","地域":"全国","时效":"程序时效——仲裁申请时效一年。起算点——自收到解除通知之日。例外——无特别时效，不适用劳动报酬类例外。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）","核对日期":"2026-10-03","备注":"入职时把「录用条件」书面化（招聘启事截图、岗位说明书、考核标准），是防这一条最有效的动作。单位拿不出录用条件，「不符合录用条件」就无从证明。要求对方把解除理由写在书面通知上；只有口头通知的，当天用邮件或聊天向对方确认「你刚才说的是以 XX 理由解除，对吗」，把答复留底。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"金钱"}},{"节号":3,"节名":"入职与签约","条号":9,"标题":"连续两次固定期限合同之后，续订时应当订立无固定期限","说人话":"跟同一家公司连续签过两次固定期限合同，第三次续签时你可以要求签无固定期限，也就是没有终止日期的合同。要点是：必须在签字之前书面提出来。合同已经按固定期限签了再去要，实践里翻回来的难度很大。","适用":"在同一单位已连续订立两次固定期限劳动合同，且没有严重违纪、不能胜任工作等法定情形，面临第三次续订的。","成本":"时间——主张走仲裁，或先书面提出要求；金钱——仲裁不收费，律师费通常自己承担。关键成本是提出时机：必须在签署续签文本之前提出。","收益":"续订时应订立无固定期限劳动合同，不再有确定的终止时间。这是合同类型上的选择权，不是直接的一笔钱——它换的是「下一次到期不能以期满为由终止」。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第十四条第二款第三项；《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第九十七条第一款","效力位阶":"法律","主张强度":"可主张","举证难度":"中——历次合同文本由双方各执一份，自己应留存全部；用人单位可能主张劳动者已同意订立固定期限合同","地域":"全国","时效":"程序时效——仲裁申请时效一年。起算点——自续订文本签署之日，或自单位明确拒绝订立无固定期限之日。例外——无特别时效，不适用劳动报酬类例外。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）；https://www.gov.cn/zhengce/zhengceku/2008-09/19/content_6630.htm（劳动合同法实施条例全文）","核对日期":"2026-10-03","备注":"第九十七条第一款规定，连续订立固定期限合同的次数自 2008-01-01 劳动合同法施行后续订时开始计算，此前的次数不计入。提出要求用书面形式并留存送达痕迹（邮件、企业微信、书面签收），口头提过不算。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"自由"}},{"节号":3,"节名":"入职与签约","条号":10,"标题":"「续延」「自动续延」「换主体重签」也被算作连续订立次数","说人话":"别只数手里有几份合同。签过「延长协议」累计满一年、合同里写了「期满自动续延」、或者被安排跟另一家公司重签但干的活没变——这几种在 2025 年新司法解释里都算作订立次数。判断自己是不是该提无固定期限，要把这些全算进去。","适用":"单位用延长协议、自动续延条款，或者让你跟关联公司重新签合同，来规避「连续订立二次」认定的情形。","成本":"不花钱。但需要翻出历次签署文本，逐份核对。","收益":"符合下列情形之一的，法院认定为构成「连续订立二次固定期限劳动合同」——① 协商延长合同期限累计达到一年以上，延长期限届满；② 约定合同期满后自动续延，续延期限届满；③ 非因本人原因仍在原工作场所、工作岗位工作，单位变换合同订立主体但继续劳动管理，合同期限届满；④ 以其他违反诚信原则的规避行为再次订立合同，期限届满。","依据":"《最高人民法院关于审理劳动争议案件适用法律问题的解释（二）》（法释〔2025〕12 号，2025-09-01 施行）第十条","效力位阶":"司法解释","主张强度":"可主张","举证难度":"中——历次文本、社保缴费单位变更记录、工作场所与岗位未变的证据需要自己留存；社保缴费明细可自行查询","地域":"全国（该解释为全国统一适用）","时效":"程序时效——仲裁申请时效一年。起算点——自续订或续延期限届满之日。例外——无特别时效，不适用劳动报酬类例外。","来源":"https://www.gov.cn/zhengce/zhengceku/2008-09/19/content_6630.htm（劳动合同法实施条例全文页入口）；http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）；http://gongbao.court.gov.cn/Details/bb72019c45453f84d920bd6375573e.html（最高人民法院公报·关于审理劳动争议案件适用法律问题的解释（二）全文，法释〔2025〕12 号）","核对日期":"2026-10-03","备注":"解释（二）已核到一手全文（最高人民法院公报，2026-10-03 复核），条文与 2026-09-02 记录一致。社保缴费记录会显示缴费单位名称，是证明「换主体但劳动关系连续」的有力材料——换主体前先把自己历年缴费明细导出。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"自由"}},{"节号":3,"节名":"入职与签约","条号":11,"标题":"满一年没签书面合同，视为已订立无固定期限","说人话":"上班满一年公司还没跟你签书面合同，法律上就当你们已经签了无固定期限合同。你可以要求它补一份书面合同。注意有个坑：一年之后那段「视为已签」的期间，不能再要双倍工资了——双倍工资最多算到十一个月，不是一直算。","适用":"从用工之日起满一年，单位一直没有与你订立书面劳动合同的。","成本":"不花钱。需要证明用工起始日期。","收益":"法律上视为双方已订立无固定期限劳动合同；可请求单位补订书面劳动合同（法院支持）。但要清楚：视为已订立的那段期间，主张二倍工资不予支持。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第十四条第三款；《最高人民法院关于审理劳动争议案件适用法律问题的解释（二）》（法释〔2025〕12 号，2025-09-01 施行）第九条","效力位阶":"法律（第九条为司法解释）","主张强度":"可主张","举证难度":"易——用工起始日期可由工资流水、社保缴费记录、考勤记录证明；未签合同这一事实由单位举证反驳","地域":"全国","时效":"程序时效——仲裁申请时效一年。起算点——二倍工资部分自用工满一个月的次月起逐月起算；补订书面合同的请求自视为订立情形出现之日。例外——无特别时效，不适用劳动报酬类例外。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）；http://gongbao.court.gov.cn/Details/bb72019c45453f84d920bd6375573e.html（最高人民法院公报·关于审理劳动争议案件适用法律问题的解释（二）全文，法释〔2025〕12 号）","核对日期":"2026-10-03","备注":"解释（二）已核到一手全文（最高人民法院公报，2026-10-03 复核），条文与 2026-09-02 记录一致。这一条与 3.1 节的二倍工资主张衔接：先算十一个月封顶，再谈无固定期限，别把两件事混成一个数字。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"金钱"}},{"节号":3,"节名":"入职与签约","条号":12,"标题":"员工手册没给你看过，不能拿来解除合同","说人话":"公司的员工手册、考勤规定，必须给你看过、你签过字，才能拿来当处罚你的依据——尤其是扣钱、开除这类直接影响你利益的条款。它只在内部群里发过、你没签收过，拿到仲裁去用是不成立的。反过来，你入职签的那些文件，自己一定要留一份。","适用":"单位以「严重违反规章制度」为由解除合同，而该制度你从未签收、从未被告知、或者只在内部系统里挂过。","成本":"时间——仲裁立案到裁决一般几个月；金钱——仲裁不收费，律师费通常自己承担。","收益":"直接涉及劳动者切身利益的规章制度，应当经民主程序制定并向劳动者公示或告知。未公示告知的制度不能作为约束劳动者的依据；据此解除的，可主张违法解除赔偿金（经济补偿标准的二倍）。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第四条、第三十九条第二项、第四十八条、第八十七条","效力位阶":"法律","主张强度":"可推定","举证难度":"难——制度送达与签收记录由单位掌握；劳动者往往拿不出「我没收到」的直接证据，只能靠反向证明（找不到自己的签收记录、入职材料里没有该版本）","地域":"全国；各地对「公示告知」的证明标准不同，有的认可系统公告加培训记录，有的要求本人签收","时效":"程序时效——仲裁申请时效一年。起算点——自收到解除通知之日。例外——无特别时效，不适用劳动报酬类例外。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）","核对日期":"2026-10-03","备注":"举证难度标「难」——取证时机在离职之前，具体动作：入职以及每次制度换版时，核对自己有没有签收页，没签过的版本当场拍照留存版本号与发布日期；离职前把能访问到的制度公告、培训通知、内部系统截图导出。不确定点在「公示告知」的证明标准上，各地裁审口径不一，可就本地尺度咨询当地劳动人事争议仲裁委员会或拨 12333。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"金钱"}},{"节号":3,"节名":"入职与签约","条号":13,"标题":"服务期违约金有上限，不能随便开价","说人话":"服务期违约金不是公司写多少就是多少。它真金白银出了培训费的，违约金不能超过培训费，还要按你没干满的那部分折算。它给你的是落户指标、安家费这类好处，那赔多少由法院看着实际损失来定，不是照合同上的数字照付。","适用":"单位出钱送你去培训或者给了落户、安家费之类的特殊待遇，签了服务期协议，约定提前离职要赔一笔钱的。","成本":"时间——争议走仲裁；需要核对培训费凭证和已履行年限。金钱——仲裁不收费。","收益":"以专项培训费为对价的，违约金不得超过单位实际支付的培训费用，并按尚未履行的服务期分摊。以落户、购房补贴、安家费等特殊待遇为对价的，属赔偿损失责任，由法院综合实际损失、过错程度、已履行年限酌定，不是照约定的数字直接付。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第二十二条、第二十五条；《最高人民法院关于审理劳动争议案件适用法律问题的解释（二）》（法释〔2025〕12 号，2025-09-01 施行）第十二条","效力位阶":"法律（第十二条为司法解释）","主张强度":"可推定","举证难度":"中——培训费凭证由单位掌握，可要求其出示；服务期协议自己应留存原件","地域":"全国；特殊待遇类服务期的酌定尺度各地差异明显","时效":"程序时效——仲裁申请时效一年。起算点——自单位主张违约金、或自劳动者提出解除之日起。例外——无特别时效，不适用劳动报酬类例外。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）；http://gongbao.court.gov.cn/Details/bb72019c45453f84d920bd6375573e.html（最高人民法院公报·关于审理劳动争议案件适用法律问题的解释（二）全文，法释〔2025〕12 号）","核对日期":"2026-10-03","备注":"不确定点在特殊待遇类服务期的酌定标准——解释（二）第十二条只给了考量因素（实际损失、过错程度、已履行年限），没有给比例。签这类协议前先看清对价是什么、金额写多少，再评估赔偿面；具体尺度向当地劳动人事争议仲裁委员会或拨 12333 了解。解释（二）已核到一手全文（最高人民法院公报，2026-10-03 复核），条文与 2026-09-02 记录一致；第十二条原文为「除向劳动者支付正常劳动报酬外，用人单位与劳动者约定服务期限并提供特殊待遇，劳动者违反约定提前解除劳动合同且不符合劳动合同法第三十八条规定的单方解除劳动合同情形时，用人单位请求劳动者承担赔偿损失责任的，人民法院可以综合考虑实际损失、当事人的过错程度、已经履行的年限等因素确定劳动者应当承担的赔偿责任」。","成本标签":{"钱":"多","时间":"中","毅力":"是","收益":"中","口径":"金钱"}},{"节号":3,"节名":"入职与签约","条号":14,"标题":"入职 30 日内没办社保登记，工伤保险待遇由单位自己掏","说人话":"公司没给你交工伤保险，你在这期间受了工伤，所有本该工伤保险基金出的钱，改由公司按同一套标准自己赔。所以「等下个月再给你交」这种话对你风险很大——这一个月里的工伤，公司得自己扛，但它扛不扛得住是另一回事。","适用":"单位未依法参加工伤保险期间，劳动者发生工伤的。","成本":"时间——工伤认定 60 日（事实清楚、权利义务明确的 15 日），劳动能力鉴定 60 日（必要时可延长 30 日）；金钱——工伤认定与鉴定不收费。","收益":"应当参加工伤保险而未参加的，由社会保险行政部门责令限期参加、补缴并加收滞纳金；用人单位职工在此期间发生工伤的，由该用人单位按条例规定的工伤保险待遇项目和标准支付费用。这不是罚款，是把本该基金付的钱转到单位头上。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）（国务院令第 586 号修订）第六十二条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"中——劳动关系材料、医疗诊断证明需要自己收集；参保状态可自行查询","地域":"全国；具体待遇标准中的一次性工伤医疗补助金、一次性伤残就业补助金由省级政府规定","时效":"程序时效——工伤认定申请，单位 30 日内，劳动者一方 1 年内；劳动能力鉴定申请无固定期限但应在治疗伤情相对稳定后。起算点——自事故伤害发生之日或被诊断、鉴定为职业病之日。例外——用人单位未在 30 日内提交申请的，此期间发生的符合条例规定的工伤待遇等费用由单位负担。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本，2003 年国务院令第 375 号公布、2010-12-20 修订）","核对日期":"2026-10-03","备注":"入职当月就查一次参保状态，发现未参保的立即书面要求单位办理并留存沟通记录。第 8 节会把这套待遇拆开讲——什么算工伤、一年期怎么数、每一笔钱找谁要。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"健康"}},{"节号":3,"节名":"入职与签约","条号":15,"标题":"合同必备条款缺项，签字前逐条核一遍","说人话":"签字前把这九样对着找一遍：公司全称和地址、你的身份信息、合同期限、干什么活在哪里干、上班和休假怎么安排、工资怎么算、社保怎么缴、劳动保护和职业危害防护。合同里没写工资数额、没写工作地点，将来出争议你就没有依据，是被动的一方。","适用":"拿到新签或续签文本、准备签字之前。","成本":"不花钱。逐条核对一次，约十分钟。","收益":"劳动合同应当具备的法定条款：用人单位名称住所与法定代表人或主要负责人、劳动者姓名住址与身份证号、合同期限、工作内容和工作地点、工作时间和休息休假、劳动报酬、社会保险、劳动保护与劳动条件及职业危害防护，以及法律法规规定应纳入的其他事项。缺项会被责令改正；造成损害的承担赔偿责任。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第十七条、第八十一条","效力位阶":"法律","主张强度":"可推定","举证难度":"中——合同文本自己应留存；缺项导致的损害需要另行举证","地域":"全国","时效":"程序时效——未载明必备条款的由劳动行政部门责令改正；造成损害的赔偿请求走仲裁，时效一年。起算点——自知道或应当知道损害发生之日。例外——无特别时效，不适用劳动报酬类例外。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）","核对日期":"2026-10-03","备注":"不确定点在「缺项」的后果上——不是缺一项合同就无效，而是责令改正加赔偿损害，需要单独证明损害；各地对缺项能否作为变更依据的把握也不一致，可就本地尺度咨询当地劳动人事争议仲裁委员会或拨 12333。真正要紧的是把工资构成、工作地点、岗位职责写清楚：这三项空着，调岗降薪（见 3.5）和加班费（见第 2 节）都会变难打。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"金钱"}},{"节号":3,"节名":"入职与签约","条号":16,"标题":"续订时单位降低条件，你不续签也能拿经济补偿","说人话":"合同到期，公司愿意续，但给的条件比原来差，你不签——这种情况下你照样能拿按工龄算的经济补偿。反过来，公司维持或提高原条件续，你自己不签，就没有补偿。所以谈的时候一定把「它到底降没降」这件事说清楚、记下来。","适用":"固定期限合同到期，单位提出续订但把条件降低了（降薪、降岗、改工作地点、削福利），你因此不同意续订的。","成本":"时间——从书面表达到仲裁裁决，快则两三个月，一般半年上下；金钱——仲裁不收费，律师费通常自己承担。","收益":"按工作年限拿经济补偿，每满一年一个月工资，六个月以上不满一年按一年算，不满六个月算半个月。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第四十四条第一项、第四十六条第五项、第四十七条","效力位阶":"法律","主张强度":"可推定","举证难度":"中——原合同与新要约的对比材料需要自己留存；单位主张免付的，须举证其续订条件不低于原合同","地域":"全国；对「维持或者提高」的比对口径（是否含绩效、补贴、职级）各地不一","时效":"程序时效——仲裁申请时效一年。起算点——自合同期满终止之日。例外——无特别时效，不适用劳动报酬类例外。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）","核对日期":"2026-10-03","备注":"不确定点在「维持或提高条件」的比对范围——把基本工资、绩效、补贴、职级、工作地点逐项列出来对比，写在同一张纸上。各地对「降低条件」的认定口径有差异，主张前向当地劳动人事争议仲裁委员会或拨 12333 确认。要求单位把续订条件出成书面，口头说的条件事后无从比对。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"金钱"}},{"节号":3,"节名":"入职与签约","条号":17,"标题":"首次实行劳动合同制或国企改制，满十年加距退休不足十年也应当订立无固定期限","说人话":"这一条针对的是单位第一次搞劳动合同制、或者国企改制重签合同的情形。如果你在这家单位连续干满十年，又快到法定退休年龄了，这种情况下你提出续订，应当给你无固定期限合同。","适用":"用人单位初次实行劳动合同制度，或者国有企业改制重新订立劳动合同时，劳动者在该单位连续工作满十年且距法定退休年龄不足十年的。","成本":"不花钱。核对自己的入职时间与法定退休年龄，几分钟。","收益":"符合条件且劳动者提出或同意续订的，除劳动者主动要求订立固定期限合同外，应当订立无固定期限劳动合同。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第十四条第二款第二项","效力位阶":"法律","主张强度":"可推定","举证难度":"中——连续工作年限可由社保缴费记录、工资流水、历次合同证明；「初次实行劳动合同制度」「改制」的认定可能涉及单位历史材料","地域":"全国","时效":"程序时效——仲裁申请时效一年。起算点——自续订文本签署之日或单位明确拒绝之日。例外——无特别时效，不适用劳动报酬类例外。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）","核对日期":"2026-10-03","备注":"不确定点在前提事实的认定——「初次实行劳动合同制度」和「国有企业改制」都需要单位的历史材料支撑，劳动者一侧往往拿不到。这类情形建议先向当地劳动人事争议仲裁委员会或拨 12333 了解本地对前提事实的把握尺度。用书面形式提出续订要求并留存送达痕迹，口头提出难以举证。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"大","口径":"自由"}},{"节号":3,"节名":"入职与签约","条号":18,"标题":"连续工作满十年，续订时也应当订立无固定期限","说人话":"在同一家公司连续干满十年，续签时你提出来，就该签无固定期限合同——也就是没有终止日期的合同。关键还是那句话：在签字之前书面提出来，别等签完固定期限文本再回头争。","适用":"在同一用人单位连续工作满十年，劳动合同面临续订的。","成本":"不花钱。核对自己的连续工作年限起算点。","收益":"劳动者提出或同意续订、订立劳动合同时，除劳动者提出订立固定期限合同外，应当订立无固定期限劳动合同。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第十四条第二款第一项、第九十七条第一款","效力位阶":"法律","主张强度":"可主张","举证难度":"中——连续工作年限可由社保缴费记录、历次合同、工资流水证明；换过主体但工作未变的情形需另行证明连续性","地域":"全国","时效":"程序时效——仲裁申请时效一年。起算点——自续订文本签署之日或单位明确拒绝之日。例外——无特别时效，不适用劳动报酬类例外。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）","核对日期":"2026-10-03","备注":"「连续工作满十年」不含依法顺延期间以外的中断；换过合同订立主体但工作场所、岗位未变的，可能被计入连续（见 3.10）。提前把社保缴费明细按单位名称拉一遍，能直接看出主体的变化轨迹。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"自由"}},{"节号":3,"节名":"入职与签约","条号":19,"标题":"年休假天数按累计工龄算，不是按在本单位干了几年","说人话":"年休假天数看的是你累计工作了多少年，不是在这家公司干了多少年。换工作不影响你已经攒下的工龄档位。试用期、入职当年也按比例享受——不是「满一年才有」。","适用":"入职新单位后核对当年年休假天数，或者跳槽后单位以「在本单位不满一年」为由不给年假的。","成本":"不花钱。核对自己累计工作年限，几分钟。","收益":"累计工作已满 1 年不满 10 年的年休假 5 天；已满 10 年不满 20 年的 10 天；已满 20 年的 15 天。这是按累计工作时间算的，不限于本单位。","依据":"《职工带薪年休假条例》（国务院令第 514 号）（国务院令第 514 号）第三条、第五条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"中——累计工作年限需要自己举证，历年社保缴费记录、离职证明、个税记录是最直接的材料","地域":"全国","时效":"程序时效——应休未休年休假工资报酬争议走仲裁，时效一年。起算点——自应休年度次年起算，或自劳动关系终止之日；实务中对跨年度计算有不同把握。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制。","来源":"https://www.gov.cn/zhengce/content/2008-03/28/content_6636.htm（职工带薪年休假条例全文）","核对日期":"2026-10-03","备注":"累计工作年限的证据要提前攒：历年社保缴费明细、各段离职证明、个税申报记录。入职时把上一家的离职证明和社保记录交给新单位留档，能直接锁定档位。日工资折算与离职当年的折算方法见第 2 节，本节不重复。","成本标签":{"钱":"0","时间":"少","毅力":"些","收益":"中","口径":"时间"}},{"节号":3,"节名":"入职与签约","条号":20,"标题":"不是所有「以完成一定工作任务为期限」的合同都能约定试用期","说人话":"合同写的是「完成某项工作为止」，这种合同不能约定试用期。约了就是违法，履行了就要按你转正后的月工资赔那段期间的损失。","适用":"单位以「做完这个项目就结束」为由签合同，同时约定了试用期的。","成本":"不花钱。签字前看合同期限栏怎么写的。","收益":"以完成一定工作任务为期限的劳动合同，不得约定试用期。已约定并履行的，可按试用期满月工资标准主张该期间赔偿金。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第十五条、第十九条第三款、第八十三条","效力位阶":"法律","主张强度":"可主张","举证难度":"易——合同文本本身即可证明合同类型和试用期约定","地域":"全国","时效":"程序时效——仲裁申请时效一年。起算点——自超期履行期间起算。例外——无特别时效，不适用劳动报酬类例外。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）","核对日期":"2026-10-03","备注":"同样不能约定试用期的还有合同期限不满三个月的。注意区分：项目制合同到期终止时，仍属于第四十四条第一项的情形，经济补偿的规则与固定期限合同到期一致（见 3.16）。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"中","口径":"金钱"}},{"节号":3,"节名":"入职与签约","条号":21,"标题":"竞业限制条款要在离职后才生效，且必须按月给补偿","说人话":"离职后的竞业限制，公司必须按月给你钱，不给钱你就可以要求解除。合同里只写了限制、没写给多少补偿，也不影响你按离职前一年平均工资的 30% 要（低于当地最低工资的按最低工资算）。但注意：在职期间的竞业限制条款是另一回事，法律认可它有效，而且不要求公司按月给补偿——签字前一定分清写的是哪一种。","适用":"入职或续签文本里出现竞业限制条款的。签字前就要看清它约束的是在职期间还是离职之后。","成本":"时间——核对一次文本；若日后要主张补偿或解除，走仲裁一般几个月。金钱——仲裁不收费。","收益":"离职后竞业限制的法定结构是「按月支付经济补偿」。约定竞业限制但没写补偿标准的，履行义务后可主张按离职前十二个月平均工资的 30% 按月支付；低于劳动合同履行地最低工资标准的，按最低工资标准支付。因单位原因三个月未支付补偿的，可请求解除竞业限制约定。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第二十三条、第二十四条；《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》（法释〔2020〕26 号，2021-01-01 施行）第三十六条、第三十八条；《最高人民法院关于审理劳动争议案件适用法律问题的解释（二）》（法释〔2025〕12 号，2025-09-01 施行）第十四条","效力位阶":"法律（第三十六条、第三十八条为司法解释）","主张强度":"可推定","举证难度":"中——竞业限制协议自己应留存原件；补偿是否支付可由银行流水证明；未支付满三个月的事实需自己记录","地域":"全国；「约定了竞业限制但未约定经济补偿」时，三个月未付能否直接请求解除，各地裁判口径未统一","时效":"程序时效——仲裁申请时效一年。起算点——主张补偿的自各月应付未付之日起算；请求解除竞业限制约定的，自三个月未支付届满之日。例外——属于持续性义务，按月产生的补偿请求权逐月起算。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）；http://gongbao.court.gov.cn/Details/bb72019c45453f84d920bd6375573e.html（最高人民法院公报·关于审理劳动争议案件适用法律问题的解释（二）全文，法释〔2025〕12 号）","核对日期":"2026-10-03","备注":"不确定点有两处，都需按本地口径确认：① 只约定竞业限制、未约定补偿金额的场合，三个月不付能否直接请求解除（解释（一）第三十八条字面前提是「约定了竞业限制和经济补偿」）；② 30% 的计算基数是税前还是实发。主张前向当地劳动人事争议仲裁委员会或拨 12333 确认。第 6 节把在职竞业、保密义务、违约金边界分开细讲。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"金钱"}},{"节号":3,"节名":"入职与签约","条号":22,"标题":"招聘中的性别与婚育歧视被明文禁止，但举证仍然是全条最难的一环","说人话":"招聘时问婚育、把怀孕测试当入职体检、写明「男性优先」、要求承诺几年内不结婚不生孩子——这些都被法律逐条点名禁止，而且人社部门要把招聘环节的性别歧视纳入劳动监察，你还可以直接去法院起诉。但要说实话：能不能赢在证据上，不在条文上。对方通常不会把歧视理由写下来，所以招聘页面截图、面试通知、聊天记录、录音就是全部家当，一定要在当时就留住。","适用":"招聘或入职环节，因性别、婚育状况被拒绝录用、被提高录用标准，或被要求作出限制结婚生育的承诺。","成本":"时间——投诉到行政部门处理或诉讼，周期不定；金钱——向劳动保障监察投诉不收费，走民事诉讼有诉讼费。","收益":"用人单位在招录（聘）过程中，除国家另有规定外，不得：① 限定为男性或者规定男性优先；② 除个人基本信息外，进一步询问或者调查女性求职者的婚育情况；③ 将妊娠测试作为入职体检项目；④ 将限制结婚、生育或者婚姻、生育状况作为录（聘）用条件；⑤ 其他以性别为由拒绝录（聘）用妇女或者差别化地提高对妇女录（聘）用标准的行为。录（聘）用女职工时订立的合同应当具备女职工特殊保护条款，不得规定限制女职工结婚、生育等内容。人力资源和社会保障部门应当将招聘、录取、晋职、晋级、评聘专业技术职称和职务、培训、辞退等过程中的性别歧视行为纳入劳动保障监察范围。实施就业歧视的，劳动者可以向人民法院提起诉讼。","依据":"《妇女权益保障法》（2022-10-30 修订，2023-01-01 施行）第四十三条、第四十四条、第四十九条；《就业促进法》（2007-08-30 通过，2008-01-01 施行）第三条、第二十六条、第二十七条、第六十二条","效力位阶":"法律","主张强度":"可主张","举证难度":"难——歧视理由通常不出现在书面材料里，需要招聘信息截图、面试录音、聊天记录等外部证据；「因为性别或婚育状况才不录用」的因果关系难以证明","地域":"全国；各地劳动保障监察对就业歧视的受理范围与处理力度不完全一致","时效":"程序时效——向劳动保障监察投诉的，违法行为在 2 年内未被发现也未被举报、投诉的不再查处；向法院起诉的按民事诉讼时效三年。起算点——自知悉被拒绝录用或差别对待之日。例外——无特别时效豁免；就业歧视之诉与劳动争议仲裁是两条不同路径，不适用仲裁前置。","来源":"https://www.spp.gov.cn/spp/fl/202210/t20221030_591251.shtml（最高人民检察院官网·妇女权益保障法全文，2022 修订）；https://www.gov.cn/gongbao/content/2007/content_778166.htm（中国政府网国务院公报 2007 年第 30 号·就业促进法全文）","核对日期":"2026-10-03","备注":"举证难度标「难」——取证时机在被拒录的当场和事后第一时间：招聘页面与岗位要求截图、面试通知、拒录邮件或聊天记录立即留存，涉及婚育、生育计划的询问能录音就录音，事后补不回来。第四十三条五项禁止行为是可以逐条对照的证据清单，截图时对着这五项找。各地劳动保障监察对就业歧视的受理口径与所需材料，向当地人力资源社会保障局劳动保障监察机构或拨 12333 确认。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"中","口径":"自由"}},{"节号":4,"节名":"在职工资与工时","条号":1,"标题":"变更劳动合同必须书面协商一致，单方通知不算","说人话":"岗位、地点、工资、上班时间这些写在合同里的东西，公司要改，必须你同意，而且得落在纸面上。它发个通知、开个会宣布，不算你同意。收到这种通知当天回一句「不同意变更，要求按原合同履行」，用邮件或聊天发出去，把回复留底——这一步是后面所有主张的起点。","适用":"单位以通知、公告、会议宣布的方式变更你的岗位、工作地点、工资构成或工作时间，你并未同意。","成本":"不花钱。收到通知当天书面回复一次，留存发送痕迹。","收益":"变更劳动合同约定的内容，须双方协商一致并采用书面形式（《劳动合同法》第三十五条）。未经同意的单方变更对劳动者不产生约束力；据此被迫解除的，可主张经济补偿。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第三十五条、第三十八条、第四十六条第一项；《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》（法释〔2020〕26 号，2021-01-01 施行）第四十三条","效力位阶":"法律（第四十三条为司法解释）","主张强度":"可主张","举证难度":"中——原合同文本、变更通知、你的书面回复由自己留存；单位若主张已协商一致，须举证","地域":"全国","时效":"程序时效——仲裁申请时效一年。起算点——自变更通知送达之日，或自按新条件实际履行之日。例外——无特别时效，不适用「拖欠劳动报酬不受一年限制」的例外。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文）；https://www.court.gov.cn/fabu/xiangqing/282121.html（最高人民法院官网·劳动争议解释（一）全文）","核对日期":"2026-10-03","备注":"注意一个反向规则：协商一致变更劳动合同虽未采用书面形式，但已实际履行口头变更超过一个月，变更内容不违反法律、行政法规且不违背公序良俗的，当事人以未采用书面形式为由主张变更无效的，人民法院不予支持（解释（一）第四十三条）。也就是说：沉默着按新条件干满一个月，可能被视为同意。有异议就要在当期提出来并留痕，别拖。","成本标签":{"钱":"0","时间":"少","毅力":"些","收益":"大","口径":"自由"}},{"节号":4,"节名":"在职工资与工时","条号":2,"标题":"单方调岗降薪的边界：不降薪、不远调、不改变工作性质","说人话":"公司说「架构调整，你去新部门，工资按新岗位算」，你不同意却硬来——这一步是公司先违约。你的动作是两手：一是书面拒绝变更，二是继续按原岗位正常出勤（不要旷工，别给它送把柄）。真被停了工作、不给排班，再谈被迫解除和经济补偿。","适用":"单位以「经营需要」「组织架构调整」为由单方调整你的岗位或薪酬，你不同意。","成本":"时间——主张走仲裁，立案到裁决一般几个月；金钱——仲裁不收费，律师费通常自己承担。","收益":"岗位与劳动报酬是劳动合同必备条款。单位单方变更不成立，据此被迫解除可主张经济补偿；构成违法解除的，可主张按经济补偿标准二倍的赔偿金。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第十七条、第三十五条、第三十八条、第四十六条第一项、第四十八条、第八十七条","效力位阶":"法律","主张强度":"可推定","举证难度":"中——原合同、调岗降薪通知、工资流水自己留存；「调整的合理性」由用人单位举证","地域":"全国；对「合理调岗」的认定各地裁审口径不一，不降薪、不改变工作地点、与原岗位相近的调整在部分地方被认可属用工自主权","时效":"程序时效——仲裁申请时效一年。起算点——自收到调岗降薪通知之日，或自按新岗位新工资实际履行之日；被迫解除的，自解除之日。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）","核对日期":"2026-10-03","备注":"不确定点在「合理调岗」的边界，各地口径差异明显，主张前向当地劳动人事争议仲裁委员会或拨 12333 确认本地尺度。不要在调岗确认单、岗位异动表上签字；签了之后再主张，实践中极难推翻。另注意解释（一）第四十三条的默示同意规则——沉默着按新条件实际履行超过一个月，可能被视为同意变更（见 4.1）。拒绝变更的同时必须继续正常出勤并保留考勤，避免被反以旷工解除。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"金钱"}},{"节号":4,"节名":"在职工资与工时","条号":3,"标题":"实行不定时工作制、综合计算工时工作制必须经人社部门审批","说人话":"公司说你是「不定时制」「综合工时制」，不算加班——先让它拿出人社部门的批准文件。拿不出来，就还是按标准工时算：每天 8 小时、平均每周 44 小时，超了就得付加班费。综合工时制是算总账的，但总工时超了照样要按 150% 付。这项审批是有期限的，到期要重新报批，过期的批准文件不算数。","适用":"单位宣布对你实行不定时工作制或综合计算工时工作制，据此不按标准工时算加班费，但你从未见过审批文件。","成本":"不花钱。做一次书面调取申请，几分钟。","收益":"企业因生产特点不能实行标准工时的，可以实行不定时工作制或综合计算工时工作制等其他工作和休息办法，但须按办法报批（《关于企业实行不定时工作制和综合计算工时工作制的审批办法》）。经批准实行综合计算工时工作制的，其综合计算工作时间超过法定标准工作时间的部分，应视为延长工作时间并按《工资支付暂行规定》支付延长工作时间的工资。未经审批的，仍按标准工时制计算加班费。","依据":"《劳动法》（2018-12-29 修正）第三十六条、第三十九条、第四十一条、第四十四条；《关于企业实行不定时工作制和综合计算工时工作制的审批办法》（劳部发〔1994〕503 号，1995-01-01 施行）第三条至第七条；《工资支付暂行规定》（劳部发〔1994〕489 号，1995-01-01 施行）第十三条","效力位阶":"部门规章","主张强度":"可推定","举证难度":"中——审批文件由单位掌握，需书面要求其出具；自己一侧的考勤记录、排班表、工作沟通记录应主动留存","地域":"全国；审批权限与有效期由各省、自治区、直辖市人力资源社会保障部门规定，各地对审批有效期的把握不同","时效":"程序时效——仲裁申请时效一年；属加班费类请求。起算点——逐月起算，各月加班费差额分别起算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"https://www.gov.cn/zhengce/2022-08/31/content_5711263.htm（关于企业实行不定时工作制和综合计算工时工作制的审批办法全文）；https://www.gov.cn/zhengce/2022-08/31/content_5711284.htm（工资支付暂行规定全文）","核对日期":"2026-10-03","备注":"不确定点有两处——① 地方审批的有效期长度与是否需要年检，各地不一；② 不定时工作制下加班费是否一律不计，实践中对法定节假日加班仍有争议。两处都需向当地人力资源社会保障部门或拨 12333 确认。「审批文件拿来我看看」这句话本身就能改变谈判位置，在离职之前提。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"大","口径":"金钱"}},{"节号":4,"节名":"在职工资与工时","条号":4,"标题":"绩效系数不能单方加码：考核标准要有依据、要告知","说人话":"绩效怎么算，得有个事先定好、且给过你看到的标准。公司中途把标准改严、系数调低、把奖金池缩小，导致你到手变少——这部分差额可以要回来。你要做的是：把每一版的考核标准、考核结果、工资条按月份存好，能对上「改在哪个月、少了多少钱」。","适用":"单位单方提高考核指标、下调绩效系数、改变绩效工资计算方式，导致实发工资下降。","成本":"时间——主张走仲裁；金钱——仲裁不收费，律师费通常自己承担。需要调出历次考核标准与工资条。","收益":"绩效工资属劳动报酬，其计算规则如写入劳动合同或依法制定的规章制度，变更同样须协商一致并书面。单方加码导致工资减少的部分，可主张补足差额；据此被迫解除的可主张经济补偿。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第四条、第三十五条、第三十八条、第四十六条第一项；《工资支付暂行规定》第十五条、第十七条","效力位阶":"法律（第十五条、第十七条为部门规章条款）","主张强度":"可推定","举证难度":"中——工资条、考核结果、制度版本需要自己按月留存；考核标准的制定与公示由用人单位举证","地域":"全国；对「绩效工资属于劳动报酬还是用人单位自主权范围」的认定各地差异较大","时效":"程序时效——仲裁申请时效一年。起算点——自各月工资实际发放之日逐月起算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）；https://www.gov.cn/zhengce/2022-08/31/content_5711284.htm（工资支付暂行规定全文）","核对日期":"2026-10-03","备注":"不确定点在绩效工资的性质认定——有的地方按劳动报酬处理，单方扣减需有制度依据；有的地方把绩效评价归入用工自主权，只审查是否明显不合理。主张前向当地劳动人事争议仲裁委员会或拨 12333 确认本地口径。每月工资条到账当天导出留存，绩效类争议靠的是逐月对比。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"中","口径":"金钱"}},{"节号":4,"节名":"在职工资与工时","条号":5,"标题":"加班证据由谁举证：考勤记录在单位手里，可以要求它拿出来","说人话":"加班费能不能要到，关键看举证责任怎么走。原则上你要先证明加了班，但考勤、审批这些记录在公司手里的，它必须拿出来；它不拿，就要承担对它不利的后果。所以你要准备的是「能指向加班存在」的入口材料：加班安排的通知、群里深夜的工作消息、非工作时间的邮件、交付记录、门禁照片。哪怕只有几天的证据，也可能让仲裁委要求公司交出完整考勤。","适用":"主张加班费，但考勤打卡记录、审批记录都在公司系统里，自己拿不到。","成本":"不花钱。在仲裁中提出调取申请，随仲裁申请一并说明。","收益":"劳动者主张加班费的，应当就加班事实的存在承担举证责任；但劳动者有证据证明用人单位掌握加班事实存在的证据，用人单位不提供的，由用人单位承担不利后果。","依据":"《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》（法释〔2020〕26 号，2021-01-01 施行）第四十二条","效力位阶":"司法解释","主张强度":"可主张","举证难度":"中——加班通知、工作沟通记录、交付时间戳需要自己留存；完整考勤由单位掌握，可申请调取","地域":"全国（该解释为全国统一适用）","时效":"程序时效——仲裁申请时效一年。起算点——加班费按月产生，逐月起算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"https://www.court.gov.cn/zixun/xiangqing/282121.html（最高人民法院官网·关于审理劳动争议案件适用法律问题的解释（一）全文）","核对日期":"2026-10-03","备注":"这一条的用法是「先交入口证据，再要求对方交全量」：不用一开始就证明每一天都加班，只要能证明「单位掌握着能证明加班存在的证据」，不交的不利后果由单位承担。取证时机在离职之前——办公账号、内部系统权限在离职当天失效，具体动作：把加班审批单、排班表、深夜工作消息、邮件发送时间逐条截图，标注日期。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"金钱"}},{"节号":4,"节名":"在职工资与工时","条号":6,"标题":"值班与待命时间算不算工作时间：没有统一明文，先固定证据","说人话":"值班和待命算不算上班，法律上没有一条一句话说死的规则：要看你在这段时间里能不能自由安排、被叫到要不要马上响应、响应频率有多高。你要先干一件事——把排班表、值班安排通知、被叫去处理问题的记录存下来，然后再去问本地仲裁委怎么认。没有这些记录，什么口径都用不上。","适用":"被安排值班、待命、随叫随到（例如夜班值守、周末备勤），单位主张「没干活就不算上班」，不支付对应报酬。","成本":"时间——主张走仲裁；金钱——仲裁不收费，律师费通常自己承担。需要保存排班表与待命期间的响应记录。","收益":"没有可直接援引的全国统一条文——《劳动法》第四章规定的是工作时间和休息休假的一般制度，没有待命时间如何定性的条款；本条不承诺任何一笔钱。","依据":"无明文的全国统一规定；已确证的是《劳动法》（2018-12-29 修正）第三十六条「每日工作时间不超过八小时、平均每周工作时间不超过四十四小时」，但未涉及待命时间定性","效力位阶":"无明文依据","主张强度":"倡导性","举证难度":"中——排班表、值班通知、响应记录需要自己留存；单位掌握的排班系统数据可申请调取","地域":"全国；各地对待命时间的定性差异很大，用人单位与劳动者对「是否影响休息」的举证要求也不同","时效":"程序时效——如主张加班费或对应报酬，仲裁申请时效一年。起算点——逐月起算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"无官方一手依据可援引。 尝试过的路径：① 已打开《劳动法》官方全文页（post_2532147.html）逐条核对第四章，其中无待命时间定性条款；② 已打开《工资支付暂行规定》全文，第十三条只规定加班费标准与不定时工时制不执行该条前三项标准，未涉及待命时间；③ 已打开最高人民法院劳动争议解释（一）全文（282121.html），第四十二条只涉加班事实的举证责任分配，未涉及待命时间定性。三处均未获取到可作依据的条文，故按「无明文依据」处理。；已核对页面：http://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_296651.html（中国人大网·劳动法全文）；已核对页面：https://www.gov.cn/zhengce/2022-08/31/content_5711284.htm（中国政府网·工资支付暂行规定全文）；已核对页面：https://www.court.gov.cn/zixun/xiangqing/282121.html（最高人民法院官网·劳动争议解释（一）全文）","核对日期":"2026-10-03","备注":"本条不给结论、不涉及金额，价值在于把问题讲清楚并给出取证动作。定性标准在不同地区差别很大，主张前必须向当地劳动人事争议仲裁委员会或拨 12333 确认。取证时机在事发当期：排班表、值班签到、被叫去处理问题的聊天记录与通话记录，当天留存。第 10 节第 10.14 条从「常见误解」角度写了同一件事，可对照阅读。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"小","口径":"时间"}},{"节号":4,"节名":"在职工资与工时","条号":7,"标题":"综合工时制是按周期算总账，总工时超了照样付 150%","说人话":"综合工时制不是免加班费的挡箭牌，它只是把「按天算」改成「按周期算总账」。周期内总工时超过了法定标准，超出来的部分照样按 150% 付。另外，法定节假日安排工作仍要按 300% 付，不因为换了工时制就打折。","适用":"单位经批准实行综合计算工时工作制（以周、月、季、年为周期），你担心「超时了也不算加班」。","成本":"不花钱。核对周期内的实际工时统计。","收益":"综合计算工时工作制的平均日工作时间和平均周工作时间应与法定标准工作时间基本相同；综合计算工作时间超过法定标准工作时间的部分，应视为延长工作时间，按不低于本人小时工资标准的 150% 支付。","依据":"《关于企业实行不定时工作制和综合计算工时工作制的审批办法》（劳部发〔1994〕503 号，1995-01-01 施行）第五条；《工资支付暂行规定》（劳部发〔1994〕489 号，1995-01-01 施行）第十三条","效力位阶":"部门规章","主张强度":"可主张","举证难度":"中——周期内的考勤、排班、工时统计需要自己留存；完整工时记录由单位掌握，可申请调取","地域":"全国","时效":"程序时效——仲裁申请时效一年。起算点——按周期届满后逐周期起算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"https://www.gov.cn/zhengce/2022-08/31/content_5711263.htm（审批办法全文）；https://www.gov.cn/zhengce/2022-08/31/content_5711284.htm（工资支付暂行规定全文）","核对日期":"2026-10-03","备注":"实务争议集中在两点：周期怎么界定（单位常选对自己有利的周期），以及周期内超时部分如何折算。先把批准文件里的周期抄下来，再按周期统计自己的实际工时。周期总表自己算一遍，比事后跟公司争论有效。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"金钱"}},{"节号":4,"节名":"在职工资与工时","条号":8,"标题":"不定时工作制：日常加班费三档不适用，法定节假日另有争议","说人话":"两件事分开看。第一件是确定的：不定时工作制下，150%、200%、300% 这三档加班费标准确实不适用，所以「日常加班没加班费」这个说法成立。第二件不确定：法定节假日那天被安排干活要不要另外付钱，全国没有统一规定，各地做法不一样。第一件事公司说得对，第二件事它未必对——先把那天「确实被安排工作」的痕迹留好，再去问本地口径。","适用":"单位经批准对你实行不定时工作制，你在法定节假日被安排工作，单位以「不定时制没有加班费」为由不付。","成本":"时间——主张走仲裁；金钱——仲裁不收费，律师费通常自己承担。","收益":"已确证的一层：《工资支付暂行规定》第十三条规定，实行不定时工时制度的劳动者，不执行该条前三项关于 150%、200%、300% 的支付标准——即单位不需要按这三档计算你的加班费。无明文的一层：不定时工作制下「法定节假日被安排工作是否仍应另行支付报酬」，全国没有统一明确规定，本条不承诺这一笔钱。","依据":"无明文的全国统一规定。可确证的是《工资支付暂行规定》（劳部发〔1994〕489 号，1995-01-01 施行）第十三条，其第四款规定「实行不定时工时制度的劳动者，不执行上述规定」；该条未涉及法定节假日另行支付的问题","效力位阶":"无明文依据","主张强度":"倡导性","举证难度":"中——排班通知、当日工作记录需自己留存","地域":"全国；各地对不定时工作制下法定节假日加班的处理差异较大","时效":"程序时效——如主张该项报酬，仲裁申请时效一年。起算点——自法定节假日所在月份工资发放之日。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"「法定节假日是否另行支付」无官方一手依据可援引。 尝试过的路径：① 已打开《工资支付暂行规定》官方全文页（content_5711284.htm）并逐字核对第十三条四款全文，仅确认不定时工时制不执行前三项标准，未涉及法定节假日另行支付；② 已打开《关于企业实行不定时工作制和综合计算工时工作制的审批办法》全文，其中无加班费支付条款；③ 检索其他全国性规定，未定位到对应条文。故按「无明文依据」处理。第十三条原文见上述中国政府网页。；已核对页面：https://www.gov.cn/zhengce/2022-08/31/content_5711284.htm（中国政府网·工资支付暂行规定全文）；已核对页面：https://www.gov.cn/zhengce/2022-08/31/content_5711263.htm（中国政府网·不定时工作制与综合计算工时工作制审批办法全文）","核对日期":"2026-10-03","备注":"本条把两层分开写：日常三档不适用是明文，法定节假日是否另行支付无明文。不定时工作制本身须经人社部门审批（见 4.3），未获批准的仍按标准工时算加班费。当天的排班通知和出勤记录要当场截图留存，事后公司系统里的记录可能已被修改或不可访问。本地口径向当地劳动人事争议仲裁委员会或拨 12333 确认。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"小","口径":"金钱"}},{"节号":4,"节名":"在职工资与工时","条号":9,"标题":"停工停产期间工资：一个工资支付周期内照发，之后按下限","说人话":"公司停工停产，不是它就能直接停你的工资。头一个工资支付周期（多数单位就是一个月）里面，工资要照合同标准发。超过这个周期：你还在正常上班的，不能低于当地最低工资；你确实没活干在家待着，那就按国家有关规定走——这一档各地做法不一样，需要问本地。","适用":"单位因经营困难、订单不足安排停产停工，你自己没有提供劳动，单位不发工资或只发很少。","成本":"不花钱。保留停工的书面通知与工资条。","收益":"非因劳动者原因造成单位停工、停产在一个工资支付周期内的，用人单位应按劳动合同规定的标准支付工资；超过一个工资支付周期的，若劳动者提供了正常劳动，支付的报酬不得低于当地最低工资标准；若劳动者没有提供正常劳动，按国家有关规定办理。","依据":"《工资支付暂行规定》（劳部发〔1994〕489 号，1995-01-01 施行）第十二条","效力位阶":"部门规章","主张强度":"可推定","举证难度":"易——工资流水、停工通知、排班记录可自行取得；「是否提供了正常劳动」的事实由双方各自的考勤记录支撑","地域":"全国；超过一个工资支付周期且劳动者未提供正常劳动时，「按国家有关规定办理」具体标准由地方规定，多数地方定在当地最低工资的一定比例","时效":"程序时效——仲裁申请时效一年；属劳动报酬类。起算点——自各月工资应发未发之日起算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"https://www.gov.cn/zhengce/2022-08/31/content_5711284.htm（工资支付暂行规定全文）","核对日期":"2026-10-03","备注":"不确定点在「超过一个工资支付周期且未提供正常劳动」那一档的具体比例，各地规定不同（有按最低工资一定比例发生活费的，也有另定标准的），需向当地人力资源社会保障部门或拨 12333 确认。停工通知一定要拿到书面版本或聊天记录，口头通知不构成证据。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"中","口径":"金钱"}},{"节号":4,"节名":"在职工资与工时","条号":10,"标题":"延长工时有硬上限：一般每日 1 小时，特殊原因每日 3 小时、每月 36 小时","说人话":"加班不是公司想加多久就加多久。延长工作时间每天最多 1 小时，特殊原因每天最多 3 小时，而且一个月加起来不能超过 36 小时。超了这个线，可以向劳动监察投诉——注意这一条换回来的是行政查处，不是自动给你一笔钱；钱还是得走加班费那条路。","适用":"长期被要求超时加班，或者单位以「自愿加班」为名不设上限。","成本":"不花钱。需要记录每日实际工作时间。","收益":"延长工作时间一般每日不得超过一小时；因特殊原因需要延长的，在保障劳动者身体健康的条件下每日不得超过三小时，但每月不得超过三十六小时（《劳动法》第四十一条）。用人单位违反规定延长工作时间的，由劳动行政部门给予警告、责令改正，并可以处以罚款（第九十条）。","依据":"《劳动法》（2018-12-29 修正）第四十一条、第四十三条、第九十条","效力位阶":"法律","主张强度":"可推定","举证难度":"中——每日实际工作时间需要自己记录（打卡截图、排班表、工作消息时间戳）","地域":"全国；劳动保障监察对超时加班的查处力度各地不同","时效":"程序时效——向劳动保障监察投诉的，违法行为在 2 年内未被发现也未被举报、投诉的不再查处；主张加班费的走仲裁，时效一年。起算点——自知悉超时加班事实之日；加班费逐月起算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制。","来源":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2532147.html（广东省人民政府门户网站转载页，页面来源标注中国人大网，转载页，待换一手源）；https://www.gov.cn/zhengce/zhengceku/2008-03/28/content_7383.htm（劳动保障监察条例全文）","核对日期":"2026-10-03","备注":"不确定点在「投诉之后能拿回什么」——这一条本身通向行政查处（警告、责令改正、罚款），不是直接给劳动者的给付请求权。要拿到钱仍须主张加班费（费率见第 2 节），并接受仲裁时效逐月起算的限制。第四十二条另有不受第四十一条限制的例外情形（发生自然灾害、事故等威胁劳动者生命健康和财产安全需要紧急处理等），单位可能援引，可向当地劳动人事争议仲裁委员会或拨 12333 核实适用。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"中","口径":"时间"}},{"节号":4,"节名":"在职工资与工时","条号":11,"标题":"计件工资的定额不能定到「正常时间干不完」","说人话":"计件工资下的定额必须是在正常 8 小时里干得完的量。定额定得让人必须加班才拿得到基本工资，这个定额本身就不合理。做完定额之后被安排接着干的，那部分要按单价的 150%（工作日）、200%（休息日）、300%（法定节假日）算。","适用":"单位实行计件工资，把计件定额定得很高，导致按正常速度在法定工作时间内做不完，只能靠延长工时完成。","成本":"不花钱。需要记录每件单价、日产量与工时。","收益":"对实行计件工作的劳动者，用人单位应根据标准工时制度合理确定其劳动定额和计件报酬标准（《劳动法》第三十七条）。实行计件工资的，在科学合理的劳动定额基础上，支付的工资不得低于相应的最低工资标准（《最低工资规定》第十二条）；完成计件定额任务后被安排延长工作时间的，按不低于计件单价的 150%、200%、300% 支付（《工资支付暂行规定》第十三条）。","依据":"《劳动法》（2018-12-29 修正）第三十七条；《最低工资规定》（劳动和社会保障部令第 21 号，2004-03-01 施行）第十二条；《工资支付暂行规定》（劳部发〔1994〕489 号，1995-01-01 施行）第十三条","效力位阶":"法律（第十二条、第十三条为部门规章条款）","主张强度":"可推定","举证难度":"中——计件单价、日产量、工时记录需要自己留存；定额的确定过程由用人单位掌握","地域":"全国；「科学合理的劳动定额」缺乏统一量化标准，各地认定尺度不一","时效":"程序时效——仲裁申请时效一年。起算点——逐月起算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2532147.html（广东省人民政府门户网站转载页，页面来源标注中国人大网，转载页，待换一手源）；https://www.gov.cn/zhengce/2022-08/31/content_5711292.htm（最低工资规定全文）；https://www.gov.cn/zhengce/2022-08/31/content_5711284.htm（工资支付暂行规定全文）","核对日期":"2026-10-03","备注":"不确定点在「科学合理」怎么量化——没有全国统一的折算公式，实践中常通过同岗位多数人的产量、行业平均定额来比对。主张前向当地劳动人事争议仲裁委员会或拨 12333 确认本地口径。自己按天记录产量和工时，一个月下来就能看出定额是否超出正常速度。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"中","口径":"金钱"}},{"节号":4,"节名":"在职工资与工时","条号":12,"标题":"工资至少每月支付一次，遇节假日要提前发","说人话":"工资得按你们约定的日子发，一个月至少发一次。约定发薪日撞上周末或节假日，要提前到最近的工作日发，不能往后拖。拖延不是小事——它是后面「被迫解除要经济补偿」的常见入口之一。","适用":"单位拖到次月中旬甚至更晚才发上月工资，或者遇节假日顺延发放。","成本":"不花钱。核对一次发薪日与约定日期的偏差。","收益":"工资必须在用人单位与劳动者约定的日期支付；如遇节假日或休息日，则应提前在最近的工作日支付；工资至少每月支付一次。","依据":"《工资支付暂行规定》（劳部发〔1994〕489 号，1995-01-01 施行）第七条；《劳动法》（2018-12-29 修正）第五十条","效力位阶":"部门规章（《劳动法》第五十条为法律）","主张强度":"可主张","举证难度":"易——工资流水的到账日期本身就是证据，不依赖单位配合","地域":"全国","时效":"程序时效——仲裁申请时效一年；属劳动报酬类。起算点——自各期工资应发未发之日起算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"https://www.gov.cn/zhengce/2022-08/31/content_5711284.htm（工资支付暂行规定全文）；http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2532147.html（广东省人民政府门户网站转载页，页面来源标注中国人大网，转载页，待换一手源）","核对日期":"2026-10-03","备注":"把每月到账日期列成一张表，连续几个月晚发就能看出规律。拖欠本身不直接等于「未及时足额支付」，被迫解除前先看本地对「未及时」的容忍度（见 5.3）。银行流水是这一条最好的证据，导出后按月归档。","成本标签":{"钱":"0","时间":"少","毅力":"些","收益":"中","口径":"金钱"}},{"节号":4,"节名":"在职工资与工时","条号":13,"标题":"单位不得克扣工资，能代扣的只有四类","说人话":"工资里能扣的只有四种：个税、你个人那部分社保、法院判决要扣的抚养费赡养费、法律法规明文规定能扣的。剩下的一律不能扣——公司自己定的「罚款」「乐捐」「管理费」都不在这个名单里。被扣了就书面要求说明扣款依据和名目，同时把工资条留好。","适用":"工资条上出现说不清名目的扣款：罚款、乐捐、管理费、服装费、培训费、押金抵扣等。","成本":"不花钱。逐月核对工资条各项扣款。","收益":"用人单位不得克扣劳动者工资。可以代扣的只有四类：代扣代缴的个人所得税；代扣代缴的应由劳动者个人负担的各项社会保险费用；法院判决、裁定中要求代扣的抚养费、赡养费；法律法规规定可以从工资中扣除的其他费用。","依据":"《工资支付暂行规定》（劳部发〔1994〕489 号，1995-01-01 施行）第十五条","效力位阶":"部门规章","主张强度":"可主张","举证难度":"易——工资条、银行流水可自行取得；扣款名目由用人单位举证说明","地域":"全国","时效":"程序时效——仲裁申请时效一年；属劳动报酬类。起算点——自各月工资发放之日起算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"https://www.gov.cn/zhengce/2022-08/31/content_5711284.htm（工资支付暂行规定全文）","核对日期":"2026-10-03","备注":"注意区分「依法代扣」与「因过错赔偿的员工赔偿」。后者适用第十六条，有 20% 的月度扣款上限（见 4.14），两者不是一回事。工资条上只写「其他扣款」而不写名目的，要求书面列明。","成本标签":{"钱":"0","时间":"少","毅力":"些","收益":"中","口径":"金钱"}},{"节号":4,"节名":"在职工资与工时","条号":14,"标题":"因个人原因造成损失的扣款：每月不超过当月工资的 20%，且不低于最低工资","说人话":"公司能因为你造成损失扣你工资，但有两条硬线：一个月最多扣当月工资的两成，而且扣完之后剩下的不能低于当地最低工资。超了这两条中的任何一条，就是违法扣款。另外，它要扣得先证明损失是你造成的、劳动合同里有约定——说不清的部分不能扣。","适用":"因工作失误、货损、账目差错等被单位要求赔偿，直接从工资里扣。","成本":"不花钱。核对扣款当月工资条与剩余工资数额。","收益":"因劳动者本人原因给用人单位造成经济损失的，用人单位可按劳动合同的约定要求其赔偿经济损失，赔偿可从工资中扣除。但每月扣除的部分不得超过劳动者当月工资的 20%；若扣除后的剩余工资部分低于当地月最低工资标准，则按最低工资标准支付。","依据":"《工资支付暂行规定》（劳部发〔1994〕489 号，1995-01-01 施行）第十六条","效力位阶":"部门规章","主张强度":"可主张","举证难度":"中——工资条证明扣款数额；劳动合同里的约定和损失事实由用人单位举证","地域":"全国；当地最低工资标准按工作地现行标准","时效":"程序时效——仲裁申请时效一年；属劳动报酬类。起算点——自被扣款当月的工资发放之日起算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"https://www.gov.cn/zhengce/2022-08/31/content_5711284.htm（中国政府网·工资支付暂行规定全文）；http://114.255.111.180/SYrlzyhshbzb/laodongguanxi_/fwyd/202601/t20260112_565296.html（人力资源和社会保障部「全国各省、自治区、直辖市最低工资标准情况（截至 2026 年 1 月 1 日）」，发布日期 2026-01-12；页面以 IP 形式发布，2026-10-03 实测 HTTP 200 并取到全表。域名版为 https://www.mohrss.gov.cn/SYrlzyhshbzb/laodongguanxi_/fwyd/202601/t20260112_565296.html，该站对自动化请求返回反爬挑战页）","核对日期":"2026-10-03","备注":"被要求签「自愿承担损失」「同意扣款」之类的确认书时，先算一遍 20% 和最低工资这两条线。最低工资标准是剔除加班费、特殊环境津贴、法定福利之后的数额（《最低工资规定》第十二条），比较时不要把加班费算进去。签之前把工资条拍照留底。","成本标签":{"钱":"0","时间":"少","毅力":"些","收益":"中","口径":"金钱"}},{"节号":4,"节名":"在职工资与工时","条号":15,"标题":"工资条和工资支付记录：单位必须给你一份，且保存两年以上","说人话":"公司必须给你工资条，这是法定义务，不是福利。它还得把发放记录留两年以上备查。你的动作是：每月收到工资条就存一份，最好同时导出银行流水——真出争议时，工资条加流水是你唯一能自己掌控的收入证据链。","适用":"单位不发工资条，或者以「保密」为由不让你看工资构成明细。","成本":"不花钱。每月要一次工资条。","收益":"用人单位必须书面记录支付劳动者工资的数额、时间、领取者姓名及签字，并保存两年以上备查；支付工资时应向劳动者提供一份其个人的工资清单。","依据":"《工资支付暂行规定》（劳部发〔1994〕489 号，1995-01-01 施行）第六条","效力位阶":"部门规章","主张强度":"可主张","举证难度":"易——银行流水可自行导出；工资条单位应当提供，不给可投诉","地域":"全国","时效":"程序时效——用人单位不提供工资清单的，可向劳动保障监察投诉，违法行为在 2 年内未被发现也未被举报、投诉的不再查处。起算点——自知悉未提供之日。例外——无特别时效豁免；主张欠薪的另按劳动报酬争议处理。","来源":"https://www.gov.cn/zhengce/2022-08/31/content_5711284.htm（工资支付暂行规定全文）；https://www.gov.cn/zhengce/zhengceku/2008-03/28/content_7383.htm（劳动保障监察条例全文）","核对日期":"2026-10-03","备注":"电子工资条（系统推送、App 查询）到期会自动清理，每月到账当天导出成文件再归档。银行流水只显示实发总额，看不到工资构成；构成要靠工资条。两者都要，缺一个都算不清加班费基数和绩效差额。","成本标签":{"钱":"0","时间":"少","毅力":"些","收益":"中","口径":"金钱"}},{"节号":4,"节名":"在职工资与工时","条号":16,"标题":"事假与病假吃掉年假：这几档天数一到，当年年假就没有了","说人话":"年假不是请了假就一定还在。有两个容易被忽略的口子：一是事假累计满 20 天而且公司没扣你工资的；二是病假按工龄档累计到 2 个月、3 个月、4 个月的。到档就没当年年假了。反过来说：只要事假不满 20 天，或者事假期间公司照扣了工资，这一档就不成立——这是你能争的地方。","适用":"当年请了较长事假或病假，单位主张不再安排年休假。","成本":"不花钱。核对自己的请假台账。","收益":"职工有下列情形之一的，不享受当年的年休假：依法享受寒暑假且天数多于年休假天数的；请事假累计 20 天以上且单位按照规定不扣工资的；累计工作满 1 年不满 10 年、请病假累计 2 个月以上的；满 10 年不满 20 年、请病假累计 3 个月以上的；满 20 年以上、请病假累计 4 个月以上的。","依据":"《职工带薪年休假条例》（国务院令第 514 号）（国务院令第 514 号）第四条","效力位阶":"行政法规","主张强度":"可推定","举证难度":"中——请假审批记录、工资条（是否扣工资）需自己留存；累计天数需按台账统计","地域":"全国；对「单位按照规定不扣工资」的认定各地口径不同","时效":"程序时效——应休未休年休假工资报酬争议走仲裁，时效一年。起算点——自应休年度次年起算，或自劳动关系终止之日。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制。","来源":"https://www.gov.cn/zhengce/content/2008-03/28/content_6636.htm（职工带薪年休假条例全文）","核对日期":"2026-10-03","备注":"不确定点在「单位按照规定不扣工资」怎么认——如果事假期间工资照发（未扣），这一档成立；如果扣了工资，就不属于本条情形。各地把握不一，主张前向当地劳动人事争议仲裁委员会或拨 12333 确认。自己记一份请假台账（类型、天数、当月是否扣工资），是这一条唯一靠得住的证据。年休假天数与折算见第 2 节。","成本标签":{"钱":"0","时间":"少","毅力":"些","收益":"中","口径":"时间"}},{"节号":5,"节名":"离职与补偿","条号":1,"标题":"被迫离职也能拿经济补偿，但必须证明「是被迫的」","说人话":"公司欠薪、不给你缴社保、不给你提供约定的工作条件，你可以主动辞职，而且照样能拿按工龄算的补偿——不是只有被裁才有。但有一条线必须踩住：辞职时写的理由必须是上面这几条，写了「个人原因」就一分也拿不到，而且事后极难翻转。","适用":"用人单位未按约定提供劳动保护或劳动条件、未及时足额支付劳动报酬、未依法缴纳社会保险费、以暴力威胁等手段强迫劳动等情形下，劳动者主动解除劳动合同。","成本":"时间——从书面通知到仲裁裁决，快则两三个月，一般半年上下；金钱——劳动仲裁不收费，律师费通常自己承担。","收益":"按在本单位工作的年限拿经济补偿，每满一年一个月工资，六个月以上不满一年按一年算，不满六个月算半个月。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第三十八条、第四十六条第一项、第四十七条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——工资流水、社保缴费记录可自证欠薪或未缴；「被迫」的因果链要靠书面解除通知里写明的理由支撑","地域":"全国；地方对「未及时」「未足额」的认定口径有差异","时效":"程序时效——仲裁申请时效一年。起算点——自劳动合同解除之日。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文）","核对日期":"2026-10-03","备注":"发送离职通知的方式决定成败：用电子邮件或可留痕的书面方式，主题写明「关于依据《劳动合同法》第三十八条解除劳动合同的通知」，正文逐条列出欠薪月份、未缴社保月份等具体事实，并保留送达截图。不要只在口头谈话里说，也不要用「个人发展」「家庭原因」这类措辞。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"金钱"}},{"节号":5,"节名":"离职与补偿","条号":2,"标题":"合同到期单位不续签，要给经济补偿；你自己不续签就不给","说人话":"合同到期，公司不要你了，它得给按工龄算的补偿。它愿意按原条件甚至更好的条件续，你自己不签，那就没有补偿。所以谈的时候第一件事是把「到底是谁不续」钉死——要一张写明「公司决定不再续订」的书面文件。","适用":"固定期限劳动合同到期，进入「谁不续」的判断。","成本":"时间——协商到仲裁裁决，一般半年上下；金钱——仲裁不收费，律师费通常自己承担。","收益":"单位不续签（合同期满终止）的，应支付经济补偿，按工龄计算，每满一年一个月工资。但用人单位维持或提高原约定条件续订、劳动者不同意续订的，单位无需支付。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第四十四条第一项、第四十六条第五项、第四十七条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——需要留存单位不续签的书面表示或聊天记录；「谁提出不续」的事实是争议焦点","地域":"全国；对「维持或者提高劳动合同约定条件」的比对范围各地口径不一","时效":"程序时效——仲裁申请时效一年。起算点——自劳动合同期满终止之日。例外——无特别时效，不适用劳动报酬类例外。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）","核对日期":"2026-10-03","备注":"离职证明上离职原因的写法直接影响失业金资格——写「公司不再续订」「协商解除」，不要接受「个人原因」。谈续签条件时把双方要价写成书面（邮件确认一句「你方提出续订条件为……，我方认为低于原合同」即可），这一句就是日后比对的材料。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"金钱"}},{"节号":5,"节名":"离职与补偿","条号":3,"标题":"「协商一致」解除：谁先提，决定有没有补偿","说人话":"「协商解除」有没有补偿，看的是谁先提出来。公司先提，谈成了要给补偿；你自己先提，谈成了通常没有。约谈时对方口头说「给你 N+1」，你同意了，事后它说是你自己辞职——所以谈的时候一定要一份写明「由单位提出、协商一致解除」的书面协议。","适用":"单位约谈希望你离职，双方协商解除劳动合同。","成本":"时间——协商本身很快，谈不拢才走仲裁，一般半年上下；金钱——仲裁不收费，律师费通常自己承担。","收益":"用人单位向劳动者提出并协商一致解除的，应支付经济补偿，按工龄计算；由劳动者先提出并协商一致的，通常不适用该情形。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第三十六条、第四十六条第二项、第四十七条","效力位阶":"法律","主张强度":"可推定","举证难度":"中——提出方是谁往往没有书面记录，需要靠会议纪要、聊天记录、录音还原；签了「个人辞职」文件的，举证责任翻转到劳动者一侧","地域":"全国","时效":"程序时效——仲裁申请时效一年。起算点——自解除协议约定的解除之日。例外——无特别时效，不适用劳动报酬类例外。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）","核对日期":"2026-10-03","备注":"不确定点在「提出方」的举证——口头约谈事后无从还原，各地对聊天记录、录音的采信程度也不一致，可就本地尺度咨询当地劳动人事争议仲裁委员会或拨 12333。谈判当天做一份谈话纪要（时间、地点、在场人、对方表述、结论），发给对方一句「以今天谈的为准，如有出入请回复」，对方不回复的沉默也有用。协议里写明补偿金额、支付时间、社保缴至月份、离职证明的离职原因。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"大","口径":"金钱"}},{"节号":5,"节名":"离职与补偿","条号":4,"标题":"经济补偿基数不是基本工资，是离职前 12 个月应得工资的平均","说人话":"算补偿用的「月工资」不是你合同上写的基本工资，是离职前整整 12 个月平均到手（应得）的全部货币性收入——奖金、津贴、补贴都算进去。所以年终奖所在的那一年离职，基数会明显高一些。公司拿基本工资来算，是常见的压价手法。","适用":"已经确定能拿经济补偿，正在算到底是多少钱的。","成本":"不花钱。导出最近 12 个月的工资流水与工资条，算一次。","收益":"经济补偿的月工资是指劳动者在劳动合同解除或者终止前十二个月的平均工资；按劳动者应得工资计算，包括计时工资或者计件工资以及奖金、津贴和补贴等货币性收入；低于当地最低工资标准的按最低工资算；工作不满十二个月的按实际月数平均。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第四十七条；《劳动合同法实施条例》（国务院令第 535 号）第二十七条","效力位阶":"法律（实施条例为行政法规）","主张强度":"可主张","举证难度":"中——工资流水、工资条、个税申报记录需自己导出；奖金与补贴是否计入由双方争议","地域":"全国","时效":"程序时效——仲裁申请时效一年。起算点——自解除或终止之日。例外——无特别时效，不适用劳动报酬类例外。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）；https://www.gov.cn/zhengce/zhengceku/2008-09/19/content_6630.htm（劳动合同法实施条例全文）","核对日期":"2026-10-03","备注":"把 12 个月的工资条和流水摊成一张表，逐月加总再除以 12，自己先算出数字。有年终奖、季度奖的，确认发放月份是否落在窗口内。离职前把 12 个月的工资条导出，离职后系统账号失效就取不到了。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"金钱"}},{"节号":5,"节名":"离职与补偿","条号":5,"标题":"高薪封顶：月工资超过当地社平三倍，按三倍算、年限最多 12 年","说人话":"工资高到一定程度，补偿反而有两条天花板：基数按当地社平工资的三倍封顶，工龄再长也只算 12 年。月薪超过这条线的人要提前算清楚，别按自己的月薪乘以工龄估个数，那个数拿不到。","适用":"离职前 12 个月平均工资高于用人单位所在地上年度职工月平均工资三倍的。","成本":"不花钱。查一次当地上年度职工月平均工资。","收益":"月工资高于当地上年度职工月平均工资三倍的，按职工月平均工资三倍的数额支付，且支付年限最高不超过十二年。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第四十七条第二款","效力位阶":"法律","主张强度":"可主张","举证难度":"中——自己的工资流水可自行导出；「当地上年度职工月平均工资」需查当地人社部门公布的数值","地域":"全国；「当地上年度职工月平均工资」由各地公布，数值和口径（城镇非私营单位在岗职工平均工资等）各地不一","时效":"程序时效——仲裁申请时效一年。起算点——自解除或终止之日。例外——无特别时效，不适用劳动报酬类例外。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）","核对日期":"2026-10-03","备注":"不确定点在「上年度职工月平均工资」的取值口径与公布时点，各地口径不同（有的用全口径城镇单位就业人员平均工资，有的用上年度职工月平均工资），需向当地人力资源社会保障部门或拨 12333 确认当年适用数值。基数与年限是双重封顶，两个都要核。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"大","口径":"金钱"}},{"节号":5,"节名":"离职与补偿","条号":6,"标题":"违法解除是二倍：赔偿金按经济补偿标准的二倍算","说人话":"公司没理由就把你辞了，你要么要求回去上班，要么要赔偿金——赔偿金是按经济补偿的两倍算。注意 2N 和「N+1」是两回事：2N 是因为它违法，N+1 是它依法解除时的补偿加代通知金。别被「给你 N+1，签个字吧」带过去。","适用":"单位解除或终止劳动合同没有法定依据，或者程序违法（例如未提前三十日通知、未走裁员程序）。","成本":"时间——仲裁立案到裁决一般几个月；金钱——仲裁不收费，律师费通常自己承担。","收益":"用人单位违法解除或终止的，劳动者可要求继续履行合同；不要求继续履行或者合同已不能继续履行的，用人单位应按经济补偿标准的二倍支付赔偿金。这就是常说的 2N。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第四十八条、第八十七条、第四十七条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——解除通知、解除理由、程序材料需要留存；解除合法性由用人单位举证","地域":"全国","时效":"程序时效——仲裁申请时效一年。起算点——自收到解除或终止通知之日。例外——无特别时效，不适用劳动报酬类例外。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）","核对日期":"2026-10-03","备注":"2N 与 N+1 不能同时要——要求继续履行并获支持的，拿的是工资；不要求继续履行的，拿的是赔偿金。拿到书面解除通知是这一条的第一步；只有口头通知的，当天用邮件或聊天向对方确认「刚才你以 XX 理由解除，对吗」并把答复留底。解除理由一旦写定，事后很难由它改成别的理由。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"金钱"}},{"节号":5,"节名":"离职与补偿","条号":7,"标题":"离职证明必须给，而且内容有法定范围","说人话":"离职时公司必须给你一张解除（终止）劳动合同证明，这是它的义务，不给你可以去投诉，甚至要它赔损失。证明上写什么是有限定的——合同期限、离职日期、岗位、在本单位的年限。你不需要它在上面写评价性的话，写了不利于你的内容可以要求删掉。","适用":"办离职手续时，单位不出具解除或终止劳动合同的证明，或者证明上写了不利于你的评价。","成本":"不花钱。核对一次证明内容。","收益":"用人单位应当在解除或终止劳动合同时出具证明；未出具的由劳动行政部门责令改正，造成损害的承担赔偿责任。证明应写明劳动合同期限、解除或终止日期、工作岗位、在本单位的工作年限。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第五十条、第八十九条；《劳动合同法实施条例》（国务院令第 535 号）第二十四条","效力位阶":"法律（实施条例为行政法规）","主张强度":"可主张","举证难度":"易——证明本身是书面文件，内容是否有误一目了然；要求补正的沟通记录可留存","地域":"全国","时效":"程序时效——未出具证明的由劳动行政部门责令改正，行政查处路径；主张损害的走仲裁，时效一年。起算点——自解除或终止之日。例外——无特别时效，不适用劳动报酬类例外。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）；https://www.gov.cn/zhengce/zhengceku/2008-09/19/content_6630.htm（劳动合同法实施条例全文）","核对日期":"2026-10-03","备注":"证明上的「离职原因」会直接影响失业金资格（见 5.17）。要求书面补正的沟通要用邮件，口头提过很难举证。证明拿到后立刻扫描存云端——原件只有一份，入职下家时往往要交。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"大","口径":"金钱"}},{"节号":5,"节名":"离职与补偿","条号":8,"标题":"未休年假要折算成钱，但折算后不足 1 整天的部分不付","说人话":"离职时当年没休完的年假要折算成钱：用你在本单位当年过了多少天，除以 365，乘上全年应休天数，再减掉已经休的，剩下的天数按日工资的 200% 补给你（另外 100% 是正常工资里已经给过的）。算出来带小数的零头不满一整天的，那部分不付。","适用":"劳动合同解除或终止时，当年还有应休未休年休假。","成本":"不花钱。按公式算一次。","收益":"按日工资收入的 300% 支付应休未休年休假工资报酬（其中含正常工作期间已付工资，实际补发为 200%）。日工资＝月工资÷21.75；月工资为支付前 12 个月剔除加班工资后的月平均工资。离职折算＝（当年在本单位已过日历天数÷365）×全年应休天数−当年已安排天数，折算后不足 1 整天的部分不支付。","依据":"《企业职工带薪年休假实施办法》（人社部令第 1 号，2008-09-18 施行）第十条、第十一条、第十二条；《职工带薪年休假条例》（国务院令第 514 号）第五条","效力位阶":"部门规章（条例为行政法规）","主张强度":"可主张","举证难度":"中——自己当年的年假申请与审批记录、考勤记录需留存；累计工龄档位需要社保记录等材料支撑","地域":"全国","时效":"程序时效——仲裁申请时效一年。起算点——自劳动合同解除或终止之日。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"https://www.gov.cn/gongbao/content/2009/content_1265995.htm（企业职工带薪年休假实施办法全文）；https://www.gov.cn/zhengce/content/2008-03/28/content_6636.htm（职工带薪年休假条例全文）","核对日期":"2026-10-03","备注":"年假的举证难点在「当年已安排天数」——审批记录在公司系统里，离职当天就登不上去了。离职前把年假申请记录、审批结果、休假台账导出。日工资基数用的是剔除加班工资后的月平均工资，不是实发总额，算的时候别把加班费算进去。天数与不享受情形见第 2 节与第 4 节。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"中","口径":"金钱"}},{"节号":5,"节名":"离职与补偿","条号":9,"标题":"离职当天工资要一次付清，未结报销与绩效另算","说人话":"离职那天，最后一个月的工资要一次结清，不能拖到下个发薪日。没结的报销、已经确定的绩效也要一起算清楚，并且让对方出一张书面的结清明细。口头说「下个月一起发」的，你要留一句书面确认，否则下个月它可能说没有这回事。","适用":"办理离职手续时，最后一个月的工资、未结报销、已确定但未发的绩效还没结清。","成本":"不花钱。要一份书面的工资结清明细。","收益":"劳动关系双方依法解除或终止劳动合同时，用人单位应在解除或终止劳动合同时一次付清劳动者工资。","依据":"《工资支付暂行规定》（劳部发〔1994〕489 号，1995-01-01 施行）第九条","效力位阶":"部门规章","主张强度":"可主张","举证难度":"中——工资流水、报销单号、绩效约定文件需自己留存；绩效是否「已确定」由双方争议","地域":"全国","时效":"程序时效——仲裁申请时效一年；属劳动报酬类。起算点——自解除或终止之日，或自各期应发未发之日。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"https://www.gov.cn/zhengce/2022-08/31/content_5711284.htm（工资支付暂行规定全文）","核对日期":"2026-10-03","备注":"报销和绩效不属于「工资」，能否一次结清要看单位制度与凭证；但已在制度或书面约定中确认的数额，可以作为劳动报酬主张。离职前把报销单号、审批截图、绩效约定文件导出，这些在公司系统里的东西离职后就取不到了。结清明细要让对方签字或邮件确认。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"中","口径":"金钱"}},{"节号":5,"节名":"离职与补偿","条号":10,"标题":"未提前三十日通知，可能要多付一个月工资（代通知金）","说人话":"公司用「不能胜任」「医疗期满」这类理由辞你，要么提前 30 天书面通知，要么多给你一个月工资（这就是常说的「+1」）。两个都没做到，这一个月工资可以要。注意它只适用于第四十条那几种理由，不适用于违法解除——违法解除走的是 2N。","适用":"单位以「不能胜任工作」「医疗期满不能从事原工作」等理由解除，没有提前三十日书面通知你。","成本":"不花钱。核对解除通知上写明的解除依据和通知日期。","收益":"用人单位依据法定情形解除劳动合同的，应提前三十日以书面形式通知劳动者本人，或者额外支付劳动者一个月工资后解除。未提前通知又未额外支付的，可主张这一个月工资。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第四十条","效力位阶":"法律","主张强度":"可推定","举证难度":"中——解除通知的送达日期与解除依据需留存；「额外支付一个月工资」是否已付可由工资流水证明","地域":"全国；代通知金的计算基数（按上月工资还是前十二个月平均）各地口径不一","时效":"程序时效——仲裁申请时效一年。起算点——自解除之日。例外——无特别时效，不适用劳动报酬类例外。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）","核对日期":"2026-10-03","备注":"不确定点在代通知金的计算基数，各地做法不同（有按上一个月的工资标准，有按解除前十二个月平均工资），需向当地劳动人事争议仲裁委员会或拨 12333 确认。别把「+1」当成违法解除的赔偿——违法解除是 2N，两者不能混。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"中","口径":"金钱"}},{"节号":5,"节名":"离职与补偿","条号":11,"标题":"医疗期：患病非因工负伤期间不得解除，期限三到二十四个月按两段工龄分档","说人话":"医疗期就是「生病治疗期间公司不能辞你」的那段保护期。长度看两段工龄：你的实际工作年限，和你在本单位的年限。最短三个月，最长二十四个月。而且这段时间是按累计病休算的——三个月的医疗期，是在六个月内累计病休计算的，不是连续休满三个月。","适用":"因患病或非因工负伤需要停止工作治病休息，单位在此期间解除劳动合同。","成本":"时间——如发生争议走仲裁，一般几个月；金钱——仲裁不收费，律师费通常自己承担。","收益":"医疗期是指企业职工因患病或非因工负伤停止工作治病休息不得解除劳动合同的时限。根据本人实际参加工作年限和在本单位工作年限，医疗期为三到二十四个月：实际工作年限十年以下、在本单位五年以下为三个月，五年以上为六个月；实际工作年限十年以上、在本单位五年以下为六个月，五年以上十年以下为九个月，十年以上十五年以下为十二个月，十五年以上二十年以下为十八个月，二十年以上为二十四个月。","依据":"《企业职工患病或非因工负伤医疗期规定》（劳部发〔1994〕479 号，1995-01-01 施行）第二条、第三条、第四条、第六条；《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第四十条第一项、第四十二条第三项","效力位阶":"部门规章（《劳动合同法》条款为法律）","主张强度":"可主张","举证难度":"中——诊断证明、病假申请与审批记录、工资条需自己留存；两段工龄的年限可由社保缴费记录与离职证明证明","地域":"全国；医疗期的计算与病假工资标准的地方执行口径存在差异","时效":"程序时效——仲裁申请时效一年。起算点——自收到解除通知之日。例外——在本单位患职业病或者因工负伤并被确认丧失或者部分丧失劳动能力的，其合同终止按工伤保险规定执行（《劳动合同法》第四十五条但书）。","来源":"https://www.gov.cn/zhengce/2022-08/31/content_5711269.htm（中国政府网人力资源和社会保障部栏目·企业职工患病或非因工负伤医疗期规定全文）；http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文）","核对日期":"2026-10-03","备注":"医疗期是按累计病休时间算的——三个月的医疗期按六个月内累计病休时间计算，六个月按十二个月内累计，九个月按十五个月内，十二个月按十八个月内，十八个月按二十四个月内，二十四个月按三十个月内（第四条）。这个算法决定了「什么时候医疗期届满」，别按连续休假去理解。另：职工非因工致残或经认定患有难以治疗疾病，医疗期内医疗终结且不能从事原工作与原单位另行安排工作的，应进行劳动能力鉴定，被鉴定为五至十级的医疗期内不得解除劳动合同（第六条）。病假工资标准由地方规定，向当地人力资源社会保障部门或拨 12333 确认。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"健康"}},{"节号":5,"节名":"离职与补偿","条号":12,"标题":"合同到期时处于法定保护情形，合同要顺延","说人话":"合同到期时你正在休产假、医疗期，或者工伤还在处理，公司不能以「到期」为由终止，合同自动顺延到这些情形结束。注意两个坑：一是顺延期间不能主张未签书面合同的二倍工资；二是工伤致残这一类不适用顺延，走的是工伤保险的专门规则。","适用":"固定期限合同到期时，你正处于医疗期、孕期产期哺乳期、患职业病或因工负伤等法定保护情形。","成本":"不花钱。核对自己是否落在这些情形里。","收益":"劳动合同期满，有法定不得解除情形之一的，合同应当续延至相应情形消失时终止；但患职业病或因工负伤并被确认丧失或部分丧失劳动能力的，其合同终止按工伤保险规定执行。此类顺延属依法自动续延，不属于未订立书面劳动合同，顺延期间不触发二倍工资。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第四十二条、第四十五条；《最高人民法院关于审理劳动争议案件适用法律问题的解释（二）》（法释〔2025〕12 号，2025-09-01 施行）第八条","效力位阶":"法律（第八条为司法解释）","主张强度":"可主张","举证难度":"中——诊断证明、生育材料、工伤认定决定书需自己留存；「情形何时消失」的时间点由医疗材料支撑","地域":"全国","时效":"程序时效——仲裁申请时效一年。起算点——自单位以合同期满为由终止之日。例外——因工致残被确认丧失或部分丧失劳动能力的，其合同终止按工伤保险规定执行，不适用顺延规则。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）；http://gongbao.court.gov.cn/Details/bb72019c45453f84d920bd6375573e.html（最高人民法院公报·关于审理劳动争议案件适用法律问题的解释（二）全文，法释〔2025〕12 号）","核对日期":"2026-10-03","备注":"解释（二）已核到一手全文（最高人民法院公报，2026-10-03 复核），条文与 2026-09-02 记录一致。顺延期间不触发二倍工资这一点容易被误解成「又能要一笔钱」，实际相反。合同顺延的书面确认要主动向单位索取，避免社保、公积金断档。","成本标签":{"钱":"0","时间":"少","毅力":"些","收益":"大","口径":"自由"}},{"节号":5,"节名":"离职与补偿","条号":13,"标题":"经济补偿的年限怎么数：六个月以上不满一年按一年","说人话":"工龄的算法有几个取整规则：干满 1 年算 1 个月，满 6 个月不满 1 年按 1 年算，不满 6 个月算半个月。所以入职 7 个月离职能拿 1 个月，入职 5 个月只能拿半个月。入职日期是这一条唯一的起点，先把它固定下来。","适用":"已经确定能拿经济补偿，需要确定年限倍数。","成本":"不花钱。核对自己的入职日期。","收益":"经济补偿按在本单位工作的年限，每满一年支付一个月工资；六个月以上不满一年的，按一年计算；不满六个月的，支付半个月工资。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第四十七条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——入职日期可由劳动合同、社保缴费记录、工资流水、offer 证明；换过主体的需另行证明连续性","地域":"全国","时效":"程序时效——仲裁申请时效一年。起算点——自解除或终止之日。例外——无特别时效，不适用劳动报酬类例外。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）","核对日期":"2026-10-03","备注":"入职日期与劳动合同起始日不一致时，以实际用工之日为准（《劳动合同法》第七条）。用社保缴费记录的首次缴费月份交叉印证入职时间，比单靠合同起始日更稳。换过合同订立主体但工作场所、岗位未变的，年限可能连续计算（见 3.10）。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"大","口径":"金钱"}},{"节号":5,"节名":"离职与补偿","条号":14,"标题":"工作交接办完，补偿才付：别用交接卡补偿，也别用它当筹码","说人话":"交接和补偿是绑在一起的——法律规定交接办完就付补偿。所以要么同时进行，要么把交接清单做扎实、逐项双签，把「还没交接完」这个借口堵掉。别做「交接单上写已交接、钱却没到账」这种事：交接单签了，你在仲裁里就少了一个抓手。","适用":"协商解除或终止时，单位要求先完成交接再谈补偿，或者拿「不交接就不给钱」施压。","成本":"不花钱。列一份交接清单并逐项双签。","收益":"用人单位应当在办结工作交接时支付经济补偿；办理档案和社会保险关系转移手续应在十五日内完成。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第五十条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——交接清单、补偿支付凭证、社保转移记录需自己留存","地域":"全国","时效":"程序时效——仲裁申请时效一年。起算点——自解除或终止之日。例外——无特别时效，不适用劳动报酬类例外。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）","核对日期":"2026-10-03","备注":"交接清单写明项目、交付物、接收人、日期，双方签字，各留一份。交接单上不写「已结清全部款项」——这句话会把工资、加班费、年假、补偿全部一笔勾销。要写「已结清」就写清是哪几项、金额多少。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"大","口径":"金钱"}},{"节号":5,"节名":"离职与补偿","条号":15,"标题":"离职后社保关系要在十五日内转出，否则影响医保和缴费连续性","说人话":"离职后公司要在 15 天内把你的社保关系转出去、做减员。没做减员，新单位加不进来，中间就断缴——断缴直接影响医保报销和缴费年限。离职两周后自己查一次参保状态，还是「在职」的就去催。","适用":"离职后准备自己续保、以灵活就业身份参保，或者马上入职新单位。","成本":"不花钱。离职后一到两周内核实。","收益":"用人单位应当在解除或终止劳动合同时出具证明，并在十五日内为劳动者办理档案和社会保险关系转移手续。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第五十条","效力位阶":"法律","主张强度":"可主张","举证难度":"易——参保状态可自行查询（社保经办渠道、政务服务平台），不依赖单位配合","地域":"全国；转移接续的办理时限与流程由参保地规定","时效":"程序时效——单位未按规定办理的，可向社保经办机构或劳动保障监察反映；主张损害的走仲裁，时效一年。起算点——自解除或终止之日。例外——无特别时效，不适用劳动报酬类例外。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）","核对日期":"2026-10-03","备注":"减员日期和工资结清日一样值得书面确认——用邮件向单位确认「社保缴至 X 月，减员日期 X 月 X 日」。医保断缴的等待期与补缴能否报销，各地规定不同，需向参保地社保经办机构或拨 12333 确认。参保状态查询截图建议按月留存。","成本标签":{"钱":"0","时间":"少","毅力":"些","收益":"中","口径":"健康"}},{"节号":5,"节名":"离职与补偿","条号":16,"标题":"对劳动能力鉴定结论不服，十五日内申请再次鉴定","说人话":"工伤伤残等级定低了，从收到结论那天起 15 天内可以申请省级再次鉴定，省级的结论就是最终结论——过了这 15 天就定了。等级差一级，一次性伤残补助金差好几个月的工资，所以这个 15 天很值钱：拿到结论当天就记下日期。","适用":"工伤职工对设区的市级劳动能力鉴定委员会作出的伤残等级结论不服。","成本":"不花钱。申请再次鉴定本身不收费，但需要重新提交医疗资料。","收益":"可以在收到该鉴定结论之日起十五日内向省、自治区、直辖市劳动能力鉴定委员会提出再次鉴定申请；省级劳动能力鉴定委员会作出的结论为最终结论。自鉴定结论作出之日起一年后，伤残情况发生变化的可以申请复查鉴定。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）（国务院令第 586 号修订）第二十六条、第二十八条、第三十七条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"中——鉴定结论书的送达日期是关键，需留存签收记录；伤残变化的医学材料需要重新收集","地域":"全国；再次鉴定的受理流程由省级劳动能力鉴定委员会规定","时效":"程序时效——对市级鉴定结论不服的，15 日内申请再次鉴定；复查鉴定自鉴定结论作出之日起 1 年后可申请。起算点——自收到鉴定结论之日（不是作出之日）。例外——省级鉴定结论为最终结论，无再次申请通道。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本，2003 年国务院令第 375 号公布、2010-12-20 修订）","核对日期":"2026-10-03","备注":"15 日从「收到」起算，不是从结论书上写的日期起算——签收当天就在日历上标出来。伤残等级与一次性伤残补助金的对应关系见第 8 节。鉴定材料（住院病历、诊断证明、影像报告）自己留一套复印件，原件交出去就要不回来了。","成本标签":{"钱":"0","时间":"少","毅力":"些","收益":"大","口径":"金钱"}},{"节号":5,"节名":"离职与补偿","条号":17,"标题":"离职证明上的「离职原因」，决定你能不能领失业金","说人话":"能不能领失业金，先看你是不是「非因本人意愿」中断就业——合同到期单位不续、被裁、协商解除都算，自己写「个人原因辞职」就不算。所以离职证明和单位报给社保的原因必须写对。签收证明之前看清楚原因那一栏，写错了当场要求改。","适用":"准备申领失业保险金，但单位在离职证明或系统减员原因里写的是「个人原因辞职」。","成本":"不花钱。核对一次离职证明的表述。","收益":"失业人员领取失业保险金需满足「非因本人意愿中断就业」等条件；用人单位应当及时为失业人员出具终止或者解除劳动关系的证明，并将失业人员名单自终止或解除劳动关系之日起十五日内告知社会保险经办机构。","依据":"《社会保险法》（2018-12-29 修正）第五十条；《失业保险条例》（国务院令第 258 号）第十四条、第十六条","效力位阶":"法律（《失业保险条例》为行政法规）","主张强度":"可主张","举证难度":"中——离职证明是书面材料可留存；单位上报社保的减员原因需另行核实，个人不一定能直接看到","地域":"全国；「非因本人意愿中断就业」的具体情形与经办流程由地方规定，地方条例会作细化","时效":"程序时效——失业保险金申领按参保地经办流程办理，原 60 日申领期限已由国家层面的口径放宽；单位未在 15 日内告知名单的可向经办机构反映。起算点——自终止或解除劳动关系之日，待遇自办理失业登记之日起计发。例外——无特别时效豁免，但「越早登记越早起算」是实务上最要紧的一条。","来源":"http://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_296659.html（社会保险法 2018 修正全文）；https://www.gd.gov.cn/zwgk/wjk/zcfgk/content/mpost_2521625.html（失业保险条例全文）","核对日期":"2026-10-03","备注":"签离职证明前先看「原因」那一栏，这是全流程里最不可逆的一步。单位口头答应「都会帮你写好的」，要以最终拿到的证明文本为准。确认单位有没有在 15 日内把名单报给社保经办机构——没报就催。具体经办口径（含能否网上办、要哪些材料）向参保地社保经办机构或拨 12333 确认，第 7 节展开讲。","成本标签":{"钱":"0","时间":"少","毅力":"是","收益":"大","口径":"金钱"}},{"节号":5,"节名":"离职与补偿","条号":18,"标题":"主动辞职通常没有补偿，但有一种例外","说人话":"自己辞职一般拿不到补偿，这是常态。唯一的例外是公司本身有违法情形（欠薪、不缴社保、不提供劳动条件），你以这个理由辞职。所以递辞呈之前先确认两件事：公司有没有违法情形？辞职信上的理由怎么写？理由写错，补偿就是零。","适用":"你打算自己提出辞职。","成本":"不花钱。辞职前确认自己有没有落在例外情形里。","收益":"劳动者提前三十日以书面形式通知用人单位，可以解除劳动合同；在试用期内提前三日通知即可解除。劳动者主动辞职的，一般不属于支付经济补偿的情形——例外是依据第三十八条以单位违法为由解除（见 5.1）。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第三十七条、第三十八条、第四十六条第一项","效力位阶":"法律","主张强度":"可主张","举证难度":"中——辞职通知的送达时间与理由需留存；三十日期满即可解除，无需单位批准","地域":"全国","时效":"程序时效——仲裁申请时效一年。起算点——自劳动合同解除之日（三十日通知期满之日）。例外——依据第三十八条解除的，属应付经济补偿情形。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）","核对日期":"2026-10-03","备注":"辞职通知要留送达痕迹（邮件、签收、聊天记录）。辞职信里不写「个人原因」「家庭原因」「另谋发展」——写了就无法再主张第三十八条的补偿。三十日通知期内单位要求提前走人的，可以协商，但别口头答应后又不留痕。","成本标签":{"钱":"0","时间":"少","毅力":"些","收益":"大","口径":"金钱"}},{"节号":5,"节名":"离职与补偿","条号":19,"标题":"严重违纪被辞：没有补偿，而且必须真的有依据","说人话":"公司说你严重违纪把你辞了，它不用给补偿——前提是它真拿得出依据：制度要合法有效，你确实违纪，而且违纪事实有证据。这三样缺一样，就是违法解除，赔两倍。所以被这样辞的时候，先问它要「哪条制度、什么事实、什么证据」。","适用":"单位以「严重违反规章制度」「严重失职造成重大损害」等理由解除劳动合同，不付补偿。","成本":"时间——如认为解除违法，走仲裁一般几个月；金钱——仲裁不收费，律师费通常自己承担。","收益":"用人单位以严重违纪为由解除的，无需支付经济补偿。但此类解除的举证责任在用人单位一边：规章制度须经民主程序并公示或告知，违纪事实须有证据。举证不足的，构成违法解除，可主张二倍赔偿金。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第四条、第三十九条第二项与第三项、第四十八条、第八十七条","效力位阶":"法律","主张强度":"可推定","举证难度":"难——规章制度是否公示告知、违纪事实是否存在，证据多由用人单位掌握；劳动者一侧往往难以还原当时的完整情形","地域":"全国；对「严重违反」与「重大损害」的认定标准各地差异明显","时效":"程序时效——仲裁申请时效一年。起算点——自收到解除通知之日。例外——无特别时效，不适用劳动报酬类例外。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）","核对日期":"2026-10-03","备注":"举证难度标「难」——取证时机在解除之前和收到通知的当场。具体动作：要求单位出具书面解除通知，写明所依据的具体条款和事实；自己把能证明事实经过的聊天记录、邮件、监控时间点、在场同事的证言第一时间留存；核对员工手册自己有没有签收页，没签过的版本当场拍照留版本号。不确定点在「严重违反」的尺度与制度送达的证明标准，各地口径不一，可向当地劳动人事争议仲裁委员会或拨 12333 咨询本地尺度。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"金钱"}},{"节号":5,"节名":"离职与补偿","条号":20,"标题":"经济性裁员有程序要求：提前三十日说明、报劳动行政部门","说人话":"大批裁员不是发个通知就完事：要提前 30 天向工会或全体员工说明，听取意见，方案还要报劳动行政部门。程序没走，解除就可能被认定违法，赔偿按两倍算。被裁时先问一句「方案报过劳动行政部门了吗」，把它答不上来的那一刻记下来。","适用":"单位以「生产经营发生严重困难」等理由裁减人员二十人以上，或裁减不足二十人但占职工总数百分之十以上。","成本":"时间——争议走仲裁，一般几个月；金钱——仲裁不收费，律师费通常自己承担。","收益":"裁减人员须提前三十日向工会或者全体职工说明情况，听取工会或职工意见后，裁减人员方案经向劳动行政部门报告，方可裁减。未走程序的，可能构成违法解除，可主张二倍赔偿金；依法裁减的应支付经济补偿。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第四十一条、第四十二条、第四十六条第四项、第四十七条、第八十七条","效力位阶":"法律","主张强度":"可推定","举证难度":"中——裁员通知、说明会记录、方案报告材料需留存；是否履行程序由用人单位举证","地域":"全国；对「生产经营发生严重困难」的认定与报告要求，各地把握不同","时效":"程序时效——仲裁申请时效一年。起算点——自收到解除通知之日。例外——处于法定不得解除情形（如医疗期、孕期产期哺乳期等）的，不得依第四十一条裁减。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）","核对日期":"2026-10-03","备注":"不确定点在「严重困难」的认定标准和报告的形式要求，各地裁审尺度不一，需向当地劳动人事争议仲裁委员会或拨 12333 确认。第四十二条的不得解除情形在裁员场景同样适用——如果你正处于医疗期、孕期产期哺乳期，或符合其他法定保护情形，可以此抗辩；具体范围以官方条文为准。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"金钱"}},{"节号":5,"节名":"离职与补偿","条号":21,"标题":"因工致残被鉴定为一至四级：保留劳动关系，退出工作岗位","说人话":"一到四级伤残是最重的档，劳动关系保留但你不用上班：一次性给一笔（21 到 27 个月本人工资），之后每月发伤残津贴（本人工资的 75% 到 90%），退休后转成养老金，比伤残津贴低的部分工伤保险基金补上。这一档的钱全部由工伤保险基金出，前提是单位给你缴了工伤保险。","适用":"工伤职工被鉴定为一至四级伤残。","成本":"不花钱。核对自己的伤残等级与待遇发放渠道。","收益":"保留劳动关系，退出工作岗位，享受：一次性伤残补助金（一级 27 个月、二级 25 个月、三级 23 个月、四级 21 个月的本人工资）；按月伤残津贴（一级 90%、二级 85%、三级 80%、四级 75% 的本人工资，低于当地最低工资标准的由工伤保险基金补足）；达到退休年龄并办理退休手续后停发伤残津贴，改享基本养老保险待遇，低于伤残津贴的由基金补足差额。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）（国务院令第 586 号修订）第三十五条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"易——伤残等级由劳动能力鉴定结论确定，待遇标准由条例明文规定，属官方鉴定与核定渠道","地域":"全国","时效":"程序时效——一次性伤残补助金与伤残津贴由工伤保险基金按核定发放；对核定的待遇有异议可申请行政复议或提起行政诉讼（行政复议 60 日、行政诉讼 6 个月）。起算点——自收到核定结果之日。例外——无特别时效豁免。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本，2003 年国务院令第 375 号公布、2010-12-20 修订）","核对日期":"2026-10-03","备注":"「本人工资」指工伤职工因工作遭受事故伤害或者患职业病前十二个月平均月缴费工资；高于统筹地区职工平均工资 300% 的按 300% 计算，低于 60% 的按 60% 计算。注意是「月缴费工资」不是实发工资——单位低报缴费基数会直接压低这一档的待遇，所以入职后核缴费基数这件事本身就是保命动作（见第 2 节）。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"大","口径":"金钱"}},{"节号":5,"节名":"离职与补偿","条号":22,"标题":"因工致残七至十级：一次性补助金加离职时的两笔补助","说人话":"七到十级是最轻的四档，先拿一笔一次性伤残补助金（7 到 13 个月本人工资）。之后如果合同到期不续、或者你自己提出离职，还能再拿两笔：一笔由工伤保险基金出（工伤医疗补助金），一笔由公司出（伤残就业补助金）。这两笔的标准是各省自己定的，同一个伤残等级在不同省份金额差别很大，必须查工作地所在省的规定。","适用":"工伤职工被鉴定为七至十级伤残。","成本":"不花钱。核对伤残等级与是否解除、终止劳动关系。","收益":"从工伤保险基金按等级支付一次性伤残补助金（七级 13 个月、八级 11 个月、九级 9 个月、十级 7 个月的本人工资）；劳动、聘用合同期满终止，或者职工本人提出解除劳动、聘用合同的，由工伤保险基金支付一次性工伤医疗补助金，由用人单位支付一次性伤残就业补助金（两项具体标准由省级政府规定）。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）（国务院令第 586 号修订）第三十七条","效力位阶":"行政法规","主张强度":"可推定","举证难度":"中——伤残等级与工伤认定材料由自己留存；两笔补助金的本地标准需另行查询","地域":"全国；一次性工伤医疗补助金和一次性伤残就业补助金的具体标准由省、自治区、直辖市人民政府规定，省际差异大","时效":"程序时效——工伤待遇争议走仲裁，时效一年；对经办机构核定的待遇有异议可申请行政复议（60 日）或提起行政诉讼（六个月）。起算点——一次性伤残补助金自核定之日；两笔补助金自合同期满终止或本人提出解除之日。例外——无特别时效豁免。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（国家行政法规库·工伤保险条例现行本，2003 年国务院令第 375 号公布、2010-12-20 修订）","核对日期":"2026-10-03","备注":"不确定点在两笔补助金的省级标准上，条例只授权未给数字，必须查工作地所在省的现行规定，可向当地社保经办机构或拨 12333 确认。离职顺序有讲究：本人提出解除会触发这两笔，但会同时失去劳动关系保障，建议先确认补助金数额再决定；具体经办流程向参保地社保经办机构确认。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"金钱"}},{"节号":5,"节名":"离职与补偿","条号":23,"标题":"劳动合同终止的六种情形：哪些要补偿、哪些不用","说人话":"合同结束分两类：终止（按第四十四条六种情形）和解除（提前结束）。终止里，合同期满而单位不续、单位破产、单位被吊销执照关闭解散——这几种要给补偿；你开始领养老金、或者劳动者死亡——不给。判断补偿时先看落在哪一项。","适用":"劳动关系结束，想确认自己是「解除」还是「终止」，据此判断有没有补偿。","成本":"不花钱。对照六种情形定位一次。","收益":"有下列情形之一的，劳动合同终止：① 劳动合同期满的；② 劳动者开始依法享受基本养老保险待遇的；③ 劳动者死亡，或者被人民法院宣告死亡或者宣告失踪的；④ 用人单位被依法宣告破产的；⑤ 用人单位被吊销营业执照、责令关闭、撤销或者用人单位决定提前解散的；⑥ 法律、行政法规规定的其他情形。其中第①项在第四十六条第五项规则下可能产生经济补偿；第②③项
