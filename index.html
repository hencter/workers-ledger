是否还有路径，不要靠猜。工伤认定的完整流程见第 8 节。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"大","口径":"健康"}},{"节号":9,"节名":"维权路径与时效","条号":6,"标题":"仲裁审理有 45 日期限，逾期可以直接起诉","说人话":"仲裁从受理到出裁决一般 45 天，复杂的最多再延 15 天。超过这个期限还没出结果的，你可以直接去法院起诉——不用无限期等下去。","适用":"仲裁申请已受理，等结果等得不耐烦。","成本":"不花钱。记下受理日期即可。","收益":"仲裁庭裁决劳动争议案件，应当自劳动争议仲裁委员会受理仲裁申请之日起 45 日内结束；案情复杂需要延期的，经劳动争议仲裁委员会主任批准，可以延期并书面通知当事人，但延长期限不得超过 15 日。逾期未作出仲裁裁决的，当事人可以就该劳动争议事项向人民法院提起诉讼。","依据":"《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第四十三条","效力位阶":"法律","主张强度":"可主张","举证难度":"易——受理通知书是计算 45 日起算点的关键凭证，需留存","地域":"全国","时效":"程序时效——受理之日起 45 日内结束，可延长 15 日；逾期未裁决的可向人民法院起诉。起算点——自劳动争议仲裁委员会受理仲裁申请之日。例外——逾期未作出仲裁裁决的，当事人可以就该劳动争议事项向人民法院提起诉讼。","来源":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（劳动争议调解仲裁法全文，第四十三条）","核对日期":"2026-10-03","备注":"受理通知书要留好，上面有受理日期，这是算 45 天和你主张「逾期未裁决」的唯一依据。案多人少的地方延期常见，延期须经主任批准并书面通知当事人——没收到书面延期通知的，可以据此主张。管辖与进度查询向当地劳动人事争议仲裁委员会咨询。","成本标签":{"钱":"0","时间":"中","毅力":"否","收益":"中","口径":"时间"}},{"节号":9,"节名":"维权路径与时效","条号":7,"标题":"追索劳动报酬可申请先予执行，不用等裁决完","说人话":"如果你是因为被欠工资、要工伤医疗费、要补偿金而打官司，而且等钱等得急，可以向仲裁庭申请「先予执行」——先裁一部分让法院执行，不用等整个案子裁完。这是给着急用钱的人留的一条快车道。","适用":"被长期欠薪，生活已经受影响，等不到裁决下来。","成本":"不花钱。需要提出申请并说明情况。","收益":"仲裁庭对追索劳动报酬、工伤医疗费、经济补偿或者赔偿金的案件，根据当事人的申请，可以裁决先予执行，移送人民法院执行。","依据":"《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第四十四条","效力位阶":"法律","主张强度":"可推定","举证难度":"中——需要证明追索事项属于法定范围、且存在急需的实际情况；相关凭证（欠薪记录、医疗费用单据）需自己提供","地域":"全国；各地仲裁委对「先予执行」适用条件的把握不同","时效":"程序时效——随仲裁程序提出，不单独计算时效；仲裁申请本身受一年时效限制。起算点——自仲裁申请受理后、裁决作出前提出。例外——无特别时效豁免。","来源":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（劳动争议调解仲裁法全文，第四十四条）","核对日期":"2026-10-03","备注":"不确定点在于「先予执行」的裁量条件与执行速度——法条只规定可以裁决，具体是否准予由仲裁庭判断，各地掌握尺度不同，需向当地劳动人事争议仲裁委员会咨询或拨 12333 确认。申请时要说明为什么急需（医疗费单据、家庭支出凭证），理由具体一些更容易获准。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"大","口径":"金钱"}},{"节号":9,"节名":"维权路径与时效","条号":8,"标题":"劳动仲裁不收费，但律师费通常自己承担","说人话":"劳动仲裁不收费，这一点可以放心。花钱的地方是请律师——而且通常不管输赢都是自己出。所以简单、证据清楚的案子（欠薪、二倍工资、未休年假折算）可以自己办；涉及违法解除定性、竞业限制、工伤等级这类复杂的，再考虑请律师。","适用":"担心打不起官司。","成本":"金钱——劳动仲裁不收费，仲裁委员会的经费由财政予以保障；如果请律师，费用一般由自己承担，不在败诉方负担的范围内。","收益":"走仲裁这条路的直接成本是零。真正的成本是时间和精力，以及要不要请律师。","依据":"《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第五十三条","效力位阶":"法律","主张强度":"可主张","举证难度":"易——收费规则由法律明文规定，无需举证","地域":"全国","时效":"无特别时效——仲裁收费规则本身不涉及时效。起算点：不适用，本条只讲费用。例外：案件实体权利的时效按本节第 9.1 条计算。","来源":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（劳动争议调解仲裁法全文，第五十三条）","核对日期":"2026-10-03","备注":"部分地方对劳动者一方提供法律援助，符合经济困难等条件的可以申请，具体受理条件与窗口向当地法律援助机构、劳动人事争议仲裁委员会或拨 12333 咨询。自己办的案子照样要写清请求事项与数额，仲裁委不会替你算。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"中","口径":"金钱"}},{"节号":9,"节名":"维权路径与时效","条号":9,"标题":"举证责任：这几类争议由用人单位举证","说人话":"不是你什么都要自己证明。公司做的决定——开除、辞退、解除合同、扣你工资、算你的工龄——由它来举证说明理由和依据。它拿不出来，对它不利。你要证明的是加班这类「事实存在」的事，而且只要能证明材料在公司手里，它不交就由它承担后果。","适用":"担心「什么都要我自己证明」。","成本":"不花钱。核对争议事项属于哪一类。","收益":"因用人单位作出的开除、除名、辞退、解除劳动合同、减少劳动报酬、计算劳动者工作年限等决定而发生的劳动争议，用人单位负举证责任。 主张加班费的，劳动者应就加班事实存在承担举证责任，但有证据证明用人单位掌握加班事实存在的证据而用人单位不提供的，由用人单位承担不利后果。","依据":"《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》（法释〔2020〕26 号，2021-01-01 施行）第四十二条、第四十四条","效力位阶":"司法解释","主张强度":"可主张","举证难度":"中——自己一侧的基础材料仍需提交；举证责任的分配规则可在庭审中主张适用","地域":"全国（该解释为全国统一适用）","时效":"程序时效——仲裁申请时效一年。起算点——自知道或者应当知道权利被侵害之日。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制。","来源":"https://www.court.gov.cn/fabu/xiangqing/282121.html（最高人民法院官网·关于审理劳动争议案件适用法律问题的解释（一）全文，第四十二条、第四十四条）","核对日期":"2026-10-03","备注":"开庭时明确主张举证责任分配——「这个决定是公司作出的，依据应由公司举证」，把这句话说出来和不说出来，结果不一样。自己一侧仍要交基础材料（劳动合同、工资流水、解除通知），举证责任分配不是免除自己的举证义务。管辖与程序问题向当地劳动人事争议仲裁委员会咨询或拨 12333。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"金钱"}},{"节号":9,"节名":"维权路径与时效","条号":10,"标题":"部分裁决是终局裁决，劳动者不服仍可起诉","说人话":"有些裁决是「终局」的，但不是对你也终局——公司不能再起诉，你作为劳动者不服还是可以在收到裁决书 15 天内去法院起诉。反过来，公司想推翻终局裁决只能去中院申请撤销，门槛更高。所以别听到「终局」就以为没救了。","适用":"收到仲裁裁决书，想知道还能不能继续打。","成本":"时间——劳动者起诉的期限是 15 日；金钱——仲裁不收费，诉讼按法院标准交费。","收益":"下列劳动争议，除法律另有规定外，仲裁裁决为终局裁决，裁决书自作出之日起发生法律效力；劳动者对终局裁决不服的，可以自收到仲裁裁决书之日起 15 日内向人民法院提起诉讼；用人单位有证据证明裁决存在法定情形的，可以自收到裁决书之日起 30 日内向劳动争议仲裁委员会所在地的中级人民法院申请撤销裁决。对终局裁决以外的其他劳动争议案件的仲裁裁决不服的，当事人可以自收到裁决书之日起 15 日内向人民法院提起诉讼；期满不起诉的，裁决书发生法律效力。","依据":"《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第四十七条、第四十八条、第四十九条、第五十条","效力位阶":"法律","主张强度":"可主张","举证难度":"易——裁决书与送达签收记录是判断期限的唯一依据","地域":"全国","时效":"程序时效——劳动者起诉期限 15 日；用人单位申请撤销期限 30 日；非终局裁决的起诉期限 15 日。起算点——自收到仲裁裁决书之日。例外——期满不起诉的，裁决书发生法律效力。","来源":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（劳动争议调解仲裁法全文，第四十七条至第五十条）","核对日期":"2026-10-03","备注":"签收裁决书的日期必须记准——15 日很短，且是自然日还是工作日、怎么起算，各地法院把握不同，需向受诉人民法院立案窗口或当地劳动人事争议仲裁委员会确认。终局裁决的具体范围见第四十七条列举，不要凭印象判断自己这一案是不是终局。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"中","口径":"金钱"}},{"节号":9,"节名":"维权路径与时效","条号":11,"标题":"对行政机关的处理不服：复议 60 日、诉讼 6 个月","说人话":"跟行政机关的决定较劲，有两条路：先复议再诉讼，或者直接去法院。时限要记牢——行政复议申请期限 60 日，行政诉讼起诉期限 6 个月。具体起算日和前置要求各地有差别，拿到决定书当天就把日期标出来。","适用":"对工伤认定结论不服、对社保经办机构的核定不服、对劳动保障监察的处理不服。","成本":"行政复议与行政诉讼一般不收费（行政诉讼按法院标准可能收取少量费用）。","收益":"对工伤认定申请不予受理的决定、对工伤认定结论不服的，有关单位或者个人可以依法申请行政复议，也可以依法向人民法院提起行政诉讼。用人单位或者个人认为社会保险费征收机构的行为侵害其合法权益的，或者对社会保险经办机构不依法办理登记、核定、支付待遇、办理转移接续手续等行为不服的，可以依法申请行政复议或者提起行政诉讼。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）第五十五条；《社会保险法》（2018-12-29 修正）第八十三条；《劳动保障监察条例》","效力位阶":"行政法规（《社会保险法》第八十三条为法律）","主张强度":"可主张","举证难度":"中——行政决定书与送达时间是期限起算的关键，需留存签收凭证","地域":"全国；复议机关与受诉法院按属地确定","时效":"程序时效——行政复议申请期限 60 日；行政诉讼起诉期限 6 个月。起算点——自知道该行政行为之日（一般以收到决定书之日起算）。例外——法律规定复议前置的，须先经复议；具体以对应法律的规定为准。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（工伤保险条例全文，第五十五条）；http://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_296659.html（中国人大网·社会保险法全文，含 2018 修正说明，第八十三条）","核对日期":"2026-10-03","备注":"60 日与 6 个月是上限，不是建议时长，超过就丧失救济机会。复议与诉讼是两条不同程序，是否必须先进复议、管辖法院怎么定，各地有差别，拿到决定书后尽快向作出决定的机关、当地司法行政部门复议机构或人民法院立案窗口确认。建议在期限过半前完成咨询和材料准备。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"中","口径":"金钱"}},{"节号":9,"节名":"维权路径与时效","条号":12,"标题":"仲裁申请要交书面申请，并按被申请人人数交副本","说人话":"仲裁要交书面申请，而且要按对方人数准备复印件——一个被申请人就交一份正本，两个就再加一份副本。申请书里必须写清三件事：你要什么（请求事项和金额）、凭什么（事实和理由）、有什么证据。请求金额别只写「依法裁决」，要写出具体数字，否则裁决时无法支持。","适用":"准备提交劳动仲裁申请。","成本":"不花钱。写申请与复印材料，几小时。","收益":"申请人申请仲裁应当提交书面仲裁申请，并按照被申请人人数提交副本。仲裁申请书应当载明劳动者与用人单位的基本信息、仲裁请求和所根据的事实理由、证据和证据来源等。","依据":"《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第二十八条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——证据清单与证据来源需要自己整理；请求金额要有计算依据","地域":"全国；受理窗口与格式要求由当地仲裁委员会规定","时效":"程序时效——仲裁申请时效一年；提交材料不齐的按仲裁委要求补正。起算点——自当事人知道或者应当知道其权利被侵害之日。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制。","来源":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（劳动争议调解仲裁法全文，第二十八条）","核对日期":"2026-10-03","备注":"请求事项要一条一条列清楚并写出各自金额：欠薪多少、加班费多少、未休年假折算多少、经济补偿多少、赔偿金多少。金额漏写或写得笼统，裁决时无法支持。仲裁委通常会提供申请书模板，去之前先向当地劳动人事争议仲裁委员会要一份或拨 12333 确认材料清单。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"中","口径":"金钱"}},{"节号":9,"节名":"维权路径与时效","条号":13,"标题":"要去哪里仲裁：劳动合同履行地或用人单位所在地","说人话":"可以在两个地方选一个申请仲裁：你实际干活的地方，或者公司所在地。两边都能立案的话，谁先受理归谁；同时申请时，实际干活地优先。选对自己方便的——通常是你工作的地方，取证、开庭都省事。","适用":"人在外地工作、公司注册地在别处，不知道该去哪申请。","成本":"不花钱。选定管辖地再跑。","收益":"劳动争议由劳动合同履行地或者用人单位所在地的劳动争议仲裁委员会管辖。双方当事人分别向劳动合同履行地和用人单位所在地的劳动争议仲裁委员会申请仲裁的，由劳动合同履行地的劳动争议仲裁委员会管辖。","依据":"《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第二十一条","效力位阶":"法律","主张强度":"可主张","举证难度":"易——劳动合同履行地与用人单位所在地可由合同、考勤记录、社保缴费单位信息确定","地域":"全国；具体受理范围由各地仲裁委员会按属地划分","时效":"程序时效——仲裁申请时效一年；管辖异议需在答辩期内提出。起算点——自当事人知道或者应当知道其权利被侵害之日。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制。","来源":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（劳动争议调解仲裁法全文，第二十一条）","核对日期":"2026-10-03","备注":"「劳动合同履行地」要用材料固定——劳动合同里约定的工作地点、考勤打卡记录、社保缴费单位、办公地址的邮件签名都能用。长期驻外地工作的，保留租房合同、差旅记录、办公地址证明会更有力。管辖有争议时向拟申请地的仲裁委员会咨询或拨 12333 确认。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"中","口径":"时间"}},{"节号":9,"节名":"维权路径与时效","条号":14,"标题":"时效中断怎么留痕：这一步决定一年能不能重来","说人话":"只要你在一年内跟公司主张过权利，这一年就重新开始算——这是给你留的活路。但关键在于「主张过」要有痕迹：口头说过不算。发一封邮件要求支付欠薪、提交一次劳动监察投诉、让对方在聊天里回一句「知道了我们会处理」，都能构成中断。","适用":"离时效届满不远了，但还在跟公司协商、还没打算仲裁。","成本":"不花钱。每次沟通留一次书面痕迹。","收益":"仲裁时效因当事人一方向对方当事人主张权利、或者向有关部门请求权利救济、或者对方当事人同意履行义务而中断；从中断时起，仲裁时效期间重新计算。","依据":"《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第二十七条第二款","效力位阶":"法律","主张强度":"可主张","举证难度":"中——中断的证据必须是书面的、能显示时间和内容的；口头沟通难以举证","地域":"全国","时效":"程序时效——中断后时效期间重新计算。起算点——自中断事由发生之日重新起算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年时效限制。","来源":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（劳动争议调解仲裁法全文，第二十七条）","核对日期":"2026-10-03","备注":"推荐的留痕方式：邮件（抄送自己）、企业微信或钉钉的书面催告、劳动监察投诉回执、书面催款函（邮寄并保留单号）。对方回复「我们会处理」「再说吧」这类内容也构成中断。每次沟通后把日期和内容记一条台账，将来主张中断时，这份台账就是证据链。","成本标签":{"钱":"0","时间":"少","毅力":"些","收益":"大","口径":"金钱"}},{"节号":10,"节名":"灰色地带与常见误解","条号":1,"标题":"「试用期不用交社保」","说人话":"试用期不缴社保是明确违法的。法律写的是「用工之日起三十日内」，跟你是不是试用期没有关系。你可以要求补缴；未办理登记的，社保经办机构会核定应缴数额，单位还会被责令改正、罚款。","适用":"入职时被告知「试用期先不缴社保，转正后再缴」。","成本":"不花钱。查一次参保状态。","收益":"这个说法站不住。用人单位应当自用工之日起三十日内为其职工向社会保险经办机构申请办理社会保险登记。参保义务的起算点是「用工之日」，不是「转正之日」——试用期包含在劳动合同期限内，也是用工期间。","依据":"《社会保险法》（2018-12-29 修正）第五十八条、第八十四条；《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第十九条第四款","效力位阶":"法律","主张强度":"可主张","举证难度":"易——参保状态可自行查询，是否登记属官方系统记录","地域":"全国","时效":"程序时效——补缴走社保征收机构责令限期缴纳或补足；向劳动保障监察投诉的 2 年查处期限。起算点——自用工之日起满三十日后仍未办理登记之日。例外——社会保险费征缴不适用劳动关系终止后一年内的仲裁时效限制。","来源":"http://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_296659.html（社会保险法 2018 修正全文页）；http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）","核对日期":"2026-10-03","备注":"「转正后再缴」这个说法本身就是最好的证据——把招聘信息、聊天记录、入职说明里的这句话截图留存。发现未参保时当场截图查询结果并书面要求单位办理。具体补缴流程向参保地社保经办机构或拨 12333 确认。","成本标签":{"钱":"0","时间":"少","毅力":"些","收益":"大","口径":"健康"}},{"节号":10,"节名":"灰色地带与常见误解","条号":2,"标题":"「你自己签了自愿放弃社保，就不能再要了」","说人话":"签了放弃社保的承诺书也照样可以要求补缴——那条承诺在法律上不算数。但要留意对面一手：如果公司每月给你发过「社保补贴」，它后来补缴了，可以要求你把补贴退回去。所以别把补贴当成省下来的钱花掉。","适用":"入职时签过「自愿放弃缴纳社会保险」的承诺书或协议，单位以此为由拒绝补缴。","成本":"不花钱。把承诺书留一份复印件。","收益":"这个说法站不住。此类约定或承诺无效，不影响劳动者依法主张权利。但有一个反向的坑：用人单位事后依法补缴的，可以请求劳动者返还其已支付的社保补偿款（例如按月随工资发放的「社保补贴」）。","依据":"《最高人民法院关于审理劳动争议案件适用法律问题的解释（二）》（法释〔2025〕12 号，2025-09-01 施行）第十九条","效力位阶":"司法解释","主张强度":"可主张","举证难度":"中——承诺书、工资条上「社保补贴」名目需自己留存","地域":"全国（该解释为全国统一适用）","时效":"程序时效——补缴走行政征缴路径；返还补偿款的争议走仲裁，时效一年。起算点——返还请求自单位完成补缴之日。例外——社会保险费征缴不适用劳动关系终止后一年内的仲裁时效限制。","来源":"http://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_296659.html（社会保险法 2018 修正全文页，作入口）；http://gongbao.court.gov.cn/Details/bb72019c45453f84d920bd6375573e.html（最高人民法院公报·关于审理劳动争议案件适用法律问题的解释（二）全文，法释〔2025〕12 号）","核对日期":"2026-10-03","备注":"解释（二）已核到一手全文（最高人民法院公报）。签过放弃承诺的，把承诺书扫描留存；工资条上标注「社保补贴」「社保补助」的项目逐月留档，将来可能被主张返还。具体补缴与返还的经办口径向参保地社保经办机构或拨 12333 确认。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"健康"}},{"节号":10,"节名":"灰色地带与常见误解","条号":3,"标题":"「合同里约定了违约金，你走就得赔」","说人话":"公司不是想写多少违约金就能要多少的。法律只认两种情况：它花钱送你专项培训并约定了服务期，或者签了竞业限制。除此之外的「违反承诺赔 X 万」——违约金部分可以争。但它仍可能按实际损失索赔，所以别以为条款无效就完全没事。","适用":"合同或承诺书里写了「违反承诺赔偿 X 万元」，离职时被要求按这句话付钱。","成本":"时间——争议走仲裁，一般几个月；金钱——仲裁不收费。","收益":"这个说法大部分情况下站不住。除服务期（第二十二条）和竞业限制（第二十三条）两种情形外，用人单位不得与劳动者约定由劳动者承担违约金。超出这两种授权的违约金条款，其违约金部分存在抗辩空间。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第二十二条、第二十三条、第二十五条、第九十条","效力位阶":"法律","主张强度":"可推定","举证难度":"中——违约金条款文本与培训费凭证需核对；实际损失的举证责任在用人单位","地域":"全国；对超出授权范围的违约金条款，各地裁判路径不完全一致","时效":"程序时效——用人单位主张赔偿走仲裁，时效一年。起算点——自其知道损失发生之日。例外——无特别时效豁免。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）","核对日期":"2026-10-03","备注":"不确定点在「违约金无效」与「按实际损失赔偿」的衔接——各地裁审处理不一致，需向当地劳动人事争议仲裁委员会或拨 12333 确认本地尺度。签字前把所有「违约金」字样圈出来，看它挂在哪种构造下（见第 6 节）。有权要求单位出示培训费凭证，出示不了的服务期违约金基础不牢。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"金钱"}},{"节号":10,"节名":"灰色地带与常见误解","条号":4,"标题":"「没签劳动合同就不算劳动关系，你没办法」","说人话":"劳动关系从你上班第一天就成立了，不是从签合同那天。没签合同对公司的代价是双倍工资——从上班满一个月的第二天起算，最多十一个月。你要做的是证明「我确实在这里上过班」：工资流水、考勤、工牌、聊天记录、社保记录。","适用":"单位不签书面合同，发生争议时说「我们没合同，不存在劳动关系」。","成本":"不花钱。日常留存材料即可。","收益":"这个说法站不住。用人单位自用工之日起即与劳动者建立劳动关系。建立劳动关系应当订立书面劳动合同；自用工之日起超过一个月不满一年未订立书面劳动合同的，应当向劳动者每月支付二倍的工资。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第七条、第十条、第八十二条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——工资流水、考勤截图、聊天记录需自己留存；未签合同的事实由单位举证反驳","地域":"全国","时效":"程序时效——仲裁申请时效一年。起算点——二倍工资按月各自产生独立请求权，逐月起算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）","核对日期":"2026-10-03","备注":"举证难点在「用工起始日」——入职通知、第一笔工资、首次打卡、社保首次缴费月份都能固定这个日期。二倍工资是逐月起算的，拖得越久，早期月份越可能超时效，所以发现没签合同就要尽早主张。满一年仍未签的，视为已订立无固定期限合同，但拟制期间不再支持二倍工资（见 3.11）。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"金钱"}},{"节号":10,"节名":"灰色地带与常见误解","条号":5,"标题":"「签了自愿放弃加班费的协议，就不能再要加班费」","说人话":"公司拿着一张「自愿放弃加班费」的协议说「你签过字了」——这句话在法条里找不到出处，法律没有哪一条写着签了就永远不能要。但反过来说，也没有哪一条明文写着这种协议一定无效。所以别停在「协议算不算数」上吵，先把加班证据抓在手里：只要能证明材料在公司手里，它不交就要承担对它不利的后果。","适用":"入职或在职期间签过「自愿放弃加班费」「加班费已包含在工资中」之类的协议，事后想主张加班费。","成本":"时间——主张走仲裁，一般几个月；金钱——仲裁不收费。","收益":"没有可直接援引的全国统一条文——法律、行政法规和现行司法解释都没有一条直接规定「在职期间约定放弃加班费的协议是否有效」。本条不承诺加班费，但给出两条能确定的东西：① 该说法不能反过来被当作依据——法律没有「签了就不能再要」这一条；② 加班事实的举证规则对你有利：劳动者主张加班费应就加班事实的存在承担举证责任，但劳动者有证据证明用人单位掌握加班事实存在的证据而用人单位不提供的，由用人单位承担不利后果。","依据":"无明文的全国统一规定。可确证的是《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》（法释〔2020〕26 号，2021-01-01 施行）第四十二条关于加班事实举证责任分配的规定；该解释第三十五条针对的是解除或终止劳动合同时就工资报酬、加班费等达成的协议，不覆盖在职期间预先放弃加班费的情形","效力位阶":"无明文依据","主张强度":"倡导性","举证难度":"中——放弃协议文本自己应留存；加班事实的入口证据需主动收集","地域":"全国；对放弃加班费协议效力的认定各地差异明显","时效":"程序时效——如主张加班费，仲裁申请时效一年；加班费按月产生。起算点——各月加班费分别起算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"无官方一手依据可援引「放弃协议一律无效」。 尝试过的路径：① 已打开并逐条核对《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》官方全文页（第四十二条规定加班事实举证责任，第三十五条规定解除或终止时达成的协议效力，均未覆盖在职期间的预先放弃）；② 检索该解释及后续司法解释，未定位到直接规定在职期间放弃加班费效力的条文；③ 检索到的仅有地方人社部门的案例与问答，属实践口径而非规范依据，故不采用。故按「无明文依据」处理。；已核对页面：https://www.court.gov.cn/zixun/xiangqing/282121.html（最高人民法院官网·劳动争议解释（一）全文）","核对日期":"2026-10-03","备注":"本条不给结论、不承诺加班费，只做两件事：把「签过字就不能要」这个说法驳掉（法律没有这一条），并把举证规则指出来。取证时机在离职之前：加班审批单、排班表、深夜工作消息逐条截图留档，办公账号离职即失效。查询渠道：当地劳动人事争议仲裁委员会、12333。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"小","口径":"金钱"}},{"节号":10,"节名":"灰色地带与常见误解","条号":6,"标题":"「工伤认定随便什么时候都能申请」","说人话":"工伤认定有时间限制，而且很硬：公司 30 天内不申请，你自己必须在一年内申请。这一年从事故当天算起，不是从伤好那天、也不是从你跟公司谈崩那天。过了一年，工伤待遇就无从谈起。所以受伤后第一件事就是确认公司有没有去申请。","适用":"出了工伤，单位说「先养伤，以后再说」。","成本":"不花钱。但拖延的代价是全部待遇。","收益":"这个说法站不住，而且代价最大。用人单位应当自事故伤害发生之日或者被诊断、鉴定为职业病之日起 30 日内提出工伤认定申请；单位未提出的，工伤职工或者其近亲属、工会组织在事故伤害发生之日或者被诊断、鉴定为职业病之日起 1 年内可以直接提出申请。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）（国务院令第 586 号修订）第十七条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"中——事故时间、诊疗记录、劳动关系材料需自己收集","地域":"全国；受理机关为用人单位所在地统筹地区社会保险行政部门","时效":"程序时效——单位 30 日内；单位未申请的，劳动者一方 1 年内。起算点——事故伤害发生之日或者被诊断、鉴定为职业病之日。例外——遇有特殊情况经报社会保险行政部门同意，申请时限可以适当延长。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（工伤保险条例全文，第十七条）","核对日期":"2026-10-03","备注":"受伤当天做两件事：一是留存就诊记录与诊断证明，二是书面催单位申请并留痕。单位不申请就自己去，材料不齐会被一次性告知补正，不是驳回。怀疑已超期的，立即向当地社会保险行政部门或拨 12333 询问是否还有路径，不要自行判断。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"大","口径":"健康"}},{"节号":10,"节名":"灰色地带与常见误解","条号":7,"标题":"「口头辞退你，你不来上班就算自动离职」","说人话":"口头辞退不等于没发生。公司说「你明天不用来了」，那就是它把你辞了，它不能事后反过来说是你自己旷工走的。举证责任在它——它要说你是旷工，得拿出考勤和通知记录。你的动作是：当天把这段对话用邮件或聊天向对方确认一遍，把答复留底。","适用":"领导口头说「你明天不用来了」，事后公司主张你自行旷工离职。","成本":"时间——争议走仲裁，一般几个月；金钱——仲裁不收费。","收益":"这个说法站不住。用人单位解除劳动合同的意思表示一旦作出即产生效力，不因未采用书面形式而当然无效；而因用人单位作出的开除、除名、辞退、解除劳动合同、减少劳动报酬、计算劳动者工作年限等决定发生的劳动争议，用人单位负举证责任。违法解除的，可主张继续履行或按经济补偿标准二倍主张赔偿金。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第四十八条、第八十七条；《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》（法释〔2020〕26 号，2021-01-01 施行）第四十四条","效力位阶":"法律（第四十四条为司法解释）","主张强度":"可推定","举证难度":"难——口头辞退的事后还原困难；谈话录音、当场书写的纪要、事后确认的聊天记录是关键","地域":"全国；各地对口头解除意思表示的认定标准不一","时效":"程序时效——仲裁申请时效一年。起算点——自被要求停止工作之日（解除之日）。例外——无特别时效豁免。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）；https://www.court.gov.cn/fabu/xiangqing/282121.html（最高人民法院官网·劳动争议解释（一）全文，第四十四条）","核对日期":"2026-10-03","备注":"取证时机在被辞的当天和此后几天，具体动作：① 当天用邮件或聊天向对方确认「你刚才说让我明天不用来上班，是以什么理由解除，请书面确认」；② 对方不回复的，第二天再发一次并注明「未收到回复」；③ 把当天在场的同事、谈话时间地点记成纪要；④ 在争议解决前不要长期不到岗，否则会被抓成旷工——必要时以书面形式说明「我要求继续提供劳动，是单位不安排工作」。不确定点在口头解除的认定标准，各地口径不一，需向当地劳动人事争议仲裁委员会或拨 12333 确认。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"金钱"}},{"节号":10,"节名":"灰色地带与常见误解","条号":8,"标题":"「什么都要你自己举证，说不清就输」","说人话":"不是什么都得你证明。公司做的决定——辞退、解除、扣工资、算工龄——由它举证说明依据。你要准备的是自己的基础材料和工作留痕。开庭时记得把这句话说出来：这个决定是公司作出的，依据应由公司举证。","适用":"听说打劳动官司全靠自己举证，觉得没戏。","成本":"不花钱。核对争议事项属于哪一类。","收益":"这个说法不准确。因用人单位作出的开除、除名、辞退、解除劳动合同、减少劳动报酬、计算劳动者工作年限等决定而发生的劳动争议，用人单位负举证责任；主张加班费的，劳动者应就加班事实存在承担举证责任，但有证据证明用人单位掌握加班事实存在的证据而用人单位不提供的，由用人单位承担不利后果。","依据":"《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》（法释〔2020〕26 号，2021-01-01 施行）第四十二条、第四十四条","效力位阶":"司法解释","主张强度":"可主张","举证难度":"中——自己一侧的基础材料仍需提交","地域":"全国（该解释为全国统一适用）","时效":"程序时效——仲裁申请时效一年。起算点——自知道或者应当知道权利被侵害之日。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制。","来源":"https://www.court.gov.cn/fabu/xiangqing/282121.html（最高人民法院官网·劳动争议解释（一）全文，第四十二条、第四十四条）","核对日期":"2026-10-03","备注":"举证责任分配是在庭审中主张才生效的规则，不会自动适用。自己一侧的材料照样要准备：劳动合同、工资流水、解除或辞退通知、考勤与工作沟通记录。程序与管辖问题向当地劳动人事争议仲裁委员会咨询或拨 12333。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"金钱"}},{"节号":10,"节名":"灰色地带与常见误解","条号":9,"标题":"「过了时效就一点办法都没有」","说人话":"过了一年不一定就完了。这一年里只要你跟公司主张过权利、或者找过有关部门，它就重新开始算——所以那些催款的邮件、投诉的回执都很值钱。另外，只要劳动关系还在，欠工资这件事不受一年限制；离职之后才要开始数这一年。","适用":"发现可能已经超过一年仲裁时效，觉得只能算了。","成本":"不花钱。先算清楚，再决定放不放弃。","收益":"这个说法不准确，有两种情况可以救：一是时效中断——因当事人一方向对方主张权利、向有关部门请求权利救济，或者对方同意履行义务而中断，从中断时起重新计算；二是时效中止——因不可抗力或者有其他正当理由不能申请仲裁的，从中止原因消除之日起继续计算。此外，劳动关系存续期间因拖欠劳动报酬发生争议的，不受一年时效期间的限制；劳动关系终止的，自终止之日起一年内提出。","依据":"《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第二十七条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——中断与中止都要有证据；口头主张难以举证","地域":"全国","时效":"程序时效——一年，可中断、可中止。起算点——自知道或者应当知道权利被侵害之日；中断后重新计算，中止原因消除后继续计算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（劳动争议调解仲裁法全文，第二十七条）","核对日期":"2026-10-03","备注":"把时效算清楚再决定：列出每一个请求事项的起算日，标出有没有中断事由。中断证据（催告邮件、投诉回执、对方同意履行的记录）要按时间排好。已经超期且没有中断事由的，仍有行政投诉路径可试（2 年查处期限），但能不能得到救济需向当地劳动人事争议仲裁委员会或拨 12333 确认。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"金钱"}},{"节号":10,"节名":"灰色地带与常见误解","条号":10,"标题":"「劳动仲裁很贵，打不起」","说人话":"劳动仲裁不收费，这是法律写明的。真正花时间花精力的是取证和出庭，不是钱。请律师的费用通常自己承担，但简单的案子（欠薪、二倍工资、年假折算）完全可以自己办。","适用":"因为担心费用而放弃主张。","成本":"不花钱。仲裁不收费。","收益":"这个说法站不住。劳动争议仲裁不收费，劳动争议仲裁委员会的经费由财政予以保障。","依据":"《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第五十三条","效力位阶":"法律","主张强度":"可主张","举证难度":"易——收费规则由法律明文规定","地域":"全国","时效":"无特别时效——仲裁收费规则本身不涉及时效。起算点：不适用，本条只讲费用。例外：案件实体权利的时效按第 9 节计算。","来源":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（劳动争议调解仲裁法全文，第五十三条）","核对日期":"2026-10-03","备注":"仲裁不收费，但诉讼阶段法院可能收取费用，符合条件的经济困难劳动者可申请法律援助。具体受理条件向当地法律援助机构或拨 12333 咨询。费用不该成为放弃的理由，时效才是。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"中","口径":"金钱"}},{"节号":10,"节名":"灰色地带与常见误解","条号":11,"标题":"「被裁就是按 N+1 算，签了字就别想了」","说人话":"「N+1」不是标准答案。N 是按工龄算的经济补偿；2N 是公司违法解除时的赔偿金，比 N+1 高不少；「+1」只在特定情形下才有。签字之前必须问清两件事：它依据哪一条解除？是依法解除还是违法解除？问不清就先别签。","适用":"公司提出「给你 N+1，签个字吧」，你想知道这个数对不对。","成本":"时间——算一遍和核对依据，几小时；签错字的代价是数额本身。","收益":"这个说法不完整，也不是唯一的算法。用人单位违法解除或终止劳动合同的，应当依照经济补偿标准的二倍支付赔偿金；依法解除的情形下才是经济补偿（按工龄，每满一年一个月工资）。而「+1」是特定解除情形下未提前三十日书面通知时额外支付的一个月工资（第四十条），不是通用的加项。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第四十条、第四十六条、第四十七条、第四十八条、第八十七条","效力位阶":"法律","主张强度":"可推定","举证难度":"中——解除依据与解除通知需留存；「违法解除」的认定需要看公司给出的理由与程序","地域":"全国；代通知金计算基数、违法解除认定的裁审口径各地不一","时效":"程序时效——仲裁申请时效一年。起算点——自解除或终止之日。例外——无特别时效豁免。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）","核对日期":"2026-10-03","备注":"不确定点在「违法解除」的认定尺度与代通知金基数，各地不同，需向当地劳动人事争议仲裁委员会或拨 12333 确认。签字前的动作：要求对方出具书面解除通知并写明依据条款；自己拿 N、2N 两个数都算一遍；协议里不写「放弃一切请求」这类概括性条款。一旦签了「个人原因辞职」或「放弃全部请求」，事后主张的难度极大。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"大","口径":"金钱"}},{"节号":10,"节名":"灰色地带与常见误解","条号":12,"标题":"「突发疾病死亡一律不算工伤，除非当场死」","说人话":"不是「只有当场死才算」。在上班时间和岗位上突发疾病，48 小时内抢救无效死亡的，也视同工伤。关键是这 48 小时的起算时间要有医院记录支撑，所以抢救记录、入院时间、死亡记录必须第一时间拿到并留复印件。","适用":"家人或同事在工作时间、工作岗位上突发疾病，经抢救后死亡。","成本":"不花钱。核对抢救时间记录。","收益":"这个说法不准确。在工作时间和工作岗位，突发疾病死亡或者在 48 小时之内经抢救无效死亡的，视同工伤——当场死亡和 48 小时内抢救无效死亡都在范围内。","依据":"《工伤保险条例》（2003 年国务院令第 375 号公布，2010-12-20 修订，2011-01-01 施行）（国务院令第 586 号修订）第十五条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"中——抢救记录、入院时间、死亡证明是核心材料，需要家属向医疗机构索取","地域":"全国；「48 小时」起算点（以抢救开始时间还是初次诊断时间）在实务中存在争议","时效":"程序时效——单位 30 日内；单位未申请的，近亲属 1 年内。起算点——自死亡之日。例外——遇有特殊情况经报社会保险行政部门同意，申请时限可以适当延长。","来源":"https://xzfg.moj.gov.cn/front/law/detail?LawID=610（工伤保险条例全文，第十五条）","核对日期":"2026-10-03","备注":"不确定点在「48 小时」的起算点，实务中以抢救开始时间还是初次诊断时间为准存在不同判断，需向当地社会保险行政部门或拨 12333 确认本地口径。家属第一时间的动作：向医院索取抢救记录、入院记录、死亡记录的复印件并盖章，这些材料事后补取困难。同时注意排除情形（故意犯罪、醉酒或吸毒、自残或自杀）不认定。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"大","口径":"健康"}},{"节号":10,"节名":"灰色地带与常见误解","条号":13,"标题":"「合同到期自然结束，谁也不用给谁钱」","说人话":"合同到期不等于白干。公司不续签，它得给按工龄算的经济补偿。只有一种情况不用给：它按原条件甚至更好的条件续，而你自己不签。所以到期谈判时，第一个要问清的就是「是你不续还是我不续」，并且要看书面。","适用":"固定期限合同到期，公司说「到期就是结束了，没有补偿」。","成本":"时间——协商或仲裁，一般半年上下；金钱——仲裁不收费。","收益":"这个说法站不住。除用人单位维持或者提高劳动合同约定条件续订劳动合同、劳动者不同意续订的情形外，依照劳动合同期满终止固定期限劳动合同的，用人单位应当向劳动者支付经济补偿。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第四十四条第一项、第四十六条第五项、第四十七条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——不续签的书面表示或聊天记录需留存；「谁不续」「条件有没有降」是争议焦点","地域":"全国；对「维持或者提高条件」的比对口径各地不一","时效":"程序时效——仲裁申请时效一年。起算点——自劳动合同期满终止之日。例外——无特别时效豁免。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）","核对日期":"2026-10-03","备注":"离职证明上的离职原因直接影响失业金资格（见 5.17）——写「公司不再续订」，不要接受「个人原因」。合同到期前两三个月就要开始把续签条件、双方要价用邮件固定下来，那是日后比对「有没有降低条件」的唯一材料。不确定点与查询渠道见 3.16。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"金钱"}},{"节号":10,"节名":"灰色地带与常见误解","条号":14,"标题":"「值班就是值班，不算上班，不给钱」","说人话":"单位说「值班不算上班」，这句话在法律里找不到依据——它只是一种说法，不是一条规定。反过来说，「值班一定算上班」也没有明文。真正决定结果的是具体情形：这段时间你能否自由支配、被叫到要不要立刻响应、一晚上被叫几次。所以别停在争论「算不算」上，先把排班表和响应记录留好，再去问本地口径。定性规则与取证动作见第 4 节第 4.6 条。","适用":"单位用「值班本来就不算上班」这句话，解释为什么不支付值班、待命期间的报酬。","成本":"不花钱。核对排班安排与值班通知。","收益":"这句话本身没有明文依据支持，但也不能被明文依据推翻——《劳动法》第四章规定的是工作时间与休息休假的一般制度，没有「值班不算工作时间」这一条，也没有「值班一律算工作时间」这一条。本条不承诺任何一笔钱。","依据":"无明文的全国统一规定。可确证的是：《劳动法》（2018-12-29 修正）第三十六条只规定「每日工作时间不超过八小时、平均每周工作时间不超过四十四小时」，未规定值班或待命时间的定性","效力位阶":"无明文依据","主张强度":"倡导性","举证难度":"中——排班表、值班通知、响应记录需自己留存","地域":"全国；各地对待命时间的定性差异很大","时效":"程序时效——如主张对应报酬，仲裁申请时效一年。起算点——逐月起算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"无官方一手依据可援引。 尝试路径与第 4 节第 4.6 条相同：已核对《劳动法》官方全文页第四章（无待命时间定性条款）、《工资支付暂行规定》第十三条（只涉加班费标准与不定时工时制）、《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》（法释〔2020〕26 号，2021-01-01 施行）第四十二条（只涉加班事实举证责任）。三处均未获取到可作依据的条文。；已核对页面：http://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_296651.html（中国人大网·劳动法全文）；已核对页面：https://www.gov.cn/zhengce/2022-08/31/content_5711284.htm（中国政府网·工资支付暂行规定全文）；已核对页面：https://www.court.gov.cn/zixun/xiangqing/282121.html（最高人民法院官网·劳动争议解释（一）全文）","核对日期":"2026-10-03","备注":"本条只做一件事——指出「值班本来就不算上班」是一种说法而不是一条依据。不给结论、不涉及金额。 取证时机在事发当期：排班表、值班签到、被叫去处理问题的聊天与通话记录当天留存。查询渠道：当地劳动人事争议仲裁委员会、12333。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"小","口径":"时间"}},{"节号":10,"节名":"灰色地带与常见误解","条号":15,"标题":"「年假必须在本单位干满一年才有」","说人话":"年假看的是你累计工作了多少年，不是在这家公司干了多久。跳槽不影响你已经攒下的档位——满 1 年就有 5 天，满 10 年 10 天，满 20 年 15 天。入职当年按比例享受，不是「干满一年才给」。","适用":"入职新单位后，被告知「在本单位工作不满一年，没有年假」。","成本":"不花钱。核对自己的累计工作年限。","收益":"这个说法站不住。职工累计工作已满 1 年不满 10 年的，年休假 5 天；已满 10 年不满 20 年的，10 天；已满 20 年的，15 天。 年休假天数按累计工作时间确定，不限于本单位。《职工带薪年休假条例》第二条规定的是「连续工作 1 年以上的，享受带薪年休假」——满 1 年这个门槛看的是累计工作年限，不是在本单位的年限。","依据":"《职工带薪年休假条例》（国务院令第 514 号）（国务院令第 514 号）第二条、第三条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"中——累计工作年限需自己举证，历年社保缴费记录、离职证明、个税记录最直接","地域":"全国","时效":"程序时效——应休未休年休假工资报酬争议走仲裁，时效一年。起算点——自应休年度次年起算，或自劳动关系终止之日。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制。","来源":"https://www.gov.cn/zhengce/content/2008-03/28/content_6636.htm（职工带薪年休假条例全文，第二条、第三条）","核对日期":"2026-10-03","备注":"入职时把上一家的离职证明和社保缴费记录交给新单位留档，同时自己留一套——这是锁定年假档位最省事的做法。年假的不享受情形（事假满 20 天、病假达档）见第 4 节第 4.16 条；折算与日工资口径见第 2 节。","成本标签":{"钱":"0","时间":"少","毅力":"些","收益":"中","口径":"时间"}},{"节号":10,"节名":"灰色地带与常见误解","条号":16,"标题":"「在职期间签的竞业限制不用给钱，所以可以不理它」","说人话":"「不给钱」不等于「不用遵守」。在职期间的竞业限制，法律认可它有效而且不要求公司给钱——零成本就能绑住你。离职后的竞业限制才是必须按月给钱的。所以签字前一定分清条款写的是「在职期间」还是「解除/终止后」，两种规则完全不同。","适用":"合同里写着「在职期间不得从事竞争业务」，你想知道这条要不要遵守。","成本":"不花钱。签字前逐字看清条款写的是哪种。","收益":"这个说法说对了一半，但结论危险。与负有保密义务的人员约定在职期间的竞业限制条款，劳动者以「不得约定在职期间竞业限制」或者「未支付经济补偿」为由请求确认无效的，人民法院不予支持——也就是说，在职竞业限制条款有效，用人单位没有按月支付经济补偿的义务。而离职后的竞业限制，必须按月支付经济补偿；未约定补偿金额的，可按离职前十二个月平均工资的 30% 主张。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第二十三条、第二十四条；《最高人民法院关于审理劳动争议案件适用法律问题的解释（二）》（法释〔2025〕12 号，2025-09-01 施行）第十四条；《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》（法释〔2020〕26 号，2021-01-01 施行）第三十六条","效力位阶":"法律（第十四条、第三十六条为司法解释）","主张强度":"可主张","举证难度":"中——条款文本自己应留存原件；协议适用期间与人员范围是判断关键","地域":"全国","时效":"程序时效——仲裁申请时效一年。起算点——用人单位主张违约的自违约行为发生之日；竞业补偿自各月应付未付之日。例外——按月补偿的请求权逐月起算。","来源":"https://www.court.gov.cn/fabu/xiangqing/282121.html（最高人民法院官网·劳动争议解释（一）全文，第三十六条）；http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）；http://gongbao.court.gov.cn/Details/bb72019c45453f84d920bd6375573e.html（最高人民法院公报·关于审理劳动争议案件适用法律问题的解释（二）全文，法释〔2025〕12 号）","核对日期":"2026-10-03","备注":"解释（二）已核到一手全文（最高人民法院公报，2026-10-03 复核），条文与 2026-09-02 记录一致。在职竞业与员工手册「禁止兼职/自营」条款是两条可并用的路径，两者的抗辩方向不同，详见第 6 节。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"大","口径":"自由"}},{"节号":10,"节名":"灰色地带与常见误解","条号":17,"标题":"「公司说离职证明要写清楚，其实是它想写什么就写什么」","说人话":"离职证明确有法定内容范围——合同期限、离职日期、岗位、在本单位的年限。它不需要也不应该在上面写评价你的话。写了不利于你的内容或者故意漏项，可以要求改正；不给证明或造成损失，还可以要求赔偿。","适用":"离职时单位在证明上写评价性内容、写「个人原因」、或者内容不全。","成本":"不花钱。签收前逐字看一遍。","收益":"这个说法站不住。用人单位应当在解除或者终止劳动合同时出具解除或者终止劳动合同的证明，证明应当写明劳动合同期限、解除或者终止劳动合同的日期、工作岗位、在本单位的工作年限。未出具的由劳动行政部门责令改正，造成损害的应当承担赔偿责任。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第五十条、第八十九条；《劳动合同法实施条例》（国务院令第 535 号）第二十四条","效力位阶":"法律（实施条例为行政法规）","主张强度":"可主张","举证难度":"易——证明本身是书面文件，内容是否有误一目了然","地域":"全国","时效":"程序时效——未出具证明的由劳动行政部门责令改正；主张损害赔偿的走仲裁，时效一年。起算点——自解除或终止之日。例外——无特别时效豁免。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文）；https://www.gov.cn/zhengce/zhengceku/2008-09/19/content_6630.htm（劳动合同法实施条例全文）","核对日期":"2026-10-03","备注":"签收之前看三处：离职原因栏、离职日期、本单位工作年限。原因栏写「个人原因」会直接影响失业金资格（见 5.17），发现写错当场要求改，不要先签了再说。要求补正的沟通用邮件留痕。证明拿到后立即扫描存云端——原件只有一份，入职下家时要交。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"大","口径":"金钱"}},{"节号":11,"节名":"加班费与工时争议实操","条号":1,"标题":"加班费的举证责任怎么分：先交入口证据，再要求单位交出考勤","说人话":"规则是两步走。第一步要你证明「加班这件事存在」；第二步，如果能证明「能证明加班的材料在公司手里」，而公司不交，那不利后果由公司承担。所以你要准备的不是每一天的完整记录，而是能把口子撬开的入口材料：加班安排的通知、深夜的工作消息、非工作时间的邮件、交付记录。有一两周的实锤，就可能让仲裁委要求公司交出整本考勤。","适用":"主张加班费，但考勤打卡、审批记录都在公司系统里，自己拿不到。","成本":"不花钱。仲裁中提出，随申请书说明。","收益":"劳动者主张加班费的，应当就加班事实的存在承担举证责任；但劳动者有证据证明用人单位掌握加班事实存在的证据，用人单位不提供的，由用人单位承担不利后果。","依据":"《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》（法释〔2020〕26 号，2021-01-01 施行）第四十二条","效力位阶":"司法解释","主张强度":"可主张","举证难度":"中——加班通知、工作沟通记录、交付时间戳需自己留存；完整考勤由单位掌握，可申请调取","地域":"全国（该解释为全国统一适用）","时效":"程序时效——仲裁申请时效一年。起算点——加班费按月产生，逐月起算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"https://www.court.gov.cn/zixun/xiangqing/282121.html（最高人民法院官网·关于审理劳动争议案件适用法律问题的解释（一）全文，第四十二条）","核对日期":"2026-10-03","备注":"开庭时要主动说出举证责任分配——「加班记录由公司掌握，请其提交，不提交应承担不利后果」这句话不说不生效。取证时机在离职之前：办公账号、内网权限离职当天失效，具体动作是把加班审批单、排班表、深夜消息、邮件发送时间逐条截图并标注日期。本地尺度向当地劳动人事争议仲裁委员会或拨 12333 确认。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"金钱"}},{"节号":11,"节名":"加班费与工时争议实操","条号":2,"标题":"加班费三档费率的适用范围：三档各自对应哪一天","说人话":"三档对应三类日子：平时加班 1.5 倍、休息日加班 2 倍（能补休就可以不付钱）、法定节假日加班 3 倍。注意第二条有个前提——「又不能安排补休」；第三条没有这个前提，法定节假日的 3 倍不能用补休抵。综合工时制是按周期算总账，总工时超出的部分按 1.5 倍算。","适用":"核对单位发加班费时用的倍率对不对。","成本":"不花钱。把加班日期分三类核对一遍。","收益":"① 安排劳动者在日法定标准工作时间以外延长工作时间的，按不低于本人小时工资标准的 150% 支付；② 安排在休息日工作而又不能安排补休的，按不低于本人日或小时工资标准的 200% 支付；③ 安排在法定休假节日工作的，按不低于本人日或小时工资标准的 300% 支付。经劳动行政部门批准实行综合计算工时工作制的，综合计算工作时间超过法定标准工作时间的部分应视为延长工作时间，按本规定支付延长工作时间的工资。","依据":"《工资支付暂行规定》（劳部发〔1994〕489 号，1995-01-01 施行）第十三条第一款、第三款；《劳动法》（2018-12-29 修正）第四十四条","效力位阶":"部门规章（《劳动法》条款为法律）","主张强度":"可主张","举证难度":"中——加班日期分类需要考勤与排班记录支撑；本人工资标准可用劳动合同与工资条证明","地域":"全国","时效":"程序时效——仲裁申请时效一年；属劳动报酬类。起算点——逐月起算，各月加班费分别起算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"https://www.gov.cn/zhengce/2022-08/31/content_5711284.htm（中国政府网·工资支付暂行规定全文，第十三条）；http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2532147.html（劳动法全文，广东省人民政府门户网站转载页，页面来源标注中国人大网，转载页，待换一手源）","核对日期":"2026-10-03","备注":"条文的表述是「按照不低于劳动合同规定的劳动者本人小时工资标准」，所以基数锚在劳动合同约定的工资标准上（基数的争议见 11.4）。把每个加班日归类到三档之一，是算加班费的第一步；分类错了，倍率就对不上。分类存疑的日期，按对劳动者有利的方向先主张，再让对方举证。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"金钱"}},{"节号":11,"节名":"加班费与工时争议实操","条号":3,"标题":"法定节假日的 3 倍不能用补休顶掉，休息日才可以","说人话":"补休只能顶休息日的加班，顶不了法定节假日。元旦、春节那几天被安排上班，单位必须按 3 倍付钱，给你调休也顶不掉。反过来，周末加班先给你补休，是合法的，补了休就不用再付 2 倍。","适用":"单位用调休、补休来冲抵你已经加过的班。","成本":"不花钱。核对加班日期是休息日还是法定节假日。","收益":"休息日安排工作而又不能安排补休的，按 200% 支付——即休息日加班可以先安排补休；法定休假节日安排工作的，按 300% 支付，该档条文中没有「不能安排补休」这个前提，不能以补休替代。","依据":"《工资支付暂行规定》（劳部发〔1994〕489 号，1995-01-01 施行）第十三条第一款第二项、第三项","效力位阶":"部门规章","主张强度":"可主张","举证难度":"中——需要把加班日期准确对应到「休息日」与「法定节假日」；节假日清单见 11.9","地域":"全国","时效":"程序时效——仲裁申请时效一年；属劳动报酬类。起算点——逐月起算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"https://www.gov.cn/zhengce/2022-08/31/content_5711284.htm（工资支付暂行规定全文，第十三条）","核对日期":"2026-10-03","备注":"「补休」与「调休」要分清：补休是把已经加过的班换成休息；调休是把周末与工作日对调，本身不产生加班。节假日与休息日的区分是这一条的核心，节假日清单见 11.9。排班表与考勤记录要能把每个加班日固定下来，否则分类无从谈起。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"大","口径":"金钱"}},{"节号":11,"节名":"加班费与工时争议实操","条号":4,"标题":"加班费基数不是基本工资，各地对「按哪个口径算」有差异","说人话":"单位拿「基本工资」算加班费是最常见的压价手法。合同里写着的基本工资低、实际每月到手高，那按基本工资算出来的加班费可能只有应得的一半。条文写的是「劳动合同规定的本人小时工资标准」，你可以据此主张按合同约定的工资总额（不只是基本工资项）算；各地对能不能进一步按实际应得工资算，口径不一样，得问本地。","适用":"单位用「基本工资」或者当地最低工资作基数算加班费，算出来的数明显偏低。","成本":"时间——主张走仲裁，一般几个月；金钱——仲裁不收费，律师费通常自己承担。","收益":"已确证的一层：《工资支付暂行规定》第十三条把基数锚在「劳动合同规定的劳动者本人小时工资标准」上。存在口径差异的一层：劳动合同只写基本工资、实际收入含绩效与补贴时，加班费基数该按合同约定工资还是按实际应得工资，全国没有统一规定，各地裁审口径不同。","依据":"《工资支付暂行规定》（劳部发〔1994〕489 号，1995-01-01 施行）第十三条；《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第十七条第五项","效力位阶":"部门规章（《劳动合同法》条款为法律）","主张强度":"可推定","举证难度":"中——劳动合同、工资条、银行流水需自己留存；工资构成中各项目的性质（是否属于工资）可能成为争点","地域":"全国；加班费基数的地方口径差异明显，有的按合同约定工资、有的按实际应得工资、有的对绩效与补贴区别处理","时效":"程序时效——仲裁申请时效一年；属劳动报酬类。起算点——逐月起算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"https://www.gov.cn/zhengce/2022-08/31/content_5711284.htm（工资支付暂行规定全文，第十三条）；http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文，第十七条）","核对日期":"2026-10-03","备注":"不确定点在基数口径：合同约定工资、实际应得工资、还是剔除某些项目后的工资，各地不同，主张前必须向当地劳动人事争议仲裁委员会或拨 12333 确认本地口径。算之前先把工资条按项目摊开，看清合同里「工资」写的是哪几项、实际发放又含哪几项，两者差额往往就是争议标的。第 5 节第 5.4 条讲的是经济补偿基数按「应得工资」计算，两者规则不同，不要套用。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"金钱"}},{"节号":11,"节名":"加班费与工时争议实操","条号":5,"标题":"加班费不得低于最低工资「另算」：最低工资不含加班费","说人话":"最低工资是「正常工作时间」的下限，加班费是在这之上另算的，不能拿最低工资来顶加班费。也就是说，单位不能说「你到手已经超过最低工资了，多出来的就算加班费」——法条把延长工作时间的工资明确排除在最低工资的构成之外。","适用":"单位说「你的工资已经高于最低工资了，所以没有加班费的问题」。","成本":"不花钱。核对工资构成与当地最低工资标准。","收益":"在劳动者提供正常劳动的情况下，用人单位支付的工资在剔除下列各项以后，不得低于当地最低工资标准：① 延长工作时间工资；② 中班、夜班、高温、低温、井下、有毒有害等特殊工作环境、条件下的津贴；③ 法律、法规和国家规定的劳动者福利待遇等。实行计件工资或提成工资的用人单位，在科学合理的劳动定额基础上，其支付的工资不得低于相应的最低工资标准。","依据":"《最低工资规定》（劳动和社会保障部令第 21 号，2004-03-01 施行）第十二条、第十三条","效力位阶":"部门规章","主张强度":"可主张","举证难度":"易——工资条体现各项目，最低工资标准由当地公布，两者可直接比对","地域":"全国；最低工资标准由各省、自治区、直辖市分别确定并定期调整，须按工作地现行标准比对","时效":"程序时效——仲裁申请时效一年；属劳动报酬类。起算点——逐月起算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"https://www.gov.cn/zhengce/2022-08/31/content_5711292.htm（中国政府网·最低工资规定全文，第十二条、第十三条）","核对日期":"2026-10-03","备注":"违反第十二条规定的，由劳动保障行政部门责令限期补发所欠工资，并可责令其按所欠工资的 1 至 5 倍支付赔偿金（第十三条）——这是行政查处路径，不是仲裁请求项。当地最低工资标准的分档数值见第 3 节第 3.7 条引用的全国分省数据。计件工资的定额合理性是另一条线（见 11.8）。","成本标签":{"钱":"0","时间":"少","毅力":"些","收益":"中","口径":"金钱"}},{"节号":11,"节名":"加班费与工时争议实操","条号":6,"标题":"单位不付加班费：先投诉责令支付，逾期才加付 50%–100%","说人话":"加付赔偿金有前置条件——必须先由劳动行政部门责令限期支付，单位逾期还不付，才加付 50% 到 100%。所以想拿这笔钱，投诉这一步不能跳过。只走仲裁要加班费、不经过行政责令，一般拿不到加付款。","适用":"单位被认定欠付加班费，你想拿到那笔加付赔偿金。","成本":"时间——走投诉加责令程序，比单一仲裁路径更长；金钱——行政投诉不收费。","收益":"用人单位有下列情形之一的，由劳动行政部门责令限期支付劳动报酬、加班费或者经济补偿；劳动报酬低于当地最低工资标准的，应当支付其差额部分；逾期不支付的，责令用人单位按应付金额 50% 以上 100% 以下的标准向劳动者加付赔偿金：① 未按照劳动合同的约定或者国家规定及时足额支付劳动者劳动报酬的；② 低于当地最低工资标准支付劳动者工资的；③ 安排加班不支付加班费的；④ 解除或者终止劳动合同，未依照本法规定给予经济补偿的。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第八十五条","效力位阶":"法律","主张强度":"可推定","举证难度":"中——需要先有劳动行政部门的责令支付文书，再证明其逾期未付；这一环节的材料需自己跟进留存","地域":"全国；各地劳动保障监察对责令程序与加付赔偿金的执行力度不同","时效":"程序时效——向劳动保障监察投诉的，违法行为在 2 年内未被发现也未被举报、投诉的不再查处；主张加班费本身的仲裁时效一年。起算点——自用人单位应支付而未支付之日起算（加班费逐月）；监察查处自违法行为发生之日。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文，第八十五条）","核对日期":"2026-10-03","备注":"不确定点在于加付赔偿金能否在仲裁中直接主张——条文把它系于行政责令程序，各地对「未经责令能否直接裁决加付」把握不一，需向当地劳动人事争议仲裁委员会或拨 12333 确认。操作顺序建议：先向劳动保障监察投诉拿责令文书，再视情况走仲裁要加班费本金。第 9 节第 9.3 条写了监察投诉的 2 年查处期限。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"中","口径":"金钱"}},{"节号":11,"节名":"加班费与工时争议实操","条号":7,"标题":"自愿加班与单位安排的加班，不是一回事","说人话":"这一条的关键是「谁安排的」。法条的表述是「用人单位安排」，所以单位常拿「没人让你加班」来挡。但真正的判据不是你几点走的，而是有没有被要求留下：工作量是不是必须在当天完成、有没有审批流程、上级有没有在工作群里催、第二天有没有因为没做完被追责。这些材料决定性质认定。","适用":"单位说「是你自己不下班，不是我安排的」，据此拒付加班费。","成本":"时间——主张走仲裁，一般几个月；金钱——仲裁不收费，律师费通常自己承担。","收益":"已确证的一层：《工资支付暂行规定》第十三条的适用前提是「用人单位在劳动者完成劳动定额或规定的工作任务后，根据实际需要安排劳动者在法定标准工作时间以外工作」——即该条针对的是单位安排的加班。「自愿留下」与「被安排」的区分因此直接影响能否主张；举证责任分配见 11.1。","依据":"《工资支付暂行规定》（劳部发〔1994〕489 号，1995-01-01 施行）第十三条；《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》（法释〔2020〕26 号，2021-01-01 施行）第四十二条","效力位阶":"部门规章（第四十二条为司法解释）","主张强度":"可推定","举证难度":"难——「是否被安排」涉及主观与情境判断，关键证据多在工作沟通记录里，且离职后账号失效","地域":"全国；各地对「变相强制加班」的认定尺度差异较大","时效":"程序时效——仲裁申请时效一年；属劳动报酬类。起算点——逐月起算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"https://www.gov.cn/zhengce/2022-08/31/content_5711284.htm（工资支付暂行规定全文，第十三条）；https://www.court.gov.cn/zixun/xiangqing/282121.html（最高人民法院官网·劳动争议解释（一）全文，第四十二条）","核对日期":"2026-10-03","备注":"举证难度标「难」——取证时机必须在离职之前，具体动作：把「当天必须完成」的任务派发、上级在非工作时间的消息与催办、加班审批被驳回或走后补、次日的追责记录逐条截图并保留原始载体（不要只截图，保留可核验的原始记录）。不确定点在「变相强制」的认定尺度，各地不一，可向当地劳动人事争议仲裁委员会或拨 12333 咨询本地口径。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"金钱"}},{"节号":11,"节名":"加班费与工时争议实操","条号":8,"标题":"计件工资被安排加班：按计件单价的 150%/200%/300% 算","说人话":"计件工也要算加班费，但算法不同：不是按小时工资乘倍数，而是按你正常工时里做一件的单价，分别乘 1.5、2、3。前提是你已经完成了当天的计件定额——定额之内按正常单价，定额之外被安排接着干的，才是加班。","适用":"实行计件工资，在完成计件定额任务后被安排继续工作。","成本":"不花钱。需要记录单价、产量与工时。","收益":"实行计件工资的劳动者，在完成计件定额任务后，由用人单位安排延长工作时间的，应根据加班费三档规定的原则，分别按照不低于其本人法定工作时间计件单价的 150%、200%、300% 支付其工资。","依据":"《工资支付暂行规定》（劳部发〔1994〕489 号，1995-01-01 施行）第十三条第二款","效力位阶":"部门规章","主张强度":"可主张","举证难度":"中——计件单价、日产量、工时记录需自己留存；定额的确定过程由用人单位掌握","地域":"全国","时效":"程序时效——仲裁申请时效一年；属劳动报酬类。起算点——逐月起算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"https://www.gov.cn/zhengce/2022-08/31/content_5711284.htm（工资支付暂行规定全文，第十三条第二款）","核对日期":"2026-10-03","备注":"自己按天记一份产量与工时台账，这是计件工资唯一靠得住的证据——公司系统里的产量数据你取不出来。定额是否「科学合理」是另一条线：定额定到正常工时内干不完，可依《劳动法》第三十七条与《最低工资规定》第十二条主张（见第 4 节第 4.11 条）。第 4 节第 4.11 条与本条的适用场景不同，前者针对定额本身不合理，本条针对定额之外被安排加班。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"中","口径":"金钱"}},{"节号":11,"节名":"加班费与工时争议实操","条号":9,"标题":"法定节假日清单：哪些天必须按 3 倍算","说人话":"法定节假日一共 13 天：元旦 1 天、春节 4 天、清明 1 天、劳动节 2 天、端午 1 天、中秋 1 天、国庆 3 天。只有这 13 天被安排上班才按 3 倍算；其余假期里上班的日子（调休出来的休息日）按 2 倍算，能补休则可以抵。所以拿加班费的时候，要按天分类，不能笼统按「节假日」算。","适用":"核对某个加班日是不是法定节假日，从而确定用 3 倍还是 2 倍。","成本":"不花钱。对着日历核一遍。","收益":"全体公民放假的节日为：元旦，放假 1 天（1 月 1 日）；春节，放假 4 天（农历除夕、正月初一至初三）；清明节，放假 1 天（农历清明当日）；劳动节，放假 2 天（5 月 1 日、2 日）；端午节，放假 1 天（农历端午当日）；中秋节，放假 1 天（农历中秋当日）；国庆节，放假 3 天（10 月 1 日至 3 日）。","依据":"《全国年节及纪念日放假办法》（2024-11-10 修订，2025-01-01 施行）第二条","效力位阶":"行政法规","主张强度":"可主张","举证难度":"易——节假日日期由国务院统一规定并公布，可直接对照","地域":"全国","时效":"程序时效——仲裁申请时效一年；属劳动报酬类。起算点——逐月起算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"https://www.gov.cn/gongbao/2024/issue_11726/202411/content_6989774.html（中国政府网国务院公报 2024 年第 33 号·全国年节及纪念日放假办法全文及修改决定）","核对日期":"2026-10-03","备注":"2024 年修订有实质变化：春节由 3 天改为 4 天（新增农历除夕），劳动节由 1 天改为 2 天（新增 5 月 2 日），自 2025-01-01 施行。核对 2025 年之前的加班费时，要用当时的节日清单，不能拿新清单倒推旧日期。同一次修订还新增了第七条：「全体公民放假的假日，可合理安排统一放假调休……除个别特殊情形外，法定节假日假期前后连续工作一般不超过 6 天」。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"中","口径":"金钱"}},{"节号":11,"节名":"加班费与工时争议实操","条号":10,"标题":"单位要你加班，法定前提是与工会和劳动者协商","说人话":"法条里「经与工会和劳动者协商」是延长时间的前置条件，不是装饰。所以单位长期不商量、直接排长班，本身就与条文不符——「经与工会和劳动者协商后」这几个字是你谈判时的依据。超过每日 1 小时（特殊原因 3 小时）或每月 36 小时上限的，另可依第四十三条、第九十条主张由劳动行政部门处理。","适用":"单位以「生产经营需要」为由长期安排加班。","成本":"不花钱。核对单位有没有走协商程序。","收益":"用人单位由于生产经营需要，经与工会和劳动者协商后可以延长工作时间，一般每日不得超过一小时；因特殊原因需要延长工作时间的，在保障劳动者身体健康的条件下延长工作时间每日不得超过三小时，但是每月不得超过三十六小时。用人单位不得违反本法规定延长劳动者的工作时间。","依据":"《劳动法》（2018-12-29 修正）第四十一条、第四十三条、第九十条","效力位阶":"法律","主张强度":"可推定","举证难度":"中——排班表、考勤记录、加班通知需自己留存；「是否协商过」的事实由双方各自举证","地域":"全国；劳动保障监察对超时加班的查处力度各地不同","时效":"程序时效——向劳动保障监察投诉的，违法行为 2 年内未被发现也未被举报、投诉的不再查处；主张加班费的走仲裁，时效一年。起算点——监察自违法行为发生之日；加班费逐月起算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制。","来源":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2532147.html（劳动法全文，广东省人民政府门户网站转载页，页面来源标注中国人大网，转载页，待换一手源）","核对日期":"2026-10-03","备注":"不确定点在「未协商」能否单独作为拒加班的抗辩——劳动者拒绝超时加班后被解除合同的处理，各地裁审尺度不一，需向当地劳动人事争议仲裁委员会或拨 12333 确认。不要自行旷工抗议：拒绝加班要留书面记录（邮件回复「已超出法定每月 36 小时上限，我无法接受本次安排」），把冲突固定在文本里。第四十二条列出了不受第四十一条限制的例外情形（自然灾害、事故等威胁生命财产安全需紧急处理等），单位可能援引。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"中","口径":"时间"}},{"节号":11,"节名":"加班费与工时争议实操","条号":11,"标题":"超时加班的行政后果：警告、责令改正、并可罚款","说人话":"这一条通向的是行政处罚，不是给你钱。对个人来说，它的用处是「另一条施压路径」：投诉之后劳动监察可以责令改正、警告、罚款，单位的用工成本会上升。但要拿自己的加班费，仍然走 11.1 的仲裁路径，两者不互相替代。","适用":"单位长期超时加班，你想走行政查处而不是只要自己的加班费。","成本":"不花钱。投诉本身不收费。","收益":"用人单位违反本法规定延长劳动者工作时间的，由劳动行政部门给予警告，责令改正，并可以处以罚款。用人单位违反本法规定延长劳动者的工作时间，同样适用上述处理。","依据":"《劳动法》（2018-12-29 修正）第四十三条、第九十条；《劳动保障监察条例》（国务院令第 423 号，2004-12-01 施行）第十一条","效力位阶":"法律（《劳动保障监察条例》为行政法规）","主张强度":"可主张","举证难度":"中——需要提供排班与考勤材料证明超时事实；查处由行政部门实施","地域":"全国；各地监察查处力度不同","时效":"程序时效——违法行为在 2 年内未被劳动保障行政部门发现，也未被举报、投诉的，不再查处（《劳动保障监察条例》第二十条）。起算点——自违法行为发生之日。例外——无特别时效豁免，2 年是硬线。","来源":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2532147.html（劳动法全文，广东省人民政府门户网站转载页，页面来源标注中国人大网，转载页，待换一手源）；https://www.gov.cn/zhengce/zhengceku/2008-03/28/content_7383.htm（中国政府网·劳动保障监察条例全文）","核对日期":"2026-10-03","备注":"2 年是硬线——发生在两年前、既没被监察发现也没被举报投诉的违法行为，监察部门不再查处。所以投诉要趁早，不要等攒齐所有证据再动。投诉时把超时事实按月份整理成表（哪几个月、每月加班多少小时、超过多少），比零散截图更容易被受理。第 9 节第 9.3 条写了监察投诉的整体路径。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"中","口径":"时间"}},{"节号":11,"节名":"加班费与工时争议实操","条号":12,"标题":"加班证据自己在单位系统里怎么导出：五个动作","说人话":"这一条没有法条，只有动作清单，但它决定 11.1 能不能走通。五类东西里，第 ③ 类最容易被忽略——交付物上的时间戳是第三方可核验的，比截图硬。第 ⑤ 类也有用：工资条上长期没有加班费项，本身就是在证明「单位一贯不付」。","适用":"还没有争议，但想提前把加班证据做扎实。","成本":"不花钱。每月固定花十几分钟。","收益":"把「加班事实存在」的入口证据固定下来，才能启动 11.1 的两步举证。可固定五类：① 加班安排（通知、排班表、审批单）；② 加班过程（非工作时间的消息、邮件、提交记录、门禁）；③ 加班结果（交付物、上线记录、客户回执）；④ 加班期间的单位态度（催办、次日追责、补休安排）；⑤ 加班费发放情况（工资条上的加班费项，或长期为零的事实）。","依据":"无明文的全国统一规定；本条是取证动作清单，配套的举证规则见《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》（法释〔2020〕26 号，2021-01-01 施行）第四十二条","效力位阶":"无明文依据","主张强度":"倡导性","举证难度":"中——五类证据都在自己或单位系统里，需要主动按月导出","地域":"全国；各地仲裁委对电子证据的采信形式要求不同","时效":"无特别时效——本条是取证动作，本身不受时效限制。起算点：不适用。例外：证据对应的加班费主张受一年仲裁时效约束，逐月起算。","来源":"无官方一手依据可援引。 尝试过的路径：本条不引条文，只给动作清单；其法律基础是《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》第四十二条的举证责任分配（已在 11.1 引一手页核对）。各地对电子证据形式的采信要求，向当地劳动人事争议仲裁委员会或拨 12333 确认。；已核对页面：https://www.court.gov.cn/zixun/xiangqing/282121.html（最高人民法院官网·劳动争议解释（一）全文）","核对日期":"2026-10-03","备注":"动作要点：截图要带系统时间与本人账号标识，不要只截内容；邮件直接导出为文件（保留原始头信息）；交付记录尽量取第三方可核验的载体。统一命名（例如「2026-08-加班-审批单」）按月归档，仲裁时按时间线一次提交比临时翻找有效得多。取证时机在离职之前——办公账号离职当天失效。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"金钱"}},{"节号":11,"节名":"加班费与工时争议实操","条号":13,"标题":"加班费能追多久：没有全国统一的「两年」限制，但举证与时效会削短实际年限","说人话":"法律条文本身没有写「只能追两年」——在职期间追拖欠工资不受一年时效限制，这是明文。但现实里能不能追到五年前、八年前，取决于你有没有那几年的证据，以及公司还留不留着那些考勤。所以「能追多久」的真正变量是证据，不是条文。别因为听说了个「两年」就放弃在职期间的主张。","适用":"在职多年、想一次性追讨历史加班费。","成本":"时间——跨度越大，整理证据越费时；金钱——仲裁不收费。","收益":"已确证的一层：《劳动争议调解仲裁法》规定，劳动关系存续期间因拖欠劳动报酬发生争议的，申请仲裁不受一年时效期间的限制；劳动关系终止的，应当自终止之日起一年内提出。加班费属劳动报酬，适用该规则。无明文的一层：实践中能追回多久，还受证据保存与举证能力限制，全国没有统一的年限上限规定。","依据":"无明文的全国统一规定（指「历史加班费可追年限」这一具体问题）。可确证的是《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第二十七条第一款的时效规则与第四款的拖欠劳动报酬例外；举证规则见《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》（法释〔2020〕26 号，2021-01-01 施行）第四十二条","效力位阶":"无明文依据","主张强度":"倡导性","举证难度":"难——年代越久，考勤、排班、审批记录越难取得，且多由单位掌握","地域":"全国；各地对历史加班费的举证要求与支持程度差异较大","时效":"程序时效——一年；劳动关系存续期间因拖欠劳动报酬发生争议的不受一年限制，劳动关系终止的自终止之日起一年内提出。起算点——劳动关系终止之日起算（针对在职期间的拖欠）；已终止情形的应在终止后一年内提出。例外——上述「存续期间不受一年限制」即为例外条款本身。","来源":"「可追年限」无官方一手依据可援引。 尝试过的路径：① 已打开《劳动争议调解仲裁法》官方全文页（post_2722147.html）核对第二十七条四款全文，其中只有时效规则与拖欠劳动报酬例外，没有年限上限；② 检索最高人民法院及人社部关于加班费追溯年限的全国性统一口径，未定位到可作依据的官方文件；③ 检索到的相关表述多为地方裁审问答或案例，属实践口径，故不采用。故按「无明文依据」处理，只写能确证的时效规则。；已核对页面：http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（广东省人民政府门户网站·劳动争议调解仲裁法全文，页面来源标注中国人大网）；已核对页面：https://www.court.gov.cn/zixun/xiangqing/282121.html（最高人民法院官网·劳动争议解释（一）全文）","核对日期":"2026-10-03","备注":"本条不给年限承诺，只纠正「只能追两年」这一说法没有全国性条文依据。取证时机在离职之前：趁还能登录系统，把历年能导出的考勤与排班一次性导出；离职后这些数据全部取不到。劳动关系终止的，务必在终止之日起一年内提出仲裁申请——这是硬线。本地说法与举证要求向当地劳动人事争议仲裁委员会或拨 12333 确认。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"金钱"}},{"节号":11,"节名":"加班费与工时争议实操","条号":14,"标题":"单位掌握考勤却不提供：要求它提交，不提交承担不利后果","说人话":"单位不交考勤，不是「你证明了不了就算了」，而是不利后果记在它头上。你要做的是两件事：一是明确向仲裁庭提出「请求责令被申请人提交某年某月至某月的考勤记录」；二是指出你已提交的入口证据足以证明材料在其掌握中。这两步缺一步，规则就用不上。","适用":"单位在庭审中主张「考勤记录显示你没加班」，或者干脆不提交考勤。","成本":"不花钱。在庭审中提出明确的举证要求。","收益":"劳动者有证据证明用人单位掌握加班事实存在的证据，用人单位不提供的，由用人单位承担不利后果。","依据":"《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》（法释〔2020〕26 号，2021-01-01 施行）第四十二条","效力位阶":"司法解释","主张强度":"可主张","举证难度":"中——需要先提交足以证明「证据在对方掌握中」的入口材料","地域":"全国（该解释为全国统一适用）","时效":"程序时效——仲裁申请时效一年；劳动关系存续期间因拖欠劳动报酬发生争议的不受一年限制。起算点——自知道或应当知道权利被侵害之日；劳动关系终止的，自终止之日起一年内提出。例外——同上。","来源":"https://www.court.gov.cn/zixun/xiangqing/282121.html（最高人民法院官网·关于审理劳动争议案件适用法律问题的解释（一）全文，第四十二条）","核对日期":"2026-10-03","备注":"举证要求要写进书面意见，只在庭审口头上提一句容易漏记。入口证据的形式：公司排班系统的截图（含本人账号）、打卡应用的通知、考勤异常提醒的邮件——这些能证明「考勤由公司系统生成」。第 11.1 条写了入口证据的完整清单。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"金钱"}},{"节号":11,"节名":"加班费与工时争议实操","条号":15,"标题":"综合计算工时制的周期怎么定：看批准文件，不看单位口头说法","说人话":"综合工时制的周期不是单位随便挑的，批准文件上写的是哪个周期就是哪个。周期越短对你越有利——按周算总账，超了立刻能看出来；按年算，单位可以拿旺季淡季互相冲抵。所以第一件事是拿到批准文件看清周期，第二件事是按那个周期统计自己的实际工时。","适用":"单位称实行综合计算工时工作制，但对周期是周、月、季还是一年说法含糊。","成本":"不花钱。书面要求单位出示批准文件。","收益":"企业因生产特点不能实行标准工时的，可以实行不定时工作制或综合计算工时工作制等其他工作和休息办法；实行综合计算工时工作制的，分别以周、月、季、年等为周期综合计算工作时间，但其平均日工作时间和平均周工作时间应与法定标准工作时间基本相同。经批准实行综合计算工时工作制的，综合计算工作时间超过法定标准工作时间的部分，应视为延长工作时间并按《工资支付暂行规定》支付延长工作时间的工资。","依据":"《关于企业实行不定时工作制和综合计算工时工作制的审批办法》（劳部发〔1994〕503 号，1995-01-01 施行）第三条、第五条；《工资支付暂行规定》（劳部发〔1994〕489 号，1995-01-01 施行）第十三条第三款","效力位阶":"部门规章","主张强度":"可主张","举证难度":"中——批准文件由单位掌握，可要求其出示；自己的工时统计需主动记录","地域":"全国；审批权限与有效期由各省、自治区、直辖市人力资源社会保障部门规定","时效":"程序时效——仲裁申请时效一年；属劳动报酬类。起算点——按周期届满后逐周期起算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"https://www.gov.cn/zhengce/2022-08/31/content_5711263.htm（中国政府网·关于企业实行不定时工作制和综合计算工时工作制的审批办法全文）；https://www.gov.cn/zhengce/2022-08/31/content_5711284.htm（工资支付暂行规定全文，第十三条）","核对日期":"2026-10-03","备注":"周期直接决定谁占便宜，所以拿到批准文件后先抄下周期与有效期。按周期做一张工时总表：周期内每日实际工时加总，减掉法定标准工时，差额就是应补的部分。第 4 节第 4.7 条写了综合工时制的加班费算法，第 4 节第 4.3 条写了审批要求。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"金钱"}},{"节号":11,"节名":"加班费与工时争议实操","条号":16,"标题":"未经批准的综合工时制或不定时制：仍按标准工时算加班费","说人话":"单位说「我们是综合工时制」，你让它拿批准文件；拿不出来，那它就没有这个制度，你还是标准工时制——每天 8 小时、每周 44 小时，超了就是加班，三档费率照算。这是最容易在谈判里改变局面的一句话，而且要在离职前问。","适用":"单位自行宣布实行综合工时制或不定时工作制，拿不出人社部门的批准文件。","成本":"时间——主张走仲裁，一般几个月；金钱——仲裁不收费，律师费通常自己承担。","收益":"实行不定时工作制或综合计算工时工作制等其他工作和休息办法，应当按审批办法报批。未获批准而自行实行的，不产生该制度的效果，加班费仍按标准工时制计算（即按 150%/200%/300% 三档）。","依据":"《关于企业实行不定时工作制和综合计算工时工作制的审批办法》（劳部发〔1994〕503 号，1995-01-01 施行）第三条、第七条；《劳动法》（2018-12-29 修正）第三十六条、第三十九条；《工资支付暂行规定》（劳部发〔1994〕489 号，1995-01-01 施行）第十三条","效力位阶":"部门规章（《劳动法》条款为法律）","主张强度":"可推定","举证难度":"中——批准文件由单位掌握，需书面要求其出示；未获批准属消极事实，可由单位举证已获批","地域":"全国；审批权限、有效期与重新报批要求由各省、自治区、直辖市人力资源社会保障部门规定","时效":"程序时效——仲裁申请时效一年；属劳动报酬类。起算点——逐月起算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"https://www.gov.cn/zhengce/2022-08/31/content_5711263.htm（关于企业实行不定时工作制和综合计算工时工作制的审批办法全文）；http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2532147.html（劳动法全文，广东省人民政府门户网站转载页，转载页，待换一手源）；https://www.gov.cn/zhengce/2022-08/31/content_5711284.htm（工资支付暂行规定全文）","核对日期":"2026-10-03","备注":"不确定点在「未获批即无效」的表述强度——审批办法规定应当报批，但各地对未批先行的处理（是认定制度不生效、还是要求补办）把握不一，故标「可推定」，主张前向当地劳动人事争议仲裁委员会或拨 12333 确认。中央直属企业的报批路径见审批办法第七条。在离职之前提出书面调取要求并留存对方答复，是这一条最关键的取证动作。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"金钱"}},{"节号":11,"节名":"加班费与工时争议实操","条号":17,"标题":"下班后还要回消息、远程待命：性质有地方口径，先固定响应记录","说人话":"这件事各地做法不一样，我不给你「算」或「不算」的结论。但有一件事是确定的：记录越细越有利。今天几点被叫、处理了多久、一周被叫几次、有没有「十分钟内回复」这类要求——把这些按时间线列出来，比争论「这算不算上班」有用得多。然后拿这份记录去问本地口径。","适用":"下班后、休息日被要求随时回应工作消息或远程处理事务。","成本":"不花钱。需要按时间线留存响应记录。","收益":"没有可直接援引的全国统一条文——现行规定没有「下班后回消息是否算工作时间」的条款。本条不承诺加班费，但给出可固定的事实：响应的时间、频次、是否被要求立即处理、是否影响休息。","依据":"无明文的全国统一规定；已确证的是《劳动法》（2018-12-29 修正）第三十六条规定的标准工时制度（每日不超过八小时、平均每周不超过四十四小时），未涉及下班后响应的定性","效力位阶":"无明文依据","主张强度":"倡导性","举证难度":"中——聊天记录、通话记录、处理动作的时间戳需自己留存","地域":"全国；各地对「隐形加班」的认定尺度差异较大","时效":"程序时效——如主张加班费或对应报酬，仲裁申请时效一年。起算点——逐月起算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"无官方一手依据可援引。 尝试过的路径：① 已打开《劳动法》官方全文页核对第四章，其中无下班后响应或远程待命的定性条款；② 已打开《工资支付暂行规定》全文，第十三条只规定三档费率与工时制差异，未涉及该情形；③ 已打开《关于企业实行不定时工作制和综合计算工时工作制的审批办法》全文，无相关条款；④ 检索其他全国性规定，未定位到对应条文。故按「无明文依据」处理。第 4 节第 4.6 条与本节第 11.18 条处理的是同一类问题。；已核对页面：http://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_296651.html（中国人大网·劳动法全文）；已核对页面：https://www.gov.cn/zhengce/2022-08/31/content_5711284.htm（中国政府网·工资支付暂行规定全文）；已核对页面：https://www.gov.cn/zhengce/2022-08/31/content_5711263.htm（中国政府网·不定时工作制与综合计算工时工作制审批办法全文）","核对日期":"2026-10-03","备注":"本条不给结论、不涉及金额。取证动作：把非工作时间的消息按周汇总，标注每条的时间、内容、你的处理时长与结果；有「立即回复」要求的，单独标出。记录形态建议是一张按周统计的表，而不是零散截图。定性尺度向当地劳动人事争议仲裁委员会或拨 12333 确认。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"小","口径":"时间"}},{"节号":11,"节名":"加班费与工时争议实操","条号":18,"标题":"待命与值班时间：与第 4 节同源，此处不重复结论","说人话":"值班和待命算不算上班，法律里没有一句话说死，各地做法也不同。这条不重复讲一遍——去看第 4 节第 4.6 条，那里把取证动作写全了：排班表、值班签到、被叫去处理问题的记录，当天留存。","适用":"被安排值班、待命、随叫随到，想确认自己该去哪一条找依据。","成本":"不花钱。读两条即可。","收益":"没有可直接援引的全国统一条文——待命、值班时间是否计入工作时间，现行规定无明文。本条不重复论证，只做索引：定性规则的完整讨论与取证动作见第 4 节第 4.6 条；从「常见误解」角度写的同一问题见第 10 节第 10.14 条。","依据":"无明文的全国统一规定；可确证的是《劳动法》（2018-12-29 修正）第三十六条的标准工时制度，未涉及待命时间定性","效力位阶":"无明文依据","主张强度":"倡导性","举证难度":"中——排班表、值班通知、响应记录需自己留存","地域":"全国；各地对待命时间的定性差异很大","时效":"程序时效——如主张对应报酬，仲裁申请时效一年。起算点——逐月起算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"无官方一手依据可援引。 尝试路径见第 4 节第 4.6 条（已核对《劳动法》第四章、《工资支付暂行规定》第十三条、劳动争议解释（一）第四十二条三处，均无待命时间定性条款）。本条为索引条，不重复列出。；已核对页面：http://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_296651.html（中国人大网·劳动法全文）；已核对页面：https://www.gov.cn/zhengce/2022-08/31/content_5711284.htm（中国政府网·工资支付暂行规定全文）；已核对页面：https://www.court.gov.cn/zixun/xiangqing/282121.html（最高人民法院官网·劳动争议解释（一）全文）","核对日期":"2026-10-03","备注":"本条是索引条，价值在于告诉读者「这个问题只在两处讲，不在第三节重复」。取证时机在事发当期，动作清单见第 4 节第 4.6 条备注。定性尺度向当地劳动人事争议仲裁委员会或拨 12333 确认。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"小","口径":"时间"}},{"节号":11,"节名":"加班费与工时争议实操","条号":19,"标题":"加班费的仲裁时效怎么算：在职期间不受一年限制，离职后一年内提","说人话":"加班费属于劳动报酬，所以关键分两种情况：只要还在职，追拖欠加班费不受一年时效限制，可以一直主张；一旦离职，就必须从离职之日起一年内提出。所以最危险的动作是「先离职，过两年再说」——那时窗口已经关了。","适用":"在职期间被长期欠加班费，担心时间过去了就追不回。","成本":"不花钱。把起算点算清楚。","收益":"劳动争议申请仲裁的时效期间为一年，从当事人知道或者应当知道其权利被侵害之日起计算；时效因主张权利、请求救济或对方同意履行而中断，从中断时起重新计算；因不可抗力等正当理由不能申请的，时效中止。劳动关系存续期间因拖欠劳动报酬发生争议的，申请仲裁不受一年时效期间的限制；但是，劳动关系终止的，应当自劳动关系终止之日起一年内提出。","依据":"《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第二十七条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——需要证明时效中断（催告记录、投诉回执）或劳动关系终止日期（离职证明、社保减员记录）","地域":"全国","时效":"程序时效——一年，可中断、可中止。起算点——自知道或应当知道权利被侵害之日；劳动关系终止的，自终止之日起一年内提出。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制（第四款）。","来源":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（广东省人民政府门户网站·劳动争议调解仲裁法全文，第二十七条四款）","核对日期":"2026-10-03","备注":"时效中断要留痕——书面催告、监察投诉回执、对方同意履行的记录都算；口头催过不算。离职时把三样东西留下：离职证明（写清离职日期）、社保减员记录、最后一个月工资发放凭证，用来固定「劳动关系终止之日」。第 9 节第 9.14 条专门写了中断留痕的做法。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"金钱"}},{"节号":11,"节名":"加班费与工时争议实操","条号":20,"标题":"加班审批制度的两面：既是单位的挡箭牌，也是你的证据来源","说人话":"单位常用「你没提交加班申请」来挡，这句话不是必然成立——因为如果是它不批、或者流程本身形同虚设（大家都直接干到深夜），审批缺失的责任不该由你承担。反过来说，审批记录也是你最硬的证据：能走流程就走流程，走不了就把「为什么走不了」留痕（比如申请被驳回、上级口头说不用申请）。","适用":"单位有加班审批流程，而你的加班大多没走审批。","成本":"不花钱。核对审批流程实际怎么执行的。","收益":"已确证的一层：加班费的举证责任分配适用《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》第四十二条——先由劳动者证明加班事实存在，能证明证据由单位掌握的，单位不提供则承担不利后果。存在口径差异的一层：单位以「未走审批流程不算加班」抗辩时能否成立，各地裁量不同。","依据":"《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》（法释〔2020〕26 号，2021-01-01 施行）第四十二条；《工资支付暂行规定》（劳部发〔1994〕489 号，1995-01-01 施行）第十三条","效力位阶":"司法解释（第十三条为部门规章）","主张强度":"可推定","举证难度":"中——审批记录、被驳回的记录、上级口头指示的聊天记录需自己留存","地域":"全国；各地对「未审批即不算加班」抗辩的采纳程度不同","时效":"程序时效——仲裁申请时效一年。起算点——逐月起算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"https://www.court.gov.cn/zixun/xiangqing/282121.html（最高人民法院官网·劳动争议解释（一）全文，第四十二条）；https://www.gov.cn/zhengce/2022-08/31/content_5711284.htm（工资支付暂行规定全文，第十三条）","核对日期":"2026-10-03","备注":"不确定点在审批缺失的归责——各地对「未走审批但实际提供了劳动」的处理不一，需向当地劳动人事争议仲裁委员会或拨 12333 确认。具体动作：每次加班都提交一次申请（哪怕明知会被忽略），保留提交记录；被驳回或被口头告知「不用申请」的，把对话留痕。这样无论哪一方主张，你手里都有材料。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"金钱"}},{"节号":11,"节名":"加班费与工时争议实操","条号":21,"标题":"加了班但工资条上没有加班费项：长期为零本身就是证据","说人话":"工资条上从来没有加班费这一栏，这本身就是一份证据——它说明单位一贯不付，而不是「偶尔漏了」。把每个月的工资条存好，再把考勤里的加班时长统计出来，两张表并排放，差额就是你要主张的数。","适用":"工资条上从来没有「加班费」这一项，而考勤显示确实加过班。","成本":"不花钱。按月归档工资条。","收益":"已确证的一层：用人单位必须书面记录支付劳动者工资的数额、时间、领取者姓名及签字并保存两年以上备查，支付工资时应向劳动者提供一份其个人的工资清单（《工资支付暂行规定》第六条）。实践判断：工资条长期不含加班费项，与考勤显示的加班事实形成矛盾，这个矛盾是主张加班费的重要切入点（属经验性判断，不是条文结论）。","依据":"《工资支付暂行规定》（劳部发〔1994〕489 号，1995-01-01 施行）第六条；《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》（法释〔2020〕26 号，2021-01-01 施行）第四十二条","效力位阶":"部门规章（第四十二条为司法解释）","主张强度":"可推定","举证难度":"中——工资条需按月留存（电子工资条会自动清理）；考勤数据由单位掌握","地域":"全国","时效":"程序时效——仲裁申请时效一年。起算点——逐月起算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"https://www.gov.cn/zhengce/2022-08/31/content_5711284.htm（工资支付暂行规定全文，第六条）；https://www.court.gov.cn/zixun/xiangqing/282121.html（最高人民法院官网·劳动争议解释（一）全文，第四十二条）","核对日期":"2026-10-03","备注":"电子工资条会在几个月后自动清理，每月到账当天导出成文件是必要动作（见第 4 节第 4.15 条）。「长期为零」这个事实要靠连续性材料证明，缺一个月的工资条就断链。不确定点在各地对「工资条缺项」证明力的评价，可向当地劳动人事争议仲裁委员会或拨 12333 咨询。","成本标签":{"钱":"0","时间":"少","毅力":"些","收益":"中","口径":"金钱"}},{"节号":11,"节名":"加班费与工时争议实操","条号":22,"标题":"单位发的加班费明显算少了：差额怎么主张","说人话":"单位「发过加班费」不等于没欠你钱。你要做的是算两张表：一张是按法定倍率算的应得，一张是实际到手的，差额就是主张的数。注意保留好每月的加班时长统计——差额主张是按月累加的，某个月的时长说不清，那个月的差额就难支持。","适用":"单位每月发了一点加班费，但按法定倍率一算明显不足。","成本":"时间——主张走仲裁，一般几个月；金钱——仲裁不收费，律师费通常自己承担。","收益":"按三档费率与实际加班时长算出应得数额，与实际发放额比对，差额部分可主张。加班费属劳动报酬，适用《劳动争议调解仲裁法》第二十七条第四款的时效例外（在职期间不受一年限制）。","依据":"《工资支付暂行规定》（劳部发〔1994〕489 号，1995-01-01 施行）第十三条；《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第二十七条第四款","效力位阶":"部门规章（《劳动争议调解仲裁法》条款为法律）","主张强度":"可推定","举证难度":"中——需要逐月的加班时长统计与实际发放数额；后者可由工资条与流水证明，前者多需单位提供考勤","地域":"全国；加班费基数口径的地方差异会影响差额数值（见 11.4）","时效":"程序时效——仲裁申请时效一年；劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制。起算点——逐月起算；劳动关系终止的，自终止之日起一年内提出。例外——第四款时效例外。","来源":"https://www.gov.cn/zhengce/2022-08/31/content_5711284.htm（工资支付暂行规定全文，第十三条）；http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（劳动争议调解仲裁法全文，第二十七条）","核对日期":"2026-10-03","备注":"不确定点在基数口径（见 11.4）——差额数值对基数很敏感，各地口径不同，建议按本地口径算一遍再报数，避免请求金额过高导致部分不获支持。做一张逐月对比表（月份、加班时长、应得、实发、差额），既是主张依据，也是谈判时最直观的材料。本地尺度向当地劳动人事争议仲裁委员会或拨 12333 确认。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"金钱"}},{"节号":11,"节名":"加班费与工时争议实操","条号":23,"标题":"出差期间的加班：路上时间与异地工作是两回事","说人话":"出差要分两段看。在异地干活的那段，如果能证明是单位安排的、超出了标准工时，可以按加班主张；在路上的那段（坐车坐飞机），法律没有明确说算不算工作时间，各地做法不一。所以出差前先把安排留痕：出差审批单写清任务与起止时间，异地的工作消息、会议记录也留着。","适用":"出差期间在途、异地加班，想主张加班费。","成本":"不花钱。需要区分在途与工作两类时间。","收益":"已确证的一层：《工资支付暂行规定》第十三条针对「在法定标准工作时间以外工作」安排加班；出差期间在异地实际提供工作的部分，落入该条射程。无明文的一层：在途时间（乘车、乘机）是否计入工作时间，现行规定无明文。","依据":"无明文的全国统一规定（指在途时间定性）。可确证的是《工资支付暂行规定》（劳部发〔1994〕489 号，1995-01-01 施行）第十三条对「安排劳动者在法定标准工作时间以外工作」的支付标准","效力位阶":"无明文依据","主张强度":"倡导性","举证难度":"中——出差审批单、行程凭证、异地工作记录需自己留存","地域":"全国；各地对在途时间与异地加班的认定差异较大","时效":"程序时效——如主张加班费，仲裁申请时效一年。起算点——逐月起算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"「在途时间是否计入工作时间」无官方一手依据可援引。 尝试过的路径：① 已打开《工资支付暂行规定》官方全文页逐条核对，第十三条只规定「在法定标准工作时间以外工作」的支付标准，未涉及在途时间定性；② 已打开《劳动法》官方全文页核对第四章，无相关条款；③ 检索其他全国性规定未定位到对应条文。故按「无明文依据」处理。第十三条原文见中国政府网页 content_5711284.htm。；已核对页面：https://www.gov.cn/zhengce/2022-08/31/content_5711284.htm（中国政府网·工资支付暂行规定全文）；已核对页面：http://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_296651.html（中国人大网·劳动法全文）","核对日期":"2026-10-03","备注":"本条不给「在途算不算」的结论，但异地工作实际提供劳动的那部分可以按加班主张，这一层是清楚的。取证动作：出差审批单（含任务、起止时间、目的地）、交通票据、异地工作期间的会议记录与交付物，按趟归档。本地口径向当地劳动人事争议仲裁委员会或拨 12333 确认。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"中","口径":"金钱"}},{"节号":11,"节名":"加班费与工时争议实操","条号":24,"标题":"用餐与休息时间是否计入工时：看能不能自由支配","说人话":"这段饭点时间算不算工时，法律没有一句话写死。各地通常看的不是「制度怎么规定」，而是你能不能自由支配：能不能离岗、能不能出公司、被叫到要不要马上停下手里的事。所以还是老办法——把实际情况留痕：排班表怎么写的、实际能不能离岗、有没有被安排值班。","适用":"单位按「扣除午休 1 小时」计算工作时长，而这段时间你实际在岗待命。","成本":"不花钱。核对排班制度与实际状态。","收益":"没有可直接援引的全国统一条文——现行规定未明确「用餐与休息时间是否计入工作时间」。本条不承诺加班费，只给出判断方向与取证动作。","依据":"无明文的全国统一规定；已确证的是《劳动法》（2018-12-29 修正）第三十六条的标准工时制度，未涉及用餐与休息时间的定性","效力位阶":"无明文依据","主张强度":"倡导性","举证难度":"中——排班制度、考勤记录、在岗状态的材料需自己留存","地域":"全国；各地对午休是否计入工时的认定差异较大","时效":"程序时效——如主张加班费或对应报酬，仲裁申请时效一年。起算点——逐月起算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"无官方一手依据可援引。 尝试过的路径：① 已打开《劳动法》官方全文页核对第四章，无用餐与休息时间定性的条款；② 已打开《工资支付暂行规定》全文，第十三条只规定加班费标准，未涉及该情形；③ 已打开《关于企业实行不定时工作制和综合计算工时工作制的审批办法》全文，无相关条款；④ 检索其他全国性规定未定位到对应条文。故按「无明文依据」处理。；已核对页面：http://www.npc.gov.cn/npc/c2/c30834/201905/t20190521_296651.html（中国人大网·劳动法全文）；已核对页面：https://www.gov.cn/zhengce/2022-08/31/content_5711284.htm（中国政府网·工资支付暂行规定全文）；已核对页面：https://www.gov.cn/zhengce/2022-08/31/content_5711263.htm（中国政府网·不定时工作制与综合计算工时工作制审批办法全文）","核对日期":"2026-10-03","备注":"本条不给结论、不涉及金额。取证动作：留存排班制度里关于休息时间的表述、打卡记录显示的离岗情况；如果休息时间实际在岗待命，把当时被安排工作的记录一并留下——「制度写了休息」与「实际无法休息」的对比，是这一条唯一能做的事。本地口径向当地劳动人事争议仲裁委员会或拨 12333 确认。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"小","口径":"时间"}},{"节号":11,"节名":"加班费与工时争议实操","条号":25,"标题":"加班费约定「已包含在工资里」：条款效力有争议，先看整体合理性","说人话":"合同里写「月薪已含加班费」，这句话不是必然有效也不是必然无效，各地做法不一样。可以争的点通常有两个：一是算下来时薪有没有低于当地最低工资（低于就站不住）；二是实际加班时长对应的加班费是否明显超过约定的那部分工资。所以先算这两笔账，再决定要不要主张。","适用":"劳动合同或口头约定「月薪已包含加班费」，单位据此不再另付。","成本":"时间——主张走仲裁，一般几个月；金钱——仲裁不收费。","收益":"没有可直接援引的全国统一条文——「工资已包含加班费」这类约定的效力，现行法律与司法解释均无直接规定，各地裁判路径不同。可确证的是：加班费属劳动报酬，其计算适用《工资支付暂行规定》第十三条的三档标准。","依据":"无明文的全国统一规定。可确证的是《工资支付暂行规定》（劳部发〔1994〕489 号，1995-01-01 施行）第十三条的三档支付标准；另《最低工资规定》第十二条把「延长工作时间工资」排除在最低工资构成之外","效力位阶":"无明文依据","主张强度":"倡导性","举证难度":"中——劳动合同文本、工资条、逐月加班时长统计需自己留存","地域":"全国；对「包含加班费」条款效力的认定各地差异明显","时效":"程序时效——如主张加班费，仲裁申请时效一年。起算点——逐月起算。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制；劳动关系终止的，自终止之日起一年内提出。","来源":"无官方一手依据可援引「该约定一律无效」。 尝试过的路径：① 已打开《工资支付暂行规定》官方全文页，第十三条只规定三档标准，未涉及「包含加班费」约定的效力；② 已打开《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》全文，第三十五条针对的是解除或终止时达成的协议，不覆盖在职期间的此类约定；③ 检索其他全国性规定未定位到对应条文。故按「无明文依据」处理，只写可确证的三档标准与最低工资规则。；已核对页面：https://www.gov.cn/zhengce/2022-08/31/content_5711284.htm（中国政府网·工资支付暂行规定全文）","核对日期":"2026-10-03","备注":"本条不给效力结论。先算两笔账再决定：① 剔除加班时长后折算出的小时工资是否低于当地最低工资；② 按第十三条三档算出的加班费与实际所得是否明显失衡。第 5 节第 5.1 条讲了以「未及时足额支付劳动报酬」为由被迫解除的路径，可作为另一条思路。本地裁审尺度向当地劳动人事争议仲裁委员会或拨 12333 确认。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"中","口径":"金钱"}},{"节号":11,"节名":"加班费与工时争议实操","条号":26,"标题":"加班费被拒付后的顺序：证据 → 投诉 → 仲裁 → 必要时诉讼","说人话":"顺序很重要。第一步永远是先把证据固定下来（离职之前做，之后做不了）；第二步考虑向劳动保障监察投诉——它可能让单位限期支付，也为后面要「加付赔偿金」铺路；第三步提交仲裁申请，把加班费本金和加付赔偿金分开列为请求项；第四步对裁决不服的，在收到裁决书之日起 15 日内起诉。别把顺序倒过来。","适用":"已经确定要走维权，但不知道先做哪一步。","成本":"时间——整条链条走完通常半年以上；金钱——仲裁不收费，诉讼按法院标准交费。","收益":"没有单一法条能给出完整顺序；本条是按各程序条文的适用条件给出的操作顺序。可确证的节点包括：仲裁申请时效一年（《劳动争议调解仲裁法》第二十七条）；加付赔偿金需经劳动行政部门责令限期支付而后逾期不付（《劳动合同法》第八十五条）；对非终局裁决不服的起诉期限十五日（《劳动争议调解仲裁法》第五十条）。","依据":"无明文的全国统一规定（指顺序本身）；可确证的是《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第二十七条、第四十七条至第五十条；《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第八十五条；《劳动保障监察条例》（国务院令第 423 号，2004-12-01 施行）第二十条","效力位阶":"无明文依据","主张强度":"倡导性","举证难度":"中——依顺序推进所需的材料各自不同，证据类最耗时","地域":"全国；各程序的实际衔接与办理时长由地方掌握","时效":"程序时效——仲裁一年（在职期间拖欠报酬不受一年限制）；监察查处 2 年；起诉 15 日（自收到裁决书起）；行政复议 60 日、行政诉讼六个月。起算点——分别见各程序规定。例外——在职期间拖欠劳动报酬不受一年限制。","来源":"「维权顺序」无官方一手依据可援引（顺序是操作规程，不是条文结论）。各节点的依据来源：http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（劳动争议调解仲裁法全文，第二十七条、第四十七条至第五十条）；http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（劳动合同法全文，第八十五条）；https://www.gov.cn/zhengce/zhengceku/2008-03/28/content_7383.htm（劳动保障监察条例全文，第二十条）。","核对日期":"2026-10-03","备注":"本条是索引与顺序条，不给金额承诺。第 9 节完整写了仲裁与监察两条路径的时效与管辖。唯一不能颠倒的一步是证据固定：办公账号、内网权限、排班系统在离职当天失效，这一步错过就没有补救。各程序衔接与本地办理时长，向当地劳动人事争议仲裁委员会、人力资源社会保障局劳动保障监察机构或拨 12333 确认。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"中","口径":"金钱"}},{"节号":11,"节名":"加班费与工时争议实操","条号":27,"标题":"加班事实的日常台账：一个人也能记","说人话":"台账记五列就够：日期、起止时间、做什么、谁安排的、有什么凭证。凭证那列写清「审批单号 / 聊天记录日期 / 邮件主题」，不用把文件都贴进去——原始文件另存一个文件夹按月归档。每天花两分钟，一年下来就是一条能站住的时间线。","适用":"想在不引起注意的前提下，把加班事实按月记下来。","成本":"不花钱。每天几分钟。","收益":"没有可直接援引的条文；本条是一份台账模板。其法律作用是为《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》第四十二条的「劳动者先证明加班事实存在」提供材料，并构成 11.1 的入口证据。","依据":"无明文的全国统一规定；配套举证规则见《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》（法释〔2020〕26 号，2021-01-01 施行）第四十二条","效力位阶":"无明文依据","主张强度":"倡导性","举证难度":"中——台账是自记材料，需与原始凭证相互印证才有证明力","地域":"全国；各地对自记台账采信程度不同，需原始凭证配合","时效":"无特别时效——本条是取证动作，自身不受时效限制。起算点：不适用。例外：台账对应的加班费主张受一年仲裁时效约束，逐月起算（见 11.19）。","来源":"无官方一手依据可援引（本条是台账模板）。举证责任分配依据为《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》第四十二条，一手页：https://www.court.gov.cn/zixun/xiangqing/282121.html（最高人民法院官网）。","核对日期":"2026-10-03","备注":"台账只是索引，不是证据本身——它自己证明不了任何事，起作用的是它指向的原始凭证（审批单、邮件、聊天记录、交付物）。所以台账里的「凭证」列必须写清可回溯的标识。台账建议存在个人设备上，不要放在公司电脑或公司网盘里。取证时机在离职之前。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"中","口径":"金钱"}},{"节号":12,"节名":"竞业限制与保密实操","条号":1,"标题":"先分清两种竞业限制：约束在职期间，还是约束离职之后","说人话":"这是全节最要紧的一条。竞业限制有两种写法，规则不一样：写「解除或终止后」的，公司必须按月给你补偿，不给钱你可以要求解除；写「在职期间」的，法律明确认可它有效，而且不要求公司给任何补偿——零成本就能绑住你。所以签字前一定看清期间那一栏，别用「离职后才有补偿义务」的逻辑去看待在职条款。","适用":"拿到竞业限制协议或含竞业限制条款的劳动合同，准备签字。","成本":"不花钱。逐字看条款「适用期间」那一栏，几分钟。","收益":"明文层（两种结构规则完全不同）：① 离职后竞业限制——用人单位可以在劳动合同或保密协议中与劳动者约定竞业限制条款，并约定在解除或者终止劳动合同后，在竞业限制期限内按月给予劳动者经济补偿；② 在职期间竞业限制——用人单位与高级管理人员、高级技术人员和其他负有保密义务的人员约定在职期间竞业限制条款，劳动者以「不得约定在职期间竞业限制」或「未支付经济补偿」为由请求确认无效的，人民法院不予支持。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第二十三条第二款、第二十四条；《最高人民法院关于审理劳动争议案件适用法律问题的解释（二）》（法释〔2025〕12 号，2025-09-01 施行）第十四条","效力位阶":"法律（第十四条为司法解释）","主张强度":"可主张","举证难度":"易——条款文本本身即可确定适用期间","地域":"全国","时效":"程序时效——仲裁申请时效一年。起算点——自用人单位主张违约之日，或自离职之日。例外——无特别时效，不适用劳动报酬类例外。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文）；http://gongbao.court.gov.cn/Details/bb72019c45453f84d920bd6375573e.html（最高人民法院公报·劳动争议解释（二）全文）","核对日期":"2026-10-03","备注":"在职期间竞业限制条款的效力是 2025 年新规（解释（二）第十四条），此前存在争议，现在明确了：不能以「不得约定」或「没给钱」为由主张无效。它与员工手册里「不得兼职、不得自营」的禁止条款是两条可并用的路径，抗辩方向不同（见 12.5 与第 6 节第 6.14 条）。协议里若只写「竞业限制」而未写期间，按文义不利于劳动者，签字前要求写清。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"大","口径":"自由"}},{"节号":12,"节名":"竞业限制与保密实操","条号":2,"标题":"离职后竞业限制的法定对价：必须按月给经济补偿","说人话":"离职后的竞业限制，按月给钱是法定结构——不是公司给你的恩惠，是它要求你守约的对价。协议里没写金额也不影响这一点（金额按 12.4 的 30% 兜底主张），但你履行了义务就得按月拿到钱。","适用":"签了离职后竞业限制条款，想确认单位有没有法定补偿义务。","成本":"不花钱。核对协议里有没有补偿条款。","收益":"明文层：对负有保密义务的劳动者，用人单位可以在劳动合同或者保密协议中与劳动者约定竞业限制条款，并约定在解除或者终止劳动合同后，在竞业限制期限内按月给予劳动者经济补偿。劳动者违反竞业限制约定的，应当按照约定向用人单位支付违约金。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第二十三条第二款","效力位阶":"法律","主张强度":"可主张","举证难度":"易——条文明确了「按月给予经济补偿」这一对价结构；协议文本自己应留存","地域":"全国","时效":"程序时效——仲裁申请时效一年。起算点——自各月补偿应付未付之日起算，逐月计算。例外——按月给付的补偿请求权逐月起算，不是从离职日一次性起算。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文，第二十三条）","核对日期":"2026-10-03","备注":"条文写的是「按月给予」，不是一次性买断，也不是实物或股份抵充。协议里写「补偿已包含在离职结算款中」或「以股权激励抵扣」的，与「按月给予」的表述不符，可据此主张按 12.4 的兜底标准按月支付；各地对此类替代约定的认可程度不同，具体尺度向当地劳动人事争议仲裁委员会或拨 12333 确认。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"大","口径":"金钱"}},{"节号":12,"节名":"竞业限制与保密实操","条号":3,"标题":"竞业限制只能对三类人用，不是人人都能被限制","说人话":"法律只认三类人：高管、高级技术人员、其他负有保密义务的人。「其他负有保密义务的人」是唯一有解释空间的一类，判断标准是你实际知不知道、接不接触商业秘密，不是协议上怎么写。所以岗位说明书、实际工作内容、能访问的数据范围就是这一条的全部战场。","适用":"被要求签竞业限制协议，或者协议把对象写成「全体员工」。","成本":"不花钱。核对协议里对人员范围的表述与自己的岗位。","收益":"明文层：竞业限制的人员限于用人单位的高级管理人员、高级技术人员和其他负有保密义务的人员。竞业限制的范围、地域、期限由用人单位与劳动者约定，竞业限制的约定不得违反法律、法规的规定。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第二十四条第一款","效力位阶":"法律","主张强度":"可推定","举证难度":"中——岗位说明书、工作内容记录、可访问数据范围需自己整理；「是否属于涉密人员」由用人单位主张","地域":"全国；对「其他负有保密义务的人员」的认定标准各地差异较大","时效":"程序时效——仲裁申请时效一年。起算点——自用人单位主张违约之日，或自劳动者请求确认条款不生效之日。例外——无特别时效豁免。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文，第二十四条）","核对日期":"2026-10-03","备注":"不确定点在人员范围的认定：职能岗、支持岗是否构成「负有保密义务的人员」，各地口径不一（有的看岗位名称，有的看实际接触的信息类型），故标「可推定」，主张前向当地劳动人事争议仲裁委员会或拨 12333 确认。入职时把岗位说明书留一份原件或扫描件——它是证明「我的工作内容不涉及核心秘密」最直接的材料，事后向公司索要基本要不出来。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"自由"}},{"节号":12,"节名":"竞业限制与保密实操","条号":4,"标题":"只约定竞业限制、没写补偿金额：按离职前十二个月平均工资的 30% 主张","说人话":"协议只写「你不能去竞争对手那里」、没写「我每月给你多少钱」——不影响你拿钱。你实际守了约，就可以按离职前十二个月平均工资的 30% 按月要。这个比例是司法解释定的兜底数，不用跟公司谈。","适用":"竞业限制协议写了限制，没写按月给多少补偿。","成本":"不花钱。核对协议里有没有补偿条款与金额。","收益":"明文层：当事人在劳动合同或者保密协议中约定了竞业限制，但未约定解除或者终止劳动合同后给予劳动者经济补偿，劳动者履行了竞业限制义务，要求用人单位按照劳动者在劳动合同解除或者终止前十二个月平均工资的 30% 按月支付经济补偿的，人民法院应予支持。","依据":"《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》（法释〔2020〕26 号，2021-01-01 施行）第三十六条","效力位阶":"司法解释","主张强度":"可主张","举证难度":"中——需要证明自己履行了竞业限制义务；离职前十二个月工资流水需自己留存","地域":"全国；低于劳动合同履行地最低工资标准的按最低工资标准支付（该条第二款）","时效":"程序时效——仲裁申请时效一年。起算点——自各月补偿应付未付之日起算，逐月计算。例外——按月给付义务逐月起算。","来源":"https://www.court.gov.cn/zixun/xiangqing/282121.html（最高人民法院官网·劳动争议解释（一）全文，第三十六条）","核对日期":"2026-10-03","备注":"该条原文还有第二款：约定的补偿标准低于劳动合同履行地最低工资标准的，按最低工资标准支付（本轮已核到全文）。30% 的计算基数是「解除或者终止前十二个月平均工资」，与第 5 节第 5.4 条的经济补偿基数口径相近但用途不同，不要混用。基数是税前还是实发，各地把握不同，向当地劳动人事争议仲裁委员会或拨 12333 确认。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"金钱"}},{"节号":12,"节名":"竞业限制与保密实操","条号":5,"标题":"约定并履行了竞业限制：双方都可以要求对方履行各自义务","说人话":"这是双向的。协议里限制和补偿都写了，那解除合同后：公司可以要求你守约，你守了约就可以要求它付补偿——两条都受法院支持。所以「公司不提，我就不用守」是错的理解：它不提，义务照样在，你照样可以按月要钱。","适用":"协议既约定了竞业限制也约定了经济补偿，解除合同时想确认各自义务。","成本":"不花钱。核对协议的两项条款是否齐全。","收益":"明文层：当事人在劳动合同或者保密协议中约定了竞业限制和经济补偿，当事人解除劳动合同时，除另有约定外，用人单位要求劳动者履行竞业限制义务，或者劳动者履行了竞业限制义务后要求用人单位支付经济补偿的，人民法院应予支持。","依据":"《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》（法释〔2020〕26 号，2021-01-01 施行）第三十七条","效力位阶":"司法解释","主张强度":"可主张","举证难度":"中——协议文本、履行竞业限制义务的证明、补偿支付记录需自己留存","地域":"全国","时效":"程序时效——仲裁申请时效一年。起算点——自各月补偿应付未付之日；主张违约的自违约行为发生之日。例外——无特别时效豁免。","来源":"https://www.court.gov.cn/zixun/xiangqing/282121.html（最高人民法院官网·劳动争议解释（一）全文，第三十七条）","核对日期":"2026-10-03","备注":"条文里的「除另有约定外」是留给双方自行安排的空间——协议若写明「离职时一次性支付补偿」或「本次离职不启动竞业限制」，从其约定。所以离职时把「是否启动、怎么付」写成书面是这一条最实用的动作（见 12.20）。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"大","口径":"金钱"}},{"节号":12,"节名":"竞业限制与保密实操","条号":6,"标题":"单位三个月不付补偿：可以请求解除竞业限制约定","说人话":"公司三个月不给你竞业补偿，你可以请求解除这条限制。解除之后你就不用再守着，它也不能拿这条找你要违约金。三个月是硬门槛，从第一笔该付没付起算——所以要按月记到账情况。","适用":"约定了竞业限制和经济补偿，单位因自身原因连续三个月没付。","成本":"时间——主张走仲裁，一般几个月；金钱——仲裁不收费，律师费通常自己承担。","收益":"明文层：当事人在劳动合同或者保密协议中约定了竞业限制和经济补偿，劳动合同解除或者终止后，因用人单位的原因导致三个月未支付经济补偿，劳动者请求解除竞业限制约定的，人民法院应予支持。","依据":"《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》（法释〔2020〕26 号，2021-01-01 施行）第三十八条","效力位阶":"司法解释","主张强度":"可推定","举证难度":"中——银行流水可证明补偿未到账；「未支付是否因用人单位原因」可能成为争点","地域":"全国；只约定竞业限制、未约定补偿金额时，三个月未付能否直接请求解除，各地裁判口径未统一","时效":"程序时效——仲裁申请时效一年。起算点——自三个月未支付届满之日起算。例外——无特别时效豁免。","来源":"https://www.court.gov.cn/zixun/xiangqing/282121.html（最高人民法院官网·劳动争议解释（一）全文，第三十八条）","核对日期":"2026-10-03","备注":"不确定点在条文衔接——第三十八条的字面前提是「约定了竞业限制和经济补偿」。若协议只约定竞业限制、没写补偿金额（落入 12.4 的 30% 兜底场合），三个月不付能否直接请求解除，各地口径不统一，需向当地劳动人事争议仲裁委员会或拨 12333 确认，故标「可推定」。操作建议：先把三个月的未付事实固定成书面清单（月份、应付金额、未到账记录），再提出解除请求。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"自由"}},{"节号":12,"节名":"竞业限制与保密实操","条号":7,"标题":"单位中途解除竞业限制：要额外给三个月补偿，但需你主动主张","说人话":"公司中途说「你不用守竞业了」，它可以解除，但要额外补你三个月的竞业补偿。注意这是请求权，不会自动打钱——它不会主动付，你得自己提。收到解除通知就书面提出这三个月的补偿要求，并留痕。","适用":"竞业限制期限内，单位单方通知你「不用再守了」。","成本":"不花钱。核对通知与已付补偿的月份。","收益":"明文层：在竞业限制期限内，用人单位请求解除竞业限制协议的，人民法院应予支持；解除竞业限制协议时，劳动者请求用人单位额外支付劳动者三个月的竞业限制经济补偿的，人民法院应予支持。","依据":"《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》（法释〔2020〕26 号，2021-01-01 施行）第三十九条","效力位阶":"司法解释","主张强度":"可主张","举证难度":"中——单位解除竞业限制的通知需留存；已付补偿的月份可由流水证明","地域":"全国；这三个月补偿的计算基数（按原约定标准还是 30% 兜底）各地认定不一","时效":"程序时效——仲裁申请时效一年。起算点——自单位解除竞业限制协议之日。例外——无特别时效豁免。","来源":"https://www.court.gov.cn/zixun/xiangqing/282121.html（最高人民法院官网·劳动争议解释（一）全文，第三十九条）","核对日期":"2026-10-03","备注":"不确定点在计算基数——三个月的补偿按原协议约定的月标准、还是按第三十六条的 30% 兜底计算，各地做法不一致，需向当地劳动人事争议仲裁委员会或拨 12333 确认。实务中最常见的损失是：收到「解除通知」就以为关系结束了，没有主动主张这三个月。收到通知当天就回一份书面要求。","成本标签":{"钱":"0","时间":"少","毅力":"些","收益":"大","口径":"金钱"}},{"节号":12,"节名":"竞业限制与保密实操","条号":8,"标题":"没接触过保密事项：可以请求确认竞业限制条款不生效","说人话":"签了不等于被绑死。如果实际工作里根本碰不到客户报价、技术方案、经营数据这类秘密，可以请求确认这条不生效。举证责任在劳动者一侧，所以你要拿出能说明「我的工作内容不含敏感信息」的材料：岗位说明书、工作交接记录、系统权限范围、可访问的数据清单。这一条对职能岗、支持岗尤其值得评估。","适用":"签了竞业限制协议，但岗位实际接触不到商业秘密和与知识产权相关的保密事项。","成本":"时间——主张走仲裁，一般几个月；金钱——仲裁不收费，律师费通常自己承担。","收益":"明文层：劳动者未知悉、接触用人单位的商业秘密和与知识产权相关的保密事项，劳动者请求确认竞业限制条款不生效的，人民法院依法予以支持。","依据":"《最高人民法院关于审理劳动争议案件适用法律问题的解释（二）》（法释〔2025〕12 号，2025-09-01 施行）第十三条第一款","效力位阶":"司法解释","主张强度":"可推定","举证难度":"难——需要证明「未知悉、未接触」这一消极事实，材料多在公司系统里，离职后难以还原","地域":"全国（该解释为全国统一适用）","时效":"程序时效——仲裁申请时效一年。起算点——自用人单位主张违约之日，或自离职之日。例外——无特别时效豁免。","来源":"http://gongbao.court.gov.cn/Details/bb72019c45453f84d920bd6375573e.html（最高人民法院公报·劳动争议解释（二）全文，第十三条）；https://www.court.gov.cn/zixun/xiangqing/282121.html（最高人民法院官网·劳动争议解释（一）全文）","核对日期":"2026-10-03","备注":"举证难度标「难」——取证时机必须在离职之前。具体动作：把岗位说明书、系统权限清单、可访问的文件夹与数据范围、日常工作产出（不含实质秘密的）、内部培训记录当场截图留存；有权限页面或数据目录的，把页面截图。离职后账号停用，这些全部取不到。不确定点在「未知悉、未接触」的认定标准，各地不一，可向当地劳动人事争议仲裁委员会或拨 12333 咨询本地尺度。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"自由"}},{"节号":12,"节名":"竞业限制与保密实操","条号":9,"标题":"范围、地域、期限超出保密必要：超过合理比例的部分可请求无效","说人话":"竞业限制的边界要和你知道的秘密相称——你在一座城市做本地客户维护，协议却限制你两年内全国同行业都不能干，这就超出了合理比例，超出那部分可以请求认定无效。这是 2025 年新规的明文，不是猜测。要做的动作是把岗位职责、可访问的数据范围拿去和协议里的定义逐字比对。","适用":"协议把「竞争业务」定义得极宽（例如「与公司业务相关的一切领域」）、地域覆盖全国乃至境外、期限顶满两年，而你实际接触的保密信息很有限。","成本":"时间——主张走仲裁，一般几个月；金钱——仲裁不收费，律师费通常自己承担。","收益":"明文层：用人单位与劳动者约定的竞业限制范围、地域、期限与劳动者知悉、接触的保密事项不相适应的，劳动者请求确认超过合理比例的部分无效的，人民法院依法予以支持。","依据":"《最高人民法院关于审理劳动争议案件适用法律问题的解释（二）》（法释〔2025〕12 号，2025-09-01 施行）第十三条第二款","效力位阶":"司法解释","主张强度":"可推定","举证难度":"中——岗位职责、工作内容记录、可访问数据范围需自己整理；「相适应」的裁量在个案","地域":"全国（该解释为全国统一适用）；「合理比例」的个案裁量空间较大，各地尺度不同","时效":"程序时效——仲裁申请时效一年。起算点——自用人单位主张违约之日，或自离职之日。例外——无特别时效豁免。","来源":"http://gongbao.court.gov.cn/Details/bb72019c45453f84d920bd6375573e.html（最高人民法院公报·劳动争议解释（二）全文，第十三条）","核对日期":"2026-10-03","备注":"不确定点在「合理比例」怎么划——解释只给了「相适应」这个标准，没有量化尺度，各地个案裁量差异明显，故标「可推定」，主张前向当地劳动人事争议仲裁委员会或拨 12333 确认本地尺度。入职时把协议原文与岗位说明书一起留存，比对材料全靠这两样；协议里的「竞争业务」定义要逐字抄下来，与自己的实际工作范围并排比较。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"自由"}},{"节号":12,"节名":"竞业限制与保密实操","条号":10,"标题":"违反有效的竞业限制：退补偿＋付违约金，还可能要继续守","说人话":"违反竞业限制不是「大不了不要补偿」。真实代价是三样叠加：把已经拿到的补偿退回去、按约定付违约金、而且还可能被要求继续守完剩下的期限。所以离职前若签过竞业限制，先把「是否启动、补偿多少、付到什么时候」书面问清，再决定去向。","适用":"签了有效的竞业限制并实际收了补偿，离职后去了竞争方或自己开业做同类业务。","成本":"钱——要返还已收的经济补偿，还要按约定支付违约金，两项叠加；时间——争议走仲裁，一般几个月。","收益":"这不是收益条，是风险条。 明文层：① 劳动者违反有效的竞业限制约定，用人单位请求劳动者按照约定返还已经支付的经济补偿并支付违约金的，人民法院依法予以支持；② 劳动者违反竞业限制约定，向用人单位支付违约金后，用人单位要求劳动者按照约定继续履行竞业限制义务的，人民法院应予支持。","依据":"《最高人民法院关于审理劳动争议案件适用法律问题的解释（二）》（法释〔2025〕12 号，2025-09-01 施行）第十五条；《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》（法释〔2020〕26 号，2021-01-01 施行）第四十条","效力位阶":"司法解释","主张强度":"可主张","举证难度":"中——竞业限制协议、补偿支付记录、新单位任职或商事登记信息","地域":"全国","时效":"程序时效——仲裁申请时效一年。起算点——自用人单位知道或应当知道违约行为之日。例外——违反竞业限制属持续性行为，时效起算可能从违约行为终了之日起算。","来源":"http://gongbao.court.gov.cn/Details/bb72019c45453f84d920bd6375573e.html（最高人民法院公报·劳动争议解释（二）全文，第十五条）；https://www.court.gov.cn/zixun/xiangqing/282121.html（最高人民法院官网·劳动争议解释（一）全文，第四十条）","核对日期":"2026-10-03","备注":"商事主体登记信息（法定代表人、股东、经营范围）通过国家企业信用信息公示系统公开可查，自己开业难以隐去。离职时务必书面确认竞业限制是否启动（见 12.20），没有书面确认的，默认按协议执行。违约金明显过高时，可主张调减——各地对调减幅度把握不同，向当地劳动人事争议仲裁委员会或拨 12333 确认。","成本标签":{"钱":"多","时间":"多","毅力":"是","收益":"小","口径":"自由"}},{"节号":12,"节名":"竞业限制与保密实操","条号":11,"标题":"离职后竞业限制最长两年，超期部分无效","说人话":"离职后的竞业限制最长两年，写三年五年也只按两年算，超出部分不算数。这一条是硬上限，不用争。协议里写「长期有效」「直至竞业事由消失」的，同样只能算两年。另外注意：自己开公司做同类业务，也在这一条的射程内。","适用":"竞业限制协议约定的限制期限超过两年。","成本":"不花钱。看协议里的期限条款。","收益":"明文层：在解除或者终止劳动合同后，竞业限制期限不得超过二年。条文同时明确覆盖「自己开业生产或者经营同类产品、从事同类业务」的情形。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第二十四条第二款","效力位阶":"法律","主张强度":"可主张","举证难度":"易——协议文本即可证明期限约定","地域":"全国","时效":"程序时效——仲裁申请时效一年。起算点——自解除或终止劳动合同之日。例外——无特别时效豁免。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文，第二十四条）","核对日期":"2026-10-03","备注":"两年从解除或终止之日起算，不是从签协议之日起算。协议里写「自离职之日起 X 年」的，保留离职日期凭证（离职证明、社保减员记录）。「自己开业」这一层是条文原文，不是延伸解释，所以注册同类业务公司同样受约束——营业执照上的经营范围是公开可查的判断依据。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"中","口径":"自由"}},{"节号":12,"节名":"竞业限制与保密实操","条号":12,"标题":"在职期间竞业限制必须经审批吗：条约定的效力不取决于审批","说人话":"在职竞业条款不需要经过什么审批，也不需要公司给你钱，签了原则上就有效。这一点和「不定时工作制要审批」不同（见第 4 节第 4.3 条），别把两类规则搞混。所以对抗它的着力点不在程序，而在两处：你是否真的负有保密义务（12.8），以及约定范围是否过度（12.9）。","适用":"单位与你在职期间约定了竞业限制条款，你想知道这个约定有没有程序要求。","成本":"不花钱。核对协议签署时间与内容。","收益":"明文层：用人单位与高级管理人员、高级技术人员和其他负有保密义务的人员约定在职期间竞业限制条款，劳动者以「不得约定在职期间竞业限制」或「未支付经济补偿」为由请求确认无效的，人民法院不予支持。该条没有设定行政审批或备案要求——约束来自双方约定本身。","依据":"《最高人民法院关于审理劳动争议案件适用法律问题的解释（二）》（法释〔2025〕12 号，2025-09-01 施行）第十四条；《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第二十四条第一款","效力位阶":"司法解释（第二十四条第一款为法律）","主张强度":"可主张","举证难度":"易——条款文本与签署时间即可证明；效力问题属法律适用，举证负担主要在「是否涉密」这一事实层面","地域":"全国","时效":"程序时效——仲裁申请时效一年。起算点——自用人单位主张违约之日。例外——无特别时效豁免。","来源":"http://gongbao.court.gov.cn/Details/bb72019c45453f84d920bd6375573e.html（最高人民法院公报·劳动争议解释（二）全文，第十四条）；http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文，第二十四条）","核对日期":"2026-10-03","备注":"这一条的实践意义是把注意力从「条款有没有效」转到「我是否涉密、范围是否过度」——因为「条款无效」这条路已经被新规封住。签这类条款时，值得争取的具体改动是：把「竞争业务」的列举范围收窄到与本人岗位相关的部分、把地域限定在实际业务区域、明确在职期间的例外情形（例如经书面报批的投资行为）。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"中","口径":"自由"}},{"节号":12,"节名":"竞业限制与保密实操","条号":13,"标题":"保密义务不需要付对价，也不因离职而消失","说人话":"保密和竞业是两件事，别混。保密是「不说出去、不拿来用」——公司不用给你钱，你离职之后也照样要守；竞业是「不去竞争对手那里干」——那个才需要按月给补偿。签了保密协议不等于被竞业限制，反过来也一样。","适用":"签了保密协议或合同里有保密条款，想确认「公司没给保密费，我是不是不用守」。","成本":"不花钱。留存保密协议文本，明确保密范围。","收益":"明文层：用人单位与劳动者可以在劳动合同中约定保守用人单位的商业秘密和与知识产权相关的保密事项（第二十三条第一款）。保密义务不以支付对价为前提——在职期间当然负有，离职后按约定与法定义务继续承担。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第二十三条第一款、第九十条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——保密协议文本自己应留存；是否构成「泄露、使用」由用人单位举证","地域":"全国","时效":"程序时效——用人单位主张赔偿走仲裁，时效一年。起算点——自其知道或应当知道泄密行为之日。例外——保密义务本身没有期限，离职后继续有效。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文，第二十三条、第九十条）","核对日期":"2026-10-03","备注":"保密范围写得越概括（「一切经营信息」）对劳动者越不利，签字时能缩小就缩小。离职前把「我在职期间能访问的资料范围」列一份清单——将来被主张泄密时，这份清单能帮你划清边界。原始资料不要带走，包括自己做的、存在公司系统里的东西；带走公司资料的行为本身，比内容是否涉密更容易成为把柄。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"中","口径":"自由"}},{"节号":12,"节名":"竞业限制与保密实操","条号":14,"标题":"什么算商业秘密：三个要件，缺一个就不受保护","说人话":"公司说「这是商业秘密」，得同时满足三条：外面查不到、能带来经济利益、它自己采取了保密措施（签保密协议、加密、权限管理、标注密级都算）。第三条最容易被忽略——一个谁都能打开的内部共享文件夹里的文件，很难主张是「采取了保密措施」。被指泄密时，先照这三条问一遍。","适用":"公司主张你泄露了「商业秘密」，要追究责任。","成本":"不花钱。核对自己接触的信息是否满足三个要件。","收益":"明文层：商业秘密是指不为公众所知悉、具有商业价值并经权利人采取相应保密措施的技术信息、经营信息等商业信息。三个要件——秘密性、价值性、保密措施——缺一个就不构成商业秘密，公司也就没有可保护的对象。","依据":"《反不正当竞争法》（2025-06-27 第二次修订，2025-10-15 施行）第十条第四款","效力位阶":"法律","主张强度":"可推定","举证难度":"中——信息的公开性与保密措施由双方各自举证；「不为公众所知悉」的举证责任分配在个案中不同","地域":"全国","时效":"程序时效——侵犯商业秘密的民事赔偿诉讼时效三年；用人单位以劳动者违约为由主张赔偿的走仲裁，时效一年。起算点——自权利人知道或应当知道权利受损害之日。例外——无特别时效豁免。","来源":"https://www.samr.gov.cn:9001/zw/zfxxgk/fdzdgknr/fgs/art/2023/art_3737890d856a4e44a8ea07c50c90c116.html（国家市场监督管理总局·反不正当竞争法全文，页内载明 2025-06-27 第二次修订、2025-10-15 施行）；http://www.npc.gov.cn/npc/c2/c30834/202506/t20250627_446247.html（中国人大网·反不正当竞争法全文，同载明 2025 年第二次修订）","核对日期":"2026-10-03","备注":"版本提示很重要：2019 年版中商业秘密定义在第九条第四款，2025 年第二次修订（2025-10-15 施行）后移至第十条第四款（该版中第九条为虚假商业宣传、第十一条为有奖销售）。引用旧条号会导致依据对不上，核条文时务必确认所引版本的条序。不确定点在「不为公众所知悉」与「采取相应保密措施」的证明标准，个案差异大；用人单位可能同时走仲裁（违约）与民事诉讼（侵权）两条路，抗辩重点不同，具体尺度可向当地劳动人事争议仲裁委员会咨询。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"中","口径":"自由"}},{"节号":12,"节名":"竞业限制与保密实操","条号":15,"标题":"保密义务没有期限上限，竞业限制有两年上限","说人话":"这两个期限不要混。竞业限制最长两年，这是硬上限；保密义务没有期限，协议里写「永久保密」并不当然无效——只要它保密的对象确实构成商业秘密，你就得守。所以「两年到了」只意味着竞业限制结束，不意味着你可以公开说原公司的信息。","适用":"协议里约定了离职后的保密期限，想确认它能不能无限期。","成本":"不花钱。核对协议里的保密期限条款。","收益":"明文层：保密义务按约定与法定义务在离职后继续承担，法律没有为保密义务设定终止期限；竞业限制则有明确的二年上限。两者是不同制度，期限规则不能互相套用。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第二十三条、第二十四条第二款","效力位阶":"法律","主张强度":"可推定","举证难度":"中——保密协议文本应留存；保密对象的性质（是否构成商业秘密）需要单独判断","地域":"全国；对无期限保密约定的效力与合理边界的把握，各地不同","时效":"程序时效——用人单位主张赔偿走仲裁，时效一年。起算点——自其知道或应当知道泄密行为之日。例外——保密义务本身无期限，不适用两年上限。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文，第二十三条、第二十四条）","核对日期":"2026-10-03","备注":"不确定点在无期限保密约定的边界——若保密对象并非真正的商业秘密（三个要件不满足），该约定缺乏保护基础，可据 12.14 抗辩；各地对「保密期限过长」的审查尺度不一，需向当地劳动人事争议仲裁委员会或拨 12333 确认。关键区分：保密管的是「不说、不用」，竞业管的是「不去对手那里」——竞业满两年后你仍然不能披露原公司信息，这个界限很多人搞混。","成本标签":{"钱":"0","时间":"少","毅力":"些","收益":"中","口径":"自由"}},{"节号":12,"节名":"竞业限制与保密实操","条号":16,"标题":"违反保密义务的赔偿：公司要能证明损失","说人话":"公司说你违反保密义务要赔钱，它得先说清损失是什么、怎么算出来的。这和竞业限制违约金不同：竞业限制有约定违约金的明文授权，保密义务这边条文说的是「造成损失的承担赔偿责任」。所以突破口在于要求对方举出实际损失，而不是接受一个凭空的数字。","适用":"公司以你违反保密义务为由要求赔偿。","成本":"时间——争议走仲裁，一般几个月；金钱——仲裁不收费，律师费通常自己承担。","收益":"明文层：劳动者违反本法规定解除劳动合同，或者违反劳动合同中约定的保密义务或者竞业限制，给用人单位造成损失的，应当承担赔偿责任。条文的构成要件包含「造成损失」——赔偿以损失为基础，不是只要违约就按约定数额赔。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第九十条","效力位阶":"法律","主张强度":"可推定","举证难度":"难——损失数额与因果关系的举证责任在用人单位，但劳动者一侧往往需要证明「我未接触」「信息不构成秘密」，材料在公司系统里","地域":"全国；损失数额与因果关系的认定标准各地差异明显","时效":"程序时效——仲裁申请时效一年。起算点——自用人单位知道或应当知道泄密与损失之日。例外——无特别时效豁免。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文，第九十条）","核对日期":"2026-10-03","备注":"举证难度标「难」——取证时机必须在离职之前：把可访问的资料清单、权限范围、经手的项目范围当场截图留存；涉及工作交接的，逐项双签并留存清单。不确定点在「免责或减责」的举证尺度，各地口径不一，需向当地劳动人事争议仲裁委员会或拨 12333 确认。行为建议：离职时不带走任何公司资料（含自制的），这是成本最低的自我保护。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"中","口径":"自由"}},{"节号":12,"节名":"竞业限制与保密实操","条号":17,"标题":"违约金不能随便约定：能约定的只有服务期和竞业限制两种","说人话":"能让你赔违约金的只有两种情况：公司花钱送你专项培训并约定了服务期，或者签了竞业限制。除此之外，「违反保密承诺罚 X 万」这类约定，其违约金部分缺乏法律授权。但要注意：违约金条款站不住，不等于它不能按实际损失索赔（第九十条），只是那条路要它自己举证损失。","适用":"协议里出现「违反保密承诺赔偿 X 万」「违反在职不兼职承诺赔偿 X 万」等条款。","成本":"不花钱。签字前把所有「违约金」字样圈出来。","收益":"明文层：除本法第二十二条（服务期）和第二十三条（保密与竞业限制）规定的情形外，用人单位不得与劳动者约定由劳动者承担违约金。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第二十二条、第二十三条、第二十五条、第九十条","效力位阶":"法律","主张强度":"可推定","举证难度":"中——违约金条款文本应留存；实际损失的举证责任在用人单位","地域":"全国；对「超出授权范围的违约金条款」各地裁判路径不完全一致（有的认定无效，有的按实际损失调整）","时效":"程序时效——用人单位主张赔偿走仲裁，时效一年。起算点——自其知道损失发生之日。例外——无特别时效豁免。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文，第二十二条至第二十五条、第九十条）","核对日期":"2026-10-03","备注":"不确定点在抗辩路径的选择——「违约金无效」与「按实际损失赔偿」是两个问题，各地对用人单位能否绕开第二十五条、按第九十条索赔实际损失的处理不一致，需向当地劳动人事争议仲裁委员会或拨 12333 确认本地尺度。例外提示：在职竞业限制条款本身有效（12.12），所以针对它的抗辩不能主张「整条无效」，只能争违约金授权与范围过度。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"大","口径":"金钱"}},{"节号":12,"节名":"竞业限制与保密实操","条号":18,"标题":"员工手册里的「禁止兼职、禁止自营」：制度不合法就用不了","说人话":"员工手册里那些「不得兼职、不得自营」的规定，要用它来处分你，前提是这份制度走程序了、而且给过你看（签收、公示、培训都算）。没签收过、只在群里发过一次的，拿到仲裁去用往往不成立。所以入职时签收的每一份制度，自己都要留一份。","适用":"员工手册或入职承诺书里写着「在职期间不得兼职、不得自营」，单位据此解除合同。","成本":"时间——争议走仲裁，一般几个月；金钱——仲裁不收费，律师费通常自己承担。","收益":"明文层：用人单位在制定、修改直接涉及劳动者切身利益的规章制度时应当经民主程序，并公示或者告知劳动者（第四条）；劳动者严重违反用人单位的规章制度的，用人单位可以解除劳动合同且无需支付经济补偿（第三十九条第二项）。两条合起来看：制度要能用来罚你，先得走完程序并让你知悉。","依据":"《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第四条、第三十九条第二项","效力位阶":"法律","主张强度":"可推定","举证难度":"难——制度是否公示告知、是否经民主程序，证据多由用人单位掌握；劳动者一侧难以证明「我没收到」","地域":"全国；对「民主程序」与「公示告知」的证明标准各地不同","时效":"程序时效——仲裁申请时效一年。起算点——自收到解除通知之日。例外——无特别时效豁免。","来源":"http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文，第四条、第三十九条）","核对日期":"2026-10-03","备注":"举证难度标「难」——取证时机在入职当时和每次制度换版时：核对自己有没有签收页，没签过的版本当场拍照留版本号与发布日期；离职前把能访问到的制度公告、培训通知、内部系统截图导出，离职后账号停用就取不到了。不确定点在「民主程序」与「公示告知」的证明标准，各地口径不一，可向当地劳动人事争议仲裁委员会或拨 12333 咨询本地尺度。","成本标签":{"钱":"0","时间":"多","毅力":"是","收益":"大","口径":"金钱"}},{"节号":12,"节名":"竞业限制与保密实操","条号":19,"标题":"新单位录用负有竞业限制义务的人：连带赔偿的风险","说人话":"这一条是写给「新东家」看的，但直接关系到你的处境：如果新单位明知道你带着竞业限制或保密义务还录用你、并用上了原公司的信息，它自己也会被认定为侵权。反过来，这也是你可以主动向新单位披露的筹码——书面向新单位说明你的竞业限制状态，既保护自己，也让新单位有据可依地安排你的工作范围。","适用":"你是新单位的用人方或被录用人，想知道录用受竞业限制约束的人有什么风险。","成本":"时间——争议走仲裁或诉讼；金钱——可能需要承担赔偿。","收益":"这不是收益条，是风险条。 明文层：第三人明知或者应知商业秘密权利人的员工、前员工或者其他单位、个人实施本条第一款所列违法行为，仍获取、披露、使用或者允许他人使用该商业秘密的，视为侵犯商业秘密。第一款所列的四项侵权行为中，与离职员工直接相关的是第三项：违反保密义务或者违反权利人有关保守商业秘密的要求，披露、使用或者允许他人使用其所掌握的商业秘密。","依据":"《反不正当竞争法》（2025-06-27 第二次修订，2025-10-15 施行）第十条第一款第三项、第十条第三款","效力位阶":"法律","主张强度":"可推定","举证难度":"中——「明知或应知」的认定需要证据；入职时的沟通记录、披露文件是关键","地域":"全国；对「应知」的认定标准各地差异较大","时效":"程序时效——侵犯商业秘密的民事赔偿诉讼时效三年。起算点——自权利人知道或应当知道权利受损害之日。例外——无特别时效豁免。","来源":"https://www.samr.gov.cn:9001/zw/zfxxgk/fdzdgknr/fgs/art/2023/art_3737890d856a4e44a8ea07c50c90c116.html（国家市场监督管理总局·反不正当竞争法全文）；http://www.npc.gov.cn/npc/c2/c30834/202506/t20250627_446247.html（中国人大网·反不正当竞争法全文）","核对日期":"2026-10-03","备注":"不确定点在「明知或者应知」的证明标准，个案差异大，各地口径不一，需向当地劳动人事争议仲裁委员会或人民法院立案窗口咨询。对劳动者的实用动作：入职新单位时书面披露自己的竞业限制与保密义务状态，并要求新单位书面确认已知悉——这既减轻你被指「隐瞒」的风险，也避免日后被新单位反以「未如实说明」追责（入职告知义务见第 3 节）。","成本标签":{"钱":"多","时间":"中","毅力":"些","收益":"小","口径":"自由"}},{"节号":12,"节名":"竞业限制与保密实操","条号":20,"标题":"离职时把竞业限制的启动与补偿一次性问清","说人话":"离职前发一封邮件给公司（抄送人事和直属上级），问三句：竞业限制是否启动？每月补偿多少、怎么付？付到哪一天？对方回复了就留底；不回复也是状态，第二天再发一封确认「未收到回复，视为按协议执行」。这一封邮件比事后任何争论都有用——它把模糊地带变成了可举证的事实。","适用":"签过竞业限制协议或含竞业限制条款的合同，正在办离职手续。","成本":"不花钱。发一封邮件，几分钟。","收益":"明文层：解释（一）第三十七条规定，约定竞业限制和经济补偿的，解除合同时除另有约定外，双方各自可要求对方履行相应义务。这个「除另有约定外」就是你的操作空间——离职时把是否启动、补偿标准、支付期限书面固定，避免事后各说各话。","依据":"《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》（法释〔2020〕26 号，2021-01-01 施行）第三十七条、第三十六条；《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第二十三条第二款","效力位阶":"司法解释（第二十三条为法律）","主张强度":"可推定","举证难度":"中——协议原文、书面询问与对方回复需留存；对方不回复时，己方催告记录即成为证据","地域":"全国；未约定补偿金额场合的解除权口径各地未统一","时效":"程序时效——仲裁申请时效一年。起算点——补偿类自各月应付未付之日；解除类自三个月未支付届满之日。例外——按月补偿的请求权逐月起算。","来源":"https://www.court.gov.cn/zixun/xiangqing/282121.html（最高人民法院官网·劳动争议解释（一）全文，第三十六条、第三十七条）；http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文，第二十三条）","核对日期":"2026-10-03","备注":"不确定点在「未约定补偿金额」场合的解除权（见 12.6 备注），各地口径不一，可就本地尺度咨询当地劳动人事争议仲裁委员会或拨 12333。这封询问邮件要在离职手续办完之前发出，离职后对方可能不再回应；附上协议扫描件一并发送，避免日后对条款版本产生争议。实务中因为「没问清」而白守两年、或误以为不用守而违约的案例都不少。","成本标签":{"钱":"0","时间":"少","毅力":"些","收益":"大","口径":"金钱"}},{"节号":12,"节名":"竞业限制与保密实操","条号":21,"标题":"竞业限制违约金过高：可以请求调减，但要能举证","说人话":"违约金写得离谱，不是必然照付，但也不能指望自动打折。可以争的两个方向：一是对价对比——公司每月给的补偿与要你赔的违约金严重失衡；二是实际损失——公司拿不出因为你去了对手那里而实际受损的证据。这两条都要你自己主张并说明，不会由仲裁庭主动提。","适用":"协议约定的违约金明显偏高（例如约定离职前年薪的数倍），公司据此索赔。","成本":"不花钱。核对协议金额与自己的实际收入、补偿数额。","收益":"已确证的一层：解释（二）第十五条规定，违反有效的竞业限制约定，用人单位可请求劳动者按约定返还已付经济补偿并支付违约金——即约定违约金原则上被支持。存在裁量空间的一层：违约金明显过高时可请求调减，但法律与司法解释未就竞业限制违约金设定统一上限或调减比例，裁量在个案。","依据":"《最高人民法院关于审理劳动争议案件适用法律问题的解释（二）》（法释〔2025〕12 号，2025-09-01 施行）第十五条；《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第二十三条第二款","效力位阶":"司法解释（第二十三条为法律）","主张强度":"可推定","举证难度":"中——协议文本、补偿发放记录、工资流水需自己留存；「违约金过高」的说明需自己组织","地域":"全国；违约金调减的尺度与比例各地差异明显","时效":"程序时效——仲裁申请时效一年。起算点——自用人单位主张违约金之日。例外——无特别时效豁免。","来源":"http://gongbao.court.gov.cn/Details/bb72019c45453f84d920bd6375573e.html（最高人民法院公报·劳动争议解释（二）全文，第十五条）；http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文，第二十三条）","核对日期":"2026-10-03","备注":"不确定点在调减的比例与门槛——没有统一标准，各地裁量差异明显，需向当地劳动人事争议仲裁委员会或拨 12333 确认本地尺度。把三组数字摆在一起：协议约定的月补偿、实际收了几个月、对方主张的违约金——对价失衡是调减请求里最直观的论据。第 6 节第 6.1 条讲了违约金授权范围的另一条抗辩线。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"中","口径":"金钱"}},{"节号":12,"节名":"竞业限制与保密实操","条号":22,"标题":"竞业限制争议走哪条路：劳动仲裁，不是普通民事诉讼","说人话":"竞业限制是劳动争议，不是普通合同纠纷——先去劳动人事争议仲裁委员会，不能直接去法院。仲裁不收费，这一步别跳过。管辖可以在「你实际干活的地方」和「公司所在地」里选，同时申请时以履行地优先。","适用":"因竞业限制协议与用人单位发生争议，不知道去哪立案。","成本":"时间——仲裁立案到裁决一般几个月；金钱——劳动仲裁不收费。","收益":"明文层：劳动争议需要先经劳动人事争议仲裁，对仲裁裁决不服的才可以向人民法院起诉（第五条、第四十八条、第五十条）；用人单位与劳动者之间因竞业限制产生的争议属劳动争议范畴，适用该前置程序。管辖按劳动合同履行地或用人单位所在地确定（第二十一条）。","依据":"《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第五条、第二十一条、第四十八条、第五十条；《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第二十三条、第二十四条","效力位阶":"法律","主张强度":"可主张","举证难度":"中——管辖需要用工地点或公司所在地的材料；程序问题本身不依赖实体证据","地域":"全国；劳动争议仲裁委员会的受理范围与管辖分工按属地确定","时效":"程序时效——仲裁申请时效一年；对非终局裁决不服的起诉期限十五日。起算点——自知道或应当知道权利被侵害之日；起诉期自收到裁决书之日。例外——劳动关系存续期间因拖欠劳动报酬发生的争议不受一年限制（竞业限制补偿类不属拖欠劳动报酬，不适用）。","来源":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（广东省人民政府门户网站·劳动争议调解仲裁法全文，第五条、第二十一条、第四十八条、第五十条）；http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文）","核对日期":"2026-10-03","备注":"注意例外关系：竞业限制经济补偿虽按月给付，但不属于「拖欠劳动报酬」，因此不适用「劳动关系存续期间不受一年时效限制」的例外——离职后已经不在劳动关系存续期间，逐月起算的一年时效要认真对待（见 12.24）。管辖与受理材料向当地劳动人事争议仲裁委员会咨询或拨 12333。","成本标签":{"钱":"0","时间":"中","毅力":"些","收益":"中","口径":"时间"}},{"节号":12,"节名":"竞业限制与保密实操","条号":23,"标题":"竞业限制补偿的时效：逐月起算，不是从离职日一次性起算","说人话":"这一条最容易被误解成「从离职那天起算一年」。不是——每月该付没付，就从那个月开始各算一年。所以早期月份可能已经超期，近期月份还在期内。动作：立刻把未付月份列成表（月份、应付金额、未付事实），并从当下开始每月发一次书面催告，把时效中断住。","适用":"离职后公司几个月没给竞业补偿，你想知道现在提还算不算晚。","成本":"不花钱。按月列一张未付清单，几十分钟。","收益":"明文层：劳动争议申请仲裁的时效期间为一年，从当事人知道或者应当知道其权利被侵害之日起计算；时效因主张权利、请求救济或对方同意履行而中断。竞业限制经济补偿是按月给付的义务，每一期构成独立的请求权，各自起算。","依据":"《劳动争议调解仲裁法》（2007-12-29 通过，2008-05-01 施行）第二十七条；《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》（法释〔2020〕26 号，2021-01-01 施行）第三十六条","效力位阶":"法律（第三十六条为司法解释）","主张强度":"可推定","举证难度":"中——银行流水可证明未到账；催告记录需自己留存以证明时效中断","地域":"全国；对按月给付义务的时效计算方式，各地理解基本一致但个案把握有别","时效":"程序时效——一年，可中断、可中止。起算点——自各期补偿应付未付之日起逐月起算。例外——竞业限制补偿不属「拖欠劳动报酬」，不适用劳动关系存续期间不受一年限制的例外。","来源":"http://www.gd.gov.cn/zwgk/wjk/zcfgk/content/post_2722147.html（劳动争议调解仲裁法全文，第二十七条）；https://www.court.gov.cn/zixun/xiangqing/282121.html（最高人民法院官网·劳动争议解释（一）全文，第三十六条）","核对日期":"2026-10-03","备注":"不确定点在逐月起算的具体把握（是否按每一笔独立计算、还是以最近一次未付为整体起算），各地口径不完全一致，需向当地劳动人事争议仲裁委员会或拨 12333 确认。最稳妥的做法是早主张：一旦发现未付就书面催告，既中断时效，也为日后主张留下证据链（催告做法见第 9 节第 9.14 条）。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"大","口径":"金钱"}},{"节号":12,"节名":"竞业限制与保密实操","条号":24,"标题":"竞业限制能不能约定在职期间也适用：两种条款的期限规则不同","说人话":"在职期间的限制覆盖你整个在职期，没有两年这个上限；离职后的限制最长两年。所以「两年上限」这条只保护离职后那一段——在职期间被绑多久，取决于劳动关系持续多久。签字时把两段分开看，别以为有个「两年」能包住全部。","适用":"协议同时写了在职期间与离职后的限制，想确认各自的期限边界。","成本":"不花钱。核对协议里两段的期间表述。","收益":"明文层：① 在职期间竞业限制条款的效力经解释（二）第十四条确认，没有法定上限，约束力覆盖整个在职期间；② 离职后竞业限制期限不得超过二年（劳动合同法第二十四条第二款）。","依据":"《最高人民法院关于审理劳动争议案件适用法律问题的解释（二）》（法释〔2025〕12 号，2025-09-01 施行）第十四条；《劳动合同法》（2012-12-28 修正，2013-07-01 施行）第二十四条第二款","效力位阶":"司法解释（第二十四条为法律）","主张强度":"可主张","举证难度":"易——条款文本本身即可确定两段期间","地域":"全国","时效":"程序时效——仲裁申请时效一年。起算点——在职期间违约的自违约行为发生之日；离职后违约的自离职之日。例外——无特别时效豁免。","来源":"http://gongbao.court.gov.cn/Details/bb72019c45453f84d920bd6375573e.html（最高人民法院公报·劳动争议解释（二）全文，第十四条）；http://www.npc.gov.cn/c2/c183/c198/201905/t20190522_26978.html（中国人大网·劳动合同法全文，第二十四条）","核对日期":"2026-10-03","备注":"这一条与第 4 节第 4.3 条形成对照：工时制度有审批要求，竞业限制没有——两类规则的「程序门槛」完全不同，不要互相类推。协议里如果只写「竞业限制」不写期间，按文义不利，签字前要求写明「在职期间」与「离职后 X 个月」两段。","成本标签":{"钱":"0","时间":"少","毅力":"否","收益":"中","口径":"自由"}},{"节号":12,"节名":"竞业限制与保密实操","条号":25,"标题":"竞业限制没启动、也没给钱：三年后公司还能追你吗","说人话":"公司长期不付钱，法律给你的是一条明确的路——请求解除竞业限制约定，而不是「它不追就等于放弃」。别指望消极等待，要主动把那三个月未付的事实固定下来，提出解除请求。解除之后关系才真正结束。","适用":"离职后公司既没通知启动竞业限制、也没付过补偿，一段时间后突然主张你违约。","成本":"时间——争议走仲裁，一般几个月；金钱——仲裁不收费。","收益":"已确证的一层：因用人单位原因导致三个月未支付经济补偿的，劳动者可以请求解除竞业限制约定（解释（一）第三十八条）；主张违约金的一方须证明存在有效的竞业限制约定（解释（二）第十五条）。无明文的一层：公司长期不启动、不支付，是否当然视为放弃权利，法律没有直接规定。","依据":"无明文的全国统一规定（指「长期不启动即视为放弃」这一具体问题）。可确证的是《最高人民法院关于审理劳动争议案件适用法律问题的解释（一）》（法释〔2020〕26 号，2021-01-01 施行）第三十八条的解除权、《最高人民法院关于审理劳动争议案件适用法律问题的解释（二）》（法释〔2025〕12 号，2025-09-01 施行）第十五条对有效约定的要求","效力位阶":"无明文依据","主张强度":"倡导性","举证难度":"中——需要证明补偿未支付（银行流水）与未收到启动通知；己方催告记录是关键","地域":"全国；各地对「长期不主张」的处理差异较大","时效":"程序时效——仲裁申请时效一年，逐月起算。起算点——请求解除的自三个月未支付届满之日；未付补偿的自各期应付未付之日。例外——无特别时效豁免。","来源":"「长期不启动即视为放弃」无官方一手依据可援引。 尝试过的路径：① 已打开最高人民法院公报的解释（二）全文，第十五条只规定违反有效约定的后果，未规定长期不启动的效力；② 已打开最高法官网的描述（一）全文，第三十八条只给「三个月未付可请求解除」的路径，未规定自动视为放弃；③ 检索其他全国性规定未定位到对应条文。故按「无明文依据」处理，只给可确证的解除路径。相关一手页：https://www.court.gov.cn/zixun/xiangqing/282121.html、http://gongbao.court.gov.cn/Details/bb72019c45453f84d920bd6375573e.html。","核对日期":"2026-10-03","备注":"本条不给「公司不能再追」的结论，只指出可确证的路径是主动请求解除（12.6）。动作清单：把未付月份列成表 → 书面催告并要求确认是否启动 → 三个月届满后提出解除请求 → 全程留痕。各地对长期不主张的处理口径不一，向当地劳动人事争议仲裁委员会或拨 12333 确认。","成本标签":{"钱":"0","时间":"中","毅力":"是","收益":"中","口径":"自由"}},{"节号":12,"节名":"竞业限制与保密实操","条号":26,"标题":"在职期间的竞业限制与《劳动合同法》第三十九条的关系","说人话":"在职期间的竞争行为，公司有三条路可以走：制度的禁止条款（第三十九条第二项）、双重劳动关系（第三十九条第四项）、以及在职竞业限制条款。所以「我注册的公司只是挂着、没实际经营」这类辩解只对第三十九条第四项有效（该条通常要求存在实际用工），对制度条款和
